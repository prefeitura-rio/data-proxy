worker_processes auto;
error_log /dev/stderr info;

env PROXY_CACHE_TTL;
env PROXY_MAX_BODY;
env PROXY_HA_MODE;
env PROXY_REDIS_HOST;
env PROXY_REDIS_PORT;
env PROXY_REDIS_DATABASE;
env PROXY_REDIS_PASSWORD;
env PROXY_POSTGREST_READ;
env PROXY_POSTGREST_WRITE;
env PROXY_POSTGREST_RETRIES;
env PROXY_POSTGREST_BACKOFF_MS;
env PROXY_MAX_INFLIGHT;
env PROXY_CONFIG_URL;
env PROXY_CONFIG_REFRESH_SECONDS;

events {
    worker_connections 1024;
}

http {
    access_log off;
    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/opt/data-proxy/rocks/?.lua;/opt/data-proxy/rocks/?/init.lua;;";
    lua_package_cpath "/opt/data-proxy/lib/?.so;;";
    lua_shared_dict proxy_locks 1m;
    lua_shared_dict proxy_results 10m;
    lua_shared_dict proxy_inflight 1m;
    lua_shared_dict proxy_settings 1m;
    lua_code_cache on;
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    resolver kube-dns.kube-system.svc.cluster.local valid=30s;

    init_by_lua_block {
        require("proxy.main").init("/config/sync.json")
    }

    init_worker_by_lua_block {
        require("proxy.main").start()
    }

    # The admin server is not routed by the ingress. Only the console calls it.
    server {
        listen 8081;

        location = /reload {
            content_by_lua_block {
                require("proxy.main").reload()
            }
        }
    }

    server {
        listen 8080;
        large_client_header_buffers __LARGE_CLIENT_HEADER_BUFFERS__;
        error_log /dev/stderr info;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept-Profile, Content-Profile, Prefer, X-DuckLake-Snapshot" always;
                return 204;
            }
            content_by_lua_block {
                require("proxy.main").handle()
            }
        }
    }
}
