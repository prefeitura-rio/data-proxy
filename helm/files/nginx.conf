load_module modules/ngx_http_js_module.so;

worker_processes auto;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    access_log off;
    js_import fallback.js;

    js_preload_object /config/sync.json;

    js_fetch_max_response_buffer_size ${FETCH_BUFFER_SIZE};
    js_fetch_timeout ${FETCH_TIMEOUT};
    js_fetch_keepalive ${FETCH_KEEPALIVE};
    js_fetch_keepalive_timeout ${FETCH_KEEPALIVE_TIMEOUT};

    resolver kube-dns.kube-system.svc.cluster.local valid=30s;

__PGRST_MAP__
    server {
        listen 8080;
        set $fallback_cache_ttl "${CACHE_TTL}";
        set $fallback_max_body "${MAX_BODY}";
        large_client_header_buffers ${LARGE_CLIENT_HEADER_BUFFERS};
        error_log /dev/stderr info;

        location = /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location /webdis/write/ {
            proxy_pass http://127.0.0.1:7379/;
        }

        location /webdis/read/ {
            proxy_pass http://127.0.0.1:7380/;
        }

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept-Profile, Content-Profile, Prefer" always;
                return 204;
            }
            js_content fallback.handle;
        }
    }
}
