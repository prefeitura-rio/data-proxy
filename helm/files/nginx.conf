load_module modules/ngx_http_js_module.so;

worker_processes auto;
error_log /dev/stderr info;
events {
    worker_connections 1024;
}
http {
    js_import fallback.js;

    js_fetch_max_response_buffer_size __FETCH_BUFFER_SIZE__;
    js_fetch_timeout __FETCH_TIMEOUT__;

    resolver kube-dns.kube-system.svc.cluster.local valid=30s;

__PGRST_MAP__
    server {
        listen 8080;
        set $fallback_cache_ttl "__CACHE_TTL__";
        error_log /dev/stderr info;

        location = /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location / {
            js_content fallback.handle;
        }
    }
}
