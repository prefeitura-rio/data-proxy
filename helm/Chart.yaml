apiVersion: v2
name: data-proxy
description: Data proxy — BigQuery → SeaweedFS → pg_duckdb sync pipeline with PostgREST and row-level security.
type: application
version: 1.97.0
appVersion: "1.0.0"
icon: https://www.cncf.io/wp-content/uploads/2020/08/cncf-color.png
dependencies:
  - name: prometheus-pushgateway
    version: "2.17.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: pushgateway.enabled
    alias: pushgateway
  - name: seaweedfs
    version: "4.46.0"
    repository: "https://seaweedfs.github.io/seaweedfs/helm"
    condition: seaweedfs.enabled
    alias: seaweedfs
