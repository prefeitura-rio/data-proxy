suite: HA mode (ha.enabled true)
templates:
  - pvc-pgduckdb.yaml
  - statefulset-duckdb.yaml
  - statefulset-duckdb-ha.yaml
  - service-duckdb-master.yaml
  - service-duckdb-replica.yaml
  - deployment-pgbouncer-rw.yaml
  - deployment-pgbouncer-ro.yaml
  - secret-pgbouncer.yaml
  - rbac.yaml
  - configmap-patroni.yaml
values:
  - ../ci/test-values-ha.yaml
tests:
  - it: renders three retained member PVCs
    asserts:
      - hasDocuments:
          count: 3
        template: pvc-pgduckdb.yaml
      - equal:
          path: metadata.name
          value: data-proxy-pgdata-0
        documentIndex: 0
        template: pvc-pgduckdb.yaml
      - equal:
          path: metadata.name
          value: data-proxy-pgdata-2
        documentIndex: 2
        template: pvc-pgduckdb.yaml
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        documentIndex: 1
        template: pvc-pgduckdb.yaml

  - it: renders one single-replica StatefulSet per Patroni member
    asserts:
      - hasDocuments:
          count: 3
        template: statefulset-duckdb-ha.yaml
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 0
        template: statefulset-duckdb-ha.yaml
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 2
        template: statefulset-duckdb-ha.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: gcr.io/proj/pgduckdb-patroni:17-v1.1.1
        documentIndex: 1
        template: statefulset-duckdb-ha.yaml
      - notExists:
          path: spec.volumeClaimTemplates
        documentIndex: 0
        template: statefulset-duckdb-ha.yaml

  - it: gives each member a stable identity and matching PVC
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: data-proxy-duckdb-0
        documentIndex: 0
        template: statefulset-duckdb-ha.yaml
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: data-proxy-pgdata-0
        documentIndex: 0
        template: statefulset-duckdb-ha.yaml
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: data-proxy-duckdb-2
        documentIndex: 2
        template: statefulset-duckdb-ha.yaml
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: data-proxy-pgdata-2
        documentIndex: 2
        template: statefulset-duckdb-ha.yaml

  - it: does not render standalone StatefulSet
    asserts:
      - hasDocuments:
          count: 0
        template: statefulset-duckdb.yaml

  - it: renders master and replica services with Patroni role selectors
    asserts:
      - hasDocuments:
          count: 1
        template: service-duckdb-master.yaml
      - equal:
          path: spec.selector.role
          value: master
        template: service-duckdb-master.yaml
      - hasDocuments:
          count: 1
        template: service-duckdb-replica.yaml
      - equal:
          path: spec.selector.role
          value: replica
        template: service-duckdb-replica.yaml

  - it: renders PgBouncer, RBAC, and Patroni configuration
    asserts:
      - hasDocuments:
          count: 1
        template: deployment-pgbouncer-rw.yaml
      - hasDocuments:
          count: 1
        template: deployment-pgbouncer-ro.yaml
      - hasDocuments:
          count: 1
        template: secret-pgbouncer.yaml
      - hasDocuments:
          count: 2
        template: rbac.yaml
      - hasDocuments:
          count: 1
        template: configmap-patroni.yaml
