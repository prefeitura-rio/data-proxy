suite: HA topology
templates:
  - validate-ha.yaml
  - scaledobject-postgrest.yaml
  - scaledobject-nginx-proxy.yaml
  - scaledobject-pooler.yaml
tests:
  - it: accepts optional HA overrides
    set:
      ha.enabled: true
      cnpg.mode: per-schema
      valkey.architecture: replication
      valkey.replicaCount: 3
      valkey.sentinel.enabled: true
      syncConfig.schemas.foo.tables: []
      ha.schemas:
        - name: foo
    asserts:
      - hasDocuments:
          count: 0
        template: validate-ha.yaml
  - it: rejects an unknown HA schema override
    set:
      ha.enabled: true
      cnpg.mode: per-schema
      valkey.architecture: replication
      valkey.replicaCount: 3
      valkey.sentinel.enabled: true
      syncConfig.schemas.foo.tables: []
      ha.schemas:
        - name: missing
    asserts:
      - failedTemplate:
          errorMessage: ha.schemas[missing] is not present in syncConfig.schemas
        template: validate-ha.yaml
  - it: renders per-schema Pooler ScaledObjects with shared autoscaling values
    set:
      ha.enabled: true
      cnpg.mode: per-schema
      syncConfig.schemas.pic.tables: []
      syncConfig.schemas.other.tables: []
    asserts:
      - hasDocuments:
          count: 2
        template: scaledobject-pooler.yaml
      - equal:
          path: spec.scaleTargetRef.kind
          value: Pooler
        template: scaledobject-pooler.yaml
      - equal:
          path: spec.minReplicaCount
          value: 1
        template: scaledobject-pooler.yaml
