suite: HA topology
templates:
  - cluster-cnpg.yaml
  - validate-ha.yaml
  - scaledobject-postgrest.yaml
  - scaledobject-nginx-proxy.yaml
  - scaledobject-pooler.yaml
  - deployment-schema-nginx-proxy.yaml
tests:
  - it: gives per-schema CPU-scaled nginx a CPU request without owning its replica count
    set:
      ha.enabled: true
      cnpg.mode: per-schema
      syncConfig.schemas.pic.tables: []
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
        template: deployment-schema-nginx-proxy.yaml
      - notExists:
          path: spec.replicas
        template: deployment-schema-nginx-proxy.yaml
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/proxy-config"]
          pattern: "^[0-9a-f]{64}$"
        template: deployment-schema-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sync-config
            mountPath: /config
            readOnly: true
        template: deployment-schema-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sync-config
            configMap:
              name: data-proxy-sync
        template: deployment-schema-nginx-proxy.yaml

  - it: mounts GCP credentials into per-schema CNPG instances
    set:
      cnpg.mode: per-schema
      cnpg.image: ghcr.io/example/data-proxy-postgres:test
      gcp.existingSecret: gcp-key
      syncConfig.schemas.foo.tables: []
    asserts:
      - contains:
          path: spec.projectedVolumeTemplate.sources[0].secret.items
          content:
            key: key.json
            path: gcp-key.json
        template: cluster-cnpg.yaml

  - it: uses the configured CNPG image for per-schema clusters
    set:
      cnpg.mode: per-schema
      cnpg.image: ghcr.io/example/data-proxy-postgres:test
      syncConfig.schemas.foo.tables: []
    asserts:
      - equal:
          path: spec.imageName
          value: ghcr.io/example/data-proxy-postgres:test
        template: cluster-cnpg.yaml

  - it: accepts optional HA overrides
    set:
      ha.enabled: true
      cnpg.mode: per-schema
      valkey.architecture: replication
      valkey.replicaCount: 3
      valkey.sentinel.enabled: true
      syncConfig.schemas.foo.tables: []
      ha.schemas:
        - name: foo
    asserts:
      - hasDocuments:
          count: 0
        template: validate-ha.yaml
  - it: rejects an unknown HA schema override
    set:
      ha.enabled: true
      cnpg.mode: per-schema
      valkey.architecture: replication
      valkey.replicaCount: 3
      valkey.sentinel.enabled: true
      syncConfig.schemas.foo.tables: []
      ha.schemas:
        - name: missing
    asserts:
      - failedTemplate:
          errorMessage: ha.schemas[missing] is not present in syncConfig.schemas
        template: validate-ha.yaml
  - it: renders per-schema Pooler ScaledObjects with shared autoscaling values
    set:
      ha.enabled: true
      cnpg.mode: per-schema
      syncConfig.schemas.pic.tables: []
      syncConfig.schemas.other.tables: []
    asserts:
      - hasDocuments:
          count: 2
        template: scaledobject-pooler.yaml
      - equal:
          path: spec.scaleTargetRef.kind
          value: Pooler
        template: scaledobject-pooler.yaml
      - equal:
          path: spec.minReplicaCount
          value: 1
        template: scaledobject-pooler.yaml
