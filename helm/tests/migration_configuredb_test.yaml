suite: Init-db Job
templates:
  - jobs.yaml
tests:
  - it: ships the template that creates a configured schema
    asserts:
      - isNotNull:
          path: data["postgres_create_schema.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml

  - it: leaves the state, reload, pre-request, maintenance and console objects to the migrations
    asserts:
      - notExists:
          path: data["postgres_create_state.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_create_reload.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_create_pre_request.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_create_console_functions.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_create_console_config.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_create_console_triggers.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_grant_app_usage.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_grant_console_usage.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_grant_proxy_config.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_cleanup_stale_objects.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_prune_access_log.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_prune_workflows.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_configure_catalog.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_create_signer_keys.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml

  - it: ships the call of the reload function, which the migrations define
    asserts:
      - matchRegex:
          path: data["postgres_call_reload_postgrest.sql"]
          pattern: "SELECT \\{\\{ schema \\}\\}.reload_postgrest\\(\\)"
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml

  - it: renders script and SQL ConfigMaps
    asserts:
      - isKind:
          of: ConfigMap
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-script
        template: jobs.yaml
      - isKind:
          of: ConfigMap
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml

  - it: mounts both ConfigMaps
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].name
          value: configure-db-script
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-0
        template: jobs.yaml
      - equal:
          path: spec.template.spec.volumes[2].name
          value: configure-db-sql
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-0
        template: jobs.yaml

  - it: ships the rbac rules file with the scripts, and not its schema
    asserts:
      - matchRegex:
          path: data["rbac.toml"]
          pattern: 'name = "dp_admin"'
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-script
        template: jobs.yaml
      - notExists:
          path: data["rbac.schema.json"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-script
        template: jobs.yaml
      - isNotNull:
          path: data["postgres_load_rbac.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - notExists:
          path: data["postgres_create_rbac.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml

  - it: creates the request roles before the migrations, and loads the rules after them
    asserts:
      - isNotNull:
          path: data["postgres_create_roles.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - matchRegex:
          path: data["configure-db.nu"]
          pattern: "main roles\\n\\s+main rules"
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-script
        template: jobs.yaml
      - matchRegex:
          path: data["configure-db.nu"]
          pattern: "wait-for-relation rbac.roles\\n\\s+configure-ducklake\\n\\s+load-rbac\\n\\s+verify-rbac"
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-script
        template: jobs.yaml

  - it: ships the recovery procedure, which takes the name of the application from the chart
    asserts:
      - notExists:
          path: data.setup_maintenance.sql
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml
      - isNotNull:
          path: data["postgres_recover_orphaned_workflows.sql"]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-sql
        template: jobs.yaml

  - it: mounts templates at /templates
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SQL_TEMPLATE_DIR
            value: /templates
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-0
        template: jobs.yaml
