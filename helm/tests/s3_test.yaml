suite: S3 secret
templates:
  - secret.yaml
tests:
  - it: renders a generated S3 secret by default
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0
      - exists:
          path: stringData.S3_ACCESS_KEY
        documentIndex: 0
      - exists:
          path: stringData.S3_SECRET_KEY
        documentIndex: 0

  - it: omits the S3 secret when an existing secret is set
    set:
      s3.existingSecret: my-s3-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: data-proxy-jobs
---
suite: S3 wiring
templates:
  - deployment-pipeline.yaml
tests:
  - it: points the pipeline at the in-chart SeaweedFS gateway
    set:
      s3.bucket: data-proxy
      seaweedfs.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_BUCKET
            value: data-proxy
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT
            value: RELEASE-NAME-seaweedfs-s3:8333

  - it: points the pipeline at an explicit endpoint when one is set
    set:
      s3.endpoint: minio.example.com:9000
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_ENDPOINT
            value: minio.example.com:9000
