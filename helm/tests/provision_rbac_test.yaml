suite: Provision RBAC
templates:
  - rbac-provision.yaml
tests:
  - it: gives the provision job a service account of its own
    asserts:
      - isKind:
          of: ServiceAccount
        documentSelector:
          path: kind
          value: ServiceAccount
        template: rbac-provision.yaml
      - equal:
          path: metadata.name
          value: data-proxy-provision
        documentSelector:
          path: kind
          value: ServiceAccount
        template: rbac-provision.yaml

  - it: lets it restart PostgREST and write ConfigMaps, and nothing else
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["get", "list", "watch", "patch"]
            - apiGroups: [""]
              resources: ["configmaps"]
              verbs: ["get", "create", "patch"]
        documentSelector:
          path: kind
          value: Role
        template: rbac-provision.yaml

  - it: binds the role to the service account
    asserts:
      - equal:
          path: subjects[0].name
          value: data-proxy-provision
        documentSelector:
          path: kind
          value: RoleBinding
        template: rbac-provision.yaml
      - equal:
          path: roleRef.name
          value: data-proxy-provision
        documentSelector:
          path: kind
          value: RoleBinding
        template: rbac-provision.yaml
