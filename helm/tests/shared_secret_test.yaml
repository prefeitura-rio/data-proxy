suite: Shared S3 secret volume
release:
  name: data-proxy
  namespace: default
templates:
  - cluster-cnpg.yaml
  - configmap-litestream.yaml
set:
  sync.config:
    schemas:
      app:
        tables: []
  ducklake.litestream.storage.storageClass: k3d-rwx
tests:
  - it: mounts the secret folder of the shared volume in every PostgreSQL pod in single mode
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: '"mountPath":"/var/lib/postgresql/data/\.duckdb/stored_secrets","name":"ducklake-catalogs","readOnly":false,"subPath":"duckdb-secrets"'
        template: cluster-cnpg.yaml

  - it: mounts the secret folder of the shared volume in every PostgreSQL pod in HA mode
    set:
      ha.enabled: true
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: '"mountPath":"/var/lib/postgresql/data/\.duckdb/stored_secrets","name":"ducklake-catalogs","readOnly":false,"subPath":"duckdb-secrets"'
        template: cluster-cnpg.yaml

  - it: mounts the secret folder from the same volume as the catalogs
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: '"mountPath":"/var/lib/ducklake/catalogs","name":"ducklake-catalogs"'
        template: cluster-cnpg.yaml

  - it: makes the secret folder writable for the primary before PostgreSQL uses it
    asserts:
      - matchRegex:
          path: data["recover-catalogs.nu"]
          pattern: "duckdb-secrets"
        template: configmap-litestream.yaml
      - matchRegex:
          path: data["recover-catalogs.nu"]
          pattern: "set-permissions '777'"
        template: configmap-litestream.yaml
