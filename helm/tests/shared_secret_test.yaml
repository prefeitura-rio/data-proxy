suite: Shared S3 secret volume
release:
  name: data-proxy
  namespace: default
templates:
  - cluster-cnpg.yaml
set:
  sync.config:
    schemas:
      app:
        tables: []
  ducklake.litestream.storage.storageClass: k3d-rwx
  ducklake.readerCatalog.storage.storageClass: local-path
tests:
  - it: mounts the secret folder of the shared volume in every PostgreSQL pod in single mode
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: '"mountPath":"/var/lib/postgresql/data/\.duckdb/stored_secrets","name":"duckdb","readOnly":false,"subPath":"duckdb/secrets"'
        template: cluster-cnpg.yaml

  - it: mounts the secret folder of the shared volume in every PostgreSQL pod in HA mode
    set:
      ha.enabled: true
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: '"mountPath":"/var/lib/postgresql/data/\.duckdb/stored_secrets","name":"duckdb","readOnly":false,"subPath":"duckdb/secrets"'
        template: cluster-cnpg.yaml

  - it: shares the secret folder through the shared volume, not the instance catalog volume
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: '"name":"duckdb","persistentVolumeClaim":\{"claimName":"data-proxy-duckdb"\}'
        template: cluster-cnpg.yaml

  - it: gives the secret folder to PostgreSQL alone before it is used
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: '"command":\["install","-d","-m","0700","/shared/duckdb","/shared/duckdb/secrets"\]'
        template: cluster-cnpg.yaml
