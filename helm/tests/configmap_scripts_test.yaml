suite: Scripts ConfigMap
templates:
  - configmap-scripts.yaml
tests:
  - it: renders when backup is enabled and maintenance is disabled
    set:
      jobs.maintenance.enabled: false
      jobs.backup.enabled: true
      sync.config.schemas.test.tables: []
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap

  - it: does not render when maintenance and backup are disabled
    set:
      jobs.maintenance.enabled: false
      jobs.backup.enabled: false
      sync.recovery.enabled: false
      sync.config.schemas.test.tables: []
    asserts:
      - hasDocuments:
          count: 0
