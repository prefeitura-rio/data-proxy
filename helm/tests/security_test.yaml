suite: Istio Security
templates:
  - requestauthentication.yaml
  - authorizationpolicy.yaml
tests:
  - it: does not render when ingress is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when auth is disabled
    set:
      ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders both resources when ingress and auth are enabled
    set:
      ingress.enabled: true
      ingress.host: api.example.com
      ingress.auth.enabled: true
      ingress.auth.issuer: "https://auth.example.com"
      ingress.auth.jwksUri: "https://auth.example.com/protocol/openid-connect/certs"
    asserts:
      - hasDocuments:
          count: 1
        template: requestauthentication.yaml
      - hasDocuments:
          count: 1
        template: authorizationpolicy.yaml

  - it: RequestAuthentication uses configured issuer and jwks and forwards the token
    template: requestauthentication.yaml
    set:
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: "https://auth.example.com"
      ingress.auth.jwksUri: "https://auth.example.com/protocol/openid-connect/certs"
    asserts:
      - isKind:
          of: RequestAuthentication
      - equal:
          path: spec.jwtRules[0].issuer
          value: "https://auth.example.com"
      - equal:
          path: spec.jwtRules[0].jwksUri
          value: "https://auth.example.com/protocol/openid-connect/certs"
      - equal:
          path: spec.jwtRules[0].forwardOriginalToken
          value: true
      - notExists:
          path: spec.jwtRules[0].audiences

  - it: RequestAuthentication sets audiences when configured
    template: requestauthentication.yaml
    set:
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: "https://auth.example.com"
      ingress.auth.jwksUri: "https://auth.example.com/protocol/openid-connect/certs"
      ingress.auth.audience: "data-proxy"
    asserts:
      - equal:
          path: spec.jwtRules[0].audiences
          value:
            - data-proxy

  - it: AuthorizationPolicy allows any valid JWT principal
    template: authorizationpolicy.yaml
    set:
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: "https://auth.example.com"
      ingress.auth.jwksUri: "https://auth.example.com/protocol/openid-connect/certs"
    asserts:
      - isKind:
          of: AuthorizationPolicy
      - equal:
          path: spec.action
          value: ALLOW
      - equal:
          path: spec.rules[0].from[0].source.requestPrincipals[0]
          value: "*"
      - notExists:
          path: spec.rules[0].when

  - it: covers the fallback proxy when it is enabled
    set:
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: "https://auth.example.com"
      ingress.auth.jwksUri: "https://auth.example.com/protocol/openid-connect/certs"
      fallback.enabled: true
      swaggerUi.enabled: true
    asserts:
      - hasDocuments:
          count: 2
        template: authorizationpolicy.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: nginx-proxy
        template: authorizationpolicy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - equal:
          path: spec.rules[0].from[0].source.requestPrincipals[0]
          value: "*"
        template: authorizationpolicy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - equal:
          path: spec.rules[1].to[0].operation.methods[0]
          value: GET
        template: authorizationpolicy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - equal:
          path: spec.rules[1].to[0].operation.paths[0]
          value: /
        template: authorizationpolicy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - equal:
          path: spec.rules[2].to[0].operation.paths[0]
          value: /health
        template: authorizationpolicy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - hasDocuments:
          count: 2
        template: requestauthentication.yaml
      - equal:
          path: spec.jwtRules[0].issuer
          value: "https://auth.example.com"
        template: requestauthentication.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy

  - it: keeps the document protected on the proxy when swagger is disabled
    set:
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: "https://auth.example.com"
      ingress.auth.jwksUri: "https://auth.example.com/protocol/openid-connect/certs"
      fallback.enabled: true
      swaggerUi.enabled: false
    asserts:
      - equal:
          path: spec.rules[1].to[0].operation.paths[0]
          value: /health
        template: authorizationpolicy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - lengthEqual:
          path: spec.rules
          count: 2
        template: authorizationpolicy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy

  - it: omits the proxy policy when the fallback is disabled
    set:
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: "https://auth.example.com"
      ingress.auth.jwksUri: "https://auth.example.com/protocol/openid-connect/certs"
    asserts:
      - hasDocuments:
          count: 1
        template: authorizationpolicy.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: postgrest
        template: authorizationpolicy.yaml
      - hasDocuments:
          count: 1
        template: requestauthentication.yaml

