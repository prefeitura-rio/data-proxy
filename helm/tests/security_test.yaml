suite: Istio Security
templates:
  - istio.yaml
tests:
  - it: does not render when ingress is disabled
    set:
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: istio.yaml

  - it: does not render when auth is disabled
    set:
      ingress.enabled: true
      ingress.auth.enabled: false
    asserts:
      - hasDocuments:
          count: 1
        template: istio.yaml

  - it: RequestAuthentication uses configured issuer and jwks and forwards the token
    set:
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: https://issuer.example.com
      ingress.auth.jwksUri: https://jwks.example.com
      ingress.auth.audience: api.example.com
    asserts:
      - isKind:
          of: RequestAuthentication
        documentSelector:
          path: kind
          value: RequestAuthentication
        template: istio.yaml
      - equal:
          path: spec.jwtRules[0].issuer
          value: https://issuer.example.com
        documentSelector:
          path: kind
          value: RequestAuthentication
        template: istio.yaml
      - equal:
          path: spec.jwtRules[0].jwksUri
          value: https://jwks.example.com
        documentSelector:
          path: kind
          value: RequestAuthentication
        template: istio.yaml
      - equal:
          path: spec.jwtRules[0].audiences[0]
          value: api.example.com
        documentSelector:
          path: kind
          value: RequestAuthentication
        template: istio.yaml
      - equal:
          path: spec.jwtRules[0].forwardOriginalToken
          value: true
        documentSelector:
          path: kind
          value: RequestAuthentication
        template: istio.yaml

  - it: AuthorizationPolicy allows authenticated requests and health
    set:
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: https://issuer.example.com
      ingress.auth.jwksUri: https://jwks.example.com
    asserts:
      - isKind:
          of: AuthorizationPolicy
        documentSelector:
          path: kind
          value: AuthorizationPolicy
        template: istio.yaml
      - equal:
          path: spec.action
          value: ALLOW
        documentSelector:
          path: kind
          value: AuthorizationPolicy
        template: istio.yaml
      - equal:
          path: spec.rules[0].from[0].source.requestPrincipals[0]
          value: "*"
        documentSelector:
          path: kind
          value: AuthorizationPolicy
        template: istio.yaml
      - equal:
          path: spec.rules[1].to[0].operation.methods[0]
          value: GET
        documentSelector:
          path: kind
          value: AuthorizationPolicy
        template: istio.yaml
      - equal:
          path: spec.rules[1].to[0].operation.paths[0]
          value: /health
        documentSelector:
          path: kind
          value: AuthorizationPolicy
        template: istio.yaml

  - it: AuthorizationPolicy allows unauthenticated Swagger UI when enabled
    set:
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: https://issuer.example.com
      ingress.auth.jwksUri: https://jwks.example.com
      swaggerUi.enabled: true
    asserts:
      - equal:
          path: spec.rules[1].to[0].operation.paths[0]
          value: /
        documentSelector:
          path: kind
          value: AuthorizationPolicy
        template: istio.yaml
