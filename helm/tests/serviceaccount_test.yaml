suite: ServiceAccount
templates:
  - serviceaccount.yaml
tests:
  - it: renders when create is true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: data-proxy

  - it: does not render when create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders annotations when set
    set:
      serviceAccount.annotations:
        iam.gke.io/gcp-service-account: sa@project.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.annotations["iam.gke.io/gcp-service-account"]
          value: sa@project.iam.gserviceaccount.com
