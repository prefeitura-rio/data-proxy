suite: Init-db Job
templates:
  - job-init-db.yaml
  - cronjobs.yaml
tests:
  - it: init-db renders script and SQL ConfigMaps
    asserts:
      - hasDocuments:
          count: 3
        template: job-init-db.yaml
      - isKind:
          of: ConfigMap
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-script
        template: job-init-db.yaml
      - isKind:
          of: ConfigMap
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-sql
        template: job-init-db.yaml

  - it: init-db mounts both ConfigMaps
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].name
          value: init-db-script
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-0
        template: job-init-db.yaml
      - equal:
          path: spec.template.spec.volumes[2].name
          value: init-db-sql
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-0
        template: job-init-db.yaml

  - it: init-db SQL ConfigMap ships maintenance procedure files
    asserts:
      - hasDocuments:
          count: 3
        template: job-init-db.yaml
      - notExists:
          path: data.setup_maintenance.sql
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-sql
        template: job-init-db.yaml

  - it: init-db mounts templates at /templates/postgres
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SQL_TEMPLATE_DIR
            value: /templates/postgres
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-0
        template: job-init-db.yaml

  - it: backup does not render when disabled
    set:
      jobs.backup.enabled: false
      jobs.cleanup.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: cronjobs.yaml
