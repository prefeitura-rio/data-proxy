suite: Migrate-db Job
templates:
  - jobs.yaml
tests:
  - it: runs the DBOS migrations and the migrations of both databases in the sync image
    set:
      sync.image: ghcr.io/example/sync:test
    asserts:
      - isKind:
          of: Job
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/sync:test
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - sh
            - -c
            - ': "${AUTH_ANON_ROLE:?}" "${AUTH_USER_ROLE:?}" "${AUTH_SIGNER_ROLE:?}" "${PGUSER:?}" && dbos migrate --sys-db-url "$DBOS_SYSTEM_DATABASE_URL" --schema "$DBOS_SYSTEM_SCHEMA" && goose -dir /app/migrations/console postgres "$PG_DATABASE_URL" up && goose -dir /app/migrations/ducklake postgres "$DUCKLAKE_ADMIN_URL" up'
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml

  - it: waits for the request roles before it runs the migrations, which grant to them
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-roles
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [nu, /scripts/wait-for-sql.nu]
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PROBE
            value: "SELECT count(*) = 3 FROM pg_roles WHERE rolname IN ('anon', 'dp_api', 'console_signer')"
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml

  - it: gives the migrations the role names that goose fills into the grants, and the catalog database
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_SIGNER_ROLE
            value: console_signer
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            value: ops
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUCKLAKE_ADMIN_URL
            value: "postgresql://ops:$(PASSWORD)@data-proxy-rw:5432/ducklake"
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml

  - it: connects with the database user and the password secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: data-proxy-cnpg-ops
                key: password
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: PG_DATABASE_URL
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].env[1].value
          pattern: "@data-proxy-rw:5432/data-proxy$"
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrate-db
        template: jobs.yaml
