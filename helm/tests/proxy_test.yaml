suite: Proxy
templates:
  - configmap-proxy.yaml
  - deployment-proxy.yaml
  - scaledobjects.yaml
  - services.yaml
set:
  redis.host: redis-writer
tests:
  - it: renders one OpenResty proxy container
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        template: deployment-proxy.yaml
      - equal:
          path: spec.template.spec.containers[0].name
          value: proxy
        template: deployment-proxy.yaml

  - it: mounts the OpenResty configuration and sync config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /usr/local/openresty/nginx/conf/nginx.conf
            subPath: nginx.conf
        template: deployment-proxy.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sync-config
            mountPath: /config
            readOnly: true
        template: deployment-proxy.yaml

  - it: passes the Redis password to OpenResty
    set:
      redis.existingSecret: redis-credentials
      redis.passwordKey: redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROXY_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: redis-credentials
                key: redis-password
        template: deployment-proxy.yaml

  - it: removes the Webdis service port
    asserts:
      - notContains:
          path: spec.ports
          content:
            name: redis-http
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
        template: services.yaml

  - it: renders the OpenResty configuration
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "lua_shared_dict proxy_locks"
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
        template: configmap-proxy.yaml
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "content_by_lua_block"
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
        template: configmap-proxy.yaml
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: "webdis|js_import|js_content"
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
        template: configmap-proxy.yaml

  - it: keeps the proxy autoscaling configuration
    asserts:
      - equal:
          path: spec.triggers[0].metadata.value
          value: "90"
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
        template: scaledobjects.yaml

  - it: leaves the console address out of OpenResty by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROXY_CONFIG_URL
            value: ""
        template: deployment-proxy.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROXY_CONFIG_REFRESH_SECONDS
            value: "60"
        template: deployment-proxy.yaml

  - it: passes the console address and the refresh time to OpenResty
    set:
      proxy.configUrl: http://console:8000/config/sync.json
      proxy.configRefreshSeconds: 30
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROXY_CONFIG_URL
            value: http://console:8000/config/sync.json
        template: deployment-proxy.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROXY_CONFIG_REFRESH_SECONDS
            value: "30"
        template: deployment-proxy.yaml

  - it: exposes the admin port that reloads the settings
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: admin
            containerPort: 8081
        template: deployment-proxy.yaml

  - it: renders a headless service for the admin port only when a console address is set
    set:
      proxy.configUrl: http://console:8000/config/sync.json
    asserts:
      - hasDocuments:
          count: 3
        template: services.yaml
      - equal:
          path: spec.clusterIP
          value: None
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy-admin
        template: services.yaml
      - equal:
          path: spec.ports[0].port
          value: 8081
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy-admin
        template: services.yaml
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: proxy
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy-admin
        template: services.yaml

  - it: renders no admin service without a console address
    asserts:
      - hasDocuments:
          count: 2
        template: services.yaml
