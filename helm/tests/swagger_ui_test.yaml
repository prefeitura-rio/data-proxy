suite: Swagger UI
templates:
  - istio.yaml
  - services.yaml
  - configmap-swagger-ui.yaml
  - deployment-swagger-ui.yaml
tests:
  - it: does not render the deployment by default
    asserts:
      - hasDocuments:
          count: 0
        template: deployment-swagger-ui.yaml

  - it: renders the deployment when enabled
    set:
      swaggerUi.enabled: true
      ingress.enabled: true
      ingress.host: api.example.com
    asserts:
      - hasDocuments:
          count: 1
        template: deployment-swagger-ui.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: swaggerapi/swagger-ui:v5.18.2
        template: deployment-swagger-ui.yaml

  - it: renders the VirtualService docs routes when enabled
    set:
      swaggerUi.enabled: true
      ingress.enabled: true
      ingress.host: api.example.com
    asserts:
      - equal:
          path: spec.http[0].name
          value: docs-redirect
        documentSelector:
          path: kind
          value: VirtualService
        template: istio.yaml
      - equal:
          path: spec.http[1].name
          value: docs
        documentSelector:
          path: kind
          value: VirtualService
        template: istio.yaml

  - it: does not render VirtualService docs routes when disabled
    set:
      swaggerUi.enabled: false
      ingress.enabled: true
      ingress.host: api.example.com
    asserts:
      - hasDocuments:
          count: 1
        template: istio.yaml
