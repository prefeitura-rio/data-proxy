suite: Standalone mode (ha.enabled false)
templates:
  - pvc-pgduckdb.yaml
  - statefulset-duckdb.yaml
  - rbac.yaml
tests:
  - it: renders one retained pgduckdb PVC
    set:
      pgduckdb.storage.size: 75Gi
    asserts:
      - hasDocuments:
          count: 1
        template: pvc-pgduckdb.yaml
      - equal:
          path: metadata.name
          value: pgdata-data-proxy-duckdb-0
        template: pvc-pgduckdb.yaml
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: pvc-pgduckdb.yaml
      - equal:
          path: spec.resources.requests.storage
          value: 75Gi
        template: pvc-pgduckdb.yaml

  - it: renders one standalone StatefulSet with the explicit PVC
    asserts:
      - hasDocuments:
          count: 1
        template: statefulset-duckdb.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: statefulset-duckdb.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ghcr.io/prefeitura-rio/data-proxy-postgres:.*
        template: statefulset-duckdb.yaml
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: pgdata-data-proxy-duckdb-0
        template: statefulset-duckdb.yaml
      - notExists:
          path: spec.volumeClaimTemplates
        template: statefulset-duckdb.yaml

  - it: injects the BigQuery credential into pgduckdb
    set:
      fallback.enabled: true
      gcp.existingSecret: data-proxy-gcp-credentials
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /gcp/key.json
        template: statefulset-duckdb.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gcp-key
            mountPath: /gcp
            readOnly: true
        template: statefulset-duckdb.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gcp-key
            secret:
              secretName: data-proxy-gcp-credentials
        template: statefulset-duckdb.yaml

  - it: omits the BigQuery credential without an existing secret
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /gcp/key.json
        template: statefulset-duckdb.yaml

  - it: does not render HA RBAC resources
    asserts:
      - hasDocuments:
          count: 0
        template: rbac.yaml
