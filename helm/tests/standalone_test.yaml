suite: CNPG single cluster
templates:
  - cluster-cnpg.yaml
  - rbac.yaml
  - scaledobjects.yaml
  - pooler-cnpg.yaml
tests:
  - it: manages anon, user, and postgrest roles through CNPG
    asserts:
      - equal:
          path: spec.managed.roles[1].name
          value: "anon"
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[1].login
          value: false
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[2].name
          value: "user"
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[3].name
          value: "postgrest"
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[3].inherit
          value: false
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[3].inRoles
          value: ["anon", "user"]
        template: cluster-cnpg.yaml
      - equal:
          path: spec.bootstrap.initdb.postInitApplicationSQL
          value:
            - CREATE EXTENSION IF NOT EXISTS postgis;
            - CREATE EXTENSION IF NOT EXISTS pg_duckdb;
            - CREATE SCHEMA IF NOT EXISTS rls;
        template: cluster-cnpg.yaml

  - it: grants policy writer membership per configured schema
    set:
      sync.config:
        schemas:
          test:
            claim: preferred_username
            tables: []
          test2:
            claim: preferred_username
            tables: []
    asserts:
      - equal:
          path: spec.managed.roles[3].inRoles
          value: ["anon", "user", "policy_writer_test", "policy_writer_test2"]
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[4]
          value:
            name: policy_writer_test
            ensure: present
            login: false
            bypassrls: false
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[5]
          value:
            name: policy_writer_test2
            ensure: present
            login: false
            bypassrls: false
        template: cluster-cnpg.yaml

  - it: renders one CNPG Cluster
    set:
      cnpg.instances: 3
      cnpg.storage.size: 100Gi
    asserts:
      - hasDocuments:
          count: 1
        template: cluster-cnpg.yaml
      - isKind:
          of: Cluster
        template: cluster-cnpg.yaml
      - notExists:
          path: spec.instances
        template: cluster-cnpg.yaml
      - equal:
          path: metadata.annotations["autoscaling.keda.sh/paused-replicas"]
          value: "3"
        documentSelector:
          path: metadata.name
          value: data-proxy-cluster-autoscaler
        template: scaledobjects.yaml
      - equal:
          path: spec.storage.size
          value: 100Gi
        template: cluster-cnpg.yaml

  - it: mounts GCP credentials into every CNPG instance
    set:
      gcp.existingSecret: gcp-key
    asserts:
      - contains:
          path: spec.projectedVolumeTemplate.sources[1].secret.items
          content:
            key: key.json
            path: gcp-key.json
        template: cluster-cnpg.yaml
      - equal:
          path: spec.projectedVolumeTemplate.sources[1].secret.name
          value: gcp-key
        template: cluster-cnpg.yaml

  - it: uses the configured CNPG PostgreSQL image
    set:
      cnpg.image: ghcr.io/example/data-proxy-postgres:test
    asserts:
      - equal:
          path: spec.imageName
          value: ghcr.io/example/data-proxy-postgres:test
        template: cluster-cnpg.yaml

  - it: configures pg_duckdb in shared_preload_libraries
    asserts:
      - contains:
          path: spec.postgresql.shared_preload_libraries
          content: pg_duckdb
        template: cluster-cnpg.yaml

  - it: declares a pg_stat_statements parameter
    asserts:
      - equal:
          path: spec.postgresql.parameters["pg_stat_statements.max"]
          value: "10000"
        template: cluster-cnpg.yaml
      - contains:
          path: spec.postgresql.shared_preload_libraries
          content: pg_stat_statements
        template: cluster-cnpg.yaml

  - it: renders sync RBAC resources
    asserts:
      - hasDocuments:
          count: 2
        template: rbac.yaml

  - it: leaves Pooler authentication to CNPG
    asserts:
      - notExists:
          path: spec.pgbouncer.authQuerySecret
        template: pooler-cnpg.yaml
      - notExists:
          path: spec.pgbouncer.authQuery
        template: pooler-cnpg.yaml

  - it: creates one read-write Pooler
    asserts:
      - hasDocuments:
          count: 1
        template: pooler-cnpg.yaml
      - equal:
          path: metadata.name
          value: data-proxy-pooler
        template: pooler-cnpg.yaml
      - equal:
          path: spec.type
          value: rw
        template: pooler-cnpg.yaml

  - it: defaults duckdb threads to two
    asserts:
      - equal:
          path: spec.postgresql.parameters["duckdb.threads"]
          value: "2"
        template: cluster-cnpg.yaml

  - it: overrides duckdb threads from values
    asserts:
      - equal:
          path: spec.postgresql.parameters["duckdb.threads"]
          value: "4"
        template: cluster-cnpg.yaml
    set:
      cnpg.duckdb.threads: 4

  - it: configures the DuckDB memory cap
    set:
      cnpg.duckdb.maxMemory: 2048MB
    asserts:
      - equal:
          path: spec.postgresql.parameters["duckdb.max_memory"]
          value: 2048MB
        template: cluster-cnpg.yaml

  - it: mounts the shared catalog PVC into every CNPG instance
    set:
      sync.config:
        schemas:
          app:
            tables: []
      ducklake.litestream.storage.storageClass: minikube-rwx
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: "ducklake-catalogs"
        template: cluster-cnpg.yaml
      - equal:
          path: spec.projectedVolumeTemplate.sources[0].configMap.name
          value: data-proxy-litestream
        template: cluster-cnpg.yaml
