suite: CNPG single cluster
templates:
  - cluster-cnpg.yaml
  - rbac.yaml
  - scaledobjects.yaml
tests:
  - it: manages only the ops and duckdb roles, because ops creates the request roles itself
    asserts:
      - lengthEqual:
          path: spec.managed.roles
          count: 2
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[0].name
          value: "ops"
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[0].superuser
          value: true
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[1].name
          value: duckdb
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[1].superuser
          value: false
        template: cluster-cnpg.yaml

  - it: creates the extensions at bootstrap and lets DuckDB run for the serving login
    asserts:
      - equal:
          path: spec.bootstrap.initdb.postInitApplicationSQL
          value:
            - CREATE EXTENSION IF NOT EXISTS postgis;
            - CREATE EXTENSION IF NOT EXISTS pg_duckdb;
        template: cluster-cnpg.yaml
      - equal:
          path: spec.postgresql.parameters["duckdb.postgres_role"]
          value: serving
        template: cluster-cnpg.yaml

  - it: renders one CNPG Cluster
    set:
      cnpg.storage.size: 100Gi
    asserts:
      - hasDocuments:
          count: 1
        template: cluster-cnpg.yaml
      - isKind:
          of: Cluster
        template: cluster-cnpg.yaml
      - notExists:
          path: spec.instances
        template: cluster-cnpg.yaml
      - equal:
          path: spec.storage.size
          value: 100Gi
        template: cluster-cnpg.yaml

  - it: mounts GCP credentials into every CNPG instance
    set:
      gcp.existingSecret: gcp
      sync.config:
        schemas:
          app:
            tables: []
      ducklake.secrets.storage.storageClass: k3d-rwx
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: '"mountPath":"/gcp","name":"gcp","readOnly":true'
        template: cluster-cnpg.yaml
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: '"name":"gcp","secret":\{"secretName":"gcp"\}'
        template: cluster-cnpg.yaml
      - contains:
          path: spec.env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /gcp/key.json
        template: cluster-cnpg.yaml
      - notExists:
          path: spec.projectedVolumeTemplate
        template: cluster-cnpg.yaml

  - it: uses the configured CNPG PostgreSQL image
    set:
      cnpg.image: ghcr.io/example/data-proxy-postgres:test
    asserts:
      - equal:
          path: spec.imageName
          value: ghcr.io/example/data-proxy-postgres:test
        template: cluster-cnpg.yaml

  - it: configures pg_duckdb in shared_preload_libraries
    asserts:
      - contains:
          path: spec.postgresql.shared_preload_libraries
          content: pg_duckdb
        template: cluster-cnpg.yaml

  - it: declares a pg_stat_statements parameter
    asserts:
      - equal:
          path: spec.postgresql.parameters["pg_stat_statements.max"]
          value: "10000"
        template: cluster-cnpg.yaml
      - contains:
          path: spec.postgresql.shared_preload_libraries
          content: pg_stat_statements
        template: cluster-cnpg.yaml

  - it: renders sync RBAC resources for the workflow recovery and the provision Jobs
    asserts:
      - hasDocuments:
          count: 2
        template: rbac.yaml
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods]
              verbs: [get, list]
            - apiGroups: [batch]
              resources: [cronjobs]
              verbs: [get]
            - apiGroups: [batch]
              resources: [jobs]
              verbs: [create, get, watch]
        documentSelector:
          path: kind
          value: Role
        template: rbac.yaml
