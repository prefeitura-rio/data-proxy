suite: CNPG shared mode
templates:
  - cluster-cnpg.yaml
  - rbac.yaml
  - scaledobject-pooler.yaml
  - pooler-cnpg.yaml
  - secret-cnpg-roles.yaml
tests:
  - it: manages anon, user, and authenticator roles through CNPG
    asserts:
      - equal:
          path: spec.managed.roles[1].name
          value: "anon"
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[1].login
          value: false
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[2].name
          value: "user"
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[3].name
          value: "authenticator"
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[3].inherit
          value: false
        template: cluster-cnpg.yaml
      - equal:
          path: spec.managed.roles[3].inRoles
          value: ["anon", "user"]
        template: cluster-cnpg.yaml
      - equal:
          path: spec.bootstrap.initdb.postInitApplicationSQL
          value: []
        template: cluster-cnpg.yaml
  - it: grants policy writer membership per configured schema
    set:
      syncConfig:
        schemas:
          app_pequenos_cariocas:
            claim: preferred_username
            tables: []
          bcadastro:
            claim: preferred_username
            tables: []
    asserts:
      - equal:
          path: spec.managed.roles[3].inRoles
          value: ["anon", "user", "policy_writer_app_pequenos_cariocas", "policy_writer_bcadastro"]
        template: cluster-cnpg.yaml
      - notContains:
          path: spec.managed.roles
          content:
            name: cnpg_pooler_pgbouncer
        template: cluster-cnpg.yaml
  - it: manages the shared jobs role through CNPG
    asserts:
      - contains:
          path: spec.managed.roles
          content:
            name: jobs
            ensure: present
            login: true
            bypassrls: false
            passwordSecret:
              name: data-proxy-jobs
        template: cluster-cnpg.yaml

  - it: renders one CNPG Cluster in shared mode
    set:
      cnpg.instances: 3
      cnpg.storage.size: 100Gi
    asserts:
      - hasDocuments:
          count: 1
        template: cluster-cnpg.yaml
      - isKind:
          of: Cluster
        template: cluster-cnpg.yaml
      - equal:
          path: spec.instances
          value: 3
        template: cluster-cnpg.yaml
      - equal:
          path: spec.storage.size
          value: 100Gi
        template: cluster-cnpg.yaml

  - it: mounts GCP credentials into every CNPG instance
    set:
      gcp.existingSecret: gcp-key
    asserts:
      - contains:
          path: spec.projectedVolumeTemplate.sources[0].secret.items
          content:
            key: key.json
            path: gcp-key.json
        template: cluster-cnpg.yaml
      - equal:
          path: spec.projectedVolumeTemplate.sources[0].secret.name
          value: gcp-key
        template: cluster-cnpg.yaml

  - it: uses the configured CNPG PostgreSQL image
    set:
      cnpg.image: ghcr.io/example/data-proxy-postgres:test
    asserts:
      - equal:
          path: spec.imageName
          value: ghcr.io/example/data-proxy-postgres:test
        template: cluster-cnpg.yaml

  - it: configures pg_duckdb in shared_preload_libraries
    asserts:
      - contains:
          path: spec.postgresql.shared_preload_libraries
          content: pg_duckdb
        template: cluster-cnpg.yaml

  - it: declares a pg_stat_statements parameter so CNPG manages the extension
    asserts:
      - equal:
          path: spec.postgresql.parameters["pg_stat_statements.max"]
          value: "10000"
        template: cluster-cnpg.yaml
      - contains:
          path: spec.postgresql.shared_preload_libraries
          content: pg_stat_statements
        template: cluster-cnpg.yaml

  - it: does not render Patroni RBAC resources
    asserts:
      - hasDocuments:
          count: 5
        template: rbac.yaml

  - it: leaves Pooler authentication to CNPG
    asserts:
      - notExists:
          path: spec.pgbouncer.authQuerySecret
        template: pooler-cnpg.yaml
      - notExists:
          path: spec.pgbouncer.authQuery
        template: pooler-cnpg.yaml
  - it: renders a Pooler ScaledObject targeting the shared Pooler
    asserts:
      - hasDocuments:
          count: 1
        template: scaledobject-pooler.yaml
      - equal:
          path: spec.scaleTargetRef.kind
          value: Pooler
        template: scaledobject-pooler.yaml
      - equal:
          path: spec.scaleTargetRef.name
          value: data-proxy-pooler-ro
        template: scaledobject-pooler.yaml
      - equal:
          path: spec.minReplicaCount
          value: 1
        template: scaledobject-pooler.yaml
      - equal:
          path: spec.maxReplicaCount
          value: 3
        template: scaledobject-pooler.yaml

  - it: sizes duckdb threads proportionally to the memory limit
    asserts:
      - equal:
          path: spec.postgresql.parameters["duckdb.threads"]
          value: "2"
        template: cluster-cnpg.yaml
    set:
      cnpg.resources.limits.memory: 4Gi
  - it: raises duckdb threads for large memory limits
    asserts:
      - equal:
          path: spec.postgresql.parameters["duckdb.threads"]
          value: "3"
        template: cluster-cnpg.yaml
    set:
      cnpg.resources.limits.memory: 6Gi
  - it: caps duckdb threads at four
    asserts:
      - equal:
          path: spec.postgresql.parameters["duckdb.threads"]
          value: "4"
        template: cluster-cnpg.yaml
    set:
      cnpg.resources.limits.memory: 32Gi
  - it: floors duckdb threads at one for tiny memory limits
    asserts:
      - equal:
          path: spec.postgresql.parameters["duckdb.threads"]
          value: "1"
        template: cluster-cnpg.yaml
    set:
      cnpg.resources.limits.memory: 512Mi

  - it: configures the DuckDB memory cap
    set:
      cnpg.duckdb.maxMemory: 2048MB
    asserts:
      - equal:
          path: spec.postgresql.parameters["duckdb.max_memory"]
          value: 2048MB
        template: cluster-cnpg.yaml