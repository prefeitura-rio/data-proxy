suite: Standalone mode (ha.enabled false)
templates:
  - pvc-pgduckdb.yaml
  - statefulset-duckdb.yaml
  - statefulset-duckdb-ha.yaml
  - service-duckdb-master.yaml
  - service-duckdb-replica.yaml
  - deployment-pgbouncer-rw.yaml
  - deployment-pgbouncer-ro.yaml
  - rbac.yaml
tests:
  - it: renders one retained pgduckdb PVC
    set:
      pgduckdb.storage.size: 75Gi
    asserts:
      - hasDocuments:
          count: 1
        template: pvc-pgduckdb.yaml
      - equal:
          path: metadata.name
          value: pgdata-data-proxy-duckdb-0
        template: pvc-pgduckdb.yaml
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
        template: pvc-pgduckdb.yaml
      - equal:
          path: spec.resources.requests.storage
          value: 75Gi
        template: pvc-pgduckdb.yaml

  - it: renders one standalone StatefulSet with the explicit PVC
    asserts:
      - hasDocuments:
          count: 1
        template: statefulset-duckdb.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: statefulset-duckdb.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/prefeitura-rio/data-proxy-postgres:1.0.0
        template: statefulset-duckdb.yaml
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: pgdata-data-proxy-duckdb-0
        template: statefulset-duckdb.yaml
      - notExists:
          path: spec.volumeClaimTemplates
        template: statefulset-duckdb.yaml

  - it: does not render HA StatefulSets
    asserts:
      - hasDocuments:
          count: 0
        template: statefulset-duckdb-ha.yaml

  - it: does not render HA services or PgBouncer
    asserts:
      - hasDocuments:
          count: 0
        template: service-duckdb-master.yaml
      - hasDocuments:
          count: 0
        template: service-duckdb-replica.yaml
      - hasDocuments:
          count: 0
        template: deployment-pgbouncer-rw.yaml
      - hasDocuments:
          count: 0
        template: deployment-pgbouncer-ro.yaml

  - it: does not render HA RBAC resources
    asserts:
      - hasDocuments:
          count: 0
        template: rbac.yaml
