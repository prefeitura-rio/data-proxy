suite: Chart label
templates:
  - serviceaccount.yaml
chart:
  version: 1.127.0+e2bb4de53598
tests:
  - it: writes a chart version with build metadata as a valid label value
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: data-proxy-1.127.0_e2bb4de53598
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: "^([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9]$"
