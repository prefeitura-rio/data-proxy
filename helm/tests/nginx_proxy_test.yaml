suite: Nginx proxy
templates:
  - configmap-nginx-proxy.yaml
  - deployment-nginx-proxy.yaml
  - service-nginx-proxy.yaml
tests:
  - it: does not render when the fallback is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: injects the Istio sidecar into the proxy that receives the traffic
    set:
      fallback.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.labels["sidecar.istio.io/inject"]
          value: "true"
        template: deployment-nginx-proxy.yaml

  - it: honors sidecarInject for the proxy
    set:
      fallback.enabled: true
      ingress.sidecarInject: false
    asserts:
      - equal:
          path: spec.template.metadata.labels["sidecar.istio.io/inject"]
          value: "false"
        template: deployment-nginx-proxy.yaml

  - it: configures Webdis with a runtime Valkey password
    set:
      fallback.enabled: true
      valkey.auth.enabled: true
      valkey.auth.existingSecret: valkey-credentials
      valkey.auth.existingSecretKey: redis-password
      valkey.auth.password: rendered-password-must-not-appear
    asserts:
      - notMatchRegex:
          path: data["webdis.json"]
          pattern: rendered-password-must-not-appear
        template: configmap-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: valkey-credentials
                key: redis-password
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.containers[1].command
          content: /bin/sh
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: webdis-runtime-config
            mountPath: /run/webdis
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: webdis-runtime-config
            emptyDir: {}
        template: deployment-nginx-proxy.yaml

  - it: publishes the webdis port of the sidecar
    set:
      fallback.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            name: redis-http
            containerPort: 7379
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.ports
          content:
            name: redis-http
            port: 7379
            targetPort: 7379
        template: service-nginx-proxy.yaml

  - it: rolls the proxy when its configuration changes
    set:
      fallback.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/proxy-config"]
          pattern: "^[0-9a-f]{64}$"
        template: deployment-nginx-proxy.yaml

  - it: mounts the sync config and rolls on its changes
    set:
      fallback.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/sync-config"]
          pattern: "^[0-9a-f]{64}$"
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sync-config
            mountPath: /config
            readOnly: true
        template: deployment-nginx-proxy.yaml
