suite: Nginx proxy
templates:
  - configmap-nginx-proxy.yaml
  - deployment-nginx-proxy.yaml
  - service-nginx-proxy.yaml
tests:
  - it: renders the proxy configmap with nginx and webdis configs
    asserts:
      - hasDocuments:
          count: 2
        template: configmap-nginx-proxy.yaml

  - it: injects the Istio sidecar into the proxy that receives the traffic
    set:
    asserts:
      - equal:
          path: spec.template.metadata.labels["sidecar.istio.io/inject"]
          value: "true"
        template: deployment-nginx-proxy.yaml

  - it: honors sidecarInject for the proxy
    set:
      ingress.sidecarInject: false
    asserts:
      - equal:
          path: spec.template.metadata.labels["sidecar.istio.io/inject"]
          value: "false"
        template: deployment-nginx-proxy.yaml

  - it: configures the webdis-write sidecar with a runtime Valkey password
    set:
      redis.existingSecret: valkey-credentials
      redis.passwordKey: redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: VALKEY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: valkey-credentials
                key: redis-password
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.containers[1].command
          content: /bin/sh
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: webdis-write-runtime
            mountPath: /run/webdis-write
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: webdis-write-runtime
            emptyDir: {}
        template: deployment-nginx-proxy.yaml

  - it: configures the webdis-read sidecar on port 7380
    set:
    asserts:
      - equal:
          path: spec.template.spec.containers[2].name
          value: webdis-read
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.containers[2].ports
          content:
            name: redis-http-read
            containerPort: 7380
        template: deployment-nginx-proxy.yaml

  - it: templates the webdis write and read config
    set:
      redis.webdisHost: redis-primary
      redis.webdisPort: 6379
      redis.webdisReadHost: redis-replica
    asserts:
      - matchRegex:
          path: data["webdis-write.json"]
          pattern: '"redis_host": "redis-primary"'
        documentSelector:
          path: metadata.name
          value: data-proxy-webdis
        template: configmap-nginx-proxy.yaml
      - matchRegex:
          path: data["webdis-read.json"]
          pattern: '"redis_host": "redis-replica"'
        documentSelector:
          path: metadata.name
          value: data-proxy-webdis
        template: configmap-nginx-proxy.yaml

  - it: publishes the webdis write port of the sidecar
    set:
    asserts:
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            name: redis-http
            containerPort: 7379
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.ports
          content:
            name: redis-http
            port: 7379
            targetPort: 7379
        template: service-nginx-proxy.yaml

  - it: keeps the fetch connections to webdis alive
    set:
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "js_fetch_keepalive 32;"
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
        template: configmap-nginx-proxy.yaml
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "js_fetch_keepalive_timeout 60s;"
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
        template: configmap-nginx-proxy.yaml

  - it: wires the fetch keepalive settings to the chart values
    set:
      fallback.fetchKeepalive: 8
      fallback.fetchKeepaliveTimeout: 30s
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "js_fetch_keepalive 8;"
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
        template: configmap-nginx-proxy.yaml
      - matchRegex:
          path: data["nginx.conf"]
          pattern: "js_fetch_keepalive_timeout 30s;"
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
        template: configmap-nginx-proxy.yaml

  - it: rolls the proxy when its configuration changes
    set:
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/proxy-config"]
          pattern: "^[0-9a-f]{64}$"
        template: deployment-nginx-proxy.yaml

  - it: mounts the sync config and rolls on its changes
    set:
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/sync-config"]
          pattern: "^[0-9a-f]{64}$"
        template: deployment-nginx-proxy.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sync-config
            mountPath: /config
            readOnly: true
        template: deployment-nginx-proxy.yaml

  - it: pins the webdis sidecar image to a fixed tag
    set:
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[1].image
          pattern: ^docker\.io/nicolas/webdis:[0-9]+\.[0-9]+\.[0-9]+$
        template: deployment-nginx-proxy.yaml
