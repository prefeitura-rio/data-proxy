suite: Always-on services
templates:
  - services.yaml
tests:
  - it: postgrest service is rendered as ClusterIP on port 3000
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: services.yaml
      - equal:
          path: spec.ports[0].port
          value: 3000
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: services.yaml

  - it: postgrest service selects the postgrest component
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: postgrest
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: services.yaml

  - it: proxy service is rendered with http and redis ports
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
        template: services.yaml
      - equal:
          path: spec.ports[1].port
          value: 7379
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
        template: services.yaml
