suite: Always-on services
templates:
  - service-postgrest.yaml
tests:
  - it: postgrest service is rendered as ClusterIP on port 3000 in shared mode
    asserts:
      - hasDocuments:
          count: 1
        template: service-postgrest.yaml
      - equal:
          path: spec.type
          value: ClusterIP
        template: service-postgrest.yaml
      - equal:
          path: spec.ports[0].port
          value: 3000
        template: service-postgrest.yaml

  - it: postgrest service selects the postgrest component
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: postgrest
        template: service-postgrest.yaml

  - it: postgrest service is not rendered in per-schema mode
    set:
      cnpg.mode: per-schema
      cnpg.schemas:
        app_example: {}
    asserts:
      - hasDocuments:
          count: 0
        template: service-postgrest.yaml
