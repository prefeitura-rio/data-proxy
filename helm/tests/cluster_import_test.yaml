suite: CNPG cluster import
templates:
  - cluster-cnpg.yaml
  - database-ducklake.yaml
  - backup-cnpg.yaml
  - scaledobjects.yaml
  - configmap-pgdog.yaml
  - deployment-sync.yaml
tests:
  - it: names the cluster after the release by default
    asserts:
      - equal:
          path: metadata.name
          value: data-proxy
        template: cluster-cnpg.yaml
      - notExists:
          path: spec.externalClusters
        template: cluster-cnpg.yaml
      - notExists:
          path: spec.bootstrap.initdb.import
        template: cluster-cnpg.yaml

  - it: names the cluster and every service host after cnpg.clusterName
    set:
      cnpg.clusterName: data-proxy-pg18
      cnpg.backup.enabled: true
      cnpg.backup.bucket: bucket
      cnpg.backup.destinationPath: cnpg
      cnpg.backup.existingSecret: backup
    asserts:
      - equal:
          path: metadata.name
          value: data-proxy-pg18
        template: cluster-cnpg.yaml
      - equal:
          path: metadata.name
          value: data-proxy-pg18-ducklake
        template: database-ducklake.yaml
      - equal:
          path: spec.cluster.name
          value: data-proxy-pg18
        template: database-ducklake.yaml
      - equal:
          path: spec.cluster.name
          value: data-proxy-pg18
        template: backup-cnpg.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: data-proxy-pg18-backup
        template: backup-cnpg.yaml
        documentIndex: 1
      - equal:
          path: metadata.name
          value: data-proxy-backup
        template: backup-cnpg.yaml
        documentIndex: 0
      - matchRegex:
          path: data["pgdog.toml"]
          pattern: 'host = "data-proxy-pg18-rw"'
        template: configmap-pgdog.yaml
      - matchRegex:
          path: data["pgdog.toml"]
          pattern: 'host = "data-proxy-pg18-ro"'
        template: configmap-pgdog.yaml

  - it: imports every database and role of the source cluster and skips the extension SQL
    set:
      cnpg.clusterName: data-proxy-pg18
      cnpg.bootstrap.import.source: data-proxy
    asserts:
      - equal:
          path: spec.bootstrap.initdb.import
          value:
            type: monolith
            databases: ["*"]
            roles: ["*"]
            source:
              externalCluster: data-proxy
        template: cluster-cnpg.yaml
      - notExists:
          path: spec.bootstrap.initdb.postInitApplicationSQL
        template: cluster-cnpg.yaml
      - equal:
          path: spec.externalClusters
          value:
            - name: data-proxy
              connectionParameters:
                host: data-proxy-rw
                user: ops
                dbname: postgres
                sslmode: require
              password:
                name: data-proxy-cnpg-ops
                key: password
        template: cluster-cnpg.yaml
