suite: Safety resources
templates:
  - cluster-cnpg.yaml
  - pdbs.yaml
  - scaledobjects.yaml
  - validate-s3.yaml
tests:
  - it: renders the proxy disruption budget
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
        template: pdbs.yaml

  - it: renders the PostgREST disruption budget
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: pdbs.yaml

  - it: renders the pooler disruption budget
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
        documentSelector:
          path: metadata.name
          value: data-proxy-pooler-ro
        template: pdbs.yaml

  - it: renders PostgREST KEDA scaler
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: data-proxy-postgrest
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: scaledobjects.yaml

  - it: renders proxy KEDA scaler
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: data-proxy-proxy
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
        template: scaledobjects.yaml

  - it: rejects a SeaweedFS bucket missing from the configured bucket list
    set:
      s3.bucket: required
      seaweedfs.s3.createBuckets:
        - name: other-bucket
    asserts:
      - failedTemplate:
          errorMessage: the SeaweedFS bucket list must contain "required", because s3.bucket names the bucket the sync service uses
        template: validate-s3.yaml
