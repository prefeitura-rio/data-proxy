suite: TriggerAuthentication
templates:
  - triggerauthentication.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: references the Redis password secret
    asserts:
      - equal:
          path: apiVersion
          value: keda.sh/v1alpha1
      - equal:
          path: kind
          value: TriggerAuthentication
      - equal:
          path: spec.secretTargetRef[0].parameter
          value: password
      - equal:
          path: spec.secretTargetRef[0].name
          value: data-proxy-redis
      - equal:
          path: spec.secretTargetRef[0].key
          value: REDIS_PASSWORD
  - it: uses an existing Redis secret
    set:
      redis.existingSecret: external-valkey
      redis.passwordKey: redis-password
    asserts:
      - equal:
          path: spec.secretTargetRef[0].name
          value: external-valkey
      - equal:
          path: spec.secretTargetRef[0].key
          value: redis-password
