suite: BigQuery fallback
release:
  name: data-proxy
  namespace: default
templates:
  - configmap-proxy.yaml
  - deployment-proxy.yaml
tests:
  - it: renders env var placeholders in nginx config
    set:
      fallback.proxyImage: example.invalid/data-proxy-fallback:test
      fallback.cacheRedisDb: 2
    templates:
      - configmap-proxy.yaml
    asserts:
      - matchRegex:
          path: data["webdis-write.json"]
          pattern: '"database": 2'
        documentSelector:
          path: metadata.name
          value: data-proxy-webdis
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'fallback_cache_ttl "\$\{CACHE_TTL\}"'
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'js_fetch_max_response_buffer_size \$\{FETCH_BUFFER_SIZE\}'
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'js_fetch_timeout \$\{FETCH_TIMEOUT\}'
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'large_client_header_buffers \$\{LARGE_CLIENT_HEADER_BUFFERS\}'
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'default "http://data-proxy-postgrest-ro.default.svc.cluster.local:3000"'
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'default "http://data-proxy-postgrest-rw.default.svc.cluster.local:3000"'
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'js_preload_object /config/sync.json'
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_pass http://127.0.0.1:7379/'
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy

  - it: sets env vars on the nginx container from helm values
    templates:
      - deployment-proxy.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="FETCH_TIMEOUT")].value
          value: "120s"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="LARGE_CLIENT_HEADER_BUFFERS")].value
          value: "4 64k"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="FETCH_BUFFER_SIZE")].value
          value: "32m"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="CACHE_TTL")].value
          value: "300"

  - it: overrides env vars from helm values
    templates:
      - deployment-proxy.yaml
    set:
      fallback.fetchTimeout: 30s
      fallback.largeClientHeaderBuffers: "8 128k"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="FETCH_TIMEOUT")].value
          value: "30s"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="LARGE_CLIENT_HEADER_BUFFERS")].value
          value: "8 128k"

  - it: mounts config as envsubst template
    templates:
      - deployment-proxy.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name=="config")].mountPath
          value: /etc/nginx/templates/nginx.conf.template
