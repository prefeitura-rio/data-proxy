suite: BigQuery fallback
release:
  name: data-proxy
  namespace: default
templates:
  - configmap-nginx-proxy.yaml
tests:
  - it: renders a configured proxy and cache
    set:
      fallback.enabled: true
      fallback.nginxImage: example.invalid/data-proxy-fallback:test
      fallback.cacheTtl: 123
      fallback.cacheRedisDb: 2
      fallback.fetchBufferSize: 8m
      fallback.fetchTimeout: 30s
    asserts:
      - matchRegex:
          path: data["webdis.json"]
          pattern: '"database": 2'
        documentSelector:
          path: metadata.name
          value: data-proxy-webdis
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'set \$fallback_cache_ttl "123";'
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'js_fetch_max_response_buffer_size 8m;'
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'js_fetch_timeout 30s;'
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'default "http://data-proxy-postgrest.default.svc.cluster.local:3000";'
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'js_preload_object /config/sync.json;'
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'proxy_pass http://127.0.0.1:7379/;'
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy

  - it: trusts the token only when the mesh validates it
    set:
      fallback.enabled: true
      ingress.enabled: true
      ingress.auth.enabled: true
      ingress.auth.issuer: "https://auth.example.com"
      ingress.auth.jwksUri: "https://auth.example.com/protocol/openid-connect/certs"
      fallback.maxCacheBodyBytes: 512
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'set \$fallback_max_body "512";'
        documentSelector:
          path: metadata.name
          value: data-proxy-nginx-proxy
