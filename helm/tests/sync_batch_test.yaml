suite: Sync dump batches
templates:
  - deployment-sync.yaml
set:
  redis.host: redis-writer
  postgrest.jwtSecret: shared-secret
tests:
  - it: takes the batch size from the values
    set:
      sync.dumpBatchBytes: 1073741824
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMP_BATCH_BYTES
            value: "1073741824"

  - it: waits for the running dumps after SIGTERM, and gives the pod 30 more seconds
    set:
      sync.shutdownTimeoutSeconds: 120
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DBOS_SHUTDOWN_TIMEOUT_SECONDS
            value: "120"
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 150

  - it: limits the removals of one step
    set:
      sync.maxRemovals: 25
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_REMOVALS
            value: "25"
