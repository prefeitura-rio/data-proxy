suite: Workloads
templates:
  - cronjob-producer.yaml
  - job-init-db.yaml
  - cronjob-backup.yaml
  - cronjob-cleanup.yaml
  - scaledjob-publisher.yaml
  - scaledjob-seeder.yaml
  - scaledobject-dumper.yaml
  - deployment-dumper.yaml
tests:
  - it: creates init-db as a Helm hook Job
    asserts:
      - isKind:
          of: Job
        documentSelector:
          path: kind
          value: Job
        template: job-init-db.yaml
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
        documentSelector:
          path: kind
          value: Job
        template: job-init-db.yaml

  - it: backup runs the Nushell script and mounts required files
    set:
      backup.enabled: true
      backup.password: test-pass
      backup.s3.bucket: backup-bucket
      backup.s3.endpointURL: https://storage.googleapis.com
      backup.s3.existingSecret: backup-creds
      syncConfig.schemas.app_example: {}
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [nu, /scripts/backup.nu]
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: backup-script
            mountPath: /scripts
            readOnly: true
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].name
          value: backup-script
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup

  - it: dumper Deployment uses the correct image and command
    asserts:
      - isKind:
          of: Deployment
        template: deployment-dumper.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [python, -m, dp.sync.dumper]
        template: deployment-dumper.yaml
      - notExists:
          path: spec.replicas
        template: deployment-dumper.yaml

  - it: dumper carries the batch settings and a scratch volume
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_BATCH_BYTES
            value: "629145600"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_VISIBILITY_TIMEOUT_MS
            value: "3600000"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEEDER_VISIBILITY_TIMEOUT_MS
            value: "900000"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PUBLISHER_VISIBILITY_TIMEOUT_MS
            value: "7200000"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_BATCH_MAX_PARTITIONS
            value: "256"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_SCRATCH_DIR
            value: "/scratch"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: scratch
            mountPath: /scratch
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scratch
            emptyDir:
              sizeLimit: 4Gi
        template: deployment-dumper.yaml

  - it: large numeric settings render as plain integers
    set:
      sync.dumper.visibilityTimeoutMs: 86400000
      sync.seeder.visibilityTimeoutMs: 7200000
      sync.dumper.batchMegaBytes: 1024
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_VISIBILITY_TIMEOUT_MS
            value: "86400000"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEEDER_VISIBILITY_TIMEOUT_MS
            value: "7200000"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_BATCH_BYTES
            value: "1073741824"
        template: deployment-dumper.yaml

  - it: dumper uses the configured scratch size limit and batch size
    set:
      sync.dumper.batchMegaBytes: 100
      sync.dumper.scratch.sizeLimit: 1Gi
      sync.dumper.scratch.mountPath: /work
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_BATCH_BYTES
            value: "104857600"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_SCRATCH_DIR
            value: "/work"
        template: deployment-dumper.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scratch
            emptyDir:
              sizeLimit: 1Gi
        template: deployment-dumper.yaml

  - it: dumper ScaledObject targets the Deployment and scales from zero
    asserts:
      - isKind:
          of: ScaledObject
        template: scaledobject-dumper.yaml
      - equal:
          path: spec.minReplicaCount
          value: 0
        template: scaledobject-dumper.yaml
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
        template: scaledobject-dumper.yaml
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:extract
        template: scaledobject-dumper.yaml
      - equal:
          path: spec.triggers[0].metadata.consumerGroup
          value: dumpers
        template: scaledobject-dumper.yaml

  - it: seeder ScaledJob runs one Job for each seed task
    asserts:
      - isKind:
          of: ScaledJob
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].command
          value: [python, -m, dp.sync.seeder]
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.jobTargetRef.template.spec.restartPolicy
          value: Never
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.jobTargetRef.backoffLimit
          value: 0
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.jobTargetRef.parallelism
          value: 1
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.minReplicaCount
          value: 0
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.maxReplicaCount
          value: 1
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 0
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 1
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:prepare
        template: scaledjob-seeder.yaml

  - it: seeder ScaledJob keeps the seed visibility timeout
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: SEEDER_VISIBILITY_TIMEOUT_MS
            value: "900000"
        template: scaledjob-seeder.yaml

  - it: publisher ScaledJob runs one Job for each schema
    asserts:
      - isKind:
          of: ScaledJob
        template: scaledjob-publisher.yaml
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].command
          value: [python, -m, dp.sync.publisher]
        template: scaledjob-publisher.yaml
      - equal:
          path: spec.jobTargetRef.template.spec.restartPolicy
          value: Never
        template: scaledjob-publisher.yaml
      - equal:
          path: spec.jobTargetRef.backoffLimit
          value: 0
        template: scaledjob-publisher.yaml
      - equal:
          path: spec.minReplicaCount
          value: 0
        template: scaledjob-publisher.yaml
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:publish
        template: scaledjob-publisher.yaml

  - it: configures a two-hour Publisher visibility timeout
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: PUBLISHER_VISIBILITY_TIMEOUT_MS
            value: "7200000"
        template: scaledjob-publisher.yaml

  - it: publisher scales to one Job for a single schema
    set:
      syncConfig.schemas:
        pic:
          claim: preferred_username
          tables:
            - name: proj.dataset.my_table
              strategy: full
    asserts:
      - equal:
          path: spec.maxReplicaCount
          value: 1
        template: scaledjob-publisher.yaml

  - it: publisher scales to one Job for each configured schema
    set:
      syncConfig.schemas:
        pic:
          claim: preferred_username
          tables:
            - name: proj.dataset.my_table
              strategy: full
        bcadastro:
          claim: preferred_username
          tables: []
        other:
          claim: preferred_username
          tables: []
    asserts:
      - equal:
          path: spec.maxReplicaCount
          value: 3
        template: scaledjob-publisher.yaml
      - equal:
          path: spec.minReplicaCount
          value: 0
        template: scaledjob-publisher.yaml

  - it: publisher maxReplicaCount overrides the schema count
    set:
      syncConfig.schemas:
        pic:
          claim: preferred_username
          tables: []
        bcadastro:
          claim: preferred_username
          tables: []
        other:
          claim: preferred_username
          tables: []
      sync.publisher.keda.maxReplicaCount: 1
    asserts:
      - equal:
          path: spec.maxReplicaCount
          value: 1
        template: scaledjob-publisher.yaml

  - it: dumper triggers on the tasks stream with configured lagCount
    set:
      sync.dumper.keda.lagCount: "2"
    asserts:
      - equal:
          path: spec.triggers[0].metadata.lagCount
          value: "2"
        template: scaledobject-dumper.yaml

  - it: dumper Deployment has topology spread constraints
    asserts:
      - exists:
          path: spec.template.spec.topologySpreadConstraints
        template: deployment-dumper.yaml

  - it: cleanup CronJob runs the Nushell script and mounts sync config
    set:
      cleanup.enabled: true
      syncConfig.schemas.app_example: {}
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: ghcr.io/prefeitura-rio/data-proxy-nushell:.*
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[2].name
          value: cleanup-script
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup

  - it: cleanup does not render when disabled
    set:
      cleanup.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: cronjob-cleanup.yaml
