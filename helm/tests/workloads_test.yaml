suite: Workloads
templates:
  - cronjob-producer.yaml
  - job-init-db.yaml
  - cronjob-backup.yaml
  - cronjob-cleanup.yaml
  - deployment-publisher.yaml
  - scaledobject-publisher.yaml
  - deployment-dumper.yaml
  - scaledobject-dumper.yaml
  - deployment-seeder.yaml
  - scaledobject-seeder.yaml
tests:
  - it: creates init-db as a normal Job
    asserts:
      - isKind:
          of: Job
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db
        template: job-init-db.yaml
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db
        template: job-init-db.yaml

  - it: backup runs the Nushell script and mounts required files
    set:
      backup.enabled: true
      backup.ageRecipient: age1example
      syncConfig.schemas.app_example: {}
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [nu, /scripts/backup.nu]
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: schema-writers
            mountPath: /config/schema-writers
            readOnly: true
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: backup-script
            mountPath: /scripts
            readOnly: true
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].name
          value: schema-writers
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[1].name
          value: backup-script
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup

  - it: dumper Deployment uses the correct image and command
    asserts:
      - isKind:
          of: Deployment
        template: deployment-dumper.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [python, -m, dp.sync.dumper]
        template: deployment-dumper.yaml
      - equal:
          path: spec.replicas
          value: 0
        template: deployment-dumper.yaml

  - it: dumper ScaledObject targets the Deployment and scales from zero
    asserts:
      - isKind:
          of: ScaledObject
        template: scaledobject-dumper.yaml
      - equal:
          path: spec.minReplicaCount
          value: 0
        template: scaledobject-dumper.yaml
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
        template: scaledobject-dumper.yaml
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:extract
        template: scaledobject-dumper.yaml
      - equal:
          path: spec.triggers[0].metadata.consumerGroup
          value: dumpers
        template: scaledobject-dumper.yaml

  - it: seeder Deployment uses the correct image and command
    asserts:
      - isKind:
          of: Deployment
        template: deployment-seeder.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [python, -m, dp.sync.seeder]
        template: deployment-seeder.yaml
      - equal:
          path: spec.replicas
          value: 0
        template: deployment-seeder.yaml

  - it: seeder ScaledObject targets the Deployment and scales from zero
    asserts:
      - isKind:
          of: ScaledObject
        template: scaledobject-seeder.yaml
      - equal:
          path: spec.minReplicaCount
          value: 0
        template: scaledobject-seeder.yaml
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:prepare
        template: scaledobject-seeder.yaml

  - it: publisher Deployment uses the correct image and command
    asserts:
      - isKind:
          of: Deployment
        template: deployment-publisher.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [python, -m, dp.sync.publisher]
        template: deployment-publisher.yaml
      - equal:
          path: spec.replicas
          value: 0
        template: deployment-publisher.yaml

  - it: publisher ScaledObject targets the Deployment and scales from zero
    asserts:
      - isKind:
          of: ScaledObject
        template: scaledobject-publisher.yaml
      - equal:
          path: spec.minReplicaCount
          value: 0
        template: scaledobject-publisher.yaml
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:publish
        template: scaledobject-publisher.yaml

  - it: dumper triggers on the tasks stream with configured lagCount
    set:
      dumper.keda.lagCount: "2"
    asserts:
      - equal:
          path: spec.triggers[0].metadata.lagCount
          value: "2"
        template: scaledobject-dumper.yaml

  - it: dumper Deployment has topology spread constraints
    asserts:
      - exists:
          path: spec.template.spec.topologySpreadConstraints
        template: deployment-dumper.yaml

  - it: cleanup CronJob runs the Nushell script and mounts sync config
    set:
      cleanup.enabled: true
      syncConfig.schemas.app_example: {}
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: ghcr.io/prefeitura-rio/data-proxy-nushell:.*
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[2].name
          value: cleanup-script
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup

  - it: cleanup does not render when disabled
    asserts:
      - hasDocuments:
          count: 0
        template: cronjob-cleanup.yaml
