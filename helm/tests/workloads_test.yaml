suite: Workloads
templates:
  - deployment-sync.yaml
  - deployment-recovery.yaml
  - scaledobjects.yaml
  - job-init-db.yaml
  - cronjobs.yaml
tests:
  - it: creates init-db as a revision-specific Job
    asserts:
      - isKind:
          of: Job
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-0
        template: job-init-db.yaml

  - it: sync Deployment uses the correct image and command
    asserts:
      - isKind:
          of: Deployment
        template: deployment-sync.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [python, -m, data_proxy.dbos.main]
        template: deployment-sync.yaml

  - it: sync carries the DBOS and DuckLake environment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DBOS_APPLICATION_NAME
            value: "data-proxy-sync"
        template: deployment-sync.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMP_QUEUE_WORKER_CONCURRENCY
            value: "4"
        template: deployment-sync.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUCKLAKE_CATALOG_PATH
            value: "ducklake"
        template: deployment-sync.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DBOS__VMID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        template: deployment-sync.yaml

  - it: renders the workflow recovery Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: deployment-recovery.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [nu, /scripts/recover-workflows.nu]
        template: deployment-recovery.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DBOS_RECOVERY_GRACE_SECONDS
            value: "120"
        template: deployment-recovery.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SQL_TEMPLATE_DIR
            value: /scripts
        template: deployment-recovery.yaml


  - it: sync mounts the writer catalog PVC
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: catalogs
            persistentVolumeClaim:
              claimName: data-proxy-catalog-writer
        template: deployment-sync.yaml

  - it: renders a KEDA ScaledObject targeting the sync Deployment
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: data-proxy-sync
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml
      - equal:
          path: spec.minReplicaCount
          value: 3
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml

  - it: scales the sync Deployment from sync.autoscaling
    set:
      sync.autoscaling.pollingInterval: 11
      sync.autoscaling.cooldownPeriod: 22
      sync.autoscaling.idleReplicaCount: 0
      sync.autoscaling.minReplicaCount: 2
      sync.autoscaling.maxReplicaCount: 9
      sync.autoscaling.query: SELECT 1
      sync.autoscaling.targetQueryValue: "2"
      sync.autoscaling.activationTargetQueryValue: "4"
    asserts:
      - equal:
          path: spec
          value:
            scaleTargetRef:
              name: data-proxy-sync
              kind: Deployment
              apiVersion: apps/v1
            pollingInterval: 11
            cooldownPeriod: 22
            idleReplicaCount: 0
            minReplicaCount: 2
            maxReplicaCount: 9
            triggers:
              - type: postgresql
                metadata:
                  connectionFromEnv: DBOS_SYSTEM_DATABASE_URL
                  query: SELECT 1
                  targetQueryValue: "2"
                  activationTargetQueryValue: "4"
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml

  - it: scales the PostgREST Deployment from postgrest.autoscaling
    set:
      postgrest.autoscaling.minReplicaCount: 2
      postgrest.autoscaling.maxReplicaCount: 7
      postgrest.autoscaling.pollingInterval: 11
      postgrest.autoscaling.cooldownPeriod: 22
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: data-proxy-postgrest
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: scaledobjects.yaml
      - equal:
          path: spec
          value:
            scaleTargetRef:
              name: data-proxy-postgrest
              kind: Deployment
              apiVersion: apps/v1
            minReplicaCount: 2
            maxReplicaCount: 7
            pollingInterval: 11
            cooldownPeriod: 22
            triggers:
              - type: cpu
                metricType: Utilization
                metadata:
                  value: "90"
              - type: memory
                metricType: Utilization
                metadata:
                  value: "90"
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: scaledobjects.yaml

  - it: replaces the PostgREST default triggers with postgrest.autoscaling.triggers
    set:
      postgrest.autoscaling.triggers:
        - type: cron
          metadata:
            timezone: UTC
            start: 0 8 * * *
            end: 0 20 * * *
            desiredReplicas: "3"
    asserts:
      - equal:
          path: spec.triggers
          value:
            - type: cron
              metadata:
                timezone: UTC
                start: 0 8 * * *
                end: 0 20 * * *
                desiredReplicas: "3"
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: scaledobjects.yaml

  - it: renders maintenance CronJob when enabled
    set:
      jobs.maintenance.enabled: true
    asserts:
      - isKind:
          of: CronJob
        documentSelector:
          path: metadata.name
          value: data-proxy-maintenance
        template: cronjobs.yaml

  - it: does not render maintenance CronJob when disabled
    set:
      jobs.maintenance.enabled: false
      jobs.backup.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: cronjobs.yaml
