suite: Workloads
templates:
  - deployment-sync.yaml
  - deployment-recovery.yaml
  - scaledobjects.yaml
  - jobs.yaml
tests:
  - it: renders the mandatory S3 bootstrap Job
    set:
      s3.bootstrap.createIfMissing: true
    asserts:
      - isKind:
          of: Job
        documentSelector:
          path: metadata.name
          value: data-proxy-s3-bootstrap-0
        template: jobs.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [nu, /s3-bootstrap/ensure-s3-bucket.nu, --create]
        documentSelector:
          path: metadata.name
          value: data-proxy-s3-bootstrap-0
        template: jobs.yaml

  - it: creates configure-db as a revision-specific Job
    asserts:
      - isKind:
          of: Job
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-0
        template: jobs.yaml

  - it: keeps the Jobs that Helm waits for until the next upgrade removes them
    asserts:
      - notExists:
          path: spec.ttlSecondsAfterFinished
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db-0
        template: jobs.yaml
      - notExists:
          path: spec.ttlSecondsAfterFinished
        documentSelector:
          path: metadata.name
          value: data-proxy-s3-bootstrap-0
        template: jobs.yaml
  - it: sync Deployment waits for the object store and for PostgreSQL before it starts
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-s3
        template: deployment-sync.yaml
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-postgres
        template: deployment-sync.yaml
      - equal:
          path: spec.template.spec.initContainers[1].command
          value: [sh, -c, "until pg_isready --quiet; do sleep 2; done"]
        template: deployment-sync.yaml
      - equal:
          path: spec.template.spec.initContainers[1].env[0]
          value:
            name: PGHOST
            value: data-proxy-rw
        template: deployment-sync.yaml

  - it: sync Deployment uses the correct image and command
    asserts:
      - isKind:
          of: Deployment
        template: deployment-sync.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [python, -m, data_proxy.dbos.main]
        template: deployment-sync.yaml

  - it: sync carries the DBOS and DuckLake environment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DBOS_APPLICATION_NAME
            value: "data-proxy-sync"
        template: deployment-sync.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMP_QUEUE_WORKER_CONCURRENCY
            value: "4"
        template: deployment-sync.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUCKLAKE_CATALOG_PATH
            value: "ducklake"
        template: deployment-sync.yaml
      - matchRegex:
          path: spec.template.spec.containers[0].env[25].value
          pattern: data-proxy-rw\.NAMESPACE\.svc\.cluster\.local:5432/data-proxy
        template: deployment-sync.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DBOS__VMID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
        template: deployment-sync.yaml

  - it: renders the workflow recovery Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: deployment-recovery.yaml
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [nu, /scripts/wait-for-postgres.nu]
        template: deployment-recovery.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [nu, /scripts/recover-workflows.nu]
        template: deployment-recovery.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DBOS_RECOVERY_GRACE_SECONDS
            value: "120"
        template: deployment-recovery.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SQL_TEMPLATE_DIR
            value: /scripts
        template: deployment-recovery.yaml
      - contains:
          path: spec.template.spec.volumes[0].configMap.items
          content:
            key: wait-for-postgres.nu
            path: wait-for-postgres.nu
        template: deployment-recovery.yaml


  - it: sync mounts the ducklake folder of the shared PVC
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: duckdb
            persistentVolumeClaim:
              claimName: data-proxy-duckdb
        template: deployment-sync.yaml

  - it: renders a KEDA ScaledObject targeting the sync Deployment
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: data-proxy-sync
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml
      - equal:
          path: spec.minReplicaCount
          value: 3
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml
      - equal:
          path: spec.triggers[0].metadata.query
          value: "SELECT ceil(COUNT(*)::decimal / 16) FROM dbos.workflow_status WHERE application_name = 'data-proxy-sync' AND status IN ('PENDING', 'ENQUEUED', 'DELAYED', 'RUNNING');"
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml

  - it: scales the sync Deployment from sync.autoscaling
    set:
      sync.autoscaling.pollingInterval: 11
      sync.autoscaling.cooldownPeriod: 22
      sync.autoscaling.minReplicaCount: 2
      sync.autoscaling.maxReplicaCount: 9
      sync.autoscaling.query: SELECT 1
      sync.autoscaling.targetQueryValue: "2"
      sync.autoscaling.activationTargetQueryValue: "4"
    asserts:
      - equal:
          path: spec
          value:
            scaleTargetRef:
              name: data-proxy-sync
              kind: Deployment
              apiVersion: apps/v1
            pollingInterval: 11
            cooldownPeriod: 22
            minReplicaCount: 2
            maxReplicaCount: 9
            triggers:
              - type: postgresql
                metadata:
                  connectionFromEnv: DBOS_SYSTEM_DATABASE_URL
                  query: SELECT 1
                  targetQueryValue: "2"
                  activationTargetQueryValue: "4"
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml

  - it: never sets idleReplicaCount on the sync ScaledObject
    asserts:
      - notExists:
          path: spec.idleReplicaCount
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml

  - it: scales the PostgREST Deployment from postgrest.autoscaling
    set:
      postgrest.autoscaling.minReplicaCount: 2
      postgrest.autoscaling.maxReplicaCount: 7
      postgrest.autoscaling.pollingInterval: 11
      postgrest.autoscaling.cooldownPeriod: 22
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: data-proxy-postgrest
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: scaledobjects.yaml
      - equal:
          path: spec
          value:
            scaleTargetRef:
              name: data-proxy-postgrest
              kind: Deployment
              apiVersion: apps/v1
            minReplicaCount: 2
            maxReplicaCount: 7
            pollingInterval: 11
            cooldownPeriod: 22
            triggers:
              - type: cpu
                metricType: Utilization
                metadata:
                  value: "90"
              - type: memory
                metricType: Utilization
                metadata:
                  value: "90"
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: scaledobjects.yaml

  - it: replaces the PostgREST default triggers with postgrest.autoscaling.triggers
    set:
      postgrest.autoscaling.triggers:
        - type: cron
          metadata:
            timezone: UTC
            start: 0 8 * * *
            end: 0 20 * * *
            desiredReplicas: "3"
    asserts:
      - equal:
          path: spec.triggers
          value:
            - type: cron
              metadata:
                timezone: UTC
                start: 0 8 * * *
                end: 0 20 * * *
                desiredReplicas: "3"
        documentSelector:
          path: metadata.name
          value: data-proxy-postgrest
        template: scaledobjects.yaml

  - it: mounts the manifests trigger ConfigMap when enabled
    set:
      sync.trigger.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sync-trigger
            configMap:
              name: manifests-sync-trigger-script
              defaultMode: 0555
        template: deployment-sync.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sync-trigger
            mountPath: /scripts
            readOnly: true
        template: deployment-sync.yaml

  - it: renders maintenance CronJob when enabled
    set:
      jobs.maintenance.enabled: true
    asserts:
      - isKind:
          of: CronJob
        documentSelector:
          path: metadata.name
          value: data-proxy-maintenance
        template: jobs.yaml

  - it: renders one refresh Job template per schema, named with a spec hash
    set:
      sync.config:
        schemas:
          app:
            tables: []
          other_schema:
            tables: []
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^data-proxy-refresh-catalog-app-[0-9a-f]{8}$'
        documentSelector:
          path: metadata.labels["data-proxy.io/schema"]
          value: app
        template: jobs.yaml
      - matchRegex:
          path: metadata.name
          pattern: '^data-proxy-refresh-catalog-other-schema-[0-9a-f]{8}$'
        documentSelector:
          path: metadata.labels["data-proxy.io/schema"]
          value: other_schema
        template: jobs.yaml
      - equal:
          path: metadata.labels["data-proxy.io/template"]
          value: "true"
        documentSelector:
          path: metadata.labels["data-proxy.io/schema"]
          value: app
        template: jobs.yaml

  - it: keeps the refresh Job template finished at once and never expiring
    set:
      sync.config:
        schemas:
          app:
            tables: []
    documentSelector:
      path: metadata.labels["data-proxy.io/schema"]
      value: app
    asserts:
      - equal:
          path: spec.completions
          value: 0
        template: jobs.yaml
      - equal:
          path: spec.backoffLimit
          value: 0
        template: jobs.yaml
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
        template: jobs.yaml
      - notExists:
          path: spec.ttlSecondsAfterFinished
        template: jobs.yaml
      - notExists:
          path: spec.suspend
        template: jobs.yaml

  - it: restores one schema catalog as the PostgreSQL user with a single command
    set:
      sync.config:
        schemas:
          app:
            tables: []
    documentSelector:
      path: metadata.labels["data-proxy.io/schema"]
      value: app
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/litestream/litestream:0.5.12
        template: jobs.yaml
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - restore
            - -force
            - -config
            - /config/litestream.yaml
            - /var/lib/ducklake/catalogs/app/catalog.sqlite
        template: jobs.yaml
      - notExists:
          path: spec.template.spec.containers[0].command
        template: jobs.yaml
      - notExists:
          path: spec.template.metadata
        template: jobs.yaml
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
        template: jobs.yaml
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: ducklake-catalogs
            emptyDir: {}
        template: jobs.yaml
