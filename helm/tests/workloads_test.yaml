suite: Workloads
templates:
  - deployment-sync-worker.yaml
  - scaledobject-sync-worker.yaml
  - job-init-db.yaml
  - cronjob-backup.yaml
  - cronjob-cleanup.yaml
  - cronjob-retention.yaml
tests:
  - it: creates init-db as a revision-specific normal Job
    asserts:
      - isKind:
          of: Job
        documentSelector:
          path: kind
          value: Job
        template: job-init-db.yaml
      - equal:
          path: metadata.name
          value: data-proxy-init-db-0
        documentSelector:
          path: kind
          value: Job
        template: job-init-db.yaml
      - notExists:
          path: metadata.annotations["helm.sh/hook"]
        documentSelector:
          path: kind
          value: Job
        template: job-init-db.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SQL_TEMPLATE_DIR
            value: /sql/helm
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-0
        template: job-init-db.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POOLER_PASSWORD
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-0
        template: job-init-db.yaml

  - it: backup runs the Nushell script and mounts required files
    set:
      backup.enabled: true
      backup.s3.bucket: backup-bucket
      backup.s3.endpointURL: https://storage.googleapis.com
      backup.s3.existingSecret: backup-creds
      syncConfig.schemas.app_example: {}
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [nu, /scripts/backup.nu]
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: scripts
            mountPath: /scripts
            readOnly: true
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].name
          value: scripts
        documentSelector:
          path: metadata.name
          value: data-proxy-app-example-backup

  - it: sync worker Deployment uses the correct image and command
    asserts:
      - isKind:
          of: Deployment
        template: deployment-sync-worker.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [python, -m, dp.main]
        template: deployment-sync-worker.yaml
      - equal:
          path: spec.replicas
          value: 0
        template: deployment-sync-worker.yaml

  - it: sync worker carries the batch settings and a scratch volume
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_BATCH_BYTES
            value: "629145600"
        template: deployment-sync-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_BATCH_MAX_PARTITIONS
            value: "256"
        template: deployment-sync-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_SCRATCH_DIR
            value: "/scratch"
        template: deployment-sync-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DBOS_APPLICATION_NAME
            value: "data-proxy-sync"
        template: deployment-sync-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SYNC_SCHEDULE
            value: "0 2 * * *"
        template: deployment-sync-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMP_QUEUE_WORKER_CONCURRENCY
            value: "4"
        template: deployment-sync-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: scratch
            mountPath: /scratch
        template: deployment-sync-worker.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scratch
            emptyDir:
              sizeLimit: 4Gi
        template: deployment-sync-worker.yaml

  - it: large numeric batch settings render as plain integers
    set:
      sync.dumper.batchMegaBytes: 1024
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_BATCH_BYTES
            value: "1073741824"
        template: deployment-sync-worker.yaml

  - it: sync worker uses the configured scratch size limit and batch size
    set:
      sync.dumper.batchMegaBytes: 100
      sync.dumper.scratch.sizeLimit: 1Gi
      sync.dumper.scratch.mountPath: /work
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_BATCH_BYTES
            value: "104857600"
        template: deployment-sync-worker.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMPER_SCRATCH_DIR
            value: "/work"
        template: deployment-sync-worker.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scratch
            emptyDir:
              sizeLimit: 1Gi
        template: deployment-sync-worker.yaml

  - it: sync worker ScaledObject keeps one warm replica and scales to at least three on the DBOS queue
    asserts:
      - isKind:
          of: ScaledObject
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.idleReplicaCount
          value: 1
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.minReplicaCount
          value: 3
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.maxReplicaCount
          value: 15
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.triggers[0].type
          value: postgresql
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.triggers[0].metadata.connectionFromEnv
          value: AIRFLOW_CONN_AIRFLOW_DB
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.triggers[0].metadata.targetQueryValue
          value: "1.1"
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.triggers[0].metadata.activationTargetQueryValue
          value: "5"
        template: scaledobject-sync-worker.yaml

  - it: sync worker ScaledObject honors overrides
    set:
      sync.worker.keda.maxReplicaCount: 9
      sync.worker.keda.minReplicaCount: 4
      sync.worker.keda.pollingInterval: 15
    asserts:
      - equal:
          path: spec.maxReplicaCount
          value: 9
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.minReplicaCount
          value: 4
        template: scaledobject-sync-worker.yaml
      - equal:
          path: spec.pollingInterval
          value: 15
        template: scaledobject-sync-worker.yaml

  - it: sync worker Deployment has topology spread constraints
    asserts:
      - exists:
          path: spec.template.spec.topologySpreadConstraints
        template: deployment-sync-worker.yaml

  - it: cleanup CronJob runs the Nushell script and mounts sync config
    set:
      cleanup.enabled: true
      syncConfig.schemas.app_example: {}
    asserts:
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: ghcr.io/prefeitura-rio/data-proxy-nushell:.*
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[2].name
          value: scripts
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup

  - it: cleanup CronJob runs as the shared jobs role
    set:
      cleanup.enabled: true
      syncConfig.schemas.app_example: {}
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGUSER
            value: jobs
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: data-proxy-jobs
                key: JOBS_PASSWORD
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PG_DSN
          documentSelector:
            path: metadata.name
            value: data-proxy-cleanup

  - it: init-db receives the jobs flag for the shared maintenance role
    set:
      backup.enabled: false
      cleanup.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JOBS_ENABLED
            value: "true"
        documentSelector:
          path: kind
          value: Job
        template: job-init-db.yaml

  - it: cleanup does not render when disabled
    set:
      cleanup.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: cronjob-cleanup.yaml

  - it: renders the retention CronJob when enabled
    set:
      retention.enabled: true
      syncConfig.schemas.app: {}
    asserts:
      - isKind:
          of: CronJob
        documentSelector:
          path: kind
          value: CronJob
        template: cronjob-retention.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [nu, /scripts/retention.nu]
        documentSelector:
          path: kind
          value: CronJob
        template: cronjob-retention.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: retention-script
            mountPath: /scripts
            readOnly: true
        documentSelector:
          path: kind
          value: CronJob
        template: cronjob-retention.yaml

  - it: does not render the retention CronJob when disabled
    asserts:
      - hasDocuments:
          count: 0
        template: cronjob-retention.yaml
