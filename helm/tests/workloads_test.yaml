suite: Workloads
templates:
  - cronjob-producer.yaml
  - scaledjob-publisher.yaml
  - scaledjob-dumper.yaml
  - scaledjob-seeder.yaml
tests:
  - it: producer CronJob uses configured schedule
    set:
      producer.schedule: "0 3 * * *"
      image.repository: gcr.io/proj/data-proxy
      image.tag: abc123
    asserts:
      - equal:
          path: spec.schedule
          value: "0 3 * * *"
        template: cronjob-producer.yaml
      - equal:
          path: spec.startingDeadlineSeconds
          value: 600
        template: cronjob-producer.yaml
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 0
        template: cronjob-producer.yaml

  - it: producer uses the app image and correct command
    set:
      image.repository: gcr.io/proj/data-proxy
      image.tag: abc123
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: gcr.io/proj/data-proxy:abc123
        template: cronjob-producer.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [python, -m, dp.sync.producer]
        template: cronjob-producer.yaml

  - it: publisher is capped at maxReplicaCount 1 without Job retries
    asserts:
      - equal:
          path: spec.maxReplicaCount
          value: 1
        template: scaledjob-publisher.yaml
      - equal:
          path: spec.jobTargetRef.backoffLimit
          value: 0
        template: scaledjob-publisher.yaml

  - it: publisher triggers on the finalize stream
    asserts:
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:publish
        template: scaledjob-publisher.yaml

  - it: publisher passes its configured visibility timeout
    set:
      publisher.visibilityTimeoutMs: "1200000"
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: PUBLISHER_VISIBILITY_TIMEOUT_MS
            value: "1200000"
        template: scaledjob-publisher.yaml

  - it: publisher mounts the schema writer configuration
    set:
      ha.enabled: true
      ha.schemas.app:
        members: 1
      syncConfig.schemas.app.tables: []
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: SCHEMA_WRITERS_FILE
            value: /config/schema-writers/writers.json
        template: scaledjob-publisher.yaml
      - equal:
          path: spec.jobTargetRef.template.spec.volumes[1].secret.secretName
          value: data-proxy-schema-writers
        template: scaledjob-publisher.yaml

  - it: dumper uses configured maxReplicaCount without Job retries
    set:
      dumper.keda.maxReplicaCount: 8
    asserts:
      - equal:
          path: spec.maxReplicaCount
          value: 8
        template: scaledjob-dumper.yaml
      - equal:
          path: spec.jobTargetRef.backoffLimit
          value: 0
        template: scaledjob-dumper.yaml

  - it: dumper passes its configured visibility timeout
    set:
      dumper.visibilityTimeoutMs: "1200000"
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: DUMPER_VISIBILITY_TIMEOUT_MS
            value: "1200000"
        template: scaledjob-dumper.yaml

  - it: dumper triggers on the tasks stream with configured lagCount
    set:
      dumper.keda.lagCount: "2"
    asserts:
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:extract
        template: scaledjob-dumper.yaml
      - equal:
          path: spec.triggers[0].metadata.lagCount
          value: "2"
        template: scaledjob-dumper.yaml

  - it: seeder uses the preparation stream and command
    asserts:
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:prepare
        template: scaledjob-seeder.yaml
      - equal:
          path: spec.jobTargetRef.template.spec.containers[0].command
          value: [python, -m, dp.sync.seeder]
        template: scaledjob-seeder.yaml
