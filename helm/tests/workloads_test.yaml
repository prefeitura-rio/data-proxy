suite: Workloads
templates:
  - cronjob-producer.yaml
  - scaledjob-finalizer.yaml
  - scaledjob-worker.yaml
tests:
  - it: producer CronJob uses configured schedule
    set:
      producer.schedule: "0 3 * * *"
      image.repository: gcr.io/proj/data-proxy
      image.tag: abc123
    asserts:
      - equal:
          path: spec.schedule
          value: "0 3 * * *"
        template: cronjob-producer.yaml
      - equal:
          path: spec.startingDeadlineSeconds
          value: 600
        template: cronjob-producer.yaml
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 0
        template: cronjob-producer.yaml

  - it: producer uses the app image and correct command
    set:
      image.repository: gcr.io/proj/data-proxy
      image.tag: abc123
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: gcr.io/proj/data-proxy:abc123
        template: cronjob-producer.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [python, -m, dp.sync.producer]
        template: cronjob-producer.yaml

  - it: finalizer is capped at maxReplicaCount 1 without Job retries
    asserts:
      - equal:
          path: spec.maxReplicaCount
          value: 1
        template: scaledjob-finalizer.yaml
      - equal:
          path: spec.jobTargetRef.backoffLimit
          value: 0
        template: scaledjob-finalizer.yaml

  - it: finalizer triggers on the finalize stream
    asserts:
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:sync:finalize
        template: scaledjob-finalizer.yaml

  - it: finalizer passes its configured visibility timeout
    set:
      finalizer.visibilityTimeoutMs: "1200000"
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: FINALIZER_VISIBILITY_TIMEOUT_MS
            value: "1200000"
        template: scaledjob-finalizer.yaml

  - it: finalizer mounts the schema writer configuration
    set:
      ha.enabled: true
      ha.schemas.app:
        members: 1
      syncConfig.schemas.app.tables: []
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: SCHEMA_WRITERS_FILE
            value: /config/schema-writers/writers.json
        template: scaledjob-finalizer.yaml
      - equal:
          path: spec.jobTargetRef.template.spec.volumes[1].configMap.name
          value: data-proxy-schema-writers
        template: scaledjob-finalizer.yaml

  - it: worker uses configured maxReplicaCount without Job retries
    set:
      worker.keda.maxReplicaCount: 8
    asserts:
      - equal:
          path: spec.maxReplicaCount
          value: 8
        template: scaledjob-worker.yaml
      - equal:
          path: spec.jobTargetRef.backoffLimit
          value: 0
        template: scaledjob-worker.yaml

  - it: worker passes its configured visibility timeout
    set:
      worker.visibilityTimeoutMs: "1200000"
    asserts:
      - contains:
          path: spec.jobTargetRef.template.spec.containers[0].env
          content:
            name: WORKER_VISIBILITY_TIMEOUT_MS
            value: "1200000"
        template: scaledjob-worker.yaml

  - it: worker triggers on the tasks stream with configured lagCount
    set:
      worker.keda.lagCount: "2"
    asserts:
      - equal:
          path: spec.triggers[0].metadata.stream
          value: dp:sync:tasks
        template: scaledjob-worker.yaml
      - equal:
          path: spec.triggers[0].metadata.lagCount
          value: "2"
        template: scaledjob-worker.yaml
