suite: Workloads
templates:
  - deployment-sync.yaml
  - scaledobjects.yaml
  - job-init-db.yaml
  - cronjobs.yaml
tests:
  - it: creates init-db as a revision-specific Job
    asserts:
      - isKind:
          of: Job
        documentSelector:
          path: metadata.name
          value: data-proxy-init-db-0
        template: job-init-db.yaml

  - it: sync Deployment uses the correct image and command
    asserts:
      - isKind:
          of: Deployment
        template: deployment-sync.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [python, -m, data_proxy.dbos.main]
        template: deployment-sync.yaml

  - it: sync carries the DBOS and DuckLake environment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DBOS_APPLICATION_NAME
            value: "data-proxy-sync"
        template: deployment-sync.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUMP_QUEUE_WORKER_CONCURRENCY
            value: "4"
        template: deployment-sync.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DUCKLAKE_CATALOG_PATH
            value: "ducklake"
        template: deployment-sync.yaml

  - it: sync mounts the writer catalog PVC
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: catalogs
            persistentVolumeClaim:
              claimName: data-proxy-catalog-writer
        template: deployment-sync.yaml

  - it: renders a KEDA ScaledObject targeting the sync Deployment
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: data-proxy-sync
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml
      - equal:
          path: spec.minReplicaCount
          value: 3
        documentSelector:
          path: metadata.name
          value: data-proxy-sync
        template: scaledobjects.yaml

  - it: renders cleanup CronJob when enabled
    set:
      jobs.cleanup.enabled: true
    asserts:
      - isKind:
          of: CronJob
        documentSelector:
          path: metadata.name
          value: data-proxy-cleanup
        template: cronjobs.yaml

  - it: does not render cleanup CronJob when disabled
    set:
      jobs.cleanup.enabled: false
      jobs.backup.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: cronjobs.yaml
