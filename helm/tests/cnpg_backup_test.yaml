suite: CNPG backup and WAL
release:
  name: data-proxy
  namespace: default
templates:
  - cluster-cnpg.yaml
  - backup-cnpg.yaml
set:
  redis.host: redis-writer
tests:
  - it: makes no backup, no object store and no plugin by default
    asserts:
      - notExists:
          path: spec.plugins
        template: cluster-cnpg.yaml
      - hasDocuments:
          count: 0
        template: backup-cnpg.yaml

  - it: archives the WAL and backs up through the Barman Cloud plugin when the backup is on
    set:
      cnpg.backup.enabled: true
      cnpg.backup.bucket: backups
      cnpg.backup.endpointURL: https://storage.example.test
      cnpg.backup.destinationPath: cnpg/preview
      cnpg.backup.existingSecret: backup-keys
    asserts:
      - equal:
          path: spec.plugins
          value:
            - name: barman-cloud.cloudnative-pg.io
              isWALArchiver: true
              parameters:
                barmanObjectName: data-proxy-backup
        template: cluster-cnpg.yaml

  - it: points the object store at the bucket, the prefix and the credentials of the Secret
    set:
      cnpg.backup.enabled: true
      cnpg.backup.bucket: backups
      cnpg.backup.endpointURL: https://storage.example.test
      cnpg.backup.destinationPath: cnpg/preview
      cnpg.backup.existingSecret: backup-keys
      cnpg.backup.retention: 14d
    template: backup-cnpg.yaml
    documentSelector:
      path: kind
      value: ObjectStore
    asserts:
      - equal:
          path: metadata.name
          value: data-proxy-backup
      - equal:
          path: spec.retentionPolicy
          value: 14d
      - equal:
          path: spec.configuration.destinationPath
          value: s3://backups/cnpg/preview
      - equal:
          path: spec.configuration.endpointURL
          value: https://storage.example.test
      - equal:
          path: spec.configuration.s3Credentials.accessKeyId
          value:
            name: backup-keys
            key: S3_ACCESS_KEY
      - equal:
          path: spec.configuration.s3Credentials.secretAccessKey
          value:
            name: backup-keys
            key: S3_SECRET_KEY

  - it: stops the client from adding checksum trailers that GCS and other S3-compatible storage refuse
    set:
      cnpg.backup.enabled: true
      cnpg.backup.bucket: backups
      cnpg.backup.endpointURL: https://storage.example.test
      cnpg.backup.existingSecret: backup-keys
    template: backup-cnpg.yaml
    documentSelector:
      path: kind
      value: ObjectStore
    asserts:
      - equal:
          path: spec.instanceSidecarConfiguration.env
          value:
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required

  - it: leaves the client of AWS S3 as it is when no endpoint is set
    set:
      cnpg.backup.enabled: true
      cnpg.backup.bucket: backups
      cnpg.backup.existingSecret: backup-keys
    template: backup-cnpg.yaml
    documentSelector:
      path: kind
      value: ObjectStore
    asserts:
      - notExists:
          path: spec.instanceSidecarConfiguration

  - it: schedules a backup of the cluster by the plugin, and takes the first one at once
    set:
      cnpg.backup.enabled: true
      cnpg.backup.bucket: backups
      cnpg.backup.existingSecret: backup-keys
      cnpg.backup.schedule: "0 30 4 * * *"
    template: backup-cnpg.yaml
    documentSelector:
      path: kind
      value: ScheduledBackup
    asserts:
      - equal:
          path: spec.schedule
          value: "0 30 4 * * *"
      - equal:
          path: spec.method
          value: plugin
      - equal:
          path: spec.pluginConfiguration.name
          value: barman-cloud.cloudnative-pg.io
      - equal:
          path: spec.cluster.name
          value: data-proxy
      - equal:
          path: spec.immediate
          value: true

  - it: needs the bucket and the Secret when the backup is on
    set:
      cnpg.backup.enabled: true
    template: backup-cnpg.yaml
    asserts:
      - failedTemplate:
          errorMessage: cnpg.backup.bucket is required when cnpg.backup.enabled is true

  - it: keeps a replication slot from filling the disk of the primary
    template: cluster-cnpg.yaml
    asserts:
      - equal:
          path: spec.postgresql.parameters.max_slot_wal_keep_size
          value: 8GB

  - it: takes the WAL limit from the parameters
    set:
      cnpg.postgresql.parameters.max_slot_wal_keep_size: 30GB
    template: cluster-cnpg.yaml
    asserts:
      - equal:
          path: spec.postgresql.parameters.max_slot_wal_keep_size
          value: 30GB
