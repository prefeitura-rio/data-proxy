suite: PostgREST
templates:
  - deployment-postgrest.yaml
tests:
  - it: fetches and validates JWKS before PostgREST starts
    set:
      postgrest.jwksUri: https://auth.example.com/certs
      postgrest.jwksFetch.image: ghcr.io/prefeitura-rio/data-proxy-nushell:latest
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/prefeitura-rio/data-proxy-nushell:latest
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [/usr/bin/nu, -c]
      - equal:
          path: spec.template.spec.initContainers[0].env[0]
          value:
            name: JWKS_URI
            value: https://auth.example.com/certs
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'http get'
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'to json'
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'save --force'
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: /etc/postgrest
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/postgrest

  - it: renders one replica by default
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: honors a custom postgrest replica count
    set:
      postgrest.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: rolls PostgREST when syncConfig changes
    set:
      syncConfig.schemas.bcadastro.tables:
        - name: proj.dataset.cpf
          strategy: full
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/sync-config"]
          pattern: "^[0-9a-f]{64}$"

  - it: derives PGRST_DB_SCHEMAS from syncConfig.schemas
    set:
      syncConfig.schemas:
        zeta_schema:
          tables:
            - name: proj.dataset.z
              strategy: full
        alpha_schema:
          tables:
            - name: proj.dataset.a
              strategy: full
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: PGRST_DB_SCHEMAS
            value: "alpha_schema,zeta_schema,rls"

  - it: PGRST_DB_SCHEMAS always includes auth.rlsSchema even with no configured schemas
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: PGRST_DB_SCHEMAS
            value: "rls"

  - it: enables PostgREST aggregate functions by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_AGGREGATES_ENABLED
            value: "true"

  - it: enables the OpenAPI security definitions
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_OPENAPI_SECURITY_ACTIVE
            value: "true"

  - it: does not ignore privileges in the OpenAPI output by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_OPENAPI_MODE
            value: ignore-privileges

  - it: ignores privileges in the OpenAPI output when swagger-ui is enabled
    set:
      swaggerUi.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_OPENAPI_MODE
            value: ignore-privileges

  - it: drops the sidecar when the fallback proxy fronts PostgREST
    set:
      fallback.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.labels["sidecar.istio.io/inject"]
          value: "false"

  - it: keeps the sidecar when the gateway reaches PostgREST directly
    set:
      fallback.enabled: false
    asserts:
      - equal:
          path: spec.template.metadata.labels["sidecar.istio.io/inject"]
          value: "true"

  - it: does not inject the sidecar when sidecarInject is disabled
    set:
      fallback.enabled: false
      ingress.sidecarInject: false
    asserts:
      - equal:
          path: spec.template.metadata.labels["sidecar.istio.io/inject"]
          value: "false"
