suite: PostgREST
templates:
  - deployment-postgrest.yaml
tests:
  - it: runs database reconciliation before PostgREST starts
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: db-migrate
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: postgres:17-alpine
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: ON_ERROR_STOP=1
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: db-init
            mountPath: /scripts
            readOnly: true

  - it: fetches and validates JWKS before PostgREST starts
    set:
      postgrest.jwksUri: https://auth.example.com/certs
      postgrest.jwksFetch.image: alpine:3.24.1
      postgrest.jwksFetch.curlVersion: 8.21.0-r0
      postgrest.jwksFetch.jqVersion: 1.8.1-r0
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: alpine:3.24.1
      - equal:
          path: spec.template.spec.initContainers[1].command
          value: [/bin/sh, -c]
      - equal:
          path: spec.template.spec.initContainers[1].env[0]
          value:
            name: JWKS_URI
            value: https://auth.example.com/certs
      - equal:
          path: spec.template.spec.initContainers[1].env[1]
          value:
            name: CURL_VERSION
            value: 8.21.0-r0
      - equal:
          path: spec.template.spec.initContainers[1].env[2]
          value:
            name: JQ_VERSION
            value: 1.8.1-r0
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: 'apk add --no-cache'
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: '--retry 5'
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: '--connect-timeout 5'
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: 'jq -e'
      - matchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: 'mv "\$temporary_file" "\$jwks_file"'
      - equal:
          path: spec.template.spec.initContainers[1].volumeMounts[0].mountPath
          value: /etc/postgrest
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/postgrest

  - it: renders one replica by default
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: honors a custom postgrest replica count
    set:
      postgrest.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: rolls PostgREST when syncConfig changes
    set:
      syncConfig.schemas.bcadastro.tables:
        - name: proj.dataset.cpf
          strategy: full
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/sync-config"]
          pattern: "^[0-9a-f]{64}$"

  - it: derives PGRST_DB_SCHEMAS from syncConfig.schemas
    set:
      syncConfig.schemas:
        zeta_schema:
          tables:
            - name: proj.dataset.z
              strategy: full
        alpha_schema:
          tables:
            - name: proj.dataset.a
              strategy: full
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: PGRST_DB_SCHEMAS
            value: "alpha_schema,zeta_schema,rls"

  - it: PGRST_DB_SCHEMAS always includes auth.rlsSchema even with no configured schemas
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: PGRST_DB_SCHEMAS
            value: "rls"

  - it: enables PostgREST aggregate functions by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_AGGREGATES_ENABLED
            value: "true"

  - it: enables the OpenAPI security definitions
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_OPENAPI_SECURITY_ACTIVE
            value: "true"

  - it: does not ignore privileges in the OpenAPI output by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_OPENAPI_MODE
            value: ignore-privileges

  - it: ignores privileges in the OpenAPI output when swagger-ui is enabled
    set:
      swaggerUi.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_OPENAPI_MODE
            value: ignore-privileges
