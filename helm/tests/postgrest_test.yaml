suite: PostgREST
templates:
  - deployment-postgrest.yaml
tests:
  - it: keeps serving while the mesh drops a stopping pod
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5
  - it: fetches and validates JWKS before PostgREST starts
    set:
      postgrest.jwksUri: https://auth.example.com/certs
      jobs.image: ghcr.io/prefeitura-rio/data-proxy-jobs:latest
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/prefeitura-rio/data-proxy-jobs:latest
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [/usr/local/bin/nu, /scripts/fetch-jwks.nu]
      - equal:
          path: spec.template.spec.initContainers[0].env[0]
          value:
            name: JWKS_URI
            value: https://auth.example.com/certs
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: /etc/postgrest
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[1].mountPath
          value: /scripts
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /etc/postgrest
      - equal:
          path: spec.template.spec.initContainers[1].command
          value: [/usr/local/bin/nu, /scripts/wait-for-postgres.nu]
      - equal:
          path: spec.template.spec.initContainers[1].volumeMounts[0].mountPath
          value: /scripts
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: data-proxy-configure-db-script

  - it: uses TCP readiness probe for authenticated PostgREST
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http
        template: deployment-postgrest.yaml
      - notExists:
          path: spec.replicas
        template: deployment-postgrest.yaml

  - it: starts PostgREST with the console schema, and the provision job adds the others
    set:
      sync.config.schemas.test.tables: []
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_SCHEMAS
            value: console

  - it: configures a bounded and persistent PostgREST database pool
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_POOL
            value: "24"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_POOL_ACQUISITION_TIMEOUT
            value: "3"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_POOL_MAX_IDLETIME
            value: "300"

  - it: enables PostgREST aggregate functions by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_AGGREGATES_ENABLED
            value: "true"

  - it: enables the OpenAPI security definitions
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_OPENAPI_SECURITY_ACTIVE
            value: "true"

  - it: does not ignore privileges in the OpenAPI output by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_OPENAPI_MODE
            value: ignore-privileges

  - it: ignores privileges in the OpenAPI output when swagger-ui is enabled
    set:
      swaggerUi.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_OPENAPI_MODE
            value: ignore-privileges

  - it: keeps the sidecar when sidecarInject is enabled
    asserts:
      - equal:
          path: spec.template.metadata.labels["sidecar.istio.io/inject"]
          value: "true"

  - it: logs PostgREST in as the serving login and waits for it
    set:
      postgrest.jwtSecret: test-secret
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PGUSER
            value: serving
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: data-proxy-cnpg-serving

  - it: labels the Deployment so the sync workflow can restart it
    asserts:
      - hasDocuments:
          count: 1
        template: deployment-postgrest.yaml
      - equal:
          path: metadata.labels["data-proxy.io/serving"]
          value: postgrest
        template: deployment-postgrest.yaml
      - notExists:
          path: spec.selector.matchLabels["data-proxy.io/serving"]
        template: deployment-postgrest.yaml
      - notExists:
          path: spec.template.metadata.labels["data-proxy.io/serving"]
        template: deployment-postgrest.yaml
  - it: serves Prometheus metrics on an admin port that the scrape annotations name
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_ADMIN_SERVER_PORT
            value: "3001"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: admin
            containerPort: 3001
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "3001"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/path"]
          value: /metrics
  - it: leaves the admin port and the scrape annotations out when metrics are off
    set:
      postgrest.metrics.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_ADMIN_SERVER_PORT
            value: "3001"
      - notExists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
