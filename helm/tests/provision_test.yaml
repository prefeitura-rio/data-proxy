suite: Provision schemas
templates:
  - jobs.yaml
  - deployment-sync.yaml
tests:
  - it: provisions the schemas of the console in a Job on every install and upgrade
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value: [nu, /scripts/provision.nu]
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml
        skipEmptyTemplate: true
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-config
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: RELATION
            value: console.schemas
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml

  - it: reloads PostgREST through the database, so it needs no access to Kubernetes
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml

  - it: loads the values file only to fill an empty configuration
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SYNC_CONFIG_PATH
            value: /config/sync.json
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_ANON_ROLE
            value: anon
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_SERVING_ROLE
            value: serving
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml

  - it: applies every schema again on an upgrade, and only the new ones when a Job comes from the template
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROVISION_ALL
            value: "true"
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PROVISION_ALL
            value: "true"
        documentSelector:
          path: metadata.name
          value: data-proxy-provision
        template: jobs.yaml

  - it: mounts the SQL templates in their directories
    asserts:
      - contains:
          path: spec.template.spec.volumes[1].configMap.items
          content:
            key: postgres_create_schema.sql
            path: postgres/create_schema.sql
        documentSelector:
          path: metadata.labels["app.kubernetes.io/component"]
          value: provision
        template: jobs.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes[1].configMap.items
          content:
            key: postgres_create_schema.sql
            path: postgres/create_schema.sql
        documentSelector:
          path: metadata.name
          value: data-proxy-provision
        template: jobs.yaml

  - it: keeps the provision CronJob suspended, so that nothing runs it on a clock
    asserts:
      - equal:
          path: spec.suspend
          value: true
        documentSelector:
          path: metadata.name
          value: data-proxy-provision
        template: jobs.yaml
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
        documentSelector:
          path: metadata.name
          value: data-proxy-provision
        template: jobs.yaml

  - it: has no schedule value to change
    asserts:
      - notExists:
          path: jobs.provision.schedule
        template: jobs.yaml

  - it: gives the provision pod the catalog and the S3 settings that the removal of a schema needs
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: DUCKLAKE_CATALOG_PATH
            value: ducklake
        documentSelector:
          path: metadata.name
          value: data-proxy-provision
        template: jobs.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: DUCKLAKE_ADMIN_URL
            value: postgresql://ops@data-proxy-rw:5432/ducklake
        documentSelector:
          path: metadata.name
          value: data-proxy-provision
        template: jobs.yaml
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name == "S3_BUCKET")]
        documentSelector:
          path: metadata.name
          value: data-proxy-provision
        template: jobs.yaml
      - exists:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[?(@.name == "AWS_ACCESS_KEY_ID")]
        documentSelector:
          path: metadata.name
          value: data-proxy-provision
        template: jobs.yaml

  - it: keeps the configure-db CronJob suspended too, with the pod of the Job of the release
    asserts:
      - equal:
          path: spec.suspend
          value: true
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db
        template: jobs.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [nu, /scripts/configure-db.nu]
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db
        template: jobs.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].name
          value: wait-for-s3
        documentSelector:
          path: metadata.name
          value: data-proxy-configure-db
        template: jobs.yaml

  - it: tells the sync workers which CronJob to call
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROVISION_CRONJOB
            value: data-proxy-provision
        template: deployment-sync.yaml

  - it: does not mount the sync configuration into the maintenance job
    set:
      jobs.maintenance.enabled: true
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: sync-config
            configMap:
              name: data-proxy-sync
        documentSelector:
          path: metadata.name
          value: data-proxy-maintenance
        template: jobs.yaml
