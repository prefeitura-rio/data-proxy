suite: Istio VirtualService
templates:
  - virtualservice.yaml
tests:
  - it: does not render when ingress is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders when ingress is enabled
    set:
      ingress.enabled: true
      ingress.host: api.example.com
      ingress.gateway: istio-system/istio-gateway
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: VirtualService
      - isAPIVersion:
          of: networking.istio.io/v1beta1

  - it: routes to the correct host and gateway
    set:
      ingress.enabled: true
      ingress.host: api.example.com
      ingress.gateway: istio-system/istio-gateway
    asserts:
      - equal:
          path: spec.hosts[0]
          value: api.example.com
      - equal:
          path: spec.gateways[0]
          value: istio-system/istio-gateway

  - it: destination points to postgrest service on port 3000
    set:
      ingress.enabled: true
      ingress.host: api.example.com
    asserts:
      - equal:
          path: spec.http[0].route[0].destination.host
          value: data-proxy-postgrest
      - equal:
          path: spec.http[0].route[0].destination.port.number
          value: 3000

  - it: renders timeout when set
    set:
      ingress.enabled: true
      ingress.host: api.example.com
      ingress.timeout: "60s"
    asserts:
      - equal:
          path: spec.http[0].timeout
          value: 60s

  - it: renders retries when attempts is greater than zero
    set:
      ingress.enabled: true
      ingress.host: api.example.com
      ingress.retries.attempts: 2
      ingress.retries.perTryTimeout: "30s"
      ingress.retries.retryOn: "503"
    asserts:
      - equal:
          path: spec.http[0].retries.attempts
          value: 2
      - equal:
          path: spec.http[0].retries.perTryTimeout
          value: 30s
      - equal:
          path: spec.http[0].retries.retryOn
          value: "503"

  - it: does not render timeout or retries by default
    set:
      ingress.enabled: true
      ingress.host: api.example.com
    asserts:
      - notExists:
          path: spec.http[0].timeout
      - notExists:
          path: spec.http[0].retries

  - it: redirects /docs to /docs/ when swagger UI is enabled
    set:
      ingress.enabled: true
      ingress.host: api.example.com
      swaggerUi.enabled: true
    asserts:
      - equal:
          path: spec.http[0].name
          value: docs-redirect
      - equal:
          path: spec.http[0].match[0].uri.exact
          value: /docs
      - equal:
          path: spec.http[0].redirect.redirectCode
          value: 302
      - equal:
          path: spec.http[0].redirect.uri
          value: /docs/

  - it: routes /docs/ prefix to swagger-ui when swagger UI is enabled
    set:
      ingress.enabled: true
      ingress.host: api.example.com
      swaggerUi.enabled: true
    asserts:
      - equal:
          path: spec.http[1].name
          value: docs
      - equal:
          path: spec.http[1].match[0].uri.prefix
          value: /docs/
      - equal:
          path: spec.http[1].rewrite.uri
          value: /
      - equal:
          path: spec.http[1].route[0].destination.host
          value: data-proxy-swagger-ui
      - equal:
          path: spec.http[1].route[0].destination.port.number
          value: 8080
