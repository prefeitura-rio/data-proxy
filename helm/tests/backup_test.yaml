suite: Backup CronJob
templates:
  - cronjobs.yaml
tests:
  - it: does not render when backup is disabled
    set:
      jobs.backup.enabled: false
      jobs.cleanup.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one schema backup with the configured schedule and image
    set:
      jobs.backup.enabled: true
      jobs.backup.schedule: "30 4 * * *"
      jobs.image: postgres:17-alpine
      jobs.backup.prefix: backups/access_policy
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      sync.config.schemas.bcadastro.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        isKind:
          of: CronJob
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        equal:
          path: metadata.name
          value: data-proxy-bcadastro-backup
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        equal:
          path: spec.schedule
          value: "30 4 * * *"
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: postgres:17-alpine
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[0]
          pattern: '^nu$'
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[1]
          value: /scripts/backup.nu
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.name
          value: data-proxy-scripts

  - it: connects as the shared jobs role
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      sync.config.schemas.bcadastro.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGUSER
            value: jobs
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: data-proxy-jobs
                key: JOBS_PASSWORD

  - it: mounts GCP credentials so rclone can reach GCS
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      gcp.existingSecret: gcp-key
      sync.config.schemas.bcadastro.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /gcp/key.json
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: gcp-key
            secret:
              secretName: gcp-key

  - it: omits GCP credentials when no GCP Secret is set
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: http://seaweedfs-s3:8333
      jobs.backup.s3.existingSecret: backup-s3-creds
      gcp.existingSecret: ""
      sync.config.schemas.bcadastro.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS

  - it: uses backup S3 credentials from jobs.backup.s3.existingSecret
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      sync.config.schemas.bcadastro.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-bcadastro-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: backup-s3-creds
                key: S3_ACCESS_KEY
