suite: Backup CronJob
templates:
  - cronjob-backup.yaml
tests:
  - it: does not render when backup is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: fails to render when enabled without an ageRecipient
    set:
      backup.enabled: true
      syncConfig.schemas.bcadastro.tables: []
    asserts:
      - failedTemplate:
          errorMessage: "backup.ageRecipient is required when backup.enabled is true"

  - it: renders one schema backup with the configured schedule and image
    set:
      backup.enabled: true
      backup.schedule: "30 4 * * *"
      backup.image: postgres:17-alpine
      backup.ageRecipient: age1exampleexampleexampleexampleexampleexampleexampleexamplexxx
      backup.prefix: backups/access_policy
      gcs.bucket: my-bucket
      syncConfig.schemas.bcadastro.tables: []
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: data-proxy-bcadastro-backup
      - equal:
          path: spec.schedule
          value: "30 4 * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: postgres:17-alpine
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: 'COPY bcadastro\.access_policy TO STDOUT'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: '\$\{BACKUP_PREFIX\}/bcadastro/'
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].args[0]
          pattern: 'writers\.json'
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.name
          value: data-proxy-schema-writers

  - it: uses an existing secret when configured
    set:
      backup.enabled: true
      backup.ageRecipient: age1exampleexampleexampleexampleexampleexampleexampleexamplexxx
      backup.existingSecret: my-backup-secret
      syncConfig.schemas.bcadastro.tables: []
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: BACKUP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-backup-secret
                key: BACKUP_PASSWORD
