suite: Backup CronJob
templates:
  - cronjob-backup.yaml
tests:
  - it: does not render when backup is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one schema backup with the configured schedule and image
    set:
      backup.enabled: true
      backup.schedule: "30 4 * * *"
      backup.image: postgres:17-alpine
      backup.password: test-backup-pass
      backup.prefix: backups/access_policy
      cnpg.backup.bucket: backup-bucket
      cnpg.backup.endpointURL: https://storage.googleapis.com
      cnpg.backup.existingSecret: backup-s3-creds
      syncConfig.schemas.bcadastro.tables: []
    asserts:
      - documentSelector:
          path: kind
          value: CronJob
        isKind:
          of: CronJob
      - documentSelector:
          path: kind
          value: CronJob
        equal:
          path: metadata.name
          value: data-proxy-bcadastro-backup
      - documentSelector:
          path: kind
          value: CronJob
        equal:
          path: spec.schedule
          value: "30 4 * * *"
      - documentSelector:
          path: kind
          value: CronJob
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: postgres:17-alpine
      - documentSelector:
          path: kind
          value: CronJob
        matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[0]
          pattern: '^nu$'
      - documentSelector:
          path: kind
          value: CronJob
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[1]
          value: /scripts/backup.nu
      - documentSelector:
          path: kind
          value: CronJob
        equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.name
          value: data-proxy-bcadastro-backup-script

  - it: uses backup S3 credentials from cnpg.backup.existingSecret
    set:
      backup.enabled: true
      backup.password: test-backup-pass
      cnpg.backup.bucket: backup-bucket
      cnpg.backup.endpointURL: https://storage.googleapis.com
      cnpg.backup.existingSecret: backup-s3-creds
      syncConfig.schemas.bcadastro.tables: []
    asserts:
      - documentSelector:
          path: kind
          value: CronJob
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: backup-s3-creds
                key: S3_ACCESS_KEY
