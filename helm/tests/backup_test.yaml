suite: Backup CronJob
templates:
  - jobs.yaml
tests:
  - it: renders one schema backup with the configured schedule and image
    set:
      jobs.backup.enabled: true
      jobs.backup.schedule: "30 4 * * *"
      jobs.image: postgres:17-alpine
      jobs.backup.prefix: backups/access_policy
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      sync.config.schemas.test.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        isKind:
          of: CronJob
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        equal:
          path: metadata.name
          value: data-proxy-test-backup
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        equal:
          path: spec.schedule
          value: "30 4 * * *"
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: postgres:17-alpine
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[0]
          pattern: '^nu$'
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[1]
          value: /scripts/backup.nu
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.name
          value: data-proxy-scripts

  - it: connects as the admin role
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      sync.config.schemas.test.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGUSER
            value: admin
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: data-proxy-cnpg-superuser
                key: password

  - it: mounts GCP credentials so rclone can reach GCS
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      gcp.existingSecret: gcp
      sync.config.schemas.test.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /gcp/key.json
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: gcp
            secret:
              secretName: gcp

  - it: omits GCP credentials when no GCP Secret is set
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: http://seaweedfs-s3:8333
      jobs.backup.s3.existingSecret: backup-s3-creds
      gcp.existingSecret: ""
      sync.config.schemas.test.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS

  - it: uses backup S3 credentials from jobs.backup.s3.existingSecret
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      sync.config.schemas.test.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: backup-s3-creds
                key: S3_ACCESS_KEY

  - it: mounts the backup script and its library from the scripts ConfigMap
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      sync.config.schemas.test.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.items
          content:
            key: backup.nu
            path: backup.nu
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.items
          content:
            key: lib.nu
            path: lib.nu

  - it: mounts the maintenance script and its library from the scripts ConfigMap
    set:
      jobs.maintenance.enabled: true
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-maintenance
        contains:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.items
          content:
            key: maintenance.nu
            path: maintenance.nu
      - documentSelector:
          path: metadata.name
          value: data-proxy-maintenance
        contains:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.items
          content:
            key: lib.nu
            path: lib.nu

  - it: gives the maintenance job the password that its database URL expands
    set:
      jobs.maintenance.enabled: true
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-maintenance
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: data-proxy-cnpg-superuser
                key: password

  - it: gives the backup job the database URL that execute-sql reads
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: http://storage:8333
      jobs.backup.s3.existingSecret: backup-s3-creds
      sync.config.schemas.test.tables: []
    asserts:
      - documentSelector:
          path: metadata.name
          value: data-proxy-test-backup
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PG_DATABASE_URL
            value: postgresql://admin@data-proxy-rw:5432/data-proxy

  - it: restores the catalog from the Litestream replica into an emptyDir for the backup
    set:
      jobs.backup.enabled: true
      jobs.backup.s3.bucket: backup-bucket
      jobs.backup.s3.endpointURL: https://storage.googleapis.com
      jobs.backup.s3.existingSecret: backup-s3-creds
      sync.config.schemas.test.tables: []
    documentSelector:
      path: metadata.name
      value: data-proxy-test-backup
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers
          content:
            name: restore-catalog
            image: docker.io/litestream/litestream:0.5.12
            imagePullPolicy: IfNotPresent
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            args:
              - restore
              - -if-replica-exists
              - -config
              - /config/litestream.yaml
              - -o
              - /catalog/catalog.sqlite
              - /var/lib/ducklake/catalogs/test/catalog.sqlite
            env:
              - name: S3_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: data-proxy-s3
                    key: S3_ACCESS_KEY
              - name: S3_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: data-proxy-s3
                    key: S3_SECRET_KEY
            volumeMounts:
              - name: catalog
                mountPath: /catalog
              - name: litestream-config
                mountPath: /config
                readOnly: true
        template: jobs.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: catalog
            mountPath: /catalog
            readOnly: true
        template: jobs.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: CATALOG_FILE
            value: /catalog/catalog.sqlite
        template: jobs.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: catalog
            emptyDir: {}
        template: jobs.yaml
      - notContains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: duckdb
            persistentVolumeClaim:
              claimName: data-proxy-duckdb
              readOnly: true
        template: jobs.yaml

  - it: gives the maintenance job no object store, catalog volume, or DuckLake settings
    set:
      jobs.maintenance.enabled: true
    documentSelector:
      path: metadata.name
      value: data-proxy-maintenance
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.initContainers
        template: jobs.yaml
      - lengthEqual:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          count: 5
        template: jobs.yaml
      - lengthEqual:
          path: spec.jobTemplate.spec.template.spec.volumes
          count: 2
        template: jobs.yaml
