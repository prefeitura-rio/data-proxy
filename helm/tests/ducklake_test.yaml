suite: DuckLake stateless architecture
templates:
  - cluster-cnpg.yaml
  - pooler-cnpg.yaml
  - deployment-proxy.yaml
  - deployment-postgrest.yaml
  - deployment-sync.yaml
  - configmap-litestream.yaml
  - deployment-litestream.yaml
  - pvc-catalogs.yaml
tests:
  - it: renders one CNPG cluster with DuckLake PostgreSQL parameters
    asserts:
      - hasDocuments:
          count: 1
        template: cluster-cnpg.yaml
      - notExists:
          path: spec.instances
        template: cluster-cnpg.yaml
      - equal:
          path: spec.postgresql.parameters.shared_buffers
          value: 1GB
        template: cluster-cnpg.yaml
      - equal:
          path: spec.postgresql.parameters.work_mem
          value: 64MB
        template: cluster-cnpg.yaml
      - equal:
          path: spec.resources.limits.memory
          value: 8Gi
        template: cluster-cnpg.yaml
      - equal:
          path: spec.postgresql.parameters["duckdb.threads"]
          value: "2"
        template: cluster-cnpg.yaml
  - it: mounts the reader catalog PVC read-write in CNPG
    set:
      sync.config:
        schemas:
          app:
            tables: []
      ducklake.litestream.storage.storageClass: minikube-rwx
    asserts:
      - matchRegex:
          path: metadata.annotations["cnpg.io/podPatch"]
          pattern: 'persistentVolumeClaim[^}]*"readOnly":false'
        template: cluster-cnpg.yaml
  - it: restarts sync pods when Secret data changes
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/s3-credentials"]
          pattern: "^[0-9a-f]{64}$"
        template: deployment-sync.yaml

  - it: restarts Litestream pods when Secret data changes
    set:
      sync.config.schemas:
        app:
          tables: []
      ducklake.litestream.storage.storageClass: minikube-rwx
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/s3-credentials"]
          pattern: "^[0-9a-f]{64}$"
        template: deployment-litestream.yaml

  - it: uses session pooling for DuckLake attachments
    asserts:
      - equal:
          path: spec.pgbouncer.poolMode
          value: session
        template: pooler-cnpg.yaml
  - it: mounts the writer catalog PVC into DBOS sync workers
    set:
      sync.config:
        schemas:
          app:
            tables: []
      ducklake.litestream.storage.storageClass: minikube-rwx
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: catalogs
            persistentVolumeClaim:
              claimName: data-proxy-catalog-writer
        template: deployment-sync.yaml
  - it: runs one Litestream workload with reader and writer containers
    set:
      sync.config:
        schemas:
          app:
            tables: []
      ducklake.litestream.storage.storageClass: minikube-rwx
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: deployment-litestream.yaml
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/litestream-config"]
          pattern: "^[0-9a-f]{64}$"
        template: deployment-litestream.yaml
      - equal:
          path: spec.template.spec.containers[0].name
          value: restore
        template: deployment-litestream.yaml
      - equal:
          path: spec.template.spec.containers[0].command
          value: [nu, /projected/recover-catalogs.nu, --read]
        template: deployment-litestream.yaml
      - equal:
          path: spec.template.spec.containers[1].name
          value: replicate
        template: deployment-litestream.yaml
      - equal:
          path: spec.template.spec.containers[1].command
          value: [nu, /projected/recover-catalogs.nu, --write]
        template: deployment-litestream.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsUser: 0
            runAsGroup: 0
        template: deployment-litestream.yaml
      - equal:
          path: spec.template.spec.containers[1].securityContext
          value:
            runAsUser: 10001
            runAsGroup: 10001
        template: deployment-litestream.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: writer-catalogs
            persistentVolumeClaim:
              claimName: data-proxy-catalog-writer
        template: deployment-litestream.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: reader-catalogs
            persistentVolumeClaim:
              claimName: data-proxy-catalog-reader
        template: deployment-litestream.yaml
  - it: renders one Litestream entry per schema
    set:
      sync.config:
        schemas:
          app:
            tables: []
      ducklake.litestream.storage.storageClass: minikube-rwx
    asserts:
      - matchRegex:
          path: data["litestream-write.yaml"]
          pattern: "replica:\\n"
        template: configmap-litestream.yaml
      - matchRegex:
          path: data["litestream-write.yaml"]
          pattern: "ducklake/app/catalog.sqlite"
        template: configmap-litestream.yaml
      - matchRegex:
          path: data["litestream-read.yaml"]
          pattern: "catalogs/app/catalog.sqlite"
        template: configmap-litestream.yaml
      - matchRegex:
          path: data["recover-catalogs.nu"]
          pattern: "litestream restore -if-replica-exists"
        template: configmap-litestream.yaml
      - matchRegex:
          path: data["recover-catalogs.nu"]
          pattern: "set-permissions '777'"
        template: configmap-litestream.yaml
      - matchRegex:
          path: data["recover-catalogs.nu"]
          pattern: "set-permissions '666'"
        template: configmap-litestream.yaml
  - it: requires and uses the shared RWX catalog volume
    set:
      sync.config:
        schemas:
          app:
            tables: []
      ducklake.litestream.storage.storageClass: minikube-rwx
    asserts:
      - hasDocuments:
          count: 2
        template: pvc-catalogs.yaml
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteMany
        template: pvc-catalogs.yaml
      - equal:
          path: spec.storageClassName
          value: minikube-rwx
        template: pvc-catalogs.yaml
      - equal:
          path: metadata.name
          value: data-proxy-catalog-writer
        documentIndex: 0
        template: pvc-catalogs.yaml
      - equal:
          path: metadata.name
          value: data-proxy-catalog-reader
        documentIndex: 1
        template: pvc-catalogs.yaml
  - it: does not configure empty response caching
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMPTY_CACHE_TTL
            value: "3600"
        template: deployment-proxy.yaml
