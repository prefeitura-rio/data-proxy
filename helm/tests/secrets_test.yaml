suite: Secrets
templates:
  - secret.yaml
tests:
  - it: renders both secrets by default
    set:
      cnpg.password: pgpass
      cnpg.authenticatorPassword: authpass
      s3.accessKey: key-id
      s3.secretKey: secret-key
    asserts:
      - hasDocuments:
          count: 2

  - it: db secret contains postgres and authenticator passwords
    set:
      cnpg.password: pgpass
      cnpg.authenticatorPassword: authpass
    asserts:
      - equal:
          path: stringData.POSTGRES_PASSWORD
          value: pgpass
        documentIndex: 0
      - equal:
          path: stringData.PGRST_AUTHENTICATOR_PASSWORD
          value: authpass
        documentIndex: 0

  - it: omits db secret when existingSecret is set
    set:
      s3.accessKey: key-id
      s3.secretKey: secret-key
      cnpg.existingSecret: my-db-secret
    asserts:
      - hasDocuments:
          count: 1

  - it: omits the s3 secret when existingSecret is set
    set:
      cnpg.password: pgpass
      cnpg.authenticatorPassword: authpass
      s3.existingSecret: my-s3-secret
    asserts:
      - hasDocuments:
          count: 1

  - it: renders a backup secret when backup is enabled
    set:
      cnpg.password: pgpass
      cnpg.authenticatorPassword: authpass
      s3.accessKey: key-id
      s3.secretKey: secret-key
      backup.enabled: true
      backup.password: backuppass
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: stringData.BACKUP_PASSWORD
          value: backuppass
        documentIndex: 1

  - it: omits backup secret when existingSecret is set
    set:
      cnpg.password: pgpass
      cnpg.authenticatorPassword: authpass
      s3.accessKey: key-id
      s3.secretKey: secret-key
      backup.enabled: true
      backup.existingSecret: my-backup-secret
    asserts:
      - hasDocuments:
          count: 2
