suite: Secrets
templates:
  - secret.yaml
tests:
  - it: renders a generated S3 Secret by default
    asserts:
      - isKind:
          of: Secret
      - exists:
          path: stringData.S3_ACCESS_KEY
      - exists:
          path: stringData.S3_SECRET_KEY

  - it: omits generated S3 Secret when supplied
    set:
      s3.existingSecret: s3-credentials
    asserts:
      - hasDocuments:
          count: 0
---
suite: Schema writer Secrets
templates:
  - secret-schema-writers.yaml
tests:
  - it: renders owner and schema writers Secrets
    asserts:
      - exists:
          path: stringData.POSTGRES_PASSWORD
        documentIndex: 0

  - it: requires schema writers override with external database Secret
    set:
      cnpg.existingSecret: database-owner
    asserts:
      - failedTemplate: {}
