suite: Secrets
templates:
  - secret.yaml
tests:
  - it: renders both secrets by default
    set:
      pgduckdb.password: pgpass
      pgduckdb.authenticatorPassword: authpass
      gcs.keyId: key-id
      gcs.secretKey: secret-key
    asserts:
      - hasDocuments:
          count: 2

  - it: db secret contains postgres and authenticator passwords
    set:
      pgduckdb.password: pgpass
      pgduckdb.authenticatorPassword: authpass
    asserts:
      - equal:
          path: stringData.POSTGRES_PASSWORD
          value: pgpass
        documentIndex: 0
      - equal:
          path: stringData.PGRST_AUTHENTICATOR_PASSWORD
          value: authpass
        documentIndex: 0

  - it: db secret includes replication password when HA is enabled
    set:
      pgduckdb.password: pgpass
      pgduckdb.authenticatorPassword: authpass
      ha.enabled: true
      ha.patroni.replicationPassword: replpass
    asserts:
      - equal:
          path: stringData.PATRONI_REPLICATION_PASSWORD
          value: replpass
        documentIndex: 0

  - it: omits db secret when existingSecret is set
    set:
      gcs.keyId: key-id
      gcs.secretKey: secret-key
      pgduckdb.existingSecret: my-db-secret
    asserts:
      - hasDocuments:
          count: 1

  - it: omits gcs secret when existingSecret is set
    set:
      pgduckdb.password: pgpass
      pgduckdb.authenticatorPassword: authpass
      gcs.existingSecret: my-gcs-secret
    asserts:
      - hasDocuments:
          count: 1

  - it: renders a backup secret when backup is enabled
    set:
      pgduckdb.password: pgpass
      pgduckdb.authenticatorPassword: authpass
      gcs.keyId: key-id
      gcs.secretKey: secret-key
      backup.enabled: true
      backup.password: backuppass
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: stringData.BACKUP_PASSWORD
          value: backuppass
        documentIndex: 1

  - it: omits backup secret when existingSecret is set
    set:
      pgduckdb.password: pgpass
      pgduckdb.authenticatorPassword: authpass
      gcs.keyId: key-id
      gcs.secretKey: secret-key
      backup.enabled: true
      backup.existingSecret: my-backup-secret
    asserts:
      - hasDocuments:
          count: 2
