suite: Secrets
templates:
  - secret.yaml
tests:
  - it: renders all three secrets by default
    set:
      duckdb.password: pgpass
      duckdb.authenticatorPassword: authpass
      gcs.keyId: key-id
      gcs.secretKey: secret-key
      postgrest.jwtSecret: '{"kty":"RSA"}'
    asserts:
      - hasDocuments:
          count: 3

  - it: db secret contains postgres and authenticator passwords
    set:
      duckdb.password: pgpass
      duckdb.authenticatorPassword: authpass
    asserts:
      - equal:
          path: stringData.POSTGRES_PASSWORD
          value: pgpass
        documentIndex: 0
      - equal:
          path: stringData.PGRST_AUTHENTICATOR_PASSWORD
          value: authpass
        documentIndex: 0

  - it: db secret includes replication password when HA is enabled
    set:
      duckdb.password: pgpass
      duckdb.authenticatorPassword: authpass
      ha.enabled: true
      ha.patroni.replicationPassword: replpass
    asserts:
      - equal:
          path: stringData.PATRONI_REPLICATION_PASSWORD
          value: replpass
        documentIndex: 0

  - it: omits db secret when existingSecret is set
    set:
      gcs.keyId: key-id
      gcs.secretKey: secret-key
      postgrest.jwtSecret: '{"kty":"RSA"}'
      duckdb.existingSecret: my-db-secret
    asserts:
      - hasDocuments:
          count: 2

  - it: omits gcs secret when existingSecret is set
    set:
      duckdb.password: pgpass
      duckdb.authenticatorPassword: authpass
      postgrest.jwtSecret: '{"kty":"RSA"}'
      gcs.existingSecret: my-gcs-secret
    asserts:
      - hasDocuments:
          count: 2

  - it: omits jwt secret when existingJwtSecret is set
    set:
      duckdb.password: pgpass
      duckdb.authenticatorPassword: authpass
      gcs.keyId: key-id
      gcs.secretKey: secret-key
      postgrest.existingJwtSecret: my-jwt-secret
    asserts:
      - hasDocuments:
          count: 2
