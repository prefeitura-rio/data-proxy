suite: BigQuery fallback CNPG per-schema routing
release:
  name: data-proxy
  namespace: default
templates:
  - virtualservice.yaml
  - configmap-proxy.yaml
  - configmap-schema-proxy.yaml
tests:
  - it: renders env var placeholders in each per-schema proxy config
    set:
      ha.enabled: true
      cnpg.mode: per-schema
      syncConfig.schemas.example.tables: []
    asserts:
      - matchRegex:
          path: data["nginx.conf"]
          pattern: 'js_fetch_max_response_buffer_size \$\{FETCH_BUFFER_SIZE\}'
        template: configmap-schema-proxy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-example-proxy
      - notMatchRegex:
          path: data["nginx.conf"]
          pattern: '__FETCH_[A-Z_]+__'
        template: configmap-schema-proxy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-example-proxy

  - it: routes per-schema reads through the fallback proxy
    set:
      cnpg.mode: per-schema
      cnpg.schemas:
        app_pequenos_cariocas:
          instances: 3
      fallback.proxyImage: example.invalid/data-proxy-fallback:test
      ingress.enabled: true
      ingress.gateway: istio-system/istio-gateway
      ingress.host: data-proxy.example.com
      syncConfig.schemas:
        app_pequenos_cariocas:
          claim: preferred_username
          tables: []
    asserts:
      - equal:
          path: spec.http[1].name
          value: app_pequenos_cariocas-read
        template: virtualservice.yaml
      - equal:
          path: spec.http[1].route[0].destination.host
          value: data-proxy-app-pequenos-cariocas-proxy
        template: virtualservice.yaml
      - equal:
          path: spec.http[1].route[0].destination.port.number
          value: 8080
        template: virtualservice.yaml
      - matchRegex:
          path: data["nginx.conf"]
          pattern: '"app_pequenos_cariocas" "http://data-proxy-app-pequenos-cariocas-postgrest-ro.default.svc.cluster.local:3000";'
        template: configmap-proxy.yaml
        documentSelector:
          path: metadata.name
          value: data-proxy-proxy
