suite: Database authorization
templates:
  - configmap-db-init.yaml
  - deployment-postgrest.yaml
tests:
  - it: creates separate anonymous and authenticated roles
    set:
      auth.anonRole: test_anon
      auth.userRole: test_user
      auth.authenticatorRole: test_authenticator
    asserts:
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE ROLE "test_anon" NOLOGIN NOBYPASSRLS
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE ROLE "test_user" NOLOGIN NOBYPASSRLS
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: GRANT "test_user" TO "test_authenticator"
        template: configmap-db-init.yaml

  - it: does not create a backup role by default
    asserts:
      - notMatchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE ROLE backup
        template: configmap-db-init.yaml

  - it: creates a read-only backup role when backup is enabled
    set:
      backup.enabled: true
      backup.ageRecipient: age1exampleexampleexampleexampleexampleexampleexampleexamplexxx
      auth.rlsSchema: rls
    asserts:
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE ROLE backup NOINHERIT LOGIN
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: GRANT USAGE ON SCHEMA rls TO backup
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["04_access_policy.sql"]
          pattern: GRANT SELECT ON rls\.access_policy TO backup
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["04_access_policy.sql"]
          pattern: CREATE POLICY backup_read ON rls\.access_policy\s+FOR SELECT\s+TO backup
        template: configmap-db-init.yaml

  - it: configures PostgREST anonymous and JWT roles
    set:
      auth.anonRole: test_anon
      auth.jwtRoleClaim: $.role
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value:
            name: PGRST_DB_ANON_ROLE
            value: test_anon
        template: deployment-postgrest.yaml
      - equal:
          path: spec.template.spec.containers[0].env[4]
          value:
            name: PGRST_JWT_ROLE_CLAIM_KEY
            value: $.role
        template: deployment-postgrest.yaml
