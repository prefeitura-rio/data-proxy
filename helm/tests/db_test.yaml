suite: Database authorization
templates:
  - configmap-db-init.yaml
  - deployment-postgrest.yaml
tests:
  - it: creates separate anonymous and authenticated roles
    set:
      auth.anonRole: test_anon
      auth.userRole: test_user
      auth.authenticatorRole: test_authenticator
    asserts:
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE ROLE "test_anon" NOLOGIN NOBYPASSRLS
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE ROLE "test_user" NOLOGIN NOBYPASSRLS
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: GRANT "test_user" TO "test_authenticator"
        template: configmap-db-init.yaml

  - it: creates the shared status enum and per-schema freshness table
    set:
      syncConfig.schemas.app.tables: []
    asserts:
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE TYPE rls\.sync_status AS ENUM \('success', 'failure'\)
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE TABLE IF NOT EXISTS "app"\.freshness
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: '"table" text NOT NULL,\s+strategy text NOT NULL,\s+partition text,\s+updated_at timestamptz,\s+attempted_at timestamptz NOT NULL,\s+status rls\.sync_status NOT NULL'
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: 'UNIQUE NULLS NOT DISTINCT \("table", strategy, partition\)'
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: GRANT SELECT ON "app"\.freshness TO "user"
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: ALTER TABLE "app"\.freshness ENABLE ROW LEVEL SECURITY
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE POLICY schema_scope ON "app"\.freshness
        template: configmap-db-init.yaml

  - it: does not create a backup role by default
    asserts:
      - notMatchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE ROLE backup
        template: configmap-db-init.yaml

  - it: creates a read-only backup role when backup is enabled
    set:
      backup.enabled: true
      backup.ageRecipient: age1exampleexampleexampleexampleexampleexampleexampleexamplexxx
      auth.rlsSchema: rls
    asserts:
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: CREATE ROLE backup NOINHERIT LOGIN
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["02_roles.sh"]
          pattern: GRANT USAGE ON SCHEMA rls TO backup
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["04_access_policy.sql"]
          pattern: GRANT SELECT ON rls\.access_policy TO backup
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["04_access_policy.sql"]
          pattern: CREATE POLICY backup_read ON rls\.access_policy\s+FOR SELECT\s+TO backup
        template: configmap-db-init.yaml

  - it: creates the admin and enabled flags on access_policy
    asserts:
      - matchRegex:
          path: data["04_access_policy.sql"]
          pattern: is_admin boolean NOT NULL DEFAULT false
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["04_access_policy.sql"]
          pattern: is_enabled boolean NOT NULL DEFAULT true
        template: configmap-db-init.yaml
      - notMatchRegex:
          path: data["04_access_policy.sql"]
          pattern: is_super_admin
        template: configmap-db-init.yaml

  - it: adds an idempotent metadata column and its timestamp trigger
    asserts:
      - matchRegex:
          path: data["04_access_policy.sql"]
          pattern: ALTER TABLE rls\.access_policy\s+ADD COLUMN IF NOT EXISTS metadata jsonb NOT NULL DEFAULT '\{\}'::jsonb
        template: configmap-db-init.yaml
      - matchRegex:
          path: data["04_access_policy.sql"]
          pattern: CREATE TRIGGER access_policy_metadata_timestamps\s+BEFORE INSERT OR UPDATE ON rls\.access_policy
        template: configmap-db-init.yaml

  - it: configures PostgREST anonymous and JWT roles
    set:
      auth.anonRole: test_anon
      auth.jwtRoleClaim: $.role
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value:
            name: PGRST_DB_ANON_ROLE
            value: test_anon
        template: deployment-postgrest.yaml
      - equal:
          path: spec.template.spec.containers[0].env[4]
          value:
            name: PGRST_JWT_ROLE_CLAIM_KEY
            value: $.role
        template: deployment-postgrest.yaml
