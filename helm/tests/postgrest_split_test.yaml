suite: PostgREST read/write split
templates:
  - deployment-postgrest-ro.yaml
  - deployment-postgrest-rw.yaml
  - service-postgrest-ro.yaml
  - service-postgrest-rw.yaml
  - hpa-postgrest-rw.yaml
  - scaledobject-postgrest.yaml
tests:
  - it: renders separate read and write workloads in shared mode
    asserts:
      - hasDocuments:
          count: 1
        template: deployment-postgrest-ro.yaml
      - hasDocuments:
          count: 1
        template: deployment-postgrest-rw.yaml
      - hasDocuments:
          count: 1
        template: service-postgrest-ro.yaml
      - hasDocuments:
          count: 1
        template: service-postgrest-rw.yaml
  - it: independently configures ro KEDA and rw HPA workloads
    set:
      postgrest.ro.replicas: 2
      postgrest.ro.keda.minReplicaCount: 2
      postgrest.ro.keda.maxReplicaCount: 6
      postgrest.rw.replicas: 3
      postgrest.rw.hpa.minReplicas: 3
      postgrest.rw.hpa.maxReplicas: 5
    asserts:
      - notExists:
          path: spec.replicas
        template: deployment-postgrest-ro.yaml
      - notExists:
          path: spec.replicas
        template: deployment-postgrest-rw.yaml
      - equal:
          path: spec.minReplicaCount
          value: 2
        template: scaledobject-postgrest.yaml
      - equal:
          path: spec.maxReplicaCount
          value: 6
        template: scaledobject-postgrest.yaml
      - equal:
          path: spec.minReplicas
          value: 3
        template: hpa-postgrest-rw.yaml
      - equal:
          path: spec.maxReplicas
          value: 5
        template: hpa-postgrest-rw.yaml

  - it: connects read through the read Pooler and write directly through CNPG rw
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_URI
            value: postgres://authenticator:$(PGRST_AUTHENTICATOR_PASSWORD)@data-proxy-pooler-ro:5432/data-proxy
        template: deployment-postgrest-ro.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_URI
            value: postgres://authenticator:$(PGRST_AUTHENTICATOR_PASSWORD)@data-proxy-rw:5432/data-proxy
        template: deployment-postgrest-rw.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGRST_DB_PREPARED_STATEMENTS
            value: "false"
        template: deployment-postgrest-ro.yaml
  - it: applies KEDA only to read and a CPU HPA to write
    asserts:
      - hasDocuments:
          count: 1
        template: scaledobject-postgrest.yaml
      - hasDocuments:
          count: 1
        template: hpa-postgrest-rw.yaml
      - equal:
          path: spec.scaleTargetRef.name
          value: data-proxy-postgrest-rw
        template: hpa-postgrest-rw.yaml
