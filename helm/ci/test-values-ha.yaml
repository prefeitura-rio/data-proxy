image:
  repository: gcr.io/proj/data-proxy
  tag: "1.0.0"

pgduckdb:
  image: gcr.io/proj/data-proxy-postgres:17-v1.1.1
  password: pgpass
  authenticatorPassword: authrole

gcs:
  bucket: prod-bucket
  keyId: hmac-key-id
  secretKey: hmac-secret

postgrest:
  proxyUri: https://api.example.com
  jwtSecret: '{"kty":"RSA","e":"AQAB","alg":"RS256","n":"abc123"}'

valkey:
  auth:
    password: testpass

producer:
  schedule: "0 2 * * *"

auth:
  anonRole: dp_anon
  userRole: dp_user
  authenticatorRole: dp_auth
  jwtRoleClaim: $.role
  rlsSchema: rls

ha:
  enabled: true
  schemas:
    app_pequenos_cariocas:
      members: 2
      storage:
        size: 80Gi
  patroni:
    maxWalSenders: 10
    walKeepSize: 1GB
    replicationUsername: replicator
    replicationPassword: replpass

syncConfig:
  schemas:
    app_pequenos_cariocas:
      claim: preferred_username
      tables:
        - name: rj-proj.dev.endpoint_participante_listagem
          strategy: full
          rls:
            - column: id_unidade
              unit_type: unidade
          indexes:
            - name: idx_pl_id_unidade
              columns: [id_unidade]

ingress:
  enabled: true
  gateway: "istio-system/istio-gateway"
  host: "data-proxy.example.com"
