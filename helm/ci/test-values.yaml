image:
  repository: gcr.io/proj/data-proxy
  tag: "1.0.0"

duckdb:
  password: pgpass
  authenticatorPassword: authrole

gcs:
  bucket: prod-bucket
  keyId: hmac-key-id
  secretKey: hmac-secret

postgrest:
  schemas: "app_pequenos_cariocas,projeto_pequenos_cariocas"
  proxyUri: https://api.example.com
  jwtSecret: '{"kty":"RSA","e":"AQAB","alg":"RS256","n":"abc123"}'

redis:
  url: redis://redis:6379/0

auth:
  anonRole: web_anon
  authenticatorRole: authenticator
  jwtClaim: unidades
  sessionVar: app.user_units
  rlsSchema: rls

syncConfig:
  tables:
    - bq_table: rj-proj.dev.endpoint_participante_listagem
      strategy: dump
      pg_schema: app_pequenos_cariocas
      rls:
        column: id_unidade
