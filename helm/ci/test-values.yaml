image:
  repository: gcr.io/proj/data-proxy
  tag: "1.0.0"

postgres:
  password: pgpass
  authenticatorPassword: authrole

cnpg:
  instances: 2
  autoscaling:
    minReplicaCount: 2
    maxReplicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: "4"
      memory: 4Gi

s3:
  bucket: prod-bucket
  accessKey: s3-access-key
  secretKey: s3-secret

postgrest:
  proxyUri: https://api.example.com
  jwtSecret: '{"kty":"RSA","e":"AQAB","alg":"RS256","n":"abc123"}'
  maxReplicaCount: 3
  pgBouncer:
    instances: 1
    poolSize: 20
    maxClientConns: 100
    autoscaling:
      minReplicaCount: 1
      maxReplicaCount: 3

redis:
  existingSecret: data-proxy-redis
  writerAddress: redis-writer:6379
  webdisHost: redis-writer
  webdisPort: 6379

producer:
  schedule: "0 2 * * *"

auth:
  anonRole: anon
  userRole: user
  authenticatorRole: authenticator
  jwtRoleClaim: $.role
  rlsSchema: rls

syncConfig:
  schemas:
    app_pequenos_cariocas:
      claim: preferred_username
      tables:
        - name: rj-proj.dev.endpoint_participante_listagem
          strategy: full
          rls:
            - column: id_unidade
              unit_type: unidade
          indexes:
            - name: idx_pl_id_unidade
              columns: [id_unidade]

ingress:
  enabled: true
  gateway: "istio-system/istio-gateway"
  host: "data-proxy.example.com"

seaweedfs:
  s3:
    credentials:
      admin:
        accessKey: s3-access-key
        secretKey: s3-secret
    createBuckets:
      - name: prod-bucket