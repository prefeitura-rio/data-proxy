## High availability. false: one PostgreSQL instance serves reads and writes.
## true: one CloudNativePG Cluster with standbys that serve reads and take over on failure.
## Nothing else to set: the autoscaling blocks of cnpg and postgrest then scale the
## read side, and the proxy sends reads and writes to different PostgREST deployments.
ha:
  enabled: false
## DBOS sync service: runs the scheduled sync workflow, BigQuery extraction,
## and DuckLake publication. Scaled by KEDA on the DBOS workflow queue.
sync:
  ## Number of sync worker replicas before KEDA scaling. KEDA manages this after startup.
  replicas: 1
  ## Container image for the DBOS sync workers.
  image: ghcr.io/prefeitura-rio/data-proxy-sync:caa0da9
  imagePullPolicy: IfNotPresent
  ## Mount the local manifests sync-trigger ConfigMap in sync workers.
  trigger:
    enabled: false
    configMap: manifests-sync-trigger-script
  ## Cron expression for the DBOS sync schedule.
  ## Default: daily at 02:00 UTC.
  schedule: 0 2 * * *
  ## Maximum wall-clock time for one DBOS sync workflow.
  workflowTimeoutSeconds: 3600
  ## Maximum concurrent run_sync workflows across all workers.
  ## One at a time prevents overlapping sync runs.
  queueConcurrency: 1
  ## Maximum number of Parquet files one dump task processes before the next task.
  dumpTaskFileLimit: 256
  ## Maximum DBOS step retry attempts for one dump task.
  dumpStepMaxAttempts: 3
  ## Maximum attempts for safe transient DBOS steps.
  stepMaxAttempts: 3
  ## Maximum dump tasks enqueued per 60 seconds.
  dumpQueueRateLimit: 0
  ## Per-process concurrency for the DBOS dump queue.
  dumpQueueWorkerConcurrency: 4
  ## Recovery of DBOS workflows owned by terminated sync pods.
  recovery:
    enabled: true
    intervalSeconds: 30
    graceSeconds: 120
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  ## Resource requests and limits for each sync worker pod.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 6Gi
  ## KEDA autoscaling for the sync Deployment.
  autoscaling:
    ## Interval in seconds between KEDA metric checks.
    pollingInterval: 30
    ## Cooldown in seconds before scaling down to idle.
    cooldownPeriod: 60
    ## Replicas KEDA scales down to when the DBOS queue is empty.
    idleReplicaCount: 1
    ## Minimum replicas once work activates.
    minReplicaCount: 3
    ## Maximum number of concurrent sync pods.
    maxReplicaCount: 15
    ## Postgres trigger query counting DBOS queued/running workflows.
    query: SELECT ceil(COUNT(*)::decimal / 16) FROM dbos.workflow_status WHERE application_name = 'data-proxy-sync' AND status IN ('PENDING', 'ENQUEUED', 'DELAYED', 'RUNNING');
    ## Target value for the query result.
    targetQueryValue: "1.1"
    ## Value above which KEDA activates from zero replicas.
    activationTargetQueryValue: "5"
  ## DBOS application and system database configuration.
  dbos:
    applicationName: data-proxy-sync
    applicationVersion: 0.1.0
    systemSchema: dbos
    appSchema: data_proxy
  ## Sync configuration rendered as sync.json and mounted into each sync container.
  ## See docs/sync.md for the full field reference.
  config:
    ## Map of PostgreSQL schemas. Each key is a schema name. Each value holds the
    ## schema's identity claim and its list of tables.
    schemas: {}
## Kubernetes ServiceAccount for the sync pods.
## Attach a Workload Identity annotation here to allow BigQuery access without
## a service account key file.
serviceAccount:
  ## Set to true to create a ServiceAccount. Set to false to use an existing one.
  create: true
  ## Name of the ServiceAccount. The chart uses this name for all sync pods.
  name: data-proxy
  ## Annotations to add to the ServiceAccount. Use this field for Workload Identity.
  ## Example: iam.gke.io/gcp-service-account: dataproxy@project.iam.gserviceaccount.com
  annotations: {}
## PostgREST read API. One workload serves all schemas.
postgrest:
  ## PostgREST container image.
  image: postgrest/postgrest:v16.1
  ## External URL that PostgREST uses in the OpenAPI specification.
  proxyUri: ""
  ## JWKS URI for JWT validation. PostgREST fetches and caches the public keys at startup.
  jwksUri: ""
  ## Symmetric JWT secret (HS256). When set, overrides JWKS validation.
  jwtSecret: ""
  ## Maximum number of rows PostgREST will return per request.
  maxRows: 1000
  ## Enable avg(), count(), max(), min(), and sum() in PostgREST select queries.
  aggregatesEnabled: true
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 512Mi
  autoscaling:
    minReplicaCount: 1
    maxReplicaCount: 6
    pollingInterval: 30
    cooldownPeriod: 300
    triggers: []
## Rendered OpenAPI documentation page for PostgREST, reachable at <ingress.host>/docs.
swaggerUi:
  enabled: false
  image: swaggerapi/swagger-ui:v5.18.2
## OpenTelemetry configuration for worker logs.
observability:
  otlpLogsEndpoint: ""
  otlpTracesEndpoint: ""
  otlpMetricsEndpoint: ""
## GCP credentials for BigQuery access.
## In GKE, use Workload Identity via serviceAccount.annotations.
## Locally, mount a Secret or ConfigMap containing key.json.
gcp:
  ## Existing Secret with a key.json file. When set, it is projected into sync pods.
  existingSecret: ""
  ## Path where the key file is mounted inside sync and PostgreSQL pods.
  mountPath: /gcp/key.json
## S3-compatible object store that holds the Parquet files and DuckLake data.
s3:
  bucket: data-proxy
  endpoint: ""
  useSsl: "false"
  existingSecret: ""
## DuckLake catalog, data, and Litestream configuration.
ducklake:
  ## Local path mounted into sync workers and PostgreSQL for catalog files.
  catalogLocalPath: /var/lib/ducklake/catalogs
  ## Local path used by the Litestream writer for its source catalogs.
  catalogWriterPath: /var/lib/ducklake/writer
  ## Single S3 prefix for all DuckLake data: catalogs and Parquet.
  ## Layout: <prefix>/<schema>/catalog.sqlite and <prefix>/<schema>/<table>/*.parquet
  catalogPath: ducklake
  ## Target output file size for DuckLake writes.
  targetFileSize: 512MB
  ## Expire snapshots older than this duration during finalization.
  snapshotExpiration: 7d
  ## Maximum compacted files produced by one maintenance call per table.
  maxCompactedFiles: 10
  ## Rewrite files when this fraction of rows is deleted.
  rewriteDeleteThreshold: 0.95
  ## Litestream configuration for catalog replication.
  litestream:
    ## Shared catalog volume used by writer and reader PVCs.
    storage:
      size: 1Gi
      ## Required RWX StorageClass. Use k3d-rwx locally, filestore-rwx in GKE.
      storageClass: ""
      accessMode: ReadWriteMany
## SeaweedFS object store, deployed as a subchart.
seaweedfs:
  enabled: true
  allInOne:
    enabled: false
  master:
    enabled: true
    replicas: 1
    data:
      type: persistentVolumeClaim
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  volume:
    enabled: true
    replicas: 1
    dataDirs:
      - name: data
        type: persistentVolumeClaim
        size: 40Gi
        maxVolumes: 0
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  filer:
    enabled: true
    replicas: 1
    enablePVC: true
    storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  s3:
    enabled: true
    replicas: 1
    enableAuth: true
    existingConfigSecret: data-proxy-s3
    createBuckets:
      - name: data-proxy
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
## External Redis-compatible cache.
redis:
  existingSecret: data-proxy-redis
  readKey: REDIS_READ
  writeKey: REDIS_WRITE
  passwordKey: REDIS_PASSWORD
  writerAddress: redis-writer:6379
  webdisHost: redis-writer
  webdisPort: 6379
  webdisReadHost: redis-reader
  webdisReadPort: 6379
## Maintenance jobs: backup and maintenance.
jobs:
  ## Shared image for maintenance jobs.
  image: ghcr.io/prefeitura-rio/data-proxy-jobs:0da190f
  ## Backup CronJob: exports access_policy, access_log, and restored catalogs.
  backup:
    enabled: false
    schedule: 0 3 * * *
    startingDeadlineSeconds: 600
    activeDeadlineSeconds: 1800
    ttlSecondsAfterFinished: 300
    prefix: backups
    s3:
      endpointURL: ""
      bucket: ""
      existingSecret: ""
    accessLog:
      retentionDays: 90
  ## Stale-object cleanup and DuckLake maintenance CronJob.
  maintenance:
    enabled: true
    schedule: 0 4 * * *
    startingDeadlineSeconds: 600
## Role names, JWT claim, and schema configuration for row-level security.
auth:
  anonRole: anon
  userRole: user
  authenticatorRole: postgrest
  existingSecret: ""
  jwtRoleClaim: $.role
  rlsSchema: rls
## CloudNativePG manages one PostgreSQL cluster.
cnpg:
  duckdb:
    maxMemory: 2048MB
    ## DuckDB threads per PostgreSQL backend. Defaults to 4; set higher for more parallelism.
    threads: 4
  postgresql:
    parameters: {}
    ## Optional CNPG synchronous replication, for example {method: any, number: 1, dataDurability: preferred}.
    ## CNPG rejects it while the cluster has one instance, so set it after the HA cluster has scaled up.
    ## With it, access_policy writes wait for a standby to apply them and other commits do not wait.
    synchronous: {}
  ## CNPG Poolers have no scale selector, so KEDA cannot scale them. Each Pooler runs one pod.
  pooler:
    poolSize: 50
    maxClientConns: 200
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  db:
    name: data-proxy
    user: admin
  existingSecret: ""
  ## PostgreSQL instances in single mode. In HA mode cnpg.autoscaling owns the count.
  instances: 1
  ## HA mode only. The floor is at least 2 (a primary and one standby).
  ## Default trigger: active PostgREST sessions per instance, derived from the CPU limit and the DuckDB threads.
  autoscaling:
    minReplicaCount: 2
    maxReplicaCount: 6
    pollingInterval: 30
    cooldownPeriod: 300
    triggers: []
  resources:
    requests:
      cpu: 4
      memory: 1Gi
    limits:
      cpu: "8"
      memory: 8Gi
  image: ghcr.io/prefeitura-rio/data-proxy-postgres:17-ff86fc4
  storage:
    size: 20Gi
    storageClass: ""
  ## Barman backup configuration. Backups go to a separate S3-compatible service.
  backup:
    ## Set to true to enable continuous WAL archiving and scheduled backups.
    enabled: false
    ## S3-compatible endpoint URL for Barman. Use a separate service from s3.bucket.
    ## For GCS, set to https://storage.googleapis.com.
    endpointURL: ""
    ## Bucket name for backup data. Use a separate bucket from s3.bucket.
    bucket: ""
    ## Object key prefix for backup data within the bucket.
    destinationPath: ""
    ## Existing Secret with S3_ACCESS_KEY and S3_SECRET_KEY for the backup service.
    ## Must be separate from the main S3 secret when backup uses a different service.
    existingSecret: ""
    ## Cron expression for scheduled full backups.
    schedule: 0 5 * * *
    ## Number of retries for a failed backup.
    backupRetention: 7
## Pushgateway for metrics push from short-lived worker pods.
pushgateway:
  enabled: true
  url: ""
## Istio VirtualService for exposing PostgREST through the Istio ingress gateway.
ingress:
  sidecarInject: true
  enabled: false
  gateway: istio-system/istio-gateway
  host: ""
  timeout: ""
  retries:
    attempts: 0
    perTryTimeout: ""
    retryOn: ""
  auth:
    enabled: false
    issuer: ""
    jwksUri: ""
    audience: ""
## Caching proxy in front of PostgREST.
proxy:
  cacheTtl: 300
  fetchBufferSize: 32m
  fetchTimeout: 120s
  largeClientHeaderBuffers: 4 64k
  fetchKeepalive: 32
  fetchKeepaliveTimeout: 60s
  cacheRedisDb: 1
  maxCacheBodyBytes: 262144
  image: ghcr.io/prefeitura-rio/data-proxy-proxy:556f3ba
  webdisImage: docker.io/nicolas/webdis:0.1.25
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
  webdisResources:
    requests:
      cpu: 10m
      memory: 32Mi
  autoscaling:
    minReplicaCount: 1
    maxReplicaCount: 3
    pollingInterval: 30
    cooldownPeriod: 300
    triggers: []
