## DBOS sync service: runs the scheduled sync workflow, BigQuery extraction,
## and DuckLake publication. Scaled by KEDA on the DBOS workflow queue.
sync:
  ## Number of sync worker replicas before KEDA scaling. KEDA manages this after startup.
  replicas: 1
  ## Container image for the DBOS sync workers.
  image: ghcr.io/prefeitura-rio/data-proxy-sync:d452d6c
  imagePullPolicy: IfNotPresent
  ## Mount the local manifests sync-trigger ConfigMap in sync workers.
  trigger:
    enabled: false
    configMap: manifests-sync-trigger-script
  ## Cron expression for the DBOS sync schedule. Only the first value: the console API changes it later.
  ## Default: daily at 02:00 UTC.
  schedule: 0 2 * * *
  ## Maximum wall-clock time for one DBOS sync workflow.
  workflowTimeoutSeconds: 3600
  ## Maximum concurrent run_sync workflows across all workers.
  ## One at a time prevents overlapping sync runs.
  queueConcurrency: 1
  ## Maximum DBOS step retry attempts for one dump task.
  dumpStepMaxAttempts: 3
  ## Maximum attempts for safe transient DBOS steps.
  stepMaxAttempts: 3
  ## Maximum dump tasks enqueued per 60 seconds.
  dumpQueueRateLimit: 0
  ## Per-process concurrency for the DBOS dump queue. Small batches fit in the memory of a pod, and KEDA adds pods
  ## when more dumps wait. This is the first value: the queue keeps the value that it stored on its first start.
  dumpQueueWorkerConcurrency: 2
  ## The limits of each DuckDB connection of a sync worker. Without them, one connection takes 80% of the memory
  ## of the pod and every thread of the node, and the connections of a pod together fill the pod. The memory limit
  ## times (dumpQueueWorkerConcurrency + 2) must stay below resources.limits.memory. DuckDB spills to the disk
  ## beyond the memory limit.
  duckdb:
    memoryLimit: 1GB
    threads: 2
  ## Recovery of DBOS workflows owned by terminated sync pods.
  recovery:
    enabled: true
    intervalSeconds: 30
    graceSeconds: 120
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  ## Resource requests and limits for each sync worker pod.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 6Gi
  ## KEDA autoscaling for the sync Deployment.
  autoscaling:
    ## Interval in seconds between KEDA metric checks.
    pollingInterval: 30
    ## Cooldown in seconds before scaling down to idle.
    cooldownPeriod: 60
    ## Minimum replicas. KEDA never scales below this, so one orchestrator always runs.
    ## Do not set idleReplicaCount: KEDA supports only 0, and other values fight the HPA.
    minReplicaCount: 3
    ## Maximum number of concurrent sync pods.
    maxReplicaCount: 15
    ## Postgres trigger query counting DBOS queued/running workflows.
    query: SELECT ceil(COUNT(*)::decimal / 16) FROM dbos.workflow_status WHERE application_name = 'data-proxy-sync' AND status IN ('PENDING', 'ENQUEUED', 'DELAYED', 'RUNNING');
    ## Target value for the query result.
    targetQueryValue: "1.1"
    ## Query value above which KEDA scales above the minimum replicas.
    activationTargetQueryValue: "5"
  ## DBOS application and system database configuration.
  dbos:
    applicationName: data-proxy-sync
    applicationVersion: 0.1.0
    systemSchema: dbos
    appSchema: data_proxy
  ## The first sync configuration. The provision job imports it once, when the configuration
  ## tables of the console are empty. Editors own the configuration afterward, so a change here
  ## has no effect on a database that already has schemas. See docs/sync.md for the field reference.
  config:
    ## Map of PostgreSQL schemas. Each key is a schema name. Each value holds the
    ## schema's identity claim and its list of tables.
    schemas: {}
## Kubernetes ServiceAccount for the sync pods.
## Attach a Workload Identity annotation here to allow BigQuery access without
## a service account key file.
serviceAccount:
  ## Set to true to create a ServiceAccount. Set to false to use an existing one.
  create: true
  ## Name of the ServiceAccount. The chart uses this name for all sync pods.
  name: data-proxy
  ## Annotations to add to the ServiceAccount. Use this field for Workload Identity.
  ## Example: iam.gke.io/gcp-service-account: dataproxy@project.iam.gserviceaccount.com
  annotations: {}
## PostgREST read API. One workload serves all schemas.
postgrest:
  ## PostgREST container image.
  image: postgrest/postgrest:v16.1
  ## External URL that PostgREST uses in the OpenAPI specification.
  proxyUri: ""
  ## JWKS URI for JWT validation. PostgREST fetches and caches the public keys at startup.
  jwksUri: ""
  ## Symmetric JWT secret (HS256). When set, overrides JWKS validation.
  jwtSecret: ""
  ## Maximum number of rows PostgREST will return per request.
  maxRows: 1000
  ## Maximum backend connections held by each PostgREST replica.
  dbPool: 24
  ## Seconds that a stopping PostgREST pod waits before it closes its port. The mesh needs this time to stop sending it requests.
  preStopSleepSeconds: 5
  ## Prometheus metrics of PostgREST, from its admin server: pool size, waiting requests, and pool timeouts.
  metrics:
    enabled: true
    port: 3001
  ## Seconds to wait for a backend connection before returning an error.
  dbPoolAcquisitionTimeout: 3
  ## Seconds to keep an idle backend connection before closing it.
  dbPoolMaxIdleTime: 300
  ## Enable avg(), count(), max(), min(), and sum() in PostgREST select queries.
  aggregatesEnabled: true
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 512Mi
  autoscaling:
    minReplicaCount: 1
    maxReplicaCount: 6
    pollingInterval: 30
    cooldownPeriod: 300
    triggers: []
## PgDog sits between PostgREST and PostgreSQL. It sends read-only transactions to a standby and every other
## transaction to the primary. It pools transactions, so many PostgREST connections share a few backends.
pgdog:
  image: ghcr.io/pgdogdev/pgdog:0.1.61
  ## A fixed number of pods, for availability. One pod serves far more than PostgREST sends (about 20000
  ## queries a second against 1200 for one PostgREST pod), and each extra pod opens its own pools.
  replicas: 2
  ## Server connections that one pod opens to the primary, and as many to the standbys.
  ## One PostgREST pod opens postgrest.dbPool connections, so more would sit idle. replicas x poolSize
  ## must stay well below max_connections of PostgreSQL, because the primary also serves the sync workers.
  poolSize: 24
  resources:
    requests:
      cpu: 500m
      memory: 96Mi
    limits:
      cpu: "1"
      memory: 256Mi
## Rendered OpenAPI documentation page for PostgREST, reachable at <ingress.host>/docs.
swaggerUi:
  enabled: false
  image: swaggerapi/swagger-ui:v5.18.2
## OpenTelemetry configuration for worker logs.
observability:
  otlpLogsEndpoint: ""
  otlpTracesEndpoint: ""
  otlpMetricsEndpoint: ""
## GCP credentials for BigQuery access.
## In GKE, use Workload Identity via serviceAccount.annotations.
## Locally, mount a Secret or ConfigMap containing key.json.
gcp:
  ## Existing Secret with a key.json file. When set, it is mounted at mountPath in sync and PostgreSQL pods.
  existingSecret: ""
  ## Path where the key file is mounted inside sync and PostgreSQL pods.
  mountPath: /gcp/key.json
## S3-compatible object store that holds the Parquet files and DuckLake data.
s3:
  bucket: data-proxy
  endpoint: ""
  useSsl: "false"
  existingSecret: ""
  ## The folder of the scratch Parquet files in the bucket. The sync worker deletes everything under it when a run ends,
  ## so each install that shares a bucket needs its own prefix.
  scratchPrefix: tmp
  bootstrap:
    createIfMissing: false
    ## The origins that the CORS rule of the bucket allows, for the notebooks. The bootstrap Job sets the rule through the
    ## S3 API with the credential of the chart. It needs the permission to change the bucket. An empty list leaves the rule alone.
    ## GCS has its own command for this, so the Job skips it for a GCS endpoint.
    corsOrigins: []
    timeout: 30min
    retry: 5sec
## DuckLake data and maintenance configuration. The catalogs live in the
## `ducklake` database of the CloudNativePG cluster, one metadata schema per sync schema.
ducklake:
  ## Single S3 prefix for all DuckLake data: <prefix>/<schema>/<table>/*.parquet
  catalogPath: ducklake
  ## Target output file size for DuckLake writes.
  targetFileSize: 512MB
  ## Expire snapshots older than this duration after each publication.
  snapshotExpiration: 7d
  ## Maximum compacted files produced by one maintenance call per table.
  maxCompactedFiles: 10
  ## Rewrite files when this fraction of rows is deleted.
  rewriteDeleteThreshold: 0.95
  ## Password of the duckdb role, the read-only login that pg_duckdb uses for the catalog.
  ## Empty: generated once and kept on upgrades.
  duckdbPassword: ""
  ## Small volume that holds the persistent DuckDB secrets (S3 credentials), shared by every PostgreSQL Pod.
  secrets:
    storage:
      size: 1Gi
      ## RWX StorageClass for the DuckDB secrets. Set it to serve data, because the console adds
      ## schemas after the install. Use k3d-rwx locally, filestore-rwx in GKE.
      storageClass: ""
      accessMode: ReadWriteMany
## SeaweedFS object store, deployed as a subchart.
seaweedfs:
  enabled: true
  allInOne:
    enabled: false
  master:
    enabled: true
    replicas: 1
    data:
      type: persistentVolumeClaim
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  volume:
    enabled: true
    replicas: 1
    dataDirs:
      - name: data
        type: persistentVolumeClaim
        size: 40Gi
        maxVolumes: 0
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  filer:
    enabled: true
    replicas: 1
    enablePVC: true
    storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  s3:
    enabled: true
    replicas: 1
    enableAuth: true
    existingConfigSecret: data-proxy-s3
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
## External Redis-compatible cache.
redis:
  existingSecret: data-proxy-redis
  ## Required. The one Redis endpoint that the proxy uses for its cache.
  host: ""
  port: 6379
  readKey: REDIS_READ
  writeKey: REDIS_WRITE
  passwordKey: REDIS_PASSWORD
  writerAddress: redis-writer:6379
  writerHost: redis-writer
  writerPort: 6379
  readerHost: redis-reader
  readerPort: 6379
## Maintenance jobs: backup and maintenance.
jobs:
  ## Shared image for maintenance jobs.
  image: ghcr.io/prefeitura-rio/data-proxy-jobs:d452d6c
  ## Provision template: a suspended CronJob that never runs on a clock. A Job is made from it when an
  ## editor adds or removes a schema, and at the start of every sync run. It creates each schema and its
  ## access policy, serves the list, and removes what the console dropped.
  provision:
    activeDeadlineSeconds: 300
  ## Backup CronJob: exports access_policy, access_log, and restored catalogs.
  backup:
    enabled: false
    schedule: 0 3 * * *
    startingDeadlineSeconds: 600
    activeDeadlineSeconds: 1800
    ttlSecondsAfterFinished: 300
    prefix: backups
    s3:
      endpointURL: ""
      bucket: ""
      existingSecret: ""
    accessLog:
      retentionDays: 90
  ## Stale PostgreSQL object cleanup CronJob.
  maintenance:
    enabled: true
    schedule: 0 4 * * *
    startingDeadlineSeconds: 600
    ## The job deletes the DBOS workflows that finished more than this many days ago.
    workflowRetentionDays: 90
## Role names, JWT claim, and schema configuration for row-level security.
auth:
  anonRole: anon
  ## The baseline role: every dp_* role of rbac.toml is a member of it, so one set of grants serves them all.
  userRole: dp_api
  ## The login of the serving path: PostgREST, the PgDog pool and the recovery Deployment. It has no rights of its own and only switches into the request roles.
  servingRole: serving
  ## The login that the console uses to read the catalog. It has no rights of its own. Each schema has a reader role that it switches into, and that role reads the metadata of that schema only.
  signerRole: console_signer
  existingSecret: ""
  jwtRoleClaim: $.role
## CloudNativePG manages one PostgreSQL cluster.
cnpg:
  duckdb:
    ## Keep per-backend DuckDB memory bounded because several PostgREST backends can run at once.
    maxMemory: 1GB
    ## DuckDB threads per PostgreSQL backend. Two threads leave room for concurrent backends.
    threads: 2
  postgresql:
    parameters: {}
    ## Optional CNPG synchronous replication, for example {method: any, number: 1, dataDurability: preferred}.
    ## CNPG rejects it while the cluster has one instance, so set it after the cluster has scaled up.
    ## With it, access_policy writes wait for a standby to apply them and other commits do not wait.
    synchronous: {}
  db:
    name: data-proxy
    user: ops
  existingSecret: ""
  ## A standby that replays more bytes behind the primary than this leaves the read Service until it catches up.
  maxReplicaLag: 16Mi
  ## How CNPG updates the primary after a change of the pod: switchover moves the primary to a standby first.
  ## A restart of the only primary leaves the standbys unready, because their readiness probe needs streaming.
  primaryUpdateMethod: switchover
  ## The cluster always has a primary and at least one standby, and KEDA adds standbys under load.
  ## The floor is at least 2.
  ## Default trigger: active PostgREST sessions per instance, derived from the CPU limit and the DuckDB threads.
  autoscaling:
    minReplicaCount: 2
    maxReplicaCount: 6
    pollingInterval: 30
    cooldownPeriod: 300
    triggers: []
  resources:
    requests:
      cpu: 4
      memory: 1Gi
    limits:
      cpu: "8"
      memory: 8Gi
  image: ghcr.io/prefeitura-rio/data-proxy-postgres:17-d452d6c
  storage:
    size: 20Gi
    storageClass: ""
  ## Continuous WAL archiving and scheduled base backups through the Barman Cloud plugin of CloudNativePG.
  ## The plugin must run in the cluster. A replica that falls behind catches up from the archive.
  backup:
    enabled: false
    ## S3-compatible endpoint of the backup storage. For GCS, use https://storage.googleapis.com.
    endpointURL: ""
    ## Bucket of the backups. It can be the bucket of the data, with its own prefix.
    bucket: ""
    ## Prefix of the backups in the bucket.
    destinationPath: ""
    ## Secret with the keys S3_ACCESS_KEY and S3_SECRET_KEY of the storage.
    existingSecret: ""
    ## Schedule of the base backups. It has six fields, because the first one is the seconds.
    schedule: 0 0 5 * * *
    ## The plugin deletes the backups and the WAL files that are older than this.
    retention: 30d
## The web console. It signs in people with OIDC, calls PostgREST with their token, and runs the query tab.
console:
  enabled: false
  image: ghcr.io/prefeitura-rio/data-proxy-console:d452d6c
  imagePullPolicy: IfNotPresent
  ## One replica is enough. The server keeps no state, so more replicas also work.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  ## The console answers on the /console path of ingress.host, so its origin is the origin of the API.
  oidc:
    ## The issuer of the identity provider.
    issuer: ""
    ## A confidential client with the redirect URI <scheme>://<host>/auth/callback.
    clientId: data-proxy-console-web
    clientSecret: ""
    ## A Secret with the keys OIDC_CLIENT_SECRET and COOKIE_SECRET. The chart makes one when this is empty.
    existingSecret: ""
  ## The storage that the signed links of the query tab point to. The browser must reach this endpoint.
  storage:
    endpoint: ""
    region: us-east-1
    ## A Secret with the keys accessKey and secretKey of a read-only credential. The chart uses its own read-only credential when this is empty.
    existingSecret: ""
    ## Make one identity in the storage for each schema, limited to the folder of that schema. The console makes it on the first
    ## query of the schema, through the IAM API of the storage, with an admin credential. SeaweedFS needs the server flag
    ## -s3.iam.readOnly=false (seaweedfs.allInOne.extraArgs). Without this, every schema signs with the read-only credential.
    perSchemaIdentities: false
    ## A Secret with the keys accessKey and secretKey of an admin credential. The chart uses the admin credential of its S3 secret when this is empty.
    adminSecret: ""
    ## The IAM endpoint of the storage. The storage endpoint above by default.
    iamEndpoint: ""
## The static site of the notebooks. It runs on its own origin, so a notebook never shares cookies with the console.
## It uses the image of the console, with another command.
notebooks:
  enabled: false
  ## The notebooks keep their own host, so a notebook never shares an origin with the console.
  host: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
## Istio VirtualService for exposing PostgREST through the Istio ingress gateway.
ingress:
  sidecarInject: true
  enabled: false
  gateway: istio-system/istio-gateway
  host: ""
  ## The scheme of the public addresses: the API, the console and the notebooks.
  scheme: https
  timeout: ""
  retries:
    attempts: 0
    perTryTimeout: ""
    retryOn: ""
  auth:
    enabled: false
    issuer: ""
    jwksUri: ""
    audience: ""
## Caching proxy in front of PostgREST.
proxy:
  cacheTtl: 300
  ## The proxy asks PostgREST for its table settings at start, and again when the sync workers send
  ## a reload request after a change. It also asks every configRefreshSeconds, in case a request got lost.
  configRefreshSeconds: 60
  largeClientHeaderBuffers: 4 64k
  cacheRedisDb: 1
  maxCacheBodyBytes: 262144
  ## Most requests that wait for PostgREST at the same time in one proxy pod. More get a 503 with Retry-After at once. 0 means no limit.
  maxInflight: 32
  image: ghcr.io/prefeitura-rio/data-proxy-proxy:d452d6c
  resources:
    requests:
      ## A large request keeps the CPU share of the proxy high when a node is busy with PostgreSQL.
      cpu: 500m
      memory: 64Mi
  autoscaling:
    minReplicaCount: 1
    maxReplicaCount: 3
    pollingInterval: 30
    cooldownPeriod: 300
    triggers: []
