## PostgreSQL client image for the pre-upgrade database reconciliation Job.
migration:
  image: postgres:17-alpine

## Container image for the producer, worker, and finalizer services.
image:
  ## Registry path for the data-proxy image, without the tag.
  repository: ghcr.io/prefeitura-rio/data-proxy
  ## Immutable application image version.
  tag: "1.0.0"
  ## Image pull policy. Use Always when the tag is mutable (for example, latest).
  pullPolicy: IfNotPresent

## Kubernetes ServiceAccount for the pipeline pods.
## Attach a Workload Identity annotation here to allow BigQuery access without
## a service account key file.
serviceAccount:
  ## Set to true to create a ServiceAccount. Set to false to use an existing one.
  create: true
  ## Name of the ServiceAccount. The chart uses this name for all pipeline pods.
  name: data-proxy
  ## Annotations to add to the ServiceAccount. Use this field for Workload Identity.
  ## Example: iam.gke.io/gcp-service-account: dataproxy@project.iam.gserviceaccount.com
  annotations: {}

## Configuration for the pgduckdb StatefulSet (PostgreSQL with the pg_duckdb extension).
pgduckdb:
  ## pgduckdb container image with PostGIS support.
  image: ghcr.io/prefeitura-rio/data-proxy-pgduckdb:1.0.0
  storage:
    ## Size of the PersistentVolumeClaim that stores PostgreSQL data.
    size: 10Gi
    ## StorageClass for the PersistentVolumeClaim. Leave empty to use the cluster default.
    storageClass: ""
    claimNamePrefix: ""
  db:
    ## Name of the PostgreSQL database that the pipeline writes to.
    name: dataproxy
    ## PostgreSQL superuser name used by the pipeline services to connect.
    user: dataproxy
  ## Name of an existing Secret to use instead of creating one.
  ## The Secret must contain POSTGRES_PASSWORD and PGRST_AUTHENTICATOR_PASSWORD.
  existingSecret: ""
  ## Password for the PostgreSQL superuser. Required when existingSecret is empty.
  password: ""
  ## Password for the PostgREST authenticator role. Required when existingSecret is empty.
  authenticatorPassword: ""

## Configuration for the PostgREST REST API service.
postgrest:
  ## PostgREST container image.
  image: postgrest/postgrest:v16.1
  ## Number of PostgREST Deployment replicas.
  replicas: 1
  ## External URL that PostgREST uses in the OpenAPI specification.
  ## Set this to the public URL of the API gateway in front of PostgREST.
  proxyUri: ""
  ## JWKS URI for JWT validation. PostgREST fetches and caches the public keys at startup.
  jwksUri: ""
  ## Maximum number of rows PostgREST will return per request.
  ## Requests without an explicit limit are capped at this value.
  maxRows: 1000
  ## Enable avg(), count(), max(), min(), and sum() in PostgREST select queries.
  ## Aggregates can be expensive. Limit access with row-level security and indexes.
  aggregatesEnabled: true
  ## PostgreSQL client image for database reconciliation before PostgREST starts.
  dbMigrate:
    image: postgres:17-alpine
  ## Init container that fetches and validates the JWKS before PostgREST starts.
  jwksFetch:
    ## Alpine image used by the JWKS init container.
    image: alpine:3.24.1
    ## Exact Alpine curl package version installed at startup.
    curlVersion: 8.21.0-r0
    ## Exact Alpine jq package version installed at startup.
    jqVersion: 1.8.1-r0

## Rendered OpenAPI documentation page for PostgREST, reachable at <ingress.host>/docs.
## Requires ingress.enabled to be true. Follows ingress.auth: when ingress.auth.enabled
## is also true, the page needs the same valid JWT and audience as PostgREST itself.
swaggerUi:
  ## Set to true to deploy the Swagger UI page.
  enabled: false
  ## Swagger UI container image.
  image: swaggerapi/swagger-ui:v5.18.2

## Google Cloud Storage credentials for DuckDB S3-compatible access.
## The pipeline uses HMAC keys (not a service account) for GCS access.
## Use Workload Identity (via the ServiceAccount annotation) for BigQuery access.
gcs:
  ## Name of the GCS bucket that stores Parquet files.
  bucket: ""
  ## GCS endpoint host and port. Leave empty to use real GCS (storage.googleapis.com).
  ## Set to host:port for a local S3-compatible server such as MinIO.
  endpoint: ""
  ## Set to true when you connect to real GCS. Set to false for local MinIO.
  useSsl: "true"
  ## Name of an existing Secret to use instead of creating one.
  ## The Secret must contain GCS_KEY_ID and GCS_SECRET_KEY.
  existingSecret: ""
  ## HMAC key ID for GCS access. Required when existingSecret is empty.
  keyId: ""
  ## HMAC secret key for GCS access. Required when existingSecret is empty.
  secretKey: ""

## Valkey (Redis-compatible) in-cluster message broker for the sync task queue.
## Valkey is deployed as a subchart. The pipeline reads from and writes to Valkey streams.
valkey:
  ## Set to true to deploy Valkey inside the cluster. Required for KEDA stream triggers.
  enabled: true
  ## Deployment architecture. Use standalone for a single-node instance.
  architecture: standalone
  auth:
    ## Set to true to require password authentication for all Valkey connections.
    enabled: true
    ## Name of an existing Secret to use instead of creating one.
    ## The Secret must contain REDIS_PASSWORD and REDIS_URL.
    ## Leave empty to let the chart create the Secret from the password field.
    existingSecret: ""
    ## Key in the existing Secret that holds the Valkey password.
    existingSecretKey: password
    ## Password for Valkey authentication. Required when existingSecret is empty.
    password: ""

## Producer CronJob — runs once per schedule, publishes sync tasks to Valkey, then exits.
producer:
  ## Cron expression that controls when the producer runs.
  ## Default: daily at 02:00 UTC.
  schedule: "0 2 * * *"
  ## Maximum delay in seconds allowed for a missed schedule before Kubernetes skips it.
  startingDeadlineSeconds: 600
  ## Maximum wall-clock time the producer Job may run before Kubernetes terminates it.
  activeDeadlineSeconds: 3600
  ## Time in seconds after a finished Job before Kubernetes deletes the Job object.
  ttlSecondsAfterFinished: 300

## Backup CronJob — dumps rls.access_policy and only rls.access_policy, encrypts it
## client-side before it leaves the pod, then uploads it to the GCS bucket above.
## Every other table is rebuildable by rerunning a sync; access_policy is not.
backup:
  ## Set to true to deploy the backup CronJob.
  enabled: false
  ## Alpine-based image with pg_dump matching the duckdb image's PostgreSQL major
  ## version. age and aws-cli are installed at container startup via apk, the same
  ## pattern postgrest.jwksFetch uses.
  image: postgres:17-alpine
  ## Cron expression that controls when the backup runs.
  ## Default: daily at 03:00 UTC, after the producer.
  schedule: "0 3 * * *"
  ## Maximum delay in seconds allowed for a missed schedule before Kubernetes skips it.
  startingDeadlineSeconds: 600
  ## Maximum wall-clock time the backup Job may run before Kubernetes terminates it.
  activeDeadlineSeconds: 1800
  ## Time in seconds after a finished Job before Kubernetes deletes the Job object.
  ttlSecondsAfterFinished: 300
  ## age public key (recipient) used to encrypt the dump. Required when backup.enabled is true.
  ## Generate a keypair with `age-keygen`; only the public key belongs here. Keep the
  ## private key outside the cluster — it is the only way to decrypt a backup.
  ageRecipient: ""
  ## GCS object key prefix for uploaded backups, under the bucket configured in gcs.bucket.
  prefix: backups/access_policy
  ## Name of an existing Secret to use instead of creating one.
  ## The Secret must contain BACKUP_PASSWORD.
  existingSecret: ""
  ## Password for the read-only backup role. Required when existingSecret is empty.
  password: ""

## Worker ScaledJob — KEDA creates one Job pod per pending message on dp:sync:tasks.
## Pods scale to zero when the stream is empty.
worker:
  ## Time in milliseconds before a worker can reclaim a pending task.
  visibilityTimeoutMs: 900000
  keda:
    ## Number of unread stream messages that triggers one additional worker Job.
    lagCount: "1"
    ## Number of delivered-but-unacknowledged messages that keeps a worker Job
    ## alive. lagCount alone reaches 0 as soon as the last message is
    ## delivered, before it is actually processed, so this second trigger
    ## prevents KEDA from terminating a Job still finishing its last task.
    pendingEntriesCount: "1"
    ## Maximum number of concurrent worker Job pods.
    maxReplicaCount: 10
    ## Maximum wall-clock time a single worker Job may run before termination.
    activeDeadlineSeconds: 3600
    ## Interval in seconds between KEDA metric checks.
    pollingInterval: 30

## Finalizer ScaledJob — KEDA creates one Job pod per pending message on dp:sync:finalize.
## Only one finalizer runs at a time (maxReplicaCount: 1) because it writes all data.
finalizer:
  ## Time in milliseconds before a finalizer can reclaim a pending message.
  visibilityTimeoutMs: 900000
  keda:
    ## Number of delivered-but-unacknowledged messages that keeps the
    ## finalizer Job alive, for the same reason as worker.keda.pendingEntriesCount.
    pendingEntriesCount: "1"
    ## Maximum wall-clock time a single finalizer Job may run before termination.
    activeDeadlineSeconds: 7200
    ## Interval in seconds between KEDA metric checks.
    pollingInterval: 30

## Sync configuration rendered as sync.json and mounted into each pipeline container.
## See docs/sync.md for the full field reference.
syncConfig:
  ## Map of PostgreSQL schemas. Each key is a schema name. Each value holds the
  ## schema's identity claim and its list of tables. See docs/sync.md.
  schemas: {}

## Role names, JWT claim, and schema configuration for row-level security.
## These values are rendered into the db-init ConfigMap and the PostgREST Deployment.
auth:
  ## PostgreSQL role used for unauthenticated requests. This role has no application table access.
  ## PostgREST uses this role as PGRST_DB_ANON_ROLE.
  anonRole: anon
  ## PostgreSQL role used for authenticated requests. This role receives application table access.
  userRole: user
  ## PostgreSQL login role that PostgREST and PgBouncer use to connect.
  ## PostgREST uses this role in PGRST_DB_URI.
  authenticatorRole: authenticator
  ## PostgREST JSPath expression that selects the database role from JWT claims. A
  ## token may also resolve to policy_writer_<schema>, created per configured
  ## schema, to write rls.access_policy for that schema only.
  jwtRoleClaim: $.role
  ## PostgreSQL schema that contains the pre_request function and rls.access_policy.
  rlsSchema: rls

## High-availability configuration: Patroni (3-node cluster) and PgBouncer (rw and ro pools).
## Set ha.enabled to true to activate HA mode.
## When ha.enabled is false, the chart deploys a single-node pgduckdb StatefulSet.
ha:
  ## Set to true to enable Patroni and PgBouncer. Set to false for standalone mode.
  enabled: false
  patroni:
    ## Container image that includes both pg_duckdb and Patroni.
    ## Build this image from Dockerfile.patroni and push it before you enable HA.
    image: ghcr.io/prefeitura-rio/data-proxy-patroni:1.0.0
    ## Number of Patroni pod replicas. The minimum for a stable cluster is 3.
    replicas: 3
    ## Maximum number of WAL sender processes on the leader.
    ## Increase this value if you add more replicas.
    maxWalSenders: 10
    ## Amount of WAL data the leader retains for streaming replication.
    ## Increase this value if replicas have slow or intermittent connectivity.
    walKeepSize: 1GB
    ## Name of the PostgreSQL role used for streaming replication.
    replicationUsername: replicator
    ## Password for the replication role. Required when ha.enabled is true.
    replicationPassword: ""
  pgbouncer:
    ## PgBouncer container image.
    image: pgbouncer/pgbouncer:1.23.1
    ## Write pool — routes connections to the Patroni leader.
    ## The finalizer service uses this pool to write data.
    rw:
      ## Number of PgBouncer write-pool replicas.
      replicas: 1
      ## Maximum number of client connections to the write pool.
      maxClientConn: 100
      ## Number of server connections the write pool maintains per database.
      defaultPoolSize: 10
    ## Read pool — routes connections to Patroni replicas.
    ## PostgREST uses this pool to serve read requests.
    ro:
      ## Number of PgBouncer read-pool replicas.
      replicas: 1
      ## Maximum number of client connections to the read pool.
      maxClientConn: 200
      ## Number of server connections the read pool maintains per database.
      defaultPoolSize: 20

## Resource requests and limits applied to all containers.
## Leave empty to use no limits. See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
resources: {}

## Istio VirtualService for exposing PostgREST through the Istio ingress gateway.
## No VirtualService is created when enabled is false.
ingress:
  ## Set to true to create an Istio VirtualService for PostgREST.
  enabled: false
  ## Gateway reference in namespace/name format.
  gateway: "istio-system/istio-gateway"
  ## External hostname the VirtualService matches. Required when enabled is true.
  host: ""
  ## Request timeout for the PostgREST route. Leave empty for no timeout.
  ## Example: "60s"
  timeout: ""
  ## Retry policy for the PostgREST route. Set attempts to 0 to disable.
  retries:
    ## Number of retry attempts. Set to 0 to disable.
    attempts: 0
    ## Timeout per retry attempt. Leave empty to inherit the route timeout.
    perTryTimeout: ""
    ## Comma-separated Istio retry conditions.
    ## Example: "503,reset,connect-failure"
    retryOn: ""
  ## Istio JWT authentication and authorization for the PostgREST workload.
  auth:
    ## Set to true to deploy RequestAuthentication and AuthorizationPolicy.
    ## Requires ingress.enabled to be true.
    enabled: false
    ## JWT issuer identifier (the iss claim value). Required when auth.enabled is true.
    issuer: ""
    ## JWKS URI for JWT validation. Required when auth.enabled is true.
    jwksUri: ""
    ## Required JWT audience (aud claim). Every client that should reach the API must carry this
    ## audience, typically via a shared identity-provider client scope — see docs/security.md.
    ## Leave empty to accept any valid JWT principal regardless of audience.
    audience: ""
