## PostgreSQL client image for the pre-upgrade database reconciliation Job.
migration:
  image: postgres:17-alpine
## Container image for the producer, Dumper, Seeder, and Publisher services.
image:
  ## Registry path for the data-proxy image, without the tag.
  repository: ghcr.io/prefeitura-rio/data-proxy
  ## Immutable application image version.
  tag: "738c8b5"
  ## Image pull policy. Use Always when the tag is mutable (for example, latest).
  pullPolicy: IfNotPresent
## Kubernetes ServiceAccount for the pipeline pods.
## Attach a Workload Identity annotation here to allow BigQuery access without
## a service account key file.
serviceAccount:
  ## Set to true to create a ServiceAccount. Set to false to use an existing one.
  create: true
  ## Name of the ServiceAccount. The chart uses this name for all pipeline pods.
  name: data-proxy
  ## Annotations to add to the ServiceAccount. Use this field for Workload Identity.
  ## Example: iam.gke.io/gcp-service-account: dataproxy@project.iam.gserviceaccount.com
  annotations: {}
## Configuration for the PostgreSQL database with pg_duckdb, PostGIS, and pg_partman.
## CNPG manages the PostgreSQL clusters. This section configures the database
## name, credentials, and init image used by the chart.
postgres:
  ## Database image used by standalone and HA members.
  image: ghcr.io/prefeitura-rio/data-proxy-postgres:030de55
  storage:
    ## Size of the PersistentVolumeClaim that stores PostgreSQL data.
    size: 100Gi
    ## StorageClass for the PersistentVolumeClaim. Leave empty to use the cluster default.
    storageClass: ""
    claimNamePrefix: ""
  db:
    ## Name of the PostgreSQL database that the pipeline writes to.
    name: dataproxy
    ## PostgreSQL superuser name used by the pipeline services to connect.
    user: dataproxy
  ## Nushell image used by the post-install init-db Job.
  init:
    image: ghcr.io/prefeitura-rio/data-proxy-nushell:030de55
  resources:
    requests:
      memory: 512Mi
      ephemeral-storage: 1Gi
    limits:
      memory: 2Gi
      ephemeral-storage: 4Gi
  ## Name of an existing Secret to use instead of creating one.
  ## The Secret must contain POSTGRES_PASSWORD and PGRST_AUTHENTICATOR_PASSWORD.
  existingSecret: ""
  ## Password for the PostgreSQL superuser. Required when existingSecret is empty.
  password: ""
  ## Password for the PostgREST authenticator role. Required when existingSecret is empty.
  authenticatorPassword: ""
## Configuration for the PostgREST REST API service.
postgrest:
  ## PostgREST container image.
  image: postgrest/postgrest:v16.1
  ## Number of PostgREST Deployment replicas.
  replicas: 1
  ## External URL that PostgREST uses in the OpenAPI specification.
  ## Set this to the public URL of the API gateway in front of PostgREST.
  proxyUri: ""
  ## JWKS URI for JWT validation. PostgREST fetches and caches the public keys at startup.
  jwksUri: ""
  ## Symmetric JWT secret (HS256). When set, overrides JWKS validation.
  jwtSecret: ""
  ## Maximum number of rows PostgREST will return per request.
  ## Requests without an explicit limit are capped at this value.
  maxRows: 1000
  ## Enable avg(), count(), max(), min(), and sum() in PostgREST select queries.
  ## Aggregates can be expensive. Limit access with row-level security and indexes.
  aggregatesEnabled: true
  ## PostgreSQL client image for database reconciliation before PostgREST starts.
  dbMigrate:
    image: postgres:17-alpine
  ## Init container that fetches and validates the JWKS before PostgREST starts.
  jwksFetch:
    ## Alpine image used by the JWKS init container.
    image: ghcr.io/prefeitura-rio/data-proxy-nushell:030de55
  ## PgBouncer connection pooler deployed between PostgREST and CNPG.
  pgBouncer:
    ## PgBouncer container image.
    image: pgbouncer/pgbouncer:1.23.1
    ## Number of PgBouncer instances in the CNPG Pooler.
    instances: 2
    ## Transaction pooling mode: each client transaction gets a server connection.
    poolSize: 20
    maxClientConns: 100
## Rendered OpenAPI documentation page for PostgREST, reachable at <ingress.host>/docs.
## Requires ingress.enabled to be true. Follows ingress.auth: when ingress.auth.enabled
## is also true, the page needs the same valid JWT and audience as PostgREST itself.
swaggerUi:
  ## Set to true to deploy the Swagger UI page.
  enabled: false
  ## Swagger UI container image.
  image: swaggerapi/swagger-ui:v5.18.2
  ## Schemas available in the Swagger UI schema profile selector.
  schemas:
    - app_pequenos_cariocas
    - bcadastro
## Google Cloud Platform credentials for BigQuery access.
## In GKE, use Workload Identity via serviceAccount.annotations instead.
## Nushell image with PostgreSQL client, Redis, AWS CLI, and age pre-installed.
## Used by the init-db Job, PostgREST JWKS init container, backup CronJob, and cleanup CronJob.
nushell:
  image: ghcr.io/prefeitura-rio/data-proxy-nushell:030de55
## In minikube, set existingSecret to a Secret containing key.json.
gcp:
  ## Name of an existing Secret with a key.json file for BigQuery access.
  ## Leave empty to use Workload Identity (no key file mounted).
  existingSecret: ""
## S3-compatible object store that holds the Parquet files of one sync run.
## The default configuration points at the SeaweedFS S3 gateway deployed by this
## chart. Set endpoint, bucket and credentials to use an external server instead.
s3:
  ## Name of the bucket that stores Parquet files.
  bucket: data-proxy
  ## S3 endpoint host and port. Leave empty to use the in-chart SeaweedFS gateway.
  endpoint: ""
  ## Set to true when the endpoint answers over HTTPS.
  useSsl: "false"
  ## Name of an existing Secret to use instead of creating one.
  ## The Secret must contain S3_ACCESS_KEY and S3_SECRET_KEY.
  existingSecret: ""
  ## Access key for S3 access. Required when existingSecret is empty.
  accessKey: ""
  ## Secret key for S3 access. Required when existingSecret is empty.
  secretKey: ""
## SeaweedFS object store, deployed as a subchart.
## Master, volume, filer and the S3 gateway run as separate workloads. The
## all-in-one process is not used, so each part can be sized and restarted alone.
seaweedfs:
  ## Set to true to deploy SeaweedFS inside the cluster.
  enabled: true
  ## Run every component in a single process. Kept off on purpose.
  allInOne:
    enabled: false
  ## Metadata and topology service.
  master:
    enabled: true
    replicas: 1
    data:
      type: persistentVolumeClaim
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  ## Stores the Parquet file data.
  volume:
    enabled: true
    replicas: 1
    dataDirs:
      - name: data
        type: persistentVolumeClaim
        size: 10Gi
        maxVolumes: 0
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  ## Directory tree and metadata for the S3 API.
  filer:
    enabled: true
    replicas: 1
    enablePVC: true
    storage: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  ## S3 gateway that speaks the S3 API to the pipeline.
  s3:
    enabled: true
    replicas: 1
    ## Require credentials on every request.
    enableAuth: true
    credentials:
      admin:
        accessKey: ""
        secretKey: ""
    ## Buckets the subchart creates after installation. The name must match s3.bucket.
    createBuckets:
      - name: data-proxy
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
## External Redis-compatible broker and cache.
## The platform chart owns Redis and metrics.
redis:
  ## Existing Secret containing the stable writer and reader URLs.
  ## Required by every deployment.
  existingSecret: data-proxy-redis
  configKey: REDIS
  passwordKey: REDIS_PASSWORD
  ## Host and port used by KEDA Redis Streams triggers.
  writerAddress: redis-writer:6379
  ## Webdis write endpoint (Redis primary).
  webdisHost: redis-writer
  webdisPort: 6379
  ## Webdis read endpoint (Redis replica). Defaults to webdisHost when unset.
  webdisReadHost: ""
  webdisReadPort: 6379
## Producer CronJob — runs once per schedule, publishes sync tasks to Valkey, then exits.
producer:
  ## Cron expression that controls when the producer runs.
  ## Default: daily at 02:00 UTC.
  schedule: 0 2 * * *
  ## Maximum delay in seconds allowed for a missed schedule before Kubernetes skips it.
  startingDeadlineSeconds: 600
  ## Maximum wall-clock time the producer Job may run before Kubernetes terminates it.
  activeDeadlineSeconds: 3600
  ## Time in seconds between checks for the prior pipeline to complete.
  pollIntervalSeconds: 60
  ## Time in seconds after a finished Job before Kubernetes deletes the Job object.
  ttlSecondsAfterFinished: 300
## Backup CronJob — exports each <schema>.access_policy table, encrypts it
## client-side before it leaves the pod, then uploads it to the S3 bucket above.
## Every other table is rebuildable by rerunning a sync; access_policy is not.
backup:
  ## Set to true to deploy the backup CronJob.
  enabled: false
  ## Alpine-based image with Nushell. PostgreSQL client, age, and aws-cli
  ## are installed at container startup via apk.
  image: ghcr.io/prefeitura-rio/data-proxy-nushell:030de55
  ## Cron expression that controls when the backup runs.
  ## Default: daily at 03:00 UTC, after the producer.
  schedule: 0 3 * * *
  ## Maximum delay in seconds allowed for a missed schedule before Kubernetes skips it.
  startingDeadlineSeconds: 600
  ## Maximum wall-clock time the backup Job may run before Kubernetes terminates it.
  activeDeadlineSeconds: 1800
  ## Time in seconds after a finished Job before Kubernetes deletes the Job object.
  ttlSecondsAfterFinished: 300
  ## age public key (recipient) used to encrypt the dump. Required when backup.enabled is true.
  ## Generate a keypair with `age-keygen`; only the public key belongs here. Keep the
  ## private key outside the cluster — it is the only way to decrypt a backup.
  ageRecipient: ""
  ## S3 object key prefix for uploaded backups, under the bucket configured in s3.bucket.
  prefix: backups/access_policy
  ## Name of an existing Secret to use instead of creating one.
  ## The Secret must contain BACKUP_PASSWORD.
  existingSecret: ""
  ## Password for the read-only backup role. Required when existingSecret is empty.
  password: ""
## Stale table cleanup CronJob — drops PostgreSQL tables that are no longer
## listed in the sync config. System tables (freshness, access_policy) are preserved.
cleanup:
  ## Set to true to deploy the cleanup CronJob.
  enabled: false
  ## Cron expression that controls when the cleanup runs.
  ## Default: daily at 04:00 UTC, after the backup.
  schedule: 0 4 * * *
  ## Maximum delay in seconds allowed for a missed schedule before Kubernetes skips it.
  startingDeadlineSeconds: 600
## Dumper — KEDA-scaled Deployment that loops on the dp:extract stream.
## Scales to zero when the stream is empty.
dumper:
  ## Spread concurrent Dumper pods across nodes when possible.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: dumper
          app.kubernetes.io/instance: data-proxy
          app.kubernetes.io/name: data-proxy
  ## Time in milliseconds before a Dumper can reclaim a pending task. One task
  ## extracts a whole batch, so this must exceed the duration of a batch.
  visibilityTimeoutMs: 3600000
  ## Size in megabytes of uncompressed source data that one extraction batch collects before it
  ## closes. A batch becomes one Parquet file in the bucket.
  batchMegaBytes: 600
  ## Maximum number of partitions in one batch, which bounds a partition set
  ## that never reaches batchMegaBytes (in MB).
  batchMaxPartitions: 256
  ## Local scratch space that a Dumper uses to merge the partitions of a batch.
  scratch:
    ## Directory inside the container that holds the scratch files.
    mountPath: /scratch
    ## Size limit of the emptyDir volume that backs the scratch directory.
    sizeLimit: 4Gi
  ## Grace period in seconds for SIGTERM before Kubernetes force-kills the pod.
  terminationGracePeriodSeconds: 900
  keda:
    ## Number of unread stream messages that triggers one additional Dumper pod.
    lagCount: "1"
    ## Number of delivered-but-unacknowledged messages that keeps a Dumper pod
    ## alive. lagCount alone reaches 0 as soon as the last message is
    ## delivered, before it is actually processed, so this second trigger
    ## prevents KEDA from terminating a pod still finishing its last task.
    pendingEntriesCount: "1"
    ## Maximum number of concurrent Dumper pods.
    maxReplicaCount: 15
    ## Interval in seconds between KEDA metric checks.
    pollingInterval: 30
    ## Cooldown in seconds before scaling down to zero.
    cooldownPeriod: 60
## Publisher — KEDA ScaledJob with one Job for each schema plan.
publisher:
  ## Time in milliseconds before a publisher can reclaim a pending message.
  visibilityTimeoutMs: "7200000"
  ## Grace period in seconds for SIGTERM before Kubernetes force-kills the pod.
  terminationGracePeriodSeconds: 1800
  keda:
    ## Maximum publisher Jobs. Leave unset for one Job for each configured schema.
    ## maxReplicaCount: 2
    ## Number of delivered-but-unacknowledged messages that asks KEDA for a Job,
    ## which then reclaims the message after the visibility timeout.
    pendingEntriesCount: "1"
    ## Interval in seconds between KEDA metric checks.
    pollingInterval: 30
    ## Number of completed publisher Jobs that KEDA keeps. Zero removes them.
    successfulJobsHistoryLimit: 0
    ## Number of failed publisher Jobs that KEDA keeps for inspection.
    failedJobsHistoryLimit: 1
## Seeder — KEDA ScaledJob with one Job for each seed task.
seeder:
  visibilityTimeoutMs: 900000
  ## Grace period in seconds for SIGTERM before Kubernetes force-kills the pod.
  terminationGracePeriodSeconds: 900
  keda:
    pendingEntriesCount: "1"
    pollingInterval: 30
    successfulJobsHistoryLimit: 0
    failedJobsHistoryLimit: 1
## Sync configuration rendered as sync.json and mounted into each pipeline container.
## See docs/sync.md for the full field reference.
syncConfig:
  ## Map of PostgreSQL schemas. Each key is a schema name. Each value holds the
  ## schema's identity claim and its list of tables. See docs/sync.md.
  schemas: {}
## Role names, JWT claim, and schema configuration for row-level security.
## These values are rendered into the init-db ConfigMap and the PostgREST Deployment.
auth:
  ## PostgreSQL role used for unauthenticated requests. This role has no application table access.
  ## PostgREST uses this role as PGRST_DB_ANON_ROLE.
  anonRole: anon
  ## PostgreSQL role used for authenticated requests. This role receives application table access.
  userRole: user
  ## PostgreSQL login role that PostgREST uses to connect.
  ## PostgREST uses this role in PGRST_DB_URI.
  authenticatorRole: authenticator
  ## PostgREST JSPath expression that selects the database role from JWT claims. A
  ## token may also resolve to policy_writer_<schema>, created per configured
  ## schema, to write that schema's access_policy table only.
  jwtRoleClaim: $.role
  ## PostgreSQL schema that contains the shared pre_request function and sync status type.
  rlsSchema: rls
## High availability configuration.
## In HA mode, workload resources are created for every schema in syncConfig.schemas.
## Entries in schemas are optional per-schema overrides.
ha:
  enabled: false
  postgres:
    minReplicaCount: 2
    maxReplicaCount: 5
    triggers: []
  postgrest:
    minReplicaCount: 2
    maxReplicaCount: 5
    triggers: []
  fallback:
    minReplicaCount: 2
    maxReplicaCount: 5
    triggers: []
  redis:
    triggers: []
  schemas: []
## CloudNativePG manages PostgreSQL clusters with native streaming replication,
## automatic failover, and Barman backups. No Patroni or HAProxy needed.
##
## mode: shared   — one Cluster for all schemas (staging)
## mode: per-schema — one Cluster per schema (prod, publication isolation)
cnpg:
  ## Deployment mode: "shared" or "per-schema".
  mode: shared
  ## Number of PostgreSQL instances per Cluster (1 primary + N-1 replicas).
  instances: 3
  ## Container image with pg_duckdb, PostGIS, and pg_partman.
  ## Must be based on the official postgres image for CNPG compatibility.
  image: ghcr.io/prefeitura-rio/data-proxy-postgres:030de55
  storage:
    ## Size of the PersistentVolumeClaim for each PostgreSQL instance.
    size: 100Gi
    ## StorageClass for the PVCs. Leave empty to use the cluster default.
    storageClass: ""
  ## PostgREST read replica count for each schema (per-schema mode only).
  postgrestReadReplicas: 1
  ## PostgREST write replica count for each schema (per-schema mode only).
  postgrestWriteReplicas: 1
  ## Per-schema overrides. Only used when mode is per-schema.
  ## Each key must also exist in syncConfig.schemas.
  ## Example:
  ##   bcadastro:
  ##     instances: 3
  ##     storage:
  ##       size: 200Gi
  ##     postgrestReadReplicas: 2
  schemas: {}
  ## Barman backup configuration. Backups go to a separate S3-compatible service.
  backup:
    ## Set to true to enable continuous WAL archiving and scheduled backups.
    enabled: false
    ## S3-compatible endpoint URL for Barman. Use a separate service from s3.bucket.
    ## For GCS, set to https://storage.googleapis.com.
    endpointURL: ""
    ## Bucket name for backup data. Use a separate bucket from s3.bucket.
    bucket: ""
    ## Object key prefix for backup data within the bucket.
    destinationPath: ""
    ## Existing Secret with S3_ACCESS_KEY and S3_SECRET_KEY for the backup service.
    ## Must be separate from the main S3 secret when backup uses a different service.
    existingSecret: ""
    ## Cron expression for scheduled full backups.
    schedule: 0 5 * * *
    ## Number of retries for a failed backup.
    backupRetention: 7
## pg_partman configuration for native PostgreSQL partition management.
## Creates future partitions and drops expired ones automatically.
## The Publisher INSERTs into the partitioned parent instead of delete+reload.
partman:
  ## Cron expression for the partition maintenance CronJob.
  ## Runs partman.run_maintenance_proc() against the CNPG primary.
  schedule: 0 6 * * *
  ## Default retention for time-partitioned tables. Override per table in syncConfig.
  retention: 365 days
## Pushgateway for metrics push from short-lived worker pods.
## When enabled, deploys prometheus-pushgateway as a subchart.
## When disabled, set pushgateway.url to point to an external service.
pushgateway:
  enabled: true
  url: ""
## Resource requests and limits applied to PostgREST containers.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
    ephemeral-storage: 128Mi
  limits:
    memory: 256Mi
    ephemeral-storage: 512Mi
## Istio VirtualService for exposing PostgREST through the Istio ingress gateway.
## No VirtualService is created when enabled is false.
ingress:
  ## Inject Istio sidecars into application pods. Disable when the local VM kernel does not provide iptables IPv6 support.
  sidecarInject: true
  ## Set to true to create an Istio VirtualService for PostgREST.
  enabled: false
  ## Gateway reference in namespace/name format.
  gateway: istio-system/istio-gateway
  ## External hostname the VirtualService matches. Required when enabled is true.
  host: ""
  ## Request timeout for the PostgREST route. Leave empty for no timeout.
  ## Example: "60s"
  timeout: ""
  ## Retry policy for the PostgREST route. Set attempts to 0 to disable.
  retries:
    ## Number of retry attempts. Set to 0 to disable.
    attempts: 0
    ## Timeout per retry attempt. Leave empty to inherit the route timeout.
    perTryTimeout: ""
    ## Comma-separated Istio retry conditions.
    ## Example: "503,reset,connect-failure"
    retryOn: ""
  ## Istio JWT authentication and authorization for the PostgREST workload.
  auth:
    ## Set to true to deploy RequestAuthentication and AuthorizationPolicy.
    ## Requires ingress.enabled to be true.
    enabled: false
    ## JWT issuer identifier (the iss claim value). Required when auth.enabled is true.
    issuer: ""
    ## JWKS URI for JWT validation. Required when auth.enabled is true.
    jwksUri: ""
    ## Required JWT audience (aud claim). Every client that should reach the API must carry this
    ## audience, typically via a shared identity-provider client scope — see docs/security.md.
    ## Leave empty to accept any valid JWT principal regardless of audience.
    audience: ""
## BigQuery fallback with nginx proxy caching and pg_duckdb views.
## The Publisher creates _bq views per table that has fallback: true in the
## sync config. An nginx proxy with webdis sidecar caches responses in
## Valkey and falls back to _bq views when the local table returns empty.
## nginx receives a fallback.json map of which tables have BigQuery fallback.
fallback:
  ## Cache TTL in seconds for non-empty responses.
  cacheTtl: 300
  ## Maximum size of a response fetched with ngx.fetch, which is the fallback
  ## answer, held in memory per request.
  fetchBufferSize: 32m
  ## Timeout of a fetch. Keep it below the ingress timeout, so that this proxy
  ## logs the failure instead of the route timing out first.
  fetchTimeout: 60s
  ## Connections that ngx.fetch holds open for reuse. Zero opens and closes one
  ## connection for each fetch, which makes webdis free its client while a
  ## command is still in flight and corrupts the reply path.
  fetchKeepalive: 32
  ## Idle lifetime of a connection held open by ngx.fetch.
  fetchKeepaliveTimeout: 60s
  ## Valkey database number for the response cache (0 is for sync streams).
  cacheRedisDb: 1
  ## Largest response body that is stored in the cache, in bytes. A larger one is
  ## served but not stored. Zero stores any size.
  maxCacheBodyBytes: 262144
  ## nginx proxy image (built from Dockerfile.proxy).
  nginxImage: ghcr.io/prefeitura-rio/data-proxy-nginx-proxy:030de55
  ## webdis image for the Redis HTTP proxy sidecar. Keep the tag pinned, because
  ## every webdis release up to this one still frees an in-flight command.
  webdisImage: docker.io/nicolas/webdis:0.1.25
  ## Resource requests and limits for the nginx proxy deployment.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
  ## Resource requests and limits for the webdis sidecar.
  webdisResources:
    requests:
      cpu: 10m
      memory: 32Mi
