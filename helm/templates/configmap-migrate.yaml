{{/*
{
  "kind": "template",
  "description": "Render the migration script ConfigMap.",
  "inputs": {
    "values": "Helm chart values used by this resource.",
    "release": "Helm release context used in resource names.",
    "chart": "Helm chart metadata used in labels."
  }
}
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
data:
  migrate.nu: |
{{ .Files.Get "files/migrate.nu" | indent 4 }}
  lib.nu: |
{{ .Files.Get "files/lib.nu" | indent 4 }}
  grant_migration_access.sql: |
{{ .Files.Get "files/sql/grant_migration_access.sql" | indent 4 }}
