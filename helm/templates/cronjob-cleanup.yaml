{{- if .Values.cleanup.enabled }}
{{- $root := . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-cleanup-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
data:
  cleanup.nu: |
{{ .Files.Get "files/scripts/cleanup.nu" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "data-proxy.fullname" . }}-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: cleanup
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  startingDeadlineSeconds: {{ .Values.cleanup.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "data-proxy.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cleanup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
          containers:
            - name: cleanup
              image: {{ .Values.backup.image | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                runAsUser: 0
              command:
                - /bin/sh
                - -ec
                - |
                  apk add --no-cache postgresql17-client redis aws-cli >/dev/null
                  exec /usr/bin/nu /scripts/cleanup.nu
              env:
                {{- include "data-proxy.appEnv" . | nindent 16 }}
                - name: GCS_ENDPOINT_URL
                  value: {{ printf "%s://%s" (ternary "https" "http" (eq .Values.gcs.useSsl "true")) (.Values.gcs.endpoint | default "storage.googleapis.com") | quote }}
                - name: REDIS_HOST
                  value: {{ printf "%s-valkey" (include "data-proxy.fullname" .) | quote }}
              volumeMounts:
                {{- include "data-proxy.syncConfigVolumeMount" . | nindent 16 }}
                {{- include "data-proxy.schemaWritersVolumeMount" . | nindent 16 }}
                - name: cleanup-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            {{- include "data-proxy.syncConfigVolume" . | nindent 12 }}
            {{- include "data-proxy.schemaWritersVolume" . | nindent 12 }}
            - name: cleanup-script
              configMap:
                name: {{ include "data-proxy.fullname" . }}-cleanup-script
                defaultMode: 0555
{{- end }}
