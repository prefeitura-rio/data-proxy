---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "data-proxy.fullname" . }}-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "data-proxy.fullname" . }}-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "data-proxy.fullname" . }}-sync
subjects:
  - kind: ServiceAccount
    name: {{ include "data-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
