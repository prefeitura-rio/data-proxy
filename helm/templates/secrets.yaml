{{- $root := . }}
{{- if not $root.Values.s3.existingSecret }}
---
{{- /* S3 credentials: generated once, preserved on upgrades, user can override */ -}}
{{- $s3Name := include "data-proxy.s3SecretName" $root }}
{{- $s3 := lookup "v1" "Secret" $root.Release.Namespace $s3Name }}
{{- $s3AccessKey := "data-proxy" }}
{{- $s3SecretKey := randAlphaNum 32 }}
{{- if $s3 }}
{{- if hasKey $s3.data "S3_ACCESS_KEY" }}
{{- $s3AccessKey = index $s3.data "S3_ACCESS_KEY" | b64dec }}
{{- end }}
{{- if hasKey $s3.data "S3_SECRET_KEY" }}
{{- $s3SecretKey = index $s3.data "S3_SECRET_KEY" | b64dec }}
{{- end }}
{{- end }}
{{- $readerAccessKey := "data-proxy-reader" }}
{{- $readerSecretKey := randAlphaNum 32 }}
{{- if $s3 }}
{{- if hasKey $s3.data "S3_READER_SECRET_KEY" }}
{{- $readerSecretKey = index $s3.data "S3_READER_SECRET_KEY" | b64dec }}
{{- end }}
{{- end }}
{{- if $root.Values.s3.accessKey }}
{{- $s3AccessKey = $root.Values.s3.accessKey }}
{{- end }}
{{- if $root.Values.s3.secretKey }}
{{- $s3SecretKey = $root.Values.s3.secretKey }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s3Name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ $s3AccessKey | quote }}
  S3_SECRET_KEY: {{ $s3SecretKey | quote }}
  S3_READER_ACCESS_KEY: {{ $readerAccessKey | quote }}
  S3_READER_SECRET_KEY: {{ $readerSecretKey | quote }}
  seaweedfs_s3_config: {{ printf "{\"identities\":[{\"name\":\"admin\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]},{\"name\":\"reader\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Read\"]}]}" $s3AccessKey $s3SecretKey $readerAccessKey $readerSecretKey | quote }}
{{- end }}
---
{{- /* Serving login credentials: generated once, preserved on upgrades, user can override */ -}}
{{- $servingName := include "data-proxy.servingSecretName" $root }}
{{- $serving := lookup "v1" "Secret" $root.Release.Namespace $servingName }}
{{- $servingPassword := randAlphaNum 32 }}
{{- if $serving }}
{{- $servingPassword = index $serving.data "password" | b64dec }}
{{- end }}
{{- if $root.Values.cnpg.servingPassword }}
{{- $servingPassword = $root.Values.cnpg.servingPassword }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $servingName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $root.Values.auth.servingRole | quote }}
  password: {{ $servingPassword | quote }}
---
{{- /* Signer login credentials: generated once and preserved on upgrades */ -}}
{{- $signerName := include "data-proxy.signerSecretName" $root }}
{{- $signer := lookup "v1" "Secret" $root.Release.Namespace $signerName }}
{{- $signerPassword := randAlphaNum 32 }}
{{- if $signer }}
{{- $signerPassword = index $signer.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $signerName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $root.Values.auth.signerRole | quote }}
  password: {{ $signerPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-proxy.fullname" $root }}-pgdog-users
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: pgdog
type: Opaque
stringData:
  users.toml: |
    [[users]]
    name = {{ $root.Values.auth.servingRole | quote }}
    database = {{ $root.Values.cnpg.db.name | quote }}
    password = {{ $servingPassword | quote }}
---
{{- /* Database credentials: generated once, preserved on upgrades, user can override */ -}}
{{- $dbName := include "data-proxy.dbSecretName" $root }}
{{- $db := lookup "v1" "Secret" $root.Release.Namespace $dbName }}
{{- $dbPassword := randAlphaNum 32 }}
{{- if $db }}
{{- if hasKey $db.data "password" }}
{{- $dbPassword = index $db.data "password" | b64dec }}
{{- end }}
{{- end }}
{{- if $root.Values.cnpg.password }}
{{- $dbPassword = $root.Values.cnpg.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $root.Values.cnpg.db.user | quote }}
  password: {{ $dbPassword | quote }}
{{- if not $root.Values.redis.existingSecret }}
---
{{- /* Redis credentials: generated once, preserved on upgrades, user can override */ -}}
{{- $redisName := include "data-proxy.redisSecretName" $root }}
{{- $redis := lookup "v1" "Secret" $root.Release.Namespace $redisName }}
{{- $redisPassword := randAlphaNum 32 }}
{{- if $redis }}
{{- if hasKey $redis.data "password" }}
{{- $redisPassword = index $redis.data "password" | b64dec }}
{{- else if hasKey $redis.data "REDIS_PASSWORD" }}
{{- $redisPassword = index $redis.data "REDIS_PASSWORD" | b64dec }}
{{- end }}
{{- end }}
{{- if $root.Values.redis.password }}
{{- $redisPassword = $root.Values.redis.password }}
{{- end }}
{{- $redisReadDsn := printf "redis://:%s@%s:%s/%s" $redisPassword ($root.Values.redis.readerHost | default $root.Values.redis.writerHost) (toString ($root.Values.redis.readerPort | default $root.Values.redis.writerPort)) (toString ($root.Values.redis.cacheRedisDb | default 1)) }}
{{- $redisWriteDsn := printf "redis://:%s@%s/%s" $redisPassword $root.Values.redis.writerAddress "0" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $redisName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: Opaque
stringData:
  password: {{ $redisPassword | quote }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  REDIS_READ: {{ $redisReadDsn | quote }}
  REDIS_WRITE: {{ $redisWriteDsn | quote }}
{{- end }}
{{- /* Catalog reader credentials: generated once, preserved on upgrades, user can override */ -}}
{{- $secretName := include "data-proxy.duckdbSecretName" $root }}
{{- $existing := lookup "v1" "Secret" $root.Release.Namespace $secretName }}
{{- $password := randAlphaNum 32 }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- with $root.Values.ducklake.duckdbPassword }}
{{- $password = . }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: duckdb
  password: {{ $password | quote }}
{{- if and .Values.console.enabled (not .Values.console.oidc.existingSecret) }}
---
{{- /* Console secrets: the cookie secret is generated once and preserved on upgrades */ -}}
{{- $consoleName := include "data-proxy.consoleSecretName" $root }}
{{- $console := lookup "v1" "Secret" $root.Release.Namespace $consoleName }}
{{- $cookieSecret := randAlphaNum 48 }}
{{- if $console }}
{{- $cookieSecret = index $console.data "COOKIE_SECRET" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $consoleName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: console
type: Opaque
stringData:
  OIDC_CLIENT_SECRET: {{ required "console.oidc.clientSecret is required when the console is enabled" $root.Values.console.oidc.clientSecret | quote }}
  COOKIE_SECRET: {{ $cookieSecret | quote }}
{{- end }}
