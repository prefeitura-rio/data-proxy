{{- $root := . }}
---
{{- /* S3 credentials: generated once, preserved on upgrades, user can override */ -}}
{{- $s3Name := include "data-proxy.s3SecretName" $root }}
{{- $s3 := lookup "v1" "Secret" $root.Release.Namespace $s3Name }}
{{- $s3AccessKey := "data-proxy" }}
{{- $s3SecretKey := randAlphaNum 32 }}
{{- if $s3 }}
{{- if hasKey $s3.data "S3_ACCESS_KEY" }}
{{- $s3AccessKey = index $s3.data "S3_ACCESS_KEY" | b64dec }}
{{- end }}
{{- if hasKey $s3.data "S3_SECRET_KEY" }}
{{- $s3SecretKey = index $s3.data "S3_SECRET_KEY" | b64dec }}
{{- end }}
{{- end }}
{{- if $root.Values.s3.accessKey }}
{{- $s3AccessKey = $root.Values.s3.accessKey }}
{{- end }}
{{- if $root.Values.s3.secretKey }}
{{- $s3SecretKey = $root.Values.s3.secretKey }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s3Name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ $s3AccessKey | quote }}
  S3_SECRET_KEY: {{ $s3SecretKey | quote }}
  seaweedfs_s3_config: {{ printf "{\"identities\":[{\"name\":\"admin\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}" $s3AccessKey $s3SecretKey | quote }}
---
{{- /* Authenticator credentials: generated once, preserved on upgrades, user can override */ -}}
{{- $authenticatorName := include "data-proxy.authenticatorSecretName" $root }}
{{- $authenticator := lookup "v1" "Secret" $root.Release.Namespace $authenticatorName }}
{{- $authenticatorPassword := randAlphaNum 32 }}
{{- if $authenticator }}
{{- $authenticatorPassword = index $authenticator.data "password" | b64dec }}
{{- end }}
{{- if $root.Values.cnpg.authenticatorPassword }}
{{- $authenticatorPassword = $root.Values.cnpg.authenticatorPassword }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authenticatorName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $root.Values.auth.authenticatorRole | quote }}
  password: {{ $authenticatorPassword | quote }}
---
{{- /* Database credentials: generated once, preserved on upgrades, user can override */ -}}
{{- $dbName := include "data-proxy.dbSecretName" $root }}
{{- $db := lookup "v1" "Secret" $root.Release.Namespace $dbName }}
{{- $dbPassword := randAlphaNum 32 }}
{{- if $db }}
{{- if hasKey $db.data "password" }}
{{- $dbPassword = index $db.data "password" | b64dec }}
{{- end }}
{{- end }}
{{- if $root.Values.cnpg.password }}
{{- $dbPassword = $root.Values.cnpg.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $root.Values.cnpg.db.user | quote }}
  password: {{ $dbPassword | quote }}
{{- if not $root.Values.redis.existingSecret }}
---
{{- /* Redis credentials: generated once, preserved on upgrades, user can override */ -}}
{{- $redisName := include "data-proxy.redisSecretName" $root }}
{{- $redis := lookup "v1" "Secret" $root.Release.Namespace $redisName }}
{{- $redisPassword := randAlphaNum 32 }}
{{- if $redis }}
{{- if hasKey $redis.data "password" }}
{{- $redisPassword = index $redis.data "password" | b64dec }}
{{- else if hasKey $redis.data "REDIS_PASSWORD" }}
{{- $redisPassword = index $redis.data "REDIS_PASSWORD" | b64dec }}
{{- end }}
{{- end }}
{{- if $root.Values.redis.password }}
{{- $redisPassword = $root.Values.redis.password }}
{{- end }}
{{- $redisReadDsn := printf "redis://:%s@%s:%s/%s" $redisPassword ($root.Values.redis.webdisReadHost | default $root.Values.redis.webdisHost) (toString ($root.Values.redis.webdisReadPort | default $root.Values.redis.webdisPort)) (toString ($root.Values.redis.cacheRedisDb | default 1)) }}
{{- $redisWriteDsn := printf "redis://:%s@%s/%s" $redisPassword $root.Values.redis.writerAddress "0" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $redisName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: Opaque
stringData:
  password: {{ $redisPassword | quote }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  REDIS_READ: {{ $redisReadDsn | quote }}
  REDIS_WRITE: {{ $redisWriteDsn | quote }}
{{- end }}
