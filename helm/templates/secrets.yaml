{{- $root := . }}
{{- $s3Name := include "data-proxy.s3SecretName" $root }}
{{- $s3 := lookup "v1" "Secret" $root.Release.Namespace $s3Name }}
{{- $s3AccessKey := "data-proxy" }}
{{- $s3SecretKey := randAlphaNum 32 }}
{{- if $s3 }}
{{- if hasKey $s3.data "S3_ACCESS_KEY" }}
{{- $s3AccessKey = index $s3.data "S3_ACCESS_KEY" | b64dec }}
{{- end }}
{{- if hasKey $s3.data "S3_SECRET_KEY" }}
{{- $s3SecretKey = index $s3.data "S3_SECRET_KEY" | b64dec }}
{{- end }}
{{- end }}
{{- if not $root.Values.s3.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s3Name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ $s3AccessKey | quote }}
  S3_SECRET_KEY: {{ $s3SecretKey | quote }}
  seaweedfs_s3_config: {{ printf "{\"identities\":[{\"name\":\"admin\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}" $s3AccessKey $s3SecretKey | quote }}
{{- end }}
{{- if or $root.Values.jobs.backup.enabled $root.Values.jobs.cleanup.enabled }}
{{- if not $root.Values.jobs.existingSecret }}
---
{{- $jobsName := include "data-proxy.jobsSecretName" $root }}
{{- $jobs := lookup "v1" "Secret" $root.Release.Namespace $jobsName }}
{{- $jobsPassword := randAlphaNum 32 }}
{{- if $jobs }}
{{- if hasKey $jobs.data "password" }}
{{- $jobsPassword = index $jobs.data "password" | b64dec }}
{{- else if hasKey $jobs.data "JOBS_PASSWORD" }}
{{- $jobsPassword = index $jobs.data "JOBS_PASSWORD" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $jobsName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: jobs
  password: {{ $jobsPassword | quote }}
  JOBS_PASSWORD: {{ $jobsPassword | quote }}
{{- end }}
{{- end }}
---
{{- $authenticatorName := printf "%s-cnpg-authenticator" (include "data-proxy.fullname" $root) }}
{{- $authenticator := lookup "v1" "Secret" $root.Release.Namespace $authenticatorName }}
{{- $authenticatorPassword := randAlphaNum 32 }}
{{- if $authenticator }}
{{- $authenticatorPassword = index $authenticator.data "password" | b64dec }}
{{- end }}
{{- if not $root.Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authenticatorName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $root.Values.auth.authenticatorRole | quote }}
  password: {{ $authenticatorPassword | quote }}
{{- end }}
