{{- if not (eq .Values.cnpg.mode "per-schema") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-proxy.fullname" . }}-postgrest-rw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgrest-rw
spec:
  type: ClusterIP
  selector:
    {{- include "data-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgrest-rw
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
