{{- $schemas := .Values.sync.config.schemas -}}
{{- if gt (len $schemas) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-litestream
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: litestream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: litestream
  template:
    metadata:
      annotations:
        checksum/s3-credentials: {{ include "data-proxy.s3CredentialsChecksum" . }}
        checksum/litestream-config: {{ include (print $.Template.BasePath "/configmap-litestream.yaml") . | sha256sum }}
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: litestream
    spec:
      restartPolicy: Always
      serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
      initContainers:
        {{- include "data-proxy.s3WaitInitContainer" . | nindent 8 }}
        - name: prepare-ducklake
          image: {{ include "data-proxy.litestreamImage" . | quote }}
          imagePullPolicy: IfNotPresent
          command: [install, -d, -o, "10001", -g, "10001", -m, "0755", /shared/ducklake]
          args:
            {{- range $schema := keys $schemas | sortAlpha }}
            - {{ printf "/shared/ducklake/%s" $schema | quote }}
            {{- end }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: duckdb
              mountPath: /shared
        - name: prepare-duckdb-secrets
          image: {{ include "data-proxy.litestreamImage" . | quote }}
          imagePullPolicy: IfNotPresent
          command: [install, -d, -o, "26", -g, "26", -m, "0700", /shared/duckdb, /shared/duckdb/secrets]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: duckdb
              mountPath: /shared
      containers:
        - name: replicate
          image: {{ include "data-proxy.litestreamImage" . | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - replicate
            - -restore-if-db-not-exists
            - -config
            - /config/litestream.yaml
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          env:
            - name: HOME
              value: /tmp
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: duckdb
              mountPath: {{ .Values.ducklake.catalogLocalPath }}
              subPath: ducklake
            - name: litestream-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: duckdb
          persistentVolumeClaim:
            claimName: {{ include "data-proxy.fullname" . }}-duckdb
        - name: litestream-config
          configMap:
            name: {{ include "data-proxy.fullname" . }}-litestream
            items:
              - key: litestream.yaml
                path: litestream.yaml
        {{- include "data-proxy.s3BootstrapVolume" . | nindent 8 }}
{{- end }}
