{{- $schemas := .Values.sync.config.schemas -}}
{{- if gt (len $schemas) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-litestream
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: litestream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: litestream
  template:
    metadata:
      annotations:
        checksum/s3-credentials: {{ include "data-proxy.s3CredentialsChecksum" . }}
        checksum/litestream-config: {{ include (print $.Template.BasePath "/configmap-litestream.yaml") . | sha256sum }}
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: litestream
    spec:
      restartPolicy: Always
      serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
      containers:
        - name: restore
          image: {{ .Values.jobs.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["nu", "/projected/recover-catalogs.nu"]
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_SECRET_KEY
            - name: DUCKLAKE_CATALOG_LOCAL_PATH
              value: {{ .Values.ducklake.catalogLocalPath | quote }}
            - name: SYNC_CONFIG_PATH
              value: /config/sync.json
          volumeMounts:
            - name: reader-catalogs
              mountPath: {{ .Values.ducklake.catalogLocalPath }}
            - name: projected
              mountPath: /projected
              readOnly: true
            {{- include "data-proxy.syncConfigVolumeMount" . | nindent 12 }}
        - name: replicate
          image: {{ .Values.jobs.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until
              {{- range $schema, $_ := $schemas }}
              [ -f {{ $.Values.ducklake.catalogWriterPath }}/{{ $schema }}/catalog.sqlite ] &&
              {{- end }}
              true; do sleep 1; done;
              exec litestream replicate -config /projected/litestream-write.yaml
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: writer-catalogs
              mountPath: {{ .Values.ducklake.catalogWriterPath }}
            - name: projected
              mountPath: /projected
              readOnly: true
      volumes:
        - name: writer-catalogs
          persistentVolumeClaim:
            claimName: {{ include "data-proxy.fullname" . }}-catalog-writer
        - name: reader-catalogs
          persistentVolumeClaim:
            claimName: {{ include "data-proxy.fullname" . }}-catalog-reader
        - name: projected
          configMap:
            name: {{ include "data-proxy.fullname" . }}-litestream
        {{- include "data-proxy.syncConfigVolume" . | nindent 8 }}
{{- end }}
