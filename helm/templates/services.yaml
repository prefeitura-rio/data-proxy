apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-proxy.fullname" . }}-postgrest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgrest
spec:
  type: ClusterIP
  selector:
    {{- include "data-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgrest
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-proxy.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  selector:
    {{- include "data-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: redis-http
      port: 7379
      targetPort: 7379
---
{{- if .Values.swaggerUi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-proxy.fullname" . }}-swagger-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: swagger-ui
spec:
  type: ClusterIP
  selector:
    {{- include "data-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: swagger-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
