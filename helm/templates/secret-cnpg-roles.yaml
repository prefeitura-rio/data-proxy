apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-proxy.fullname" . }}-cnpg-dataproxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.pgduckdb.db.user | quote }}
  password: {{ .Values.pgduckdb.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-proxy.fullname" . }}-cnpg-authenticator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.auth.authenticatorRole | quote }}
  password: {{ .Values.pgduckdb.authenticatorPassword | quote }}
