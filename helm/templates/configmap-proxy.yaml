{{/*
{
  "kind": "template",
  "description": "Render the shared proxy configuration.",
  "inputs": {
    "values": "Helm chart values used by this resource.",
    "release": "Helm release context used in resource names.",
    "chart": "Helm chart metadata used in labels."
  }
}
*/}}
{{- if not false }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  nginx.conf: |
{{ include "data-proxy.nginxProxyConfig" . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-webdis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: webdis
data:
  webdis-write.json: |
{{ include "data-proxy.webdisWriteConfig" . | indent 4 }}
  webdis-read.json: |
{{ include "data-proxy.webdisReadConfig" . | indent 4 }}
{{- end }}
