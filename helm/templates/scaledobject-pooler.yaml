{{- if not .Values.ha.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "data-proxy.fullname" . }}-pooler-ro-autoscaler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  scaleTargetRef:
    apiVersion: postgresql.cnpg.io/v1
    kind: Pooler
    name: {{ include "data-proxy.fullname" . }}-pooler-ro
  minReplicaCount: {{ .Values.cnpg.pooler.autoscaling.minReplicaCount }}
  maxReplicaCount: {{ .Values.cnpg.pooler.autoscaling.maxReplicaCount }}
  pollingInterval: {{ .Values.cnpg.pooler.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.cnpg.pooler.autoscaling.cooldownPeriod }}
  triggers:
{{- if gt (len (.Values.cnpg.pooler.autoscaling.triggers | default list)) 0 }}
{{ toYaml .Values.cnpg.pooler.autoscaling.triggers | nindent 4 }}
{{- else }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
{{- end }}
{{- else }}
{{- $root := . }}
{{- range $schema, $_ := $root.Values.syncConfig.schemas }}
{{- $pooler := include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $pooler }}-pooler-ro-autoscaler
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  scaleTargetRef:
    apiVersion: postgresql.cnpg.io/v1
    kind: Pooler
    name: {{ $pooler }}-pooler-ro
  minReplicaCount: {{ $root.Values.cnpg.pooler.autoscaling.minReplicaCount }}
  maxReplicaCount: {{ $root.Values.cnpg.pooler.autoscaling.maxReplicaCount }}
  pollingInterval: {{ $root.Values.cnpg.pooler.autoscaling.pollingInterval }}
  cooldownPeriod: {{ $root.Values.cnpg.pooler.autoscaling.cooldownPeriod }}
  triggers:
{{- if gt (len ($root.Values.cnpg.pooler.autoscaling.triggers | default list)) 0 }}
{{ toYaml $root.Values.cnpg.pooler.autoscaling.triggers | nindent 4 }}
{{- else }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
{{- end }}
{{- end }}
{{- end }}
