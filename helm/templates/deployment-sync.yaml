apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-sync
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync
spec:
  replicas: {{ .Values.sync.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sync
  template:
    metadata:
      annotations:
        checksum/s3-credentials: {{ include "data-proxy.s3CredentialsChecksum" . }}
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sync
    spec:
      restartPolicy: Always
      serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
      containers:
        - name: sync
          image: "{{ .Values.sync.image }}"
          imagePullPolicy: {{ .Values.sync.imagePullPolicy }}
          resources:
            {{- toYaml .Values.sync.resources | nindent 12 }}
          command: ["python", "-m", "data_proxy.dbos.main"]
          env:
            {{- include "data-proxy.appEnv" . | nindent 12 }}
            - name: DBOS__VMID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          volumeMounts:
            {{- include "data-proxy.syncConfigVolumeMount" . | nindent 12 }}
            {{- include "data-proxy.gcpVolumeMount" . | nindent 12 }}
            {{- if .Values.sync.trigger.enabled }}
            - name: sync-trigger
              mountPath: /scripts
              readOnly: true
            {{- end }}
            - name: catalogs
              mountPath: {{ .Values.ducklake.catalogLocalPath }}
      volumes:
        {{- include "data-proxy.syncConfigVolume" . | nindent 8 }}
        {{- include "data-proxy.gcpVolume" . | nindent 8 }}
        {{- if .Values.sync.trigger.enabled }}
        - name: sync-trigger
          configMap:
            name: {{ .Values.sync.trigger.configMap }}
            defaultMode: 0555
        {{- end }}
        - name: catalogs
          persistentVolumeClaim:
            claimName: {{ include "data-proxy.fullname" . }}-catalog-writer
