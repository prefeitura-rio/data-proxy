{{- if .Values.retention.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-retention-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: retention
data:
  retention.nu: |
{{ .Files.Get "files/retention.nu" | nindent 4 }}
  lib.nu: |
{{ .Files.Get "files/lib.nu" | nindent 4 }}
  retention_delete.sql: |
{{ .Files.Get "files/sql/helm/retention_delete.sql" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "data-proxy.fullname" . }}-retention
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: retention
spec:
  schedule: {{ .Values.retention.schedule | quote }}
  startingDeadlineSeconds: {{ .Values.retention.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "data-proxy.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
          containers:
            - name: retention
              image: {{ .Values.retention.image | quote }}
              imagePullPolicy: {{ .Values.sync.imagePullPolicy }}
              command: [nu, /scripts/retention.nu]
              workingDir: /scripts
              env:
                {{- include "data-proxy.appEnv" . | nindent 16 }}
              volumeMounts:
                {{- include "data-proxy.syncConfigVolumeMount" . | nindent 16 }}
                {{- include "data-proxy.schemaWritersVolumeMount" . | nindent 16 }}
                - name: retention-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            {{- include "data-proxy.syncConfigVolume" . | nindent 12 }}
            {{- include "data-proxy.schemaWritersVolume" . | nindent 12 }}
            - name: retention-script
              configMap:
                name: {{ include "data-proxy.fullname" . }}-retention-script
                defaultMode: 0555
{{- end }}
