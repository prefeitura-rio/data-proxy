{{- if .Values.backup.enabled }}
{{- $root := . }}
{{- range $schema, $_ := .Values.syncConfig.schemas }}
{{- $name := include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}
{{- $backupName := printf "%s-%s-backup" (include "data-proxy.fullname" $root) ($schema | replace "_" "-") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $backupName }}-script
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: backup
    data-proxy.io/schema: {{ $schema | quote }}
data:
  backup.nu: |
{{ $root.Files.Get "files/backup.nu" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $backupName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: backup
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  schedule: {{ $root.Values.backup.schedule | quote }}
  startingDeadlineSeconds: {{ $root.Values.backup.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $root.Values.backup.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $root.Values.backup.ttlSecondsAfterFinished }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "data-proxy.selectorLabels" $root | nindent 12 }}
            app.kubernetes.io/component: backup
            data-proxy.io/schema: {{ $schema | quote }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "data-proxy.serviceAccountName" $root }}
          containers:
            - name: backup
              image: {{ $root.Values.backup.image | quote }}
              command: [nu, /scripts/backup.nu]
              env:
                - name: BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.backupSecretName" $root }}
                      key: BACKUP_PASSWORD
                - name: SCHEMA
                  value: {{ $schema | quote }}
                - name: AGE_RECIPIENT
                  value: {{ required "backup.ageRecipient is required when backup.enabled is true" $root.Values.backup.ageRecipient | quote }}
                - name: BACKUP_PREFIX
                  value: {{ $root.Values.backup.prefix | quote }}
                - name: S3_BUCKET
                  value: {{ $root.Values.s3.bucket | quote }}
                - name: S3_ENDPOINT
                  value: {{ include "data-proxy.s3Endpoint" $root | quote }}
                - name: S3_USE_SSL
                  value: {{ $root.Values.s3.useSsl | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.s3SecretName" $root }}
                      key: S3_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.s3SecretName" $root }}
                      key: S3_SECRET_KEY
                - name: SCHEMA_WRITERS_FILE
                  value: /config/schema-writers/writers.json
              volumeMounts:
                - name: schema-writers
                  mountPath: /config/schema-writers
                  readOnly: true
                - name: backup-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: schema-writers
              secret:
                secretName: {{ include "data-proxy.fullname" $root }}-duckdb-schema-writers
                defaultMode: 0440
            - name: backup-script
              configMap:
                name: {{ $backupName }}-script
                defaultMode: 0555
{{- end }}
{{- end }}
