{{- if .Values.backup.enabled }}
{{- $root := . }}
{{- range $schema, $_ := .Values.syncConfig.schemas }}
{{- $name := include "data-proxy.schemaStackName" (dict "root" $root "schema" $schema) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-backup
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: backup
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  schedule: {{ $root.Values.backup.schedule | quote }}
  startingDeadlineSeconds: {{ $root.Values.backup.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $root.Values.backup.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $root.Values.backup.ttlSecondsAfterFinished }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "data-proxy.selectorLabels" $root | nindent 12 }}
            app.kubernetes.io/component: backup
            data-proxy.io/schema: {{ $schema | quote }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "data-proxy.serviceAccountName" $root }}
          containers:
            - name: backup
              image: {{ $root.Values.backup.image | quote }}
              command: [/bin/sh, -c]
              args:
                - |
                  set -eu
                  apk add --no-cache age aws-cli jq >/dev/null
                  BACKUP_WRITER="$(jq -er --arg schema "$SCHEMA" '.writers[$schema]' /config/schema-writers/writers.json)"
                  BACKUP_PG_DSN="postgresql://backup:${BACKUP_PASSWORD}@${BACKUP_WRITER#*@}"
                  export AWS_ACCESS_KEY_ID="$GCS_KEY_ID"
                  export AWS_SECRET_ACCESS_KEY="$GCS_SECRET_KEY"
                  aws configure set default.s3.addressing_style path
                  aws configure set default.region auto
                  scheme="https"
                  [ "$GCS_USE_SSL" = "true" ] || scheme="http"
                  object_date="$(date -u +%F)"
                  psql "$BACKUP_PG_DSN" --no-psqlrc --quiet --command "COPY {{ $schema }}.access_policy TO STDOUT WITH (FORMAT csv, HEADER true)" \
                    | age --encrypt --recipient "$AGE_RECIPIENT" \
                    | aws s3 cp - "s3://${GCS_BUCKET}/${BACKUP_PREFIX}/{{ $schema }}/${object_date}.csv.age" --endpoint-url "${scheme}://${GCS_ENDPOINT}"
              env:
                - name: BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.backupSecretName" $root }}
                      key: BACKUP_PASSWORD
                - name: SCHEMA
                  value: {{ $schema | quote }}
                - name: AGE_RECIPIENT
                  value: {{ required "backup.ageRecipient is required when backup.enabled is true" $root.Values.backup.ageRecipient | quote }}
                - name: BACKUP_PREFIX
                  value: {{ $root.Values.backup.prefix | quote }}
                - name: GCS_BUCKET
                  value: {{ $root.Values.gcs.bucket | quote }}
                - name: GCS_ENDPOINT
                  value: {{ $root.Values.gcs.endpoint | default "storage.googleapis.com" | quote }}
                - name: GCS_USE_SSL
                  value: {{ $root.Values.gcs.useSsl | quote }}
                - name: GCS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.gcsSecretName" $root }}
                      key: GCS_KEY_ID
                - name: GCS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.gcsSecretName" $root }}
                      key: GCS_SECRET_KEY
          volumes:
            - name: schema-writers
              configMap:
                name: {{ include "data-proxy.fullname" $root }}-schema-writers
              volumeMounts:
                - name: schema-writers
                  mountPath: /config/schema-writers
                  readOnly: true
{{- end }}
{{- end }}
