{{- if .Values.backup.enabled }}
{{- $root := . }}
{{- range $schema, $_ := .Values.syncConfig.schemas }}
{{- $backupName := printf "%s-%s-backup" (include "data-proxy.fullname" $root) ($schema | replace "_" "-") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $backupName }}-script
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: backup
    data-proxy.io/schema: {{ $schema | quote }}
data:
  backup.nu: |
{{ $root.Files.Get "files/backup.nu" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $backupName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: backup
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  schedule: {{ $root.Values.backup.schedule | quote }}
  startingDeadlineSeconds: {{ $root.Values.backup.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $root.Values.backup.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $root.Values.backup.ttlSecondsAfterFinished }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "data-proxy.selectorLabels" $root | nindent 12 }}
            app.kubernetes.io/component: backup
            data-proxy.io/schema: {{ $schema | quote }}
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: {{ $root.Values.backup.image | quote }}
              command: [nu, /scripts/backup.nu]
              env:
                - name: SCHEMA
                  value: {{ $schema | quote }}
                - name: PG_DSN
                  {{- if $root.Values.ha.enabled }}
                  value: {{ printf "postgresql://backup:%s@%s-%s-rw:5432/%s" $root.Values.backup.password (include "data-proxy.fullname" $root) ($schema | replace "_" "-") $root.Values.postgres.db.name | quote }}
                  {{- else }}
                  value: {{ printf "postgresql://backup:%s@%s-rw:5432/%s" $root.Values.backup.password (include "data-proxy.fullname" $root) $root.Values.postgres.db.name | quote }}
                  {{- end }}
                - name: BACKUP_PREFIX
                  value: {{ $root.Values.backup.prefix | quote }}
                - name: S3_BUCKET
                  value: {{ $root.Values.cnpg.backup.bucket | quote }}
                - name: S3_ENDPOINT
                  value: {{ $root.Values.cnpg.backup.endpointURL | quote }}
                - name: S3_USE_SSL
                  value: "true"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.cnpg.backup.existingSecret }}
                      key: S3_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $root.Values.cnpg.backup.existingSecret }}
                      key: S3_SECRET_KEY
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: backup-script
              configMap:
                name: {{ $backupName }}-script
                defaultMode: 0555
{{- end }}
{{- end }}
