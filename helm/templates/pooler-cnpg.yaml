{{/* Render one session-pooled read pooler for the single CNPG cluster. */}}
{{- $root := . }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ include "data-proxy.fullname" $root }}-pooler-ro
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  cluster:
    name: {{ include "data-proxy.fullname" $root }}
  instances: {{ $root.Values.cnpg.pooler.instances }}
  type: ro
  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            {{- toYaml $root.Values.cnpg.pooler.resources | nindent 12 }}
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: {{ $root.Values.cnpg.pooler.maxClientConns | quote }}
      default_pool_size: {{ $root.Values.cnpg.pooler.poolSize | quote }}
