{{- $root := . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-init-db-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-db
data:
  init-db.nu: |
{{ .Files.Get "files/init-db.nu" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-init-db-sql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-db
data:
{{- range $path, $_ := .Files.Glob "files/sql/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
{{- if not .Values.ha.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "data-proxy.fullname" . }}-init-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-db
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-iteration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init-db
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: init-db
          image: {{ .Values.cnpg.init.image | quote }}
          imagePullPolicy: {{ .Values.sync.imagePullPolicy }}
          command: [nu, /scripts/init-db.nu]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGRST_AUTHENTICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: PGRST_AUTHENTICATOR_PASSWORD
            - name: PG_DSN
              value: {{ printf "postgresql://%s:$(POSTGRES_PASSWORD)@%s-rw:5432/%s" .Values.cnpg.db.user (include "data-proxy.fullname" .) .Values.cnpg.db.name | quote }}
            - name: AUTH_ANON_ROLE
              value: {{ .Values.auth.anonRole | quote }}
            - name: AUTH_USER_ROLE
              value: {{ .Values.auth.userRole | quote }}
            - name: AUTH_AUTHENTICATOR_ROLE
              value: {{ .Values.auth.authenticatorRole | quote }}
            - name: BACKUP_ENABLED
              value: {{ .Values.backup.enabled | quote }}
            {{- if .Values.backup.enabled }}
            - name: BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.backupSecretName" . }}
                  key: BACKUP_PASSWORD
            {{- end }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_SECRET_KEY
            - name: S3_ENDPOINT
              value: {{ include "data-proxy.s3Endpoint" . | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.s3.useSsl | quote }}
            - name: SYNC_CONFIG_PATH
              value: /config/sync.json
          volumeMounts:
            {{- include "data-proxy.syncConfigVolumeMount" . | nindent 12 }}
            - name: init-db-script
              mountPath: /scripts
              readOnly: true
            - name: init-db-sql
              mountPath: /sql
              readOnly: true
      volumes:
        {{- include "data-proxy.syncConfigVolume" . | nindent 8 }}
        - name: init-db-script
          configMap:
            name: {{ include "data-proxy.fullname" . }}-init-db-script
            defaultMode: 0555
        - name: init-db-sql
          configMap:
            name: {{ include "data-proxy.fullname" . }}-init-db-sql
            defaultMode: 0444
{{- else }}
{{- range $schema, $_ := $root.Values.syncConfig.schemas }}
{{- $cluster := include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $cluster }}-init-db
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: init-db
    data-proxy.io/schema: {{ $schema | quote }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-iteration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: init-db
        data-proxy.io/schema: {{ $schema | quote }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: init-db
          image: {{ $root.Values.cnpg.init.image | quote }}
          imagePullPolicy: {{ $root.Values.sync.imagePullPolicy }}
          command: [nu, /scripts/init-db.nu]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" $root }}
                  key: POSTGRES_PASSWORD
            - name: PGRST_AUTHENTICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" $root }}
                  key: PGRST_AUTHENTICATOR_PASSWORD
            - name: PG_DSN
              value: {{ printf "postgresql://%s:$(POSTGRES_PASSWORD)@%s-rw:5432/%s" $root.Values.cnpg.db.user $cluster $root.Values.cnpg.db.name | quote }}
            - name: AUTH_ANON_ROLE
              value: {{ $root.Values.auth.anonRole | quote }}
            - name: AUTH_USER_ROLE
              value: {{ $root.Values.auth.userRole | quote }}
            - name: AUTH_AUTHENTICATOR_ROLE
              value: {{ $root.Values.auth.authenticatorRole | quote }}
            - name: BACKUP_ENABLED
              value: {{ $root.Values.backup.enabled | quote }}
            {{- if $root.Values.backup.enabled }}
            - name: BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.backupSecretName" $root }}
                  key: BACKUP_PASSWORD
            {{- end }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" $root }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" $root }}
                  key: S3_SECRET_KEY
            - name: S3_ENDPOINT
              value: {{ include "data-proxy.s3Endpoint" $root | quote }}
            - name: S3_USE_SSL
              value: {{ $root.Values.s3.useSsl | quote }}
            - name: SYNC_CONFIG_PATH
              value: /config/sync.json
            - name: SCHEMA
              value: {{ $schema | quote }}
          volumeMounts:
            {{- include "data-proxy.syncConfigVolumeMount" $root | nindent 12 }}
            - name: init-db-script
              mountPath: /scripts
              readOnly: true
            - name: init-db-sql
              mountPath: /sql
              readOnly: true
      volumes:
        {{- include "data-proxy.syncConfigVolume" $root | nindent 8 }}
        - name: init-db-script
          configMap:
            name: {{ include "data-proxy.fullname" $root }}-init-db-script
            defaultMode: 0555
        - name: init-db-sql
          configMap:
            name: {{ include "data-proxy.fullname" $root }}-init-db-sql
            defaultMode: 0444
{{- end }}
{{- end }}
