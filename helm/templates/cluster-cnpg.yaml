{{- $root := . }}
{{- if eq $root.Values.cnpg.mode "shared" }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "data-proxy.fullname" $root }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  imageName: {{ $root.Values.cnpg.image | quote }}
  env:
    - name: HOME
      value: /var/lib/postgresql/data
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /var/lib/postgresql/data/gcp-key.json
  bootstrap:
    initdb:
      database: {{ $root.Values.cnpg.db.name | quote }}
      owner: {{ $root.Values.cnpg.db.user | quote }}
      encoding: UTF8
      dataChecksums: true
  instances: {{ $root.Values.cnpg.instances | int }}
  resources:
    requests:
      cpu: {{ $root.Values.cnpg.resources.requests.cpu | quote }}
      memory: {{ $root.Values.cnpg.resources.requests.memory | quote }}
    limits:
      cpu: {{ $root.Values.cnpg.resources.limits.cpu | quote }}
      memory: {{ $root.Values.cnpg.resources.limits.memory | quote }}
  postgresql:
    shared_preload_libraries:
      - pg_duckdb
      - pg_partman_bgw
    parameters:
      duckdb.allow_unsigned_extensions: "on"
      duckdb.allow_community_extensions: "on"
      duckdb.unsafe_allow_execution_inside_functions: "on"
      duckdb.postgres_role: authenticator
  storage:
    size: {{ $root.Values.cnpg.storage.size | quote }}
    {{- with $root.Values.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  managed:
    roles:
      - name: {{ $root.Values.cnpg.db.user | quote }}
        ensure: present
        superuser: true
        login: true
        passwordSecret:
          name: {{ include "data-proxy.fullname" $root }}-cnpg-dataproxy
      - name: {{ $root.Values.auth.authenticatorRole | quote }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "data-proxy.fullname" $root }}-cnpg-authenticator

{{- else if eq $root.Values.cnpg.mode "per-schema" }}
{{- range $schema, $stack := (default $root.Values.cnpg.schemas $root.Values.syncConfig.schemas) }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: postgres
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  imageName: {{ $root.Values.cnpg.image | quote }}
  env:
    - name: HOME
      value: /var/lib/postgresql/data
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /var/lib/postgresql/data/gcp-key.json
  bootstrap:
    initdb:
      database: {{ $root.Values.cnpg.db.name | quote }}
      owner: {{ $root.Values.cnpg.db.user | quote }}
      encoding: UTF8
      dataChecksums: true
  instances: {{ default $root.Values.cnpg.instances $stack.instances | int }}
  resources:
    requests:
      cpu: {{ $root.Values.cnpg.resources.requests.cpu | quote }}
      memory: {{ $root.Values.cnpg.resources.requests.memory | quote }}
    limits:
      cpu: {{ $root.Values.cnpg.resources.limits.cpu | quote }}
      memory: {{ $root.Values.cnpg.resources.limits.memory | quote }}
  postgresql:
    shared_preload_libraries:
      - pg_duckdb
      - pg_partman_bgw
    parameters:
      duckdb.allow_unsigned_extensions: "on"
      duckdb.allow_community_extensions: "on"
      duckdb.unsafe_allow_execution_inside_functions: "on"
      duckdb.postgres_role: authenticator
  storage:
    size: {{ default $root.Values.cnpg.storage.size (dig "storage" "size" $root.Values.cnpg.storage.size $stack) | quote }}
    {{- with $root.Values.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  managed:
    roles:
      - name: {{ $root.Values.cnpg.db.user | quote }}
        ensure: present
        superuser: true
        login: true
        passwordSecret:
          name: {{ include "data-proxy.fullname" $root }}-cnpg-dataproxy
      - name: {{ $root.Values.auth.authenticatorRole | quote }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "data-proxy.fullname" $root }}-cnpg-authenticator

{{- end }}
{{- end }}
