{{- $root := . }}
{{- if eq $root.Values.cnpg.mode "shared" }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "data-proxy.fullname" $root }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: duckdb
spec:
  imageName: {{ $root.Values.cnpg.image | quote }}
  env:
    - name: HOME
      value: /var/lib/postgresql/data
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /var/lib/postgresql/data/gcp-key.json
  bootstrap:
    initdb:
      database: {{ $root.Values.pgduckdb.db.name | quote }}
      owner: {{ $root.Values.pgduckdb.db.user | quote }}
      encoding: UTF8
      dataChecksums: true
  instances: {{ $root.Values.cnpg.instances | int }}
  postgresql:
    shared_preload_libraries:
      - pg_duckdb
      - pg_partman_bgw
    parameters:
      duckdb.allow_unsigned_extensions: "on"
      duckdb.allow_community_extensions: "on"
      duckdb.unsafe_allow_execution_inside_functions: "on"
      duckdb.postgres_role: authenticator
  storage:
    size: {{ $root.Values.cnpg.storage.size | quote }}
    {{- with $root.Values.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  managed:
    roles:
      - name: {{ $root.Values.pgduckdb.db.user | quote }}
        ensure: present
        superuser: true
        login: true
        passwordSecret:
          name: {{ include "data-proxy.fullname" $root }}-cnpg-dataproxy
      - name: {{ $root.Values.auth.authenticatorRole | quote }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "data-proxy.fullname" $root }}-cnpg-authenticator
  {{- if $root.Values.cnpg.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ $root.Values.cnpg.backup.destinationPath | default (printf "s3://%s/backups" $root.Values.s3.bucket) | quote }}
      endpointURL: {{ $root.Values.cnpg.backup.endpointURL | default (printf "http://%s-s3.%s.svc.cluster.local:8333" $root.Release.Name $root.Release.Namespace) | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ include "data-proxy.s3SecretName" $root }}
          key: S3_ACCESS_KEY
        secretAccessKey:
          name: {{ include "data-proxy.s3SecretName" $root }}
          key: S3_SECRET_KEY
      retentionPolicy: {{ printf "%d backups" (int $root.Values.cnpg.backup.backupRetention) | quote }}
    retentionPolicy: {{ printf "%d backups" (int $root.Values.cnpg.backup.backupRetention) | quote }}
  {{- end }}
{{- else if eq $root.Values.cnpg.mode "per-schema" }}
{{- range $schema, $stack := (default $root.Values.cnpg.schemas $root.Values.syncConfig.schemas) }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: duckdb
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  imageName: {{ $root.Values.cnpg.image | quote }}
  env:
    - name: HOME
      value: /var/lib/postgresql/data
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /var/lib/postgresql/data/gcp-key.json
  bootstrap:
    initdb:
      database: {{ $root.Values.pgduckdb.db.name | quote }}
      owner: {{ $root.Values.pgduckdb.db.user | quote }}
      encoding: UTF8
      dataChecksums: true
  instances: {{ default $root.Values.cnpg.instances $stack.instances | int }}
  postgresql:
    shared_preload_libraries:
      - pg_duckdb
      - pg_partman_bgw
    parameters:
      duckdb.allow_unsigned_extensions: "on"
      duckdb.allow_community_extensions: "on"
      duckdb.unsafe_allow_execution_inside_functions: "on"
      duckdb.postgres_role: authenticator
  storage:
    size: {{ default $root.Values.cnpg.storage.size (dig "storage" "size" $root.Values.cnpg.storage.size $stack) | quote }}
    {{- with $root.Values.cnpg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  managed:
    roles:
      - name: {{ $root.Values.pgduckdb.db.user | quote }}
        ensure: present
        superuser: true
        login: true
        passwordSecret:
          name: {{ include "data-proxy.fullname" $root }}-cnpg-dataproxy
      - name: {{ $root.Values.auth.authenticatorRole | quote }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "data-proxy.fullname" $root }}-cnpg-authenticator
  {{- if $root.Values.cnpg.backup.enabled }}
  backup:
    barmanObjectStore:
      destinationPath: {{ $root.Values.cnpg.backup.destinationPath | default (printf "s3://%s/backups/%s" $root.Values.s3.bucket $schema) | quote }}
      endpointURL: {{ $root.Values.cnpg.backup.endpointURL | default (printf "http://%s-s3.%s.svc.cluster.local:8333" $root.Release.Name $root.Release.Namespace) | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ include "data-proxy.s3SecretName" $root }}
          key: S3_ACCESS_KEY
        secretAccessKey:
          name: {{ include "data-proxy.s3SecretName" $root }}
          key: S3_SECRET_KEY
      retentionPolicy: {{ printf "%d backups" (int $root.Values.cnpg.backup.backupRetention) | quote }}
    retentionPolicy: {{ printf "%d backups" (int $root.Values.cnpg.backup.backupRetention) | quote }}
  {{- end }}
{{- end }}
{{- end }}
