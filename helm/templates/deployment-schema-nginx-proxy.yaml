{{- if .Values.ha.enabled }}
{{- $root := . }}
{{- range $schema, $_ := (default $root.Values.cnpg.schemas $root.Values.syncConfig.schemas) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" $root }}-{{ $schema | replace "_" "-" }}-nginx-proxy
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: nginx-proxy
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: nginx-proxy
      data-proxy.io/schema: {{ $schema | quote }}
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: nginx-proxy
        data-proxy.io/schema: {{ $schema | quote }}
        sidecar.istio.io/inject: {{ $root.Values.ingress.sidecarInject | quote }}
    spec:
      containers:
        - name: nginx
          image: {{ required "fallback.nginxImage must reference an image built from Dockerfile.proxy" $root.Values.fallback.nginxImage | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
        - name: webdis-write
          image: {{ $root.Values.fallback.webdisImage }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              escaped_password="$(printf '%s' "${VALKEY_PASSWORD:-}" | sed 's/[\\/&]/\\\\&/g')"
              sed "s/__VALKEY_PASSWORD__/${escaped_password}/g" /etc/webdis/webdis-write.json > /run/webdis-write/webdis.json
              exec /usr/local/bin/webdis /run/webdis-write/webdis.json
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.redisSecretName" $root }}
                  key: {{ include "data-proxy.redisPasswordKey" $root }}
          ports:
            - name: redis-http
              containerPort: 7379
          volumeMounts:
            - name: webdis-config
              mountPath: /etc/webdis
              readOnly: true
            - name: webdis-write-runtime
              mountPath: /run/webdis-write
          {{- with $root.Values.fallback.webdisResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: webdis-read
          image: {{ $root.Values.fallback.webdisImage }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              escaped_password="$(printf '%s' "${VALKEY_PASSWORD:-}" | sed 's/[\\/&]/\\\\&/g')"
              sed "s/__VALKEY_PASSWORD__/${escaped_password}/g" /etc/webdis/webdis-read.json > /run/webdis-read/webdis.json
              exec /usr/local/bin/webdis /run/webdis-read/webdis.json
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.redisSecretName" $root }}
                  key: {{ include "data-proxy.redisPasswordKey" $root }}
          ports:
            - name: redis-http-read
              containerPort: 7380
          volumeMounts:
            - name: webdis-config
              mountPath: /etc/webdis
              readOnly: true
            - name: webdis-read-runtime
              mountPath: /run/webdis-read
          {{- with $root.Values.fallback.webdisResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "data-proxy.fullname" $root }}-{{ $schema | replace "_" "-" }}-nginx-proxy
        - name: webdis-config
          configMap:
            name: {{ $root.Values.redis.webdisConfigMap }}
        - name: webdis-write-runtime
          emptyDir: {}
        - name: webdis-read-runtime
          emptyDir: {}
{{- end }}
{{- end }}
