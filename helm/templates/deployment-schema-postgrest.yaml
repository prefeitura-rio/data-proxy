{{/*
{
  "kind": "template",
  "description": "Render the per-schema PostgREST deployment.",
  "inputs": {
    "values": "Helm chart values used by this resource.",
    "release": "Helm release context used in resource names.",
    "chart": "Helm chart metadata used in labels."
  }
}
*/}}
{{- if eq .Values.cnpg.mode "per-schema" }}
{{- $root := . }}
{{- range $schema, $stack := (default $root.Values.cnpg.schemas $root.Values.syncConfig.schemas) }}
{{- $cluster := include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}
{{- range $mode := list "ro" "rw" }}
{{- $databaseService := ternary (printf "%s-pooler-ro" $cluster) (printf "%s-rw" $cluster) (eq $mode "ro") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $cluster }}-postgrest-{{ $mode }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: postgrest-{{ $mode }}
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: postgrest-{{ $mode }}
      data-proxy.io/schema: {{ $schema | quote }}
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: postgrest-{{ $mode }}
        data-proxy.io/schema: {{ $schema | quote }}
        sidecar.istio.io/inject: {{ $root.Values.ingress.sidecarInject | quote }}
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "data-proxy.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: postgrest-{{ $mode }}
              data-proxy.io/schema: {{ $schema | quote }}
      initContainers:
        - name: fetch-jwks
          image: {{ $root.Values.postgrest.jwksFetch.image }}
          command: ["/usr/bin/nu", "-c"]
          args:
            - |
{{ $root.Files.Get "files/fetch-jwks.nu" | nindent 14 }}
          env:
            - name: JWKS_URI
              value: {{ $root.Values.postgrest.jwksUri | quote }}
          volumeMounts:
            - name: jwks
              mountPath: /etc/postgrest
        - name: wait-for-authenticator
          image: {{ $root.Values.cnpg.init.image | quote }}
          imagePullPolicy: {{ $root.Values.sync.imagePullPolicy }}
          command: ["/usr/bin/nu", "-c"]
          args:
            - |
{{ $root.Files.Get "files/wait-for-authenticator.nu" | nindent 14 }}
          env:
            - name: PGHOST
              value: {{ $databaseService | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT
              value: "2"
            - name: PGDATABASE
              value: {{ $root.Values.cnpg.db.name | quote }}
            - name: PGUSER
              value: {{ $root.Values.auth.authenticatorRole | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.authenticatorSecretName" $root }}
                  key: password
      containers:
        - name: postgrest
          image: {{ $root.Values.postgrest.image }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PGRST_AUTHENTICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.authenticatorSecretName" $root }}
                  key: password
            - name: PGRST_DB_URI
              value: {{ printf "postgres://%s:$(PGRST_AUTHENTICATOR_PASSWORD)@%s:5432/%s" $root.Values.auth.authenticatorRole $databaseService $root.Values.cnpg.db.name | quote }}
            {{- if eq $mode "ro" }}
            - name: PGRST_DB_PREPARED_STATEMENTS
              value: "false"
            - name: PGRST_DB_CHANNEL_ENABLED
              value: "false"
            {{- end }}
            - name: PGRST_DB_SCHEMAS
              value: {{ $schema | quote }}
            - name: PGRST_DB_ANON_ROLE
              value: {{ $root.Values.auth.anonRole | quote }}
            - name: PGRST_JWT_ROLE_CLAIM_KEY
              value: {{ $root.Values.auth.jwtRoleClaim | quote }}
            - name: PGRST_DB_PRE_REQUEST
              value: {{ printf "%s.pre_request" $root.Values.auth.rlsSchema | quote }}
            - name: PGRST_JWT_SECRET
              value: "@/etc/postgrest/jwks.json"
            - name: PGRST_DB_MAX_ROWS
              value: {{ $root.Values.postgrest.maxRows | quote }}
            - name: PGRST_OPENAPI_SERVER_PROXY_URI
              value: {{ $root.Values.postgrest.proxyUri | quote }}
            - name: PGRST_OPENAPI_SECURITY_ACTIVE
              value: "true"
            - name: PGRST_OPENAPI_MODE
              value: ignore-privileges
          volumeMounts:
            - name: jwks
              mountPath: /etc/postgrest
              readOnly: true
          resources:
            {{- toYaml (ternary $root.Values.postgrest.ro.resources $root.Values.postgrest.rw.resources (eq $mode "ro")) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
      volumes:
        - name: jwks
          emptyDir: {}
{{- end }}
{{- end }}
{{- end }}
