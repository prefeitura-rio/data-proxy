{{- if and .Values.ingress.enabled .Values.ingress.auth.enabled }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "data-proxy.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals:
              - "*"
    {{- if .Values.swaggerUi.enabled }}
    - to:
        - operation:
            methods:
              - GET
            paths:
              - /
    {{- end }}
    - to:
        - operation:
            methods:
              - GET
            paths:
              - /health
{{- end }}
