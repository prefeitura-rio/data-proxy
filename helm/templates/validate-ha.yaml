{{/*
{
  "kind": "template",
  "description": "Render the HA validation Job.",
  "inputs": {
    "values": "Helm chart values used by this resource.",
    "release": "Helm release context used in resource names.",
    "chart": "Helm chart metadata used in labels."
  }
}
*/}}
{{- if .Values.ha.enabled }}
{{- if not (eq .Values.cnpg.mode "per-schema") }}
{{- fail "ha.enabled requires cnpg.mode=per-schema" }}
{{- end }}
{{- if empty .Values.redis.existingSecret }}
{{- fail "redis.existingSecret is required" }}
{{- end }}
{{- if not (.Values.syncConfig.schemas | default dict) }}
{{- fail "ha.enabled requires at least one syncConfig schema" }}
{{- end }}
{{- $names := list }}
{{- range .Values.ha.schemas }}
{{- $name := required "ha.schemas entries require name" .name }}
{{- if not (hasKey $.Values.syncConfig.schemas $name) }}
{{- fail (printf "ha.schemas[%s] is not present in syncConfig.schemas" $name) }}
{{- end }}
{{- if has $name $names }}
{{- fail (printf "ha.schemas contains duplicate schema %s" $name) }}
{{- end }}
{{- $names = append $names $name }}
{{- end }}
{{- end }}
