apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "data-proxy.fullname" . }}-publisher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: publisher
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    ## A failed publisher exits non-zero and leaves its message pending.
    ## The stream reclaims the message, so Kubernetes must not retry the Job.
    backoffLimit: 0
    template:
      metadata:
        labels:
          {{- include "data-proxy.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: publisher
      spec:
        ## A Job accepts Never or OnFailure only. One pod publishes one schema.
        restartPolicy: Never
        terminationGracePeriodSeconds: {{ .Values.publisher.terminationGracePeriodSeconds }}
        serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
        containers:
          - name: publisher
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            command: ["python", "-m", "dp.sync.publisher"]
            env:
              {{- include "data-proxy.appEnv" . | nindent 14 }}
            volumeMounts:
              {{- include "data-proxy.syncConfigVolumeMount" . | nindent 14 }}
              {{- include "data-proxy.schemaWritersVolumeMount" . | nindent 14 }}
              {{- include "data-proxy.gcpVolumeMount" . | nindent 14 }}
        volumes:
          {{- include "data-proxy.syncConfigVolume" . | nindent 10 }}
          {{- include "data-proxy.schemaWritersVolume" . | nindent 10 }}
          {{- include "data-proxy.gcpVolume" . | nindent 10 }}
  pollingInterval: {{ .Values.publisher.keda.pollingInterval }}
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.publisher.keda.maxReplicaCount | default (max 1 (len .Values.syncConfig.schemas)) }}
  successfulJobsHistoryLimit: {{ .Values.publisher.keda.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.publisher.keda.failedJobsHistoryLimit }}
  triggers:
    - type: redis-streams
      authenticationRef:
        name: {{ include "data-proxy.fullname" . }}-valkey-trigger-auth
      metadata:
        address: {{ include "data-proxy.redisWriterAddress" . }}
        stream: dp:publish
        consumerGroup: publishers
        lagCount: "1"
    - type: redis-streams
      authenticationRef:
        name: {{ include "data-proxy.fullname" . }}-valkey-trigger-auth
      metadata:
        address: {{ include "data-proxy.redisWriterAddress" . }}
        stream: dp:publish
        consumerGroup: publishers
        pendingEntriesCount: {{ .Values.publisher.keda.pendingEntriesCount | quote }}
