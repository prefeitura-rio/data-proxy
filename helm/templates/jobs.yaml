apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-configure-db-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: configure-db
data:
  configure-db.nu: |
{{ .Files.Get "files/configure-db.nu" | nindent 4 }}
  lib.nu: |
{{ .Files.Get "files/lib.nu" | nindent 4 }}
  wait-for-postgres.nu: |
{{ .Files.Get "files/wait-for-postgres.nu" | nindent 4 }}
  fetch-jwks.nu: |
{{ .Files.Get "files/fetch-jwks.nu" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-configure-db-sql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: configure-db
data:
{{- range $path, $_ := .Files.Glob "files/templates/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "files/templates/**/*.sql" }}
  {{ base (dir $path) }}_{{ base $path }}: |
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "data-proxy.fullname" . }}-configure-db-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: configure-db
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: configure-db
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      initContainers:
        {{- include "data-proxy.s3WaitInitContainer" . | nindent 8 }}
      containers:
        - name: configure-db
          image: {{ .Values.jobs.image | quote }}
          imagePullPolicy: {{ .Values.sync.imagePullPolicy }}
          command: [nu, /scripts/configure-db.nu]
          workingDir: /scripts
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: password
            - name: PG_DATABASE_URL
              value: {{ printf "postgresql://%s@%s-rw:5432/%s" .Values.cnpg.db.user (include "data-proxy.fullname" .) .Values.cnpg.db.name | quote }}
            - name: PGHOST
              value: {{ printf "%s-rw" (include "data-proxy.fullname" .) | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.cnpg.db.name | quote }}
            - name: PGUSER
              value: {{ .Values.cnpg.db.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: password
            - name: AUTH_ANON_ROLE
              value: {{ .Values.auth.anonRole | quote }}
            - name: AUTH_USER_ROLE
              value: {{ .Values.auth.userRole | quote }}
            - name: AUTH_AUTHENTICATOR_ROLE
              value: {{ .Values.auth.authenticatorRole | quote }}
            - name: DBOS_APPLICATION_NAME
              value: {{ .Values.sync.dbos.applicationName | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.s3SecretName" . }}
                  key: S3_SECRET_KEY
            - name: S3_ENDPOINT
              value: {{ include "data-proxy.s3Endpoint" . | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.s3.useSsl | quote }}
            - name: SYNC_CONFIG_PATH
              value: /config/sync.json
            - name: SQL_TEMPLATE_DIR
              value: /templates
          volumeMounts:
            {{- include "data-proxy.syncConfigVolumeMount" . | nindent 12 }}
            - name: configure-db-script
              mountPath: /scripts
              readOnly: true
            - name: configure-db-sql
              mountPath: /templates
              readOnly: true
      volumes:
        {{- include "data-proxy.syncConfigVolume" . | nindent 8 }}
        {{- include "data-proxy.s3BootstrapVolume" . | nindent 8 }}
        - name: configure-db-script
          configMap:
            name: {{ include "data-proxy.fullname" . }}-configure-db-script
            defaultMode: 0555
        - name: configure-db-sql
          configMap:
            name: {{ include "data-proxy.fullname" . }}-configure-db-sql
            defaultMode: 0444
            items:
{{- range $path, $_ := .Files.Glob "files/templates/*.sql" }}
              - key: {{ base $path }}
                path: {{ base $path }}
{{- end }}
{{- range $path, $_ := .Files.Glob "files/templates/**/*.sql" }}
              - key: {{ base (dir $path) }}_{{ base $path }}
                path: {{ base (dir $path) }}/{{ base $path }}
{{- end }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "data-proxy.fullname" . }}-s3-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3-bootstrap
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: s3-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: {{ .Values.jobs.image | quote }}
          command: [nu, /s3-bootstrap/ensure-s3-bucket.nu, {{ if .Values.s3.bootstrap.createIfMissing }}--create{{ else }}--wait{{ end }}]
          env:
            {{- include "data-proxy.s3BootstrapEnv" . | nindent 12 }}
          volumeMounts:
            - name: s3-bootstrap
              mountPath: /s3-bootstrap
              readOnly: true
      volumes:
        {{- include "data-proxy.s3BootstrapVolume" . | nindent 8 }}

---
{{- if .Values.jobs.backup.enabled }}
{{- $root := . }}
{{- range $schema, $_ := .Values.sync.config.schemas }}
{{- $backupName := printf "%s-%s-backup" (include "data-proxy.fullname" $root) ($schema | replace "_" "-") }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $backupName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: backup
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  schedule: {{ $root.Values.jobs.backup.schedule | quote }}
  startingDeadlineSeconds: {{ $root.Values.jobs.backup.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $root.Values.jobs.backup.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $root.Values.jobs.backup.ttlSecondsAfterFinished }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "data-proxy.selectorLabels" $root | nindent 12 }}
            app.kubernetes.io/component: backup
            data-proxy.io/schema: {{ $schema | quote }}
        spec:
          restartPolicy: Never
          initContainers:
            {{- include "data-proxy.backupS3WaitInitContainer" $root | nindent 12 }}
          containers:
            - name: backup
              image: {{ $root.Values.jobs.image | quote }}
              command: [nu, /scripts/backup.nu]
              workingDir: /scripts
              env:
                - name: SCHEMA
                  value: {{ $schema | quote }}
                - name: PGHOST
                  value: {{ printf "%s-rw" (include "data-proxy.fullname" $root) | quote }}
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: {{ $root.Values.cnpg.db.name | quote }}
                - name: PGUSER
                  value: {{ $root.Values.cnpg.db.user | quote }}
                - name: PG_DATABASE_URL
                  value: {{ printf "postgresql://%s@%s-rw:5432/%s" $root.Values.cnpg.db.user (include "data-proxy.fullname" $root) $root.Values.cnpg.db.name | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.dbSecretName" $root }}
                      key: password
                - name: BACKUP_PREFIX
                  value: {{ $root.Values.jobs.backup.prefix | quote }}
                - name: S3_BUCKET
                  value: {{ required "jobs.backup.s3.bucket is required when backup is enabled" $root.Values.jobs.backup.s3.bucket | quote }}
                - name: S3_ENDPOINT
                  value: {{ required "jobs.backup.s3.endpointURL is required when backup is enabled" $root.Values.jobs.backup.s3.endpointURL | quote }}
                - name: S3_USE_SSL
                  value: "true"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "jobs.backup.s3.existingSecret is required when backup is enabled" $root.Values.jobs.backup.s3.existingSecret }}
                      key: S3_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "jobs.backup.s3.existingSecret is required when backup is enabled" $root.Values.jobs.backup.s3.existingSecret }}
                      key: S3_SECRET_KEY
                - name: ACCESS_LOG_RETENTION_DAYS
                  value: {{ $root.Values.jobs.backup.accessLog.retentionDays | quote }}
                - name: DUCKLAKE_CATALOG_PATH
                  value: {{ $root.Values.ducklake.catalogLocalPath | quote }}
                - name: SQL_TEMPLATE_DIR
                  value: /scripts
                {{- if $root.Values.gcp.existingSecret }}
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: {{ $root.Values.gcp.mountPath | quote }}
                {{- end }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: catalogs
                  mountPath: {{ $root.Values.ducklake.catalogLocalPath }}
                  readOnly: true
                {{- include "data-proxy.gcpVolumeMount" $root | nindent 16 }}
          volumes:
            - name: scripts
              configMap:
                name: {{ include "data-proxy.fullname" $root }}-scripts
                defaultMode: 0555
                items:
                  - key: backup.nu
                    path: backup.nu
                  - key: lib.nu
                    path: lib.nu
{{- range $path, $_ := $root.Files.Glob "files/templates/*.sql" }}
                  - key: {{ base $path }}
                    path: {{ base $path }}
{{- end }}
{{- range $path, $_ := $root.Files.Glob "files/templates/**/*.sql" }}
                  - key: {{ base (dir $path) }}_{{ base $path }}
                    path: {{ base (dir $path) }}/{{ base $path }}
{{- end }}
            - name: catalogs
              persistentVolumeClaim:
                claimName: {{ include "data-proxy.fullname" $root }}-catalog-reader
                readOnly: true
            {{- include "data-proxy.gcpVolume" $root | nindent 12 }}
            {{- include "data-proxy.s3BootstrapVolume" $root | nindent 12 }}
{{- end }}
{{- end }}
---
{{- if .Values.jobs.maintenance.enabled }}
{{- $root := . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "data-proxy.fullname" $root }}-maintenance
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: maintenance
spec:
  schedule: {{ $root.Values.jobs.maintenance.schedule | quote }}
  startingDeadlineSeconds: {{ $root.Values.jobs.maintenance.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "data-proxy.selectorLabels" $root | nindent 12 }}
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: Never
          initContainers:
            {{- include "data-proxy.s3WaitInitContainer" $root | nindent 12 }}
          containers:
            - name: maintenance
              image: {{ $root.Values.jobs.image | quote }}
              imagePullPolicy: {{ $root.Values.sync.imagePullPolicy }}
              command: [nu, /scripts/maintenance.nu]
              workingDir: /scripts
              env:
                - name: PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.dbSecretName" $root }}
                      key: password
                - name: PG_DATABASE_URL
                  value: {{ include "data-proxy.appPgDsn" $root | quote }}
                - name: SYNC_CONFIG_PATH
                  value: /config/sync.json
                - name: DBOS_APP_SCHEMA
                  value: {{ $root.Values.sync.dbos.appSchema | quote }}
                - name: S3_BUCKET
                  value: {{ $root.Values.s3.bucket | quote }}
                - name: S3_ENDPOINT
                  value: {{ include "data-proxy.s3Endpoint" $root | quote }}
                - name: S3_USE_SSL
                  value: {{ $root.Values.s3.useSsl | quote }}
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.s3SecretName" $root }}
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.s3SecretName" $root }}
                      key: S3_SECRET_KEY
                - name: DUCKLAKE_CATALOG_PATH
                  value: {{ $root.Values.ducklake.catalogPath | quote }}
                - name: DUCKLAKE_CATALOG_LOCAL_PATH
                  value: {{ $root.Values.ducklake.catalogLocalPath | quote }}
                - name: DUCKLAKE_SNAPSHOT_EXPIRATION
                  value: {{ $root.Values.ducklake.snapshotExpiration | quote }}
                - name: DUCKLAKE_MAX_COMPACTED_FILES
                  value: {{ $root.Values.ducklake.maxCompactedFiles | quote }}
                - name: DUCKLAKE_REWRITE_DELETE_THRESHOLD
                  value: {{ $root.Values.ducklake.rewriteDeleteThreshold | quote }}
                - name: SQL_TEMPLATE_DIR
                  value: /scripts
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: sync-config
                  mountPath: /config
                  readOnly: true
                - name: catalogs
                  mountPath: {{ $root.Values.ducklake.catalogLocalPath }}
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: {{ include "data-proxy.fullname" $root }}-scripts
                defaultMode: 0555
                items:
                  - key: maintenance.nu
                    path: maintenance.nu
                  - key: lib.nu
                    path: lib.nu
{{- range $path, $_ := $root.Files.Glob "files/templates/*.sql" }}
                  - key: {{ base $path }}
                    path: {{ base $path }}
{{- end }}
{{- range $path, $_ := $root.Files.Glob "files/templates/**/*.sql" }}
                  - key: {{ base (dir $path) }}_{{ base $path }}
                    path: {{ base (dir $path) }}/{{ base $path }}
{{- end }}
            - name: sync-config
              configMap:
                name: {{ include "data-proxy.fullname" $root }}-sync
            - name: catalogs
              persistentVolumeClaim:
                claimName: {{ include "data-proxy.fullname" $root }}-catalog-reader
                readOnly: true
            {{- include "data-proxy.s3BootstrapVolume" $root | nindent 12 }}
{{- end }}
