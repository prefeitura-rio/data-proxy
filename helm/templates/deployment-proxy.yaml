{{/*
{
  "kind": "template",
  "description": "Render the shared proxy deployment.",
  "inputs": {
    "values": "Helm chart values used by this resource.",
    "release": "Helm release context used in resource names.",
    "chart": "Helm chart metadata used in labels."
  }
}
*/}}
{{- if not false }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      annotations:
        checksum/proxy-config: {{ printf "%s%s" (include "data-proxy.nginxProxyConfig" .) (include "data-proxy.webdisWriteConfig" .) | sha256sum }}
        checksum/sync-config: {{ .Values.sync.config | toJson | sha256sum }}
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
        sidecar.istio.io/inject: {{ .Values.ingress.sidecarInject | quote }}
    spec:
      containers:
        - name: nginx
          image: {{ required "fallback.proxyImage must reference an image built from Dockerfile.proxy" .Values.fallback.proxyImage | quote }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CACHE_TTL
              value: {{ toString .Values.fallback.cacheTtl | quote }}
            - name: EMPTY_CACHE_TTL
              value: {{ toString .Values.fallback.emptyCacheTtl | quote }}
            - name: MAX_BODY
              value: {{ toString .Values.fallback.maxCacheBodyBytes | quote }}
            - name: FETCH_BUFFER_SIZE
              value: {{ toString .Values.fallback.fetchBufferSize | quote }}
            - name: FETCH_TIMEOUT
              value: {{ toString .Values.fallback.fetchTimeout | quote }}
            - name: FETCH_KEEPALIVE
              value: {{ toString .Values.fallback.fetchKeepalive | quote }}
            - name: FETCH_KEEPALIVE_TIMEOUT
              value: {{ toString .Values.fallback.fetchKeepaliveTimeout | quote }}
            - name: LARGE_CLIENT_HEADER_BUFFERS
              value: {{ toString .Values.fallback.largeClientHeaderBuffers | quote }}
          volumeMounts:
            {{- include "data-proxy.syncConfigVolumeMount" . | nindent 12 }}
            - name: config
              mountPath: /etc/nginx/templates/nginx.conf.template
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          {{- with .Values.fallback.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: webdis-write
          image: {{ .Values.fallback.webdisImage }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              escaped_password="$(printf '%s' "${VALKEY_PASSWORD:-}" | sed 's/[\\/&]/\\\\&/g')"
              sed "s/__VALKEY_PASSWORD__/${escaped_password}/g" /etc/webdis/webdis-write.json > /run/webdis-write/webdis.json
              exec /usr/local/bin/webdis /run/webdis-write/webdis.json
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.redisSecretName" . }}
                  key: {{ include "data-proxy.redisPasswordKey" . }}
          ports:
            - name: redis-http
              containerPort: 7379
          volumeMounts:
            - name: webdis-config
              mountPath: /etc/webdis
              readOnly: true
            - name: webdis-write-runtime
              mountPath: /run/webdis-write
          {{- with .Values.fallback.webdisResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: webdis-read
          image: {{ .Values.fallback.webdisImage }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              escaped_password="$(printf '%s' "${VALKEY_PASSWORD:-}" | sed 's/[\\/&]/\\\\&/g')"
              sed "s/__VALKEY_PASSWORD__/${escaped_password}/g" /etc/webdis/webdis-read.json > /run/webdis-read/webdis.json
              exec /usr/local/bin/webdis /run/webdis-read/webdis.json
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.redisSecretName" . }}
                  key: {{ include "data-proxy.redisPasswordKey" . }}
          ports:
            - name: redis-http-read
              containerPort: 7380
          volumeMounts:
            - name: webdis-config
              mountPath: /etc/webdis
              readOnly: true
            - name: webdis-read-runtime
              mountPath: /run/webdis-read
          {{- with .Values.fallback.webdisResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "data-proxy.syncConfigVolume" . | nindent 8 }}
        - name: config
          configMap:
            name: {{ include "data-proxy.fullname" . }}-proxy
        - name: webdis-config
          configMap:
            name: {{ include "data-proxy.fullname" . }}-webdis
        - name: webdis-write-runtime
          emptyDir: {}
        - name: webdis-read-runtime
          emptyDir: {}
{{- end }}
