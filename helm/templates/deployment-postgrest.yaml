{{- if not (and .Values.ha.enabled (not (empty .Values.ha.schemas))) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-postgrest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgrest
spec:
  replicas: {{ .Values.postgrest.replicas }}
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgrest
  template:
    metadata:
      annotations:
        checksum/sync-config: {{ .Values.syncConfig | toJson | sha256sum }}
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgrest
        sidecar.istio.io/inject: {{ .Values.ingress.sidecarInject | quote }}
    spec:
      initContainers:
        - name: db-migrate
          image: {{ .Values.postgrest.dbMigrate.image | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready --host="$PGHOST" --port="$PGPORT" --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"; do
                echo "waiting for database at $PGHOST:$PGPORT"
                sleep 2
              done
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -f /scripts/01_extensions.sql
              /bin/sh /scripts/02_roles.sh
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -f /scripts/03_pre_request.sql
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -f /scripts/04_access_policy.sql
          env:
            - name: PGHOST
              value: {{ include "data-proxy.migrationDatabaseHost" . | quote }}
            - name: PGPORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.pgduckdb.db.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.pgduckdb.db.name | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGRST_AUTHENTICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: PGRST_AUTHENTICATOR_PASSWORD
            {{- if .Values.backup.enabled }}
            - name: BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.backupSecretName" . }}
                  key: BACKUP_PASSWORD
            {{- end }}
          volumeMounts:
            - name: db-init
              mountPath: /scripts
              readOnly: true
        - name: fetch-jwks
          image: {{ .Values.postgrest.jwksFetch.image }}
          command:
            - /bin/sh
            - -c
          args:
            - |
{{ .Files.Get "files/scripts/fetch-jwks.sh" | nindent 14 }}
          env:
            - name: JWKS_URI
              value: {{ .Values.postgrest.jwksUri | quote }}
            - name: CURL_VERSION
              value: {{ .Values.postgrest.jwksFetch.curlVersion | quote }}
            - name: JQ_VERSION
              value: {{ .Values.postgrest.jwksFetch.jqVersion | quote }}
          volumeMounts:
            - name: jwks
              mountPath: /etc/postgrest
      volumes:
        - name: db-init
          configMap:
            name: {{ include "data-proxy.fullname" . }}-db-init
            defaultMode: 0755
        - name: jwks
          emptyDir: {}
      containers:
        - name: postgrest
          image: {{ .Values.postgrest.image }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PGRST_AUTHENTICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: PGRST_AUTHENTICATOR_PASSWORD
            - name: PGRST_DB_URI
              value: {{ include "data-proxy.postgresDsn" . | quote }}
            - name: PGRST_DB_SCHEMAS
              value: {{ keys (.Values.syncConfig.schemas | default dict) | sortAlpha | join "," | quote }}
            - name: PGRST_DB_ANON_ROLE
              value: {{ .Values.auth.anonRole | quote }}
            - name: PGRST_JWT_ROLE_CLAIM_KEY
              value: {{ .Values.auth.jwtRoleClaim | quote }}
            - name: PGRST_DB_PRE_REQUEST
              value: {{ printf "%s.pre_request" .Values.auth.rlsSchema | quote }}
            - name: PGRST_JWT_SECRET
              value: "@/etc/postgrest/jwks.json"
            - name: PGRST_DB_MAX_ROWS
              value: {{ .Values.postgrest.maxRows | quote }}
            - name: PGRST_DB_AGGREGATES_ENABLED
              value: {{ .Values.postgrest.aggregatesEnabled | quote }}
            - name: PGRST_OPENAPI_SERVER_PROXY_URI
              value: {{ .Values.postgrest.proxyUri | quote }}
            - name: PGRST_OPENAPI_SECURITY_ACTIVE
              value: "true"
            {{- if .Values.swaggerUi.enabled }}
            - name: PGRST_OPENAPI_MODE
              value: ignore-privileges
            {{- end }}
          volumeMounts:
            - name: jwks
              mountPath: /etc/postgrest
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
