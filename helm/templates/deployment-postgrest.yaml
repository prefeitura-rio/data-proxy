{{- if not (and .Values.ha.enabled (not (empty .Values.ha.schemas))) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-postgrest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgrest
spec:
  replicas: {{ .Values.postgrest.replicas }}
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgrest
  template:
    metadata:
      annotations:
        checksum/sync-config: {{ .Values.syncConfig | toJson | sha256sum }}
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgrest
        # The fallback proxy is the only entrance when it is enabled.
        sidecar.istio.io/inject: {{ and .Values.ingress.sidecarInject (not .Values.fallback.enabled) | quote }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        {{- if not .Values.postgrest.jwtSecret }}
        - name: fetch-jwks
          image: {{ .Values.postgrest.jwksFetch.image }}
          command:
            - /usr/bin/nu
            - -c
          args:
            - |
{{ .Files.Get "files/fetch-jwks.nu" | nindent 14 }}
          env:
            - name: JWKS_URI
              value: {{ .Values.postgrest.jwksUri | quote }}
          volumeMounts:
            - name: jwks
              mountPath: /etc/postgrest
        {{- end }}
      volumes:
        {{- if not .Values.postgrest.jwtSecret }}
        - name: jwks
          emptyDir: {}
        {{- end }}
      containers:
        - name: postgrest
          image: {{ .Values.postgrest.image }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PGRST_AUTHENTICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: PGRST_AUTHENTICATOR_PASSWORD
            - name: PGRST_DB_URI
              value: {{ include "data-proxy.postgresDsn" . | quote }}
            - name: PGRST_DB_SCHEMAS
              value: {{ append (keys (.Values.syncConfig.schemas | default dict) | sortAlpha) .Values.auth.rlsSchema | join "," | quote }}
            - name: PGRST_DB_ANON_ROLE
              value: {{ .Values.auth.anonRole | quote }}
            - name: PGRST_JWT_ROLE_CLAIM_KEY
              value: {{ .Values.auth.jwtRoleClaim | quote }}
            - name: PGRST_DB_PRE_REQUEST
              value: {{ printf "%s.pre_request" .Values.auth.rlsSchema | quote }}
            - name: PGRST_JWT_SECRET
              {{- if .Values.postgrest.jwtSecret }}
              value: {{ .Values.postgrest.jwtSecret | quote }}
              {{- else }}
              value: "@/etc/postgrest/jwks.json"
              {{- end }}
            - name: PGRST_DB_MAX_ROWS
              value: {{ .Values.postgrest.maxRows | quote }}
            - name: PGRST_DB_AGGREGATES_ENABLED
              value: {{ .Values.postgrest.aggregatesEnabled | quote }}
            - name: PGRST_OPENAPI_SERVER_PROXY_URI
              value: {{ .Values.postgrest.proxyUri | quote }}
            - name: PGRST_OPENAPI_SECURITY_ACTIVE
              value: "true"
            {{- if .Values.swaggerUi.enabled }}
            - name: PGRST_OPENAPI_MODE
              value: ignore-privileges
            {{- end }}
          volumeMounts:
            {{- if not .Values.postgrest.jwtSecret }}
            - name: jwks
              mountPath: /etc/postgrest
              readOnly: true
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
