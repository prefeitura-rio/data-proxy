{{- $root := . }}
{{- $variants := list (dict "suffix" "" "component" "postgrest" "pooler" "pooler") }}
{{- if $root.Values.ha.enabled }}
{{- $variants = append $variants (dict "suffix" "-ro" "component" "postgrest-ro" "pooler" "pooler-ro") }}
{{- end }}
{{- range $variant := $variants }}
{{- with $root }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-postgrest{{ $variant.suffix }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $variant.component }}
spec:
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $variant.component }}
  template:
    metadata:
      annotations:
        checksum/sync-config: {{ .Values.sync.config | toJson | sha256sum }}
        checksum/s3-credentials: {{ include "data-proxy.s3CredentialsChecksum" . }}
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $variant.component }}
        sidecar.istio.io/inject: {{ .Values.ingress.sidecarInject | quote }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        {{- if not .Values.postgrest.jwtSecret }}
        - name: fetch-jwks
          image: {{ .Values.jobs.image }}
          command:
            - /usr/local/bin/nu
            - -c
          args:
            - |
{{ .Files.Get "files/fetch-jwks.nu" | nindent 14 }}
          env:
            - name: JWKS_URI
              value: {{ .Values.postgrest.jwksUri | quote }}
          volumeMounts:
            - name: jwks
              mountPath: /etc/postgrest
        {{- end }}
        - name: wait-for-postgres
          image: {{ .Values.jobs.image | quote }}
          imagePullPolicy: {{ .Values.sync.imagePullPolicy }}
          command: ["/usr/local/bin/nu", "/scripts/wait-for-postgres.nu"]
          env:
            - name: PGHOST
              value: {{ printf "%s-rw" (include "data-proxy.fullname" .) | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT
              value: "2"
            - name: PGDATABASE
              value: {{ .Values.cnpg.db.name | quote }}
            - name: PGUSER
              value: {{ .Values.auth.authenticatorRole | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.authenticatorSecretName" . }}
                  key: password
          volumeMounts:
            - name: init-db-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: init-db-script
          configMap:
            name: {{ include "data-proxy.fullname" . }}-init-db-script
            defaultMode: 0555
        {{- if not .Values.postgrest.jwtSecret }}
        - name: jwks
          emptyDir: {}
        {{- end }}
      containers:
        - name: postgrest
          image: {{ .Values.postgrest.image }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PGRST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.authenticatorSecretName" . }}
                  key: password
            - name: PGRST_DB_URI
              value: {{ include "data-proxy.postgresPoolerDsn" (dict "root" . "pooler" $variant.pooler) | quote }}
            - name: PGRST_DB_PREPARED_STATEMENTS
              value: "false"
            - name: PGRST_DB_CHANNEL_ENABLED
              value: "false"
            - name: PGRST_DB_SCHEMAS
              value: {{ append (keys (.Values.sync.config.schemas | default dict) | sortAlpha) .Values.auth.rlsSchema | join "," | quote }}
            - name: PGRST_DB_ANON_ROLE
              value: {{ .Values.auth.anonRole | quote }}
            - name: PGRST_JWT_ROLE_CLAIM_KEY
              value: {{ .Values.auth.jwtRoleClaim | quote }}
            - name: PGRST_DB_PRE_REQUEST
              value: {{ printf "%s.pre_request" .Values.auth.rlsSchema | quote }}
            - name: PGRST_JWT_SECRET
              {{- if .Values.postgrest.jwtSecret }}
              value: {{ .Values.postgrest.jwtSecret | quote }}
              {{- else }}
              value: "@/etc/postgrest/jwks.json"
              {{- end }}
            - name: PGRST_DB_MAX_ROWS
              value: {{ .Values.postgrest.maxRows | quote }}
            - name: PGRST_DB_AGGREGATES_ENABLED
              value: {{ .Values.postgrest.aggregatesEnabled | quote }}
            - name: PGRST_OPENAPI_SERVER_PROXY_URI
              value: {{ .Values.postgrest.proxyUri | quote }}
            - name: PGRST_OPENAPI_SECURITY_ACTIVE
              value: "true"
            {{- if .Values.swaggerUi.enabled }}
            - name: PGRST_OPENAPI_MODE
              value: ignore-privileges
            {{- end }}
          volumeMounts:
            {{- if not .Values.postgrest.jwtSecret }}
            - name: jwks
              mountPath: /etc/postgrest
              readOnly: true
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.postgrest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
