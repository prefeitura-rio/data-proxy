{{- $root := . }}
{{- $ownerName := include "data-proxy.dbSecretName" $root }}
{{- $owner := lookup "v1" "Secret" $root.Release.Namespace $ownerName }}
{{- $ownerPassword := randAlphaNum 32 }}
{{- if $owner }}
{{- if hasKey $owner.data "password" }}
{{- $ownerPassword = index $owner.data "password" | b64dec }}
{{- else if hasKey $owner.data "POSTGRES_PASSWORD" }}
{{- $ownerPassword = index $owner.data "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
{{- end }}
{{- if not $root.Values.cnpg.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ownerName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $root.Values.cnpg.db.user | quote }}
  password: {{ $ownerPassword | quote }}
  POSTGRES_PASSWORD: {{ $ownerPassword | quote }}
---
{{- end }}
{{- if $root.Values.cnpg.existingSecret }}
{{- if not $root.Values.schemaWriters.existingSecret }}
{{- fail "schemaWriters.existingSecret is required when cnpg.existingSecret is set" }}
{{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-proxy.schemaWritersSecretName" $root }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: Opaque
stringData:
  writers.json: |
    {"writers": {
    {{- $schemas := keys $root.Values.syncConfig.schemas | sortAlpha }}
    {{- range $index, $schema := $schemas }}
    {{ $schema | quote }}: {{ printf "postgresql://%s:%s@%s-rw:5432/%s" $root.Values.cnpg.db.user $ownerPassword (include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema)) $root.Values.cnpg.db.name | quote }}{{ if lt (add1 $index) (len $schemas) }},{{ end }}
    {{- end }}
    }}
{{- end }}
