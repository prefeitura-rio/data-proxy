{{- if .Values.ha.enabled }}
{{- $root := . }}
{{- range $schema, $_ := (default $root.Values.cnpg.schemas $root.Values.syncConfig.schemas) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" $root }}-{{ $schema | replace "_" "-" }}-nginx-proxy
  namespace: {{ $root.Release.Namespace }}
data:
  nginx.conf: |
{{ $root.Files.Get "files/nginx.conf" | replace "__PGRST_MAP__" (printf "default \\\"http://%s-%s-postgrest-rw.%s.svc.cluster.local:3000\\\";" (include "data-proxy.fullname" $root) ($schema | replace "_" "-") $root.Release.Namespace) | nindent 4 }}
{{- end }}
{{- end }}
