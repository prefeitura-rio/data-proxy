{{- $root := . -}}
{{- if and $root.Values.ha.enabled (not (empty $root.Values.ha.schemas)) }}
{{- range $schema, $stack := $root.Values.ha.schemas }}
{{- $members := default 1 $stack.members | int }}
{{- range $ordinal := until $members }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "data-proxy.schemaPvcName" (dict "root" $root "schema" $schema "ordinal" $ordinal) }}
  namespace: {{ $root.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: duckdb
    data-proxy.io/schema: {{ $schema | quote }}
    data-proxy.io/member: {{ $ordinal | quote }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $root.Values.pgduckdb.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ default $root.Values.pgduckdb.storage.size $stack.storage.size }}
{{- end }}
{{- end }}
{{- else }}
{{- $memberCount := include "data-proxy.pgduckdbMemberCount" . | int }}
{{- range $ordinal := until $memberCount }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "data-proxy.pgduckdbPvcName" (dict "root" $root "ordinal" $ordinal) }}
  namespace: {{ $root.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: duckdb
    data-proxy.io/member: {{ $ordinal | quote }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $root.Values.pgduckdb.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $root.Values.pgduckdb.storage.size }}
{{- end }}
{{- end }}
