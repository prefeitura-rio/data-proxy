{{- if .Values.swaggerUi.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "data-proxy.fullname" . }}-swagger-ui-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: swagger-ui
data:
  schemas.js: |
    window.dataProxySchemas = {{ .Values.swaggerUi.schemas | toJson }};

    window.createSchemaSelector = function(schemas, selectedSchema, onChange) {
      var schemes = document.querySelector('.schemes-server-container');
      if (!schemes || document.getElementById('schema-selector')) {
        return;
      }

      var label = document.createElement('label');
      label.htmlFor = 'schema-selector';
      label.style.marginLeft = '2rem';

      var title = document.createElement('span');
      title.className = 'schemes-title';
      title.textContent = 'Schema';

      var select = document.createElement('select');
      select.id = 'schema-selector';
      select.style.textTransform = 'lowercase';

      schemas.forEach(function(schema) {
        var option = document.createElement('option');
        option.value = schema;
        option.textContent = schema;
        option.selected = schema === selectedSchema;
        select.appendChild(option);
      });

      select.addEventListener('change', function() {
        onChange(select.value);
      });

      label.appendChild(title);
      label.appendChild(select);
      schemes.appendChild(label);
    };

  initializer.js: |
    window.onload = function() {
      var schemaScript = document.createElement('script');
      schemaScript.src = 'schemas.js';
      schemaScript.onload = initializeSwagger;
      document.head.appendChild(schemaScript);
    };

    function initializeSwagger() {
      var schemas = window.dataProxySchemas || [];
      var selectedSchema = new URLSearchParams(window.location.search).get('schema');
      if (!schemas.includes(selectedSchema)) {
        selectedSchema = schemas[0];
      }

      var apiUrl = {{ printf "%s/" (trimSuffix "/" .Values.postgrest.proxyUri) | quote }};

      var selectSchema = function(schema) {
        var url = new URL(window.location.href);
        url.searchParams.set('schema', schema);
        window.location.href = url.toString();
      };

      window.ui = SwaggerUIBundle({
        url: apiUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        onComplete: function() {
          window.createSchemaSelector(schemas, selectedSchema, selectSchema);
        },
        requestInterceptor: function(req) {
          var auth = req.headers.Authorization;
          if (auth && auth.indexOf('Bearer ') !== 0) {
            req.headers.Authorization = 'Bearer ' + auth;
          }
          if (selectedSchema) {
            req.headers['Accept-Profile'] = selectedSchema;
            req.headers['Content-Profile'] = selectedSchema;
          }
          return req;
        }
      });
    };
{{- end }}
