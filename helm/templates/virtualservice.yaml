{{- if .Values.ingress.enabled }}
{{- $root := . }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "data-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
spec:
  gateways:
    - {{ .Values.ingress.gateway }}
  hosts:
    - {{ .Values.ingress.host | quote }}
  http:
    {{- if .Values.swaggerUi.enabled }}
    - name: docs-redirect
      match:
        - uri:
            exact: /docs
      redirect:
        redirectCode: 302
        uri: /docs/
    - name: docs
      match:
        - uri:
            prefix: /docs/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "data-proxy.fullname" . }}-swagger-ui
            port:
              number: 8080
    {{- end }}
    {{- if eq .Values.cnpg.mode "per-schema" }}
    {{- range $schema, $_ := (default .Values.cnpg.schemas .Values.syncConfig.schemas) }}
    {{- $cluster := include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}
    - name: {{ $schema }}-openapi
      match:
        - uri:
            exact: {{ printf "/openapi/%s" $schema | quote }}
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ $cluster }}-postgrest-rw
            port:
              number: 3000
    - name: {{ $schema }}-read
      match:
        - method:
            exact: GET
          headers:
            accept-profile:
              exact: {{ $schema | quote }}
        - method:
            exact: HEAD
          headers:
            accept-profile:
              exact: {{ $schema | quote }}
        - method:
            exact: OPTIONS
          headers:
            accept-profile:
              exact: {{ $schema | quote }}
      route:
        - destination:
            host: {{ include "data-proxy.fullname" $root }}-nginx-proxy
            port:
              number: 8080
    - name: {{ $schema }}-write
      match:
        - method:
            exact: POST
          headers:
            accept-profile:
              exact: {{ $schema | quote }}
        - method:
            exact: PUT
          headers:
            accept-profile:
              exact: {{ $schema | quote }}
        - method:
            exact: PATCH
          headers:
            accept-profile:
              exact: {{ $schema | quote }}
        - method:
            exact: DELETE
          headers:
            accept-profile:
              exact: {{ $schema | quote }}
      route:
        - destination:
            host: {{ $cluster }}-postgrest-rw
            port:
              number: 3000
    {{- end }}
    - name: unknown-profile
      directResponse:
        status: 404
        body:
          string: "Unknown schema profile"
    {{- else }}
    - route:
        - destination:
            host: {{ include "data-proxy.fullname" . }}-nginx-proxy
            port:
              number: 8080
      {{- with .Values.ingress.timeout }}
      timeout: {{ . }}
      {{- end }}
      {{- if gt (int .Values.ingress.retries.attempts) 0 }}
      retries:
        attempts: {{ .Values.ingress.retries.attempts }}
        {{- with .Values.ingress.retries.perTryTimeout }}
        perTryTimeout: {{ . }}
        {{- end }}
        {{- with .Values.ingress.retries.retryOn }}
        retryOn: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
