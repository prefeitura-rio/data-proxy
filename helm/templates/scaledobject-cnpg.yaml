{{- if not .Values.ha.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "data-proxy.fullname" . }}-autoscaler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  scaleTargetRef:
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: {{ include "data-proxy.fullname" . }}
  minReplicaCount: {{ .Values.cnpg.autoscaling.minReplicaCount }}
  maxReplicaCount: {{ .Values.cnpg.autoscaling.maxReplicaCount }}
  pollingInterval: {{ .Values.cnpg.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.cnpg.autoscaling.cooldownPeriod }}
  triggers:
{{- if gt (len (.Values.cnpg.autoscaling.triggers | default list)) 0 }}
{{ toYaml .Values.cnpg.autoscaling.triggers | nindent 4 }}
{{- else }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
{{- end }}
{{- else }}
{{- $root := . }}
{{- range $schema, $_ := $root.Values.syncConfig.schemas }}
{{- $cluster := include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $cluster }}-autoscaler
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  scaleTargetRef:
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: {{ $cluster }}
  minReplicaCount: {{ $root.Values.cnpg.autoscaling.minReplicaCount }}
  maxReplicaCount: {{ $root.Values.cnpg.autoscaling.maxReplicaCount }}
  pollingInterval: {{ $root.Values.cnpg.autoscaling.pollingInterval }}
  cooldownPeriod: {{ $root.Values.cnpg.autoscaling.cooldownPeriod }}
  triggers:
{{ include "data-proxy.haTriggers" (dict "root" $root "schema" $schema "component" "postgres") | nindent 4 }}
{{- end }}
{{- end }}
