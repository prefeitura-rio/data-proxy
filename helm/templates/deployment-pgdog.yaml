{{- $name := include "data-proxy.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-pgdog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgdog
spec:
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgdog
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-pgdog.yaml") . | sha256sum }}
        checksum/s3-credentials: {{ include "data-proxy.s3CredentialsChecksum" . }}
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pgdog
        sidecar.istio.io/inject: {{ .Values.ingress.sidecarInject | quote }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pgdog
          image: {{ .Values.pgdog.image }}
          args: [--config, /etc/pgdog/pgdog.toml, --users, /etc/pgdog-users/users.toml]
          ports:
            - name: pgdog
              containerPort: 6432
          readinessProbe:
            tcpSocket:
              port: pgdog
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/pgdog
              readOnly: true
            - name: users
              mountPath: /etc/pgdog-users
              readOnly: true
          {{- with .Values.pgdog.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-pgdog
        - name: users
          secret:
            secretName: {{ $name }}-pgdog-users
