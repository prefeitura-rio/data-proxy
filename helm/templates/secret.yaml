{{- $root := . }}
{{- $s3Name := include "data-proxy.s3SecretName" $root }}
{{- $s3 := lookup "v1" "Secret" $root.Release.Namespace $s3Name }}
{{- $s3AccessKey := "data-proxy" }}
{{- $s3SecretKey := randAlphaNum 32 }}
{{- if $s3 }}
{{- if hasKey $s3.data "S3_ACCESS_KEY" }}
{{- $s3AccessKey = index $s3.data "S3_ACCESS_KEY" | b64dec }}
{{- end }}
{{- if hasKey $s3.data "S3_SECRET_KEY" }}
{{- $s3SecretKey = index $s3.data "S3_SECRET_KEY" | b64dec }}
{{- end }}
{{- end }}
{{- if not $root.Values.s3.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s3Name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ $s3AccessKey | quote }}
  S3_SECRET_KEY: {{ $s3SecretKey | quote }}
  seaweedfs_s3_config: {{ printf "{\"identities\":[{\"name\":\"admin\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}" $s3AccessKey $s3SecretKey | quote }}
{{- end }}
{{- if and $root.Values.backup.enabled (not $root.Values.backup.existingSecret) }}
---
{{- $backupName := include "data-proxy.backupSecretName" $root }}
{{- $backup := lookup "v1" "Secret" $root.Release.Namespace $backupName }}
{{- $backupPassword := randAlphaNum 32 }}
{{- if $backup }}
{{- if hasKey $backup.data "password" }}
{{- $backupPassword = index $backup.data "password" | b64dec }}
{{- else if hasKey $backup.data "BACKUP_PASSWORD" }}
{{- $backupPassword = index $backup.data "BACKUP_PASSWORD" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $backupName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: backup
  password: {{ $backupPassword | quote }}
  BACKUP_PASSWORD: {{ $backupPassword | quote }}
{{- end }}
