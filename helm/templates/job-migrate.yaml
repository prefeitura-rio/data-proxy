{{/*
{
  "kind": "template",
  "description": "Render the database migration Job.",
  "inputs": {
    "values": "Helm chart values used by this resource.",
    "release": "Helm release context used in resource names.",
    "chart": "Helm chart metadata used in labels."
  }
}
*/}}
{{- $state := lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-mode-state" (include "data-proxy.fullname" .)) }}
{{- $previous := "" }}
{{- if $state }}
{{- $previous = $state.data.mode | default "" }}
{{- end }}
{{- if ne $previous .Values.cnpg.mode }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "data-proxy.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "data-proxy.fullname" . }}-migrate
      containers:
        - name: migrate
          image: {{ .Values.migration.image | quote }}
          command: ["/usr/bin/nu", "/scripts/migrate.nu"]
          workingDir: /scripts
          env:
            - name: TARGET_MODE
              value: {{ .Values.cnpg.mode | quote }}
            - name: SOURCE_MODE
              value: {{ $previous | quote }}
            - name: SOURCE_DSN
              value: {{ printf "postgresql://%s-rw:5432/%s" (include "data-proxy.fullname" .) .Values.cnpg.db.name | quote }}
            - name: TARGET_DSN
              value: {{ printf "postgresql://%s-{schema}-rw:5432/%s" (include "data-proxy.fullname" .) .Values.cnpg.db.name | quote }}
            - name: PGUSER
              value: {{ .Values.cnpg.db.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: DBOS_SYSTEM_DATABASE_URL
              value: {{ include "data-proxy.dbosSystemDatabaseUrl" . | quote }}
            - name: DBOS_SYSTEM_SCHEMA
              value: {{ .Values.dbos.systemSchema | quote }}
            - name: SCHEMAS
              value: {{ keys (.Values.syncConfig.schemas | default dict) | join " " | quote }}
            - name: AUTH_USER_ROLE
              value: {{ .Values.auth.userRole | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: RELEASE_NAME
              value: {{ include "data-proxy.fullname" . }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "data-proxy.fullname" . }}-migrate
{{- end }}
