{{- $schemas := .Values.sync.config.schemas -}}
{{- if gt (len $schemas) 0 }}
{{- $storageClass := required "ducklake.litestream.storage.storageClass is required when sync schemas are configured" .Values.ducklake.litestream.storage.storageClass -}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-duckdb" (include "data-proxy.fullname" $) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $ | nindent 4 }}
    app.kubernetes.io/component: duckdb-storage
spec:
  accessModes:
    - {{ $.Values.ducklake.litestream.storage.accessMode | quote }}
  storageClassName: {{ $storageClass | quote }}
  resources:
    requests:
      storage: {{ $.Values.ducklake.litestream.storage.size | quote }}
{{- end }}
