apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "data-proxy.fullname" . }}-db-migrate
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: {{ .Values.migration.image | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready --host="$PGHOST" --port="$PGPORT" --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"; do
                echo "waiting for writable database at $PGHOST:$PGPORT"
                sleep 2
              done
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -f /scripts/01_extensions.sql
              /bin/sh /scripts/02_roles.sh
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -f /scripts/03_pre_request.sql
              psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -f /scripts/04_access_policy.sql
          env:
            - name: PGHOST
              value: {{ include "data-proxy.migrationDatabaseHost" . | quote }}
            - name: PGPORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.pgduckdb.db.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.pgduckdb.db.name | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGRST_AUTHENTICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: PGRST_AUTHENTICATOR_PASSWORD
            {{- if .Values.backup.enabled }}
            - name: BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.backupSecretName" . }}
                  key: BACKUP_PASSWORD
            {{- end }}
          volumeMounts:
            - name: db-init
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: db-init
          configMap:
            name: {{ include "data-proxy.fullname" . }}-db-migrate
            defaultMode: 0755
