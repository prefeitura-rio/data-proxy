apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "data-proxy.fullname" . }}-seeder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: seeder
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    ## A failed seeder exits non-zero and leaves its message pending.
    ## The stream reclaims the message, so Kubernetes must not retry the Job.
    backoffLimit: 0
    template:
      metadata:
        labels:
          {{- include "data-proxy.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: seeder
      spec:
        ## A Job accepts Never or OnFailure only. One pod handles one seed task.
        restartPolicy: Never
        terminationGracePeriodSeconds: {{ .Values.seeder.terminationGracePeriodSeconds }}
        serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
        containers:
          - name: seeder
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            command: ["python", "-m", "dp.sync.seeder"]
            env:
              {{- include "data-proxy.appEnv" . | nindent 14 }}
            volumeMounts:
              {{- include "data-proxy.syncConfigVolumeMount" . | nindent 14 }}
              {{- include "data-proxy.schemaWritersVolumeMount" . | nindent 14 }}
              {{- include "data-proxy.gcpVolumeMount" . | nindent 14 }}
        volumes:
          {{- include "data-proxy.syncConfigVolume" . | nindent 10 }}
          {{- include "data-proxy.schemaWritersVolume" . | nindent 10 }}
          {{- include "data-proxy.gcpVolume" . | nindent 10 }}
  pollingInterval: {{ .Values.seeder.keda.pollingInterval }}
  minReplicaCount: 0
  maxReplicaCount: 1
  successfulJobsHistoryLimit: {{ .Values.seeder.keda.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.seeder.keda.failedJobsHistoryLimit }}
  triggers:
    - type: redis-streams
      authenticationRef:
        name: {{ include "data-proxy.fullname" . }}-valkey-trigger-auth
      metadata:
        address: {{ .Release.Name }}-valkey.{{ .Release.Namespace }}.svc.cluster.local:6379
        stream: dp:prepare
        consumerGroup: seeders
        lagCount: "1"
    - type: redis-streams
      authenticationRef:
        name: {{ include "data-proxy.fullname" . }}-valkey-trigger-auth
      metadata:
        address: {{ .Release.Name }}-valkey.{{ .Release.Namespace }}.svc.cluster.local:6379
        stream: dp:prepare
        consumerGroup: seeders
        pendingEntriesCount: {{ .Values.seeder.keda.pendingEntriesCount | quote }}
