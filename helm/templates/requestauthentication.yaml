{{- if and .Values.ingress.enabled .Values.ingress.auth.enabled }}
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: {{ include "data-proxy.fullname" . }}-postgrest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgrest
  jwtRules:
    - issuer: {{ .Values.ingress.auth.issuer | quote }}
      jwksUri: {{ .Values.ingress.auth.jwksUri | quote }}
      {{- with .Values.ingress.auth.audience }}
      audiences:
        - {{ . | quote }}
      {{- end }}
      forwardOriginalToken: true
{{- end }}
