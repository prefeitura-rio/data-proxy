{{/*
{
  "kind": "template",
  "description": "Render the per-schema PostgREST scaler.",
  "inputs": {
    "values": "Helm chart values used by this resource.",
    "release": "Helm release context used in resource names.",
    "chart": "Helm chart metadata used in labels."
  }
}
*/}}
{{- if .Values.ha.enabled }}
{{- $root := . }}
{{- range $schema, $_ := (default $root.Values.cnpg.schemas $root.Values.syncConfig.schemas) }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "data-proxy.fullname" $root }}-{{ $schema | replace "_" "-" }}-postgrest-ro
  namespace: {{ $root.Release.Namespace }}
spec:
  scaleTargetRef:
    name: {{ include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}-postgrest-ro
    kind: Deployment
    apiVersion: apps/v1
  minReplicaCount: {{ $root.Values.postgrest.ro.keda.minReplicaCount }}
  maxReplicaCount: {{ $root.Values.postgrest.ro.keda.maxReplicaCount }}
  pollingInterval: {{ $root.Values.postgrest.ro.keda.pollingInterval }}
  cooldownPeriod: {{ $root.Values.postgrest.ro.keda.cooldownPeriod }}
  triggers:
{{ include "data-proxy.haTriggers" (dict "root" $root "schema" $schema "component" "postgrest") | nindent 4 }}
{{- end }}
{{- end }}
