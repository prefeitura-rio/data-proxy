{{- if .Values.ha.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-proxy.pgbouncerRwName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer-rw
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "data-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer-rw
{{- end }}
