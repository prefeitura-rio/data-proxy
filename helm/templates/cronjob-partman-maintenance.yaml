{{- $root := . }}
{{- if not .Values.ha.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "data-proxy.fullname" . }}-partman
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: partman
spec:
  schedule: {{ .Values.cnpg.partman.schedule | quote }}
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "data-proxy.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: partman
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: partman
              image: {{ .Values.cnpg.init.image | quote }}
              command: [nu, -c]
              args:
                - |
                  let dsn = $env.PG_DSN
                  psql $dsn --no-psqlrc --quiet -c 'CALL partman.run_maintenance_proc()'
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.dbSecretName" . }}
                      key: POSTGRES_PASSWORD
                - name: PG_DSN
                  value: {{ printf "postgresql://%s:$(POSTGRES_PASSWORD)@%s-rw:5432/%s" .Values.cnpg.db.user (include "data-proxy.fullname" .) .Values.cnpg.db.name | quote }}
{{- else }}
{{- range $schema, $_ := $root.Values.syncConfig.schemas }}
{{- $cluster := include "data-proxy.cnpgClusterName" (dict "root" $root "schema" $schema) }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $cluster }}-partman
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: partman
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  schedule: {{ $root.Values.cnpg.partman.schedule | quote }}
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "data-proxy.selectorLabels" $root | nindent 12 }}
            app.kubernetes.io/component: partman
            data-proxy.io/schema: {{ $schema | quote }}
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: partman
              image: {{ $root.Values.cnpg.init.image | quote }}
              command: [nu, -c]
              args:
                - |
                  let dsn = $env.PG_DSN
                  psql $dsn --no-psqlrc --quiet -c 'CALL partman.run_maintenance_proc()'
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "data-proxy.dbSecretName" $root }}
                      key: POSTGRES_PASSWORD
                - name: PG_DSN
                  value: {{ printf "postgresql://%s:$(POSTGRES_PASSWORD)@%s-rw:5432/%s" $root.Values.cnpg.db.user $cluster $root.Values.cnpg.db.name | quote }}
{{- end }}
{{- end }}
