{{- if .Values.sync.recovery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-recovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: recovery
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: recovery
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: recovery
    spec:
      serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.jobs.image | quote }}
          imagePullPolicy: {{ .Values.sync.imagePullPolicy }}
          command: [nu, /scripts/wait-for-postgres.nu]
          env:
            - name: PGHOST
              value: {{ printf "%s-rw" (include "data-proxy.fullname" .) | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT
              value: "2"
            - name: PGDATABASE
              value: {{ .Values.cnpg.db.name | quote }}
            - name: PGUSER
              value: {{ .Values.auth.authenticatorRole | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.authenticatorSecretName" . }}
                  key: password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: recovery
          image: {{ .Values.jobs.image | quote }}
          imagePullPolicy: {{ .Values.sync.imagePullPolicy }}
          command: [nu, /scripts/recover-workflows.nu]
          env:
            {{- include "data-proxy.appEnv" . | nindent 12 }}
            - name: DBOS_RECOVERY_INTERVAL_SECONDS
              value: {{ .Values.sync.recovery.intervalSeconds | quote }}
            - name: DBOS_RECOVERY_GRACE_SECONDS
              value: {{ .Values.sync.recovery.graceSeconds | quote }}
            - name: SQL_TEMPLATE_DIR
              value: /scripts
          resources:
            {{- toYaml .Values.sync.recovery.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "data-proxy.fullname" . }}-scripts
            defaultMode: 0555
            items:
              - key: recover-workflows.nu
                path: recover-workflows.nu
              - key: wait-for-postgres.nu
                path: wait-for-postgres.nu
              - key: lib.nu
                path: lib.nu
{{- range $path, $_ := .Files.Glob "files/templates/*.sql" }}
              - key: {{ base $path }}
                path: {{ base $path }}
{{- end }}
{{- range $path, $_ := .Files.Glob "files/templates/**/*.sql" }}
              - key: {{ base (dir $path) }}_{{ base $path }}
                path: {{ base (dir $path) }}/{{ base $path }}
{{- end }}
{{- end }}
