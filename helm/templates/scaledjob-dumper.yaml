apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "data-proxy.fullname" . }}-dumper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: dumper
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    activeDeadlineSeconds: {{ .Values.dumper.keda.activeDeadlineSeconds }}
    backoffLimit: 0
    template:
      metadata:
        labels:
          {{- include "data-proxy.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: dumper
      spec:
        restartPolicy: Never
        serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
        containers:
          - name: dumper
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            command: ["python", "-m", "dp.sync.dumper"]
            env:
              {{- include "data-proxy.appEnv" . | nindent 14 }}
            volumeMounts:
              {{- include "data-proxy.syncConfigVolumeMount" . | nindent 14 }}
              {{- include "data-proxy.gcpVolumeMount" . | nindent 14 }}
        volumes:
          {{- include "data-proxy.syncConfigVolume" . | nindent 10 }}
          {{- include "data-proxy.gcpVolume" . | nindent 10 }}
  pollingInterval: {{ .Values.dumper.keda.pollingInterval }}
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.dumper.keda.maxReplicaCount }}
  scalingStrategy:
    strategy: accurate
  triggers:
    - type: redis-streams
      authenticationRef:
        name: {{ include "data-proxy.fullname" . }}-valkey-trigger-auth
      metadata:
        address: {{ .Release.Name }}-valkey.{{ .Release.Namespace }}.svc.cluster.local:6379
        stream: dp:extract
        consumerGroup: dumpers
        lagCount: {{ .Values.dumper.keda.lagCount | quote }}
    - type: redis-streams
      authenticationRef:
        name: {{ include "data-proxy.fullname" . }}-valkey-trigger-auth
      metadata:
        address: {{ .Release.Name }}-valkey.{{ .Release.Namespace }}.svc.cluster.local:6379
        stream: dp:extract
        consumerGroup: dumpers
        pendingEntriesCount: {{ .Values.dumper.keda.pendingEntriesCount | quote }}
