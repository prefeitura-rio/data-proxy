{{- $name := include "data-proxy.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-pgdog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgdog
data:
  pgdog.toml: |
    [general]
    host = "0.0.0.0"
    port = 6432
    pooler_mode = "transaction"
    read_write_split = "include_primary_if_replica_banned"
    default_pool_size = {{ .Values.pgdog.poolSize }}
    min_pool_size = 1
    connect_timeout = 2000
    connect_attempts = 2
    connect_attempt_delay = 250
    healthcheck_timeout = 3000
    idle_healthcheck_interval = 5000
    ban_timeout = 10000
    server_lifetime = 300000
    server_lifetime_jitter = 60000
    prepared_statements_limit = 500
    shutdown_timeout = 25000
    healthcheck_port = 8080
    openmetrics_port = 9090

    [tcp]
    keepalive = true
    time = 10000
    interval = 5000
    retries = 2
    user_timeout = 10000

    [[databases]]
    name = {{ .Values.cnpg.db.name | quote }}
    host = {{ printf "%s-rw" $name | quote }}
    role = "primary"

    [[databases]]
    name = {{ .Values.cnpg.db.name | quote }}
    host = {{ printf "%s-ro" $name | quote }}
    role = "replica"
