---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "data-proxy.fullname" . }}-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "data-proxy.fullname" . }}-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "data-proxy.fullname" . }}-provision
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "data-proxy.fullname" . }}-provision
subjects:
  - kind: ServiceAccount
    name: {{ include "data-proxy.fullname" . }}-provision
    namespace: {{ .Release.Namespace }}
