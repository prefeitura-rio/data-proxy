{{- if .Values.ha.enabled }}
{{- $root := . }}
{{- range $ordinal := until (.Values.ha.patroni.replicas | int) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "data-proxy.pgduckdbStatefulSetName" (dict "root" $root "ordinal" $ordinal) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: duckdb
    data-proxy.io/member: {{ $ordinal | quote }}
spec:
  serviceName: {{ include "data-proxy.fullname" $root }}-duckdb
  replicas: 1
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: duckdb
      data-proxy.io/member: {{ $ordinal | quote }}
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: duckdb
        data-proxy.io/member: {{ $ordinal | quote }}
    spec:
      securityContext:
        fsGroup: 999
      serviceAccountName: {{ include "data-proxy.serviceAccountName" $root }}
      containers:
        - name: duckdb
          image: {{ $root.Values.pgduckdb.image }}
          command: [patroni, /etc/patroni/patroni.yaml]
          ports:
            - name: postgres
              containerPort: 5432
            - name: patroni
              containerPort: 8008
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PATRONI_SCOPE
              value: {{ include "data-proxy.fullname" $root }}-patroni
            - name: PATRONI_NAME
              value: {{ include "data-proxy.patroniMemberName" (dict "root" $root "ordinal" $ordinal) | quote }}
            - name: PATRONI_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PATRONI_SUPERUSER_USERNAME
              value: {{ $root.Values.pgduckdb.db.user | quote }}
            - name: POSTGRES_DB
              value: {{ $root.Values.pgduckdb.db.name | quote }}
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" $root }}
                  key: POSTGRES_PASSWORD
            - name: PATRONI_REPLICATION_USERNAME
              value: {{ $root.Values.ha.patroni.replicationUsername | quote }}
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" $root }}
                  key: PATRONI_REPLICATION_PASSWORD
            - name: PGRST_AUTHENTICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" $root }}
                  key: PGRST_AUTHENTICATOR_PASSWORD
            {{- if $root.Values.backup.enabled }}
            - name: BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.backupSecretName" $root }}
                  key: BACKUP_PASSWORD
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8008
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: patroni-config
              mountPath: /etc/patroni
              readOnly: true
            - name: db-init
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: {{ include "data-proxy.pgduckdbPvcName" (dict "root" $root "ordinal" $ordinal) }}
        - name: patroni-config
          configMap:
            name: {{ include "data-proxy.fullname" $root }}-patroni
        - name: db-init
          configMap:
            name: {{ include "data-proxy.fullname" $root }}-db-init
            defaultMode: 0755
{{- end }}
{{- end }}
