{{- if .Values.ha.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "data-proxy.fullname" . }}-duckdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: duckdb
spec:
  serviceName: {{ include "data-proxy.fullname" . }}-duckdb
  replicas: {{ .Values.ha.patroni.replicas }}
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: duckdb
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: duckdb
    spec:
      serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
      containers:
        - name: duckdb
          image: {{ .Values.ha.patroni.image }}
          command: [patroni, /etc/patroni/patroni.yaml]
          ports:
            - name: postgres
              containerPort: 5432
            - name: patroni
              containerPort: 8008
          env:
            - name: PATRONI_SCOPE
              value: {{ include "data-proxy.fullname" . }}-patroni
            - name: PATRONI_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PATRONI_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PATRONI_SUPERUSER_USERNAME
              value: {{ .Values.duckdb.db.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.duckdb.db.name | quote }}
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PATRONI_REPLICATION_USERNAME
              value: {{ .Values.ha.patroni.replicationUsername | quote }}
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: PATRONI_REPLICATION_PASSWORD
            - name: PGRST_AUTHENTICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.dbSecretName" . }}
                  key: PGRST_AUTHENTICATOR_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8008
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: patroni-config
              mountPath: /etc/patroni
              readOnly: true
            - name: db-init
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: patroni-config
          configMap:
            name: {{ include "data-proxy.fullname" . }}-patroni
        - name: db-init
          configMap:
            name: {{ include "data-proxy.fullname" . }}-db-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.duckdb.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.duckdb.storage.size }}
{{- end }}
