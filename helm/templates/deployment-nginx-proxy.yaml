{{- if .Values.fallback.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-nginx-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx-proxy
  template:
    metadata:
      annotations:
        checksum/proxy-config: {{ printf "%s%s" (include "data-proxy.nginxProxyConfig" .) (include "data-proxy.webdisConfig" .) | sha256sum }}
        checksum/sync-config: {{ .Values.syncConfig | toJson | sha256sum }}
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx-proxy
        sidecar.istio.io/inject: {{ .Values.ingress.sidecarInject | quote }}
    spec:
      containers:
        - name: nginx
          image: {{ required "fallback.nginxImage must reference an image built from Dockerfile.proxy" .Values.fallback.nginxImage | quote }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            {{- include "data-proxy.syncConfigVolumeMount" . | nindent 12 }}
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
          {{- with .Values.fallback.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: webdis
          image: {{ .Values.fallback.webdisImage }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              escaped_password="$(printf '%s' "${VALKEY_PASSWORD:-}" | sed 's/[\\/&]/\\\\&/g')"
              sed "s/__VALKEY_PASSWORD__/${escaped_password}/g" /etc/webdis-template/webdis.json > /run/webdis/webdis.json
              exec /usr/local/bin/webdis /run/webdis/webdis.json
          {{- if .Values.valkey.auth.enabled }}
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.valkeySecretName" . }}
                  key: {{ include "data-proxy.valkeySecretKey" . }}
          {{- end }}
          ports:
            - name: redis-http
              containerPort: 7379
          volumeMounts:
            - name: webdis-config
              mountPath: /etc/webdis-template
              readOnly: true
            - name: webdis-runtime-config
              mountPath: /run/webdis
          {{- with .Values.fallback.webdisResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "data-proxy.syncConfigVolume" . | nindent 8 }}
        - name: config
          configMap:
            name: {{ include "data-proxy.fullname" . }}-nginx-proxy
        - name: webdis-config
          configMap:
            name: {{ include "data-proxy.fullname" . }}-webdis
        - name: webdis-runtime-config
          emptyDir: {}
{{- end }}
