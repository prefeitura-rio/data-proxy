apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "data-proxy.fullname" . }}-dumper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: dumper
spec:
  scaleTargetRef:
    name: {{ include "data-proxy.fullname" . }}-dumper
    kind: Deployment
    apiVersion: apps/v1
  pollingInterval: {{ .Values.sync.dumper.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.sync.dumper.keda.cooldownPeriod }}
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.sync.dumper.keda.maxReplicaCount }}
  triggers:
    - type: redis-streams
      authenticationRef:
        name: {{ include "data-proxy.fullname" . }}-valkey-trigger-auth
      metadata:
        address: {{ include "data-proxy.redisWriterAddress" . }}
        stream: dp:extract
        consumerGroup: dumpers
        lagCount: {{ .Values.sync.dumper.keda.lagCount | quote }}
    - type: redis-streams
      authenticationRef:
        name: {{ include "data-proxy.fullname" . }}-valkey-trigger-auth
      metadata:
        address: {{ include "data-proxy.redisWriterAddress" . }}
        stream: dp:extract
        consumerGroup: dumpers
        pendingEntriesCount: {{ .Values.sync.dumper.keda.pendingEntriesCount | quote }}
