{{- if and .Values.ha.enabled (not (empty .Values.ha.schemas)) }}
{{- $root := . }}
{{- range $schema, $_ := $root.Values.ha.schemas }}
{{- $name := include "data-proxy.schemaStackName" (dict "root" $root "schema" $schema) }}
{{- range $mode := list "ro" "rw" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-postgrest-{{ $mode }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: postgrest-{{ $mode }}
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "data-proxy.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: postgrest-{{ $mode }}
    data-proxy.io/schema: {{ $schema | quote }}
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
{{- end }}
{{- end }}
