apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" . }}-seeder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: seeder
spec:
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: seeder
  template:
    metadata:
      labels:
        {{- include "data-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seeder
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.seeder.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "data-proxy.serviceAccountName" . }}
      containers:
        - name: seeder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "dp.sync.seeder"]
          env:
            {{- include "data-proxy.appEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "data-proxy.syncConfigVolumeMount" . | nindent 12 }}
            {{- include "data-proxy.schemaWritersVolumeMount" . | nindent 12 }}
            {{- include "data-proxy.gcpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "data-proxy.syncConfigVolume" . | nindent 8 }}
        {{- include "data-proxy.schemaWritersVolume" . | nindent 8 }}
        {{- include "data-proxy.gcpVolume" . | nindent 8 }}
