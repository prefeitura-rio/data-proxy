{{/*
{
  "kind": "template",
  "description": "Render the per-schema proxy deployment.",
  "inputs": {
    "values": "Helm chart values used by this resource.",
    "release": "Helm release context used in resource names.",
    "chart": "Helm chart metadata used in labels."
  }
}
*/}}
{{- if .Values.ha.enabled }}
{{- $root := . }}
{{- range $schema, $_ := (default $root.Values.cnpg.schemas $root.Values.syncConfig.schemas) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-proxy.fullname" $root }}-{{ $schema | replace "_" "-" }}-proxy
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: proxy
    data-proxy.io/schema: {{ $schema | quote }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: proxy
      data-proxy.io/schema: {{ $schema | quote }}
  template:
    metadata:
      annotations:
        checksum/proxy-config: {{ printf "%s%s%s" $schema ($root.Values.fallback | toJson) $root.Release.Namespace | sha256sum }}
        checksum/sync-config: {{ $root.Values.syncConfig | toJson | sha256sum }}
      labels:
        {{- include "data-proxy.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: proxy
        data-proxy.io/schema: {{ $schema | quote }}
        sidecar.istio.io/inject: {{ $root.Values.ingress.sidecarInject | quote }}
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "data-proxy.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: proxy
              data-proxy.io/schema: {{ $schema | quote }}
      containers:
        - name: nginx
          image: {{ required "fallback.proxyImage must reference an image built from Dockerfile.proxy" $root.Values.fallback.proxyImage | quote }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CACHE_TTL
              value: {{ toString $root.Values.fallback.cacheTtl | quote }}
            - name: MAX_BODY
              value: {{ toString $root.Values.fallback.maxCacheBodyBytes | quote }}
            - name: FETCH_BUFFER_SIZE
              value: {{ toString $root.Values.fallback.fetchBufferSize | quote }}
            - name: FETCH_TIMEOUT
              value: {{ toString $root.Values.fallback.fetchTimeout | quote }}
            - name: FETCH_KEEPALIVE
              value: {{ toString $root.Values.fallback.fetchKeepalive | quote }}
            - name: FETCH_KEEPALIVE_TIMEOUT
              value: {{ toString $root.Values.fallback.fetchKeepaliveTimeout | quote }}
            - name: LARGE_CLIENT_HEADER_BUFFERS
              value: {{ toString $root.Values.fallback.largeClientHeaderBuffers | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
          volumeMounts:
            {{- include "data-proxy.syncConfigVolumeMount" $root | nindent 12 }}
            - name: config
              mountPath: /etc/nginx/templates/nginx.conf.template
              subPath: nginx.conf
          {{- with $root.Values.fallback.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: webdis-write
          image: {{ $root.Values.fallback.webdisImage }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              escaped_password="$(printf '%s' "${VALKEY_PASSWORD:-}" | sed 's/[\\/&]/\\\\&/g')"
              sed "s/__VALKEY_PASSWORD__/${escaped_password}/g" /etc/webdis/webdis-write.json > /run/webdis-write/webdis.json
              exec /usr/local/bin/webdis /run/webdis-write/webdis.json
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.redisSecretName" $root }}
                  key: {{ include "data-proxy.redisPasswordKey" $root }}
          ports:
            - name: redis-http
              containerPort: 7379
          volumeMounts:
            - name: webdis-config
              mountPath: /etc/webdis
              readOnly: true
            - name: webdis-write-runtime
              mountPath: /run/webdis-write
          {{- with $root.Values.fallback.webdisResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: webdis-read
          image: {{ $root.Values.fallback.webdisImage }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              escaped_password="$(printf '%s' "${VALKEY_PASSWORD:-}" | sed 's/[\\/&]/\\\\&/g')"
              sed "s/__VALKEY_PASSWORD__/${escaped_password}/g" /etc/webdis/webdis-read.json > /run/webdis-read/webdis.json
              exec /usr/local/bin/webdis /run/webdis-read/webdis.json
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "data-proxy.redisSecretName" $root }}
                  key: {{ include "data-proxy.redisPasswordKey" $root }}
          ports:
            - name: redis-http-read
              containerPort: 7380
          volumeMounts:
            - name: webdis-config
              mountPath: /etc/webdis
              readOnly: true
            - name: webdis-read-runtime
              mountPath: /run/webdis-read
          {{- with $root.Values.fallback.webdisResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "data-proxy.syncConfigVolume" $root | nindent 8 }}
        - name: config
          configMap:
            name: {{ include "data-proxy.fullname" $root }}-{{ $schema | replace "_" "-" }}-proxy
        - name: webdis-config
          configMap:
            name: {{ include "data-proxy.fullname" $root }}-{{ $schema | replace "_" "-" }}-webdis
        - name: webdis-write-runtime
          emptyDir: {}
        - name: webdis-read-runtime
          emptyDir: {}
{{- end }}
{{- end }}
