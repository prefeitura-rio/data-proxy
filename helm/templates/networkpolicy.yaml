{{- if .Values.networkPolicy.enabled }}
{{- $name := include "data-proxy.fullname" . }}
{{- $gateway := include "data-proxy.namespacePeer" .Values.networkPolicy.gatewayNamespace | fromYaml }}
{{- $proxy := include "data-proxy.podPeer" (dict "root" . "component" "proxy") | fromYaml }}
{{- $postgrest := include "data-proxy.podPeer" (dict "root" . "component" "postgrest") | fromYaml }}
{{- $sync := include "data-proxy.podPeer" (dict "root" . "component" "sync") | fromYaml }}
{{- $console := include "data-proxy.podPeer" (dict "root" . "component" "console") | fromYaml }}
{{- $monitoring := dict }}
{{- if .Values.networkPolicy.monitoringNamespace }}
{{- $monitoring = include "data-proxy.namespacePeer" .Values.networkPolicy.monitoringNamespace | fromYaml }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  podSelector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  policyTypes: [Ingress]
  ingress:
    - {{- include "data-proxy.allowFrom" (dict "root" . "peers" (list $gateway)) | nindent 6 }}
      ports:
        - port: 8080
    {{- /* The admin port reloads the settings of the proxy. Only the sync workers call it. */}}
    - {{- include "data-proxy.allowFrom" (dict "root" . "peers" (list $sync)) | nindent 6 }}
      ports:
        - port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-postgrest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgrest
spec:
  podSelector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgrest
  policyTypes: [Ingress]
  ingress:
    - {{- include "data-proxy.allowFrom" (dict "root" . "peers" (ternary (list $proxy $console) (list $proxy) .Values.console.enabled)) | nindent 6 }}
      ports:
        - port: 3000
    {{- if and .Values.postgrest.metrics.enabled $monitoring }}
    - from:
        - {{- toYaml $monitoring | nindent 10 }}
      ports:
        - port: {{ .Values.postgrest.metrics.port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-pgdog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgdog
spec:
  podSelector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgdog
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- toYaml $postgrest | nindent 10 }}
      ports:
        - port: 6432
    {{- if $monitoring }}
    - from:
        - {{- toYaml $monitoring | nindent 10 }}
      ports:
        - port: 9090
    {{- end }}
{{- range $component, $port := dict "swagger-ui" 8080 "console" 3000 "notebooks" 8080 }}
{{- $enabled := dict "swagger-ui" $.Values.swaggerUi.enabled "console" $.Values.console.enabled "notebooks" $.Values.notebooks.enabled }}
{{- if get $enabled $component }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "data-proxy.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "data-proxy.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- toYaml $gateway | nindent 10 }}
      ports:
        - port: {{ $port }}
{{- end }}
{{- end }}
{{- end }}
