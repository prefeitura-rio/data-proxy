services:
  db:
    image: pgduckdb/pgduckdb:17-v1.1.1
    restart: unless-stopped
    ports:
      - 5544:5432
    environment:
      POSTGRES_USER: ${DB_USER:-test}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
      POSTGRES_DB: ${DB_NAME:-test}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-test} -d ${DB_NAME:-test}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
  postgrest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 3111:3000
    environment:
      PGRST_DB_URI: postgres://${DB_USER:-test}:${DB_PASSWORD:-test}@db:5432/${DB_NAME:-test}
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_PRE_REQUEST: api.pre_request
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3111
    networks:
      - backend
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    restart: unless-stopped
    ports:
      - 9050:9050
      - 9060:9060
    command:
      - --project=dev
      - --data-from-yaml=/data/seed.yaml
    volumes:
      - ./data/seed.yaml:/data/seed.yaml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:9050/discovery/v1/apis/bigquery/v2/rest || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
  gcs:
    image: fsouza/fake-gcs-server:latest
    restart: unless-stopped
    ports:
      - 4443:4443
    command:
      - -scheme=http
      - -port=4443
      - -backend=memory
      - -public-host=gcs:4443
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:4443/_internal/healthcheck || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
  gcs-init:
    image: curlimages/curl:latest
    depends_on:
      gcs:
        condition: service_healthy
    command:
      - -X
      - POST
      - http://gcs:4443/storage/v1/b
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"name":"test-bucket"}'
    networks:
      - backend
  sync-producer:
    build: .
    command: python -m dp.sync.producer
    environment:
      PG_DSN: postgresql://test:test@db:5432/test
      REDIS_URL: redis://redis:6379/0
      BIGQUERY_EMULATOR_HOST: bigquery:9060
      GCS_ENDPOINT: gcs:4443
      SYNC_CONFIG_PATH: config/sync.test.json
    depends_on:
      redis:
        condition: service_healthy
      bigquery:
        condition: service_healthy
      gcs-init:
        condition: service_completed_successfully
    networks:
      - backend
  sync-worker:
    build: .
    command: python -m dp.sync.worker
    environment:
      PG_DSN: postgresql://test:test@db:5432/test
      REDIS_URL: redis://redis:6379/0
      BIGQUERY_EMULATOR_HOST: bigquery:9060
      GCS_ENDPOINT: gcs:4443
      SYNC_CONFIG_PATH: config/sync.test.json
    depends_on:
      redis:
        condition: service_healthy
      bigquery:
        condition: service_healthy
      gcs-init:
        condition: service_completed_successfully
    networks:
      - backend
  sync-finalizer:
    build: .
    command: python -m dp.sync.finalizer
    environment:
      PG_DSN: postgresql://test:test@db:5432/test
      REDIS_URL: redis://redis:6379/0
      GCS_ENDPOINT: gcs:4443
      SYNC_CONFIG_PATH: config/sync.test.json
    depends_on:
      redis:
        condition: service_healthy
      gcs-init:
        condition: service_completed_successfully
    networks:
      - backend
networks:
  backend:
volumes:
  pgdata:
