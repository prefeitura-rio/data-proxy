services:
  duckdb:
    image: pgduckdb/pgduckdb:17-v1.1.1
    restart: unless-stopped
    ports:
      - 5544:5432
    environment:
      POSTGRES_USER: ${DB_USER:-test}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
      POSTGRES_DB: ${DB_NAME:-test}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER:-test} -d ${DB_NAME:-test}
      interval: 5s
      timeout: 5s
      retries: 10
  postgrest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on:
      duckdb:
        condition: service_healthy
    ports:
      - 3111:3000
    environment:
      PGRST_DB_URI: postgres://authenticator:${PGRST_AUTHENTICATOR_PASSWORD:-authenticator}@duckdb:5432/${DB_NAME:-test}
      PGRST_DB_SCHEMA: ${PG_SCHEMA:-pic}
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_PRE_REQUEST: rls.pre_request
      PGRST_JWT_SECRET: '{"kty":"RSA","e":"AQAB","use":"sig","kid":"default","alg":"RS256","n":"onZcB1ryWS1keTIcbgsLKJ1UBwL1Wbzse5P2HjkrNwbG3Jy2lefUEcTVJxN8bpLeW460Luz3ScZd3d9p8IoHjmhZ2cyO49E41aBRIlBRzWNpebK5xeC95rSKenYHpOPlLzPgybg2qxallzQUOcKCheiF0fsErlapaA9YmKwzP3DwvzYW4JqSrHhDGWPwUCcsR4dpetwKXP_9tRFso06ryr4um3qiq7giyZEyZVG3fHMplD-5e-2-RrzBiGFW_zvs-XVRGPIf9Y5YNjeQJRuS4vF82V8mNZxEZddtUY5plSz-vgX3GSvANLDH-LZJ76Zmx3a8dEZbI7VxgsBQAqcUlQ"}'
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3111
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 5
  minio-init:
    image: pgsty/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/test-bucket
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:latest
    restart: unless-stopped
    ports:
      - 8081:8080
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "tokenCallbacks": [{
            "issuerId": "default",
            "requestMappings": [{
              "requestParam": "grant_type",
              "match": ".*",
              "claims": {
                "sub": "user-1",
                "aud": ["dev-client"],
                "unidades": ["cras_1", "cras_2"]
              }
            }]
          }]
        }
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO /dev/null http://localhost:8080/isalive
      interval: 5s
      timeout: 3s
      retries: 5
  producer:
    build: .
    restart: on-failure
    command: python -m dp.sync.producer
    environment:
      PG_DSN: postgresql://test:test@duckdb:5432/test
      REDIS_URL: redis://redis:6379/0
      GCS_ENDPOINT: minio:9000
      SYNC_CONFIG_PATH: config/sync.test.json
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/root/.config/gcloud/application_default_credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  worker:
    build: .
    restart: on-failure
    command: python -m dp.sync.worker
    environment:
      PG_DSN: postgresql://test:test@duckdb:5432/test
      REDIS_URL: redis://redis:6379/0
      GCS_ENDPOINT: minio:9000
      SYNC_CONFIG_PATH: config/sync.test.json
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    volumes:
      - ~/.config/gcloud/application_default_credentials.json:/root/.config/gcloud/application_default_credentials.json:ro
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  finalizer:
    build: .
    restart: on-failure
    command: python -m dp.sync.finalizer
    environment:
      PG_DSN: postgresql://test:test@duckdb:5432/test
      REDIS_URL: redis://redis:6379/0
      GCS_ENDPOINT: minio:9000
      SYNC_CONFIG_PATH: config/sync.test.json
    depends_on:
      duckdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
volumes:
  pgdata:
