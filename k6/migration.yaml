apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-proxy-k6
  namespace: data-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-proxy-k6
  namespace: data-proxy
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-proxy-k6
  namespace: data-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-proxy-k6
subjects:
  - kind: ServiceAccount
    name: data-proxy-k6
    namespace: data-proxy
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: data-proxy-migration
  namespace: data-proxy
spec:
  parallelism: 1
  script:
    configMap:
      name: data-proxy-migration
      file: migration.ts
  runner:
    image: localhost/k6:local
    serviceAccountName: data-proxy-k6
    automountServiceAccountToken: "true"
    env:
      - name: BASE_URL
        value: http://istio-ingressgateway.istio-ingress.svc.cluster.local
      - name: API_HOST
        value: data-proxy.local
      - name: NAMESPACE
        value: data-proxy
      - name: PIPELINE
        value: data-proxy-pipeline
      - name: E2E_SCRIPT_CONFIGMAP
        value: data-proxy-migration
      - name: MIGRATION_PHASE
        value: shared-baseline
      - name: MIGRATION_TIMEOUT_SECONDS
        value: "300"
      - name: MIGRATION_POLL_INTERVAL_SECONDS
        value: "2"
