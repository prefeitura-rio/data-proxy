apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-proxy-k6
  namespace: data-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-proxy-k6
  namespace: data-proxy
rules:
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - keda.sh
    resources:
      - scaledobjects
      - scaledjobs
    verbs:
      - get
      - list
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
      - poolers
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-proxy-k6
  namespace: data-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-proxy-k6
subjects:
  - kind: ServiceAccount
    name: data-proxy-k6
    namespace: data-proxy
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: data-proxy-e2e
  namespace: data-proxy
spec:
  parallelism: 1
  script:
    configMap:
      name: data-proxy-e2e
      file: e2e.ts
  runner:
    image: localhost/k6:local
    serviceAccountName: data-proxy-k6
    automountServiceAccountToken: "true"
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 4Gi
    env:
      - name: SUITE
        value: full
      - name: MODE
        value: single
      - name: BASE_URL
        value: http://istio-ingressgateway.istio-ingress.svc.cluster.local
      - name: API_HOST
        value: data-proxy.local
      - name: WEBDIS_WRITE_URL
        value: http://istio-ingressgateway.istio-ingress.svc.cluster.local/webdis/write
      - name: NAMESPACE
        value: data-proxy
      - name: PIPELINE
        value: data-proxy-sync
      - name: E2E_SCRIPT_CONFIGMAP
        value: data-proxy-e2e
      - name: POSTGREST_URL
        value: http://data-proxy-postgrest.data-proxy.svc.cluster.local:3000
      - name: POSTGREST_READ_URL
        value: http://data-proxy-postgrest-ro.data-proxy.svc.cluster.local:3000
      - name: OIDC_TOKEN_URL
        value: http://keycloak.keycloak.svc.cluster.local:8080/realms/dev/protocol/openid-connect/token
      - name: OIDC_USER_CLIENT_ID
        value: user
      - name: OIDC_NO_POLICY_CLIENT_ID
        value: no_policy
      - name: PG_IMAGE
        value: localhost/data-proxy-postgres:17.0.0-local
      - name: CACHE_TTL_SECONDS
        value: "5"
      - name: PROXY_CACHE_REDIS_DB
        value: "1"
      - name: POLICY_REPLICATION_TIMEOUT_SECONDS
        value: "120"
      - name: POLICY_REPLICATION_POLL_INTERVAL_SECONDS
        value: "2"
      - name: MODE_TIMEOUT_SECONDS
        value: "900"
      - name: MAX_DURATION
        value: 40m
      - name: K8S_SA_TOKEN_PATH
        value: /var/run/secrets/kubernetes.io/serviceaccount/token
      - name: PARTITIONED_SOURCE
        value: rj-ia-desenvolvimento.dev.partitioned_table
      - name: DUCKLAKE_CATALOG_LOCAL_PATH
        value: /var/lib/ducklake/catalogs
