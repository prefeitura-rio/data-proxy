apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-proxy-k6
  namespace: data-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-proxy-k6
  namespace: data-proxy
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-proxy-k6
  namespace: data-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-proxy-k6
subjects:
  - kind: ServiceAccount
    name: data-proxy-k6
    namespace: data-proxy
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: data-proxy-e2e
  namespace: data-proxy
spec:
  parallelism: 1
  script:
    configMap:
      name: data-proxy-e2e
      file: e2e.ts
  runner:
    image: localhost/k6:local
    serviceAccountName: data-proxy-k6
    automountServiceAccountToken: "true"
    env:
      - name: BASE_URL
        value: http://istio-ingressgateway.istio-ingress.svc.cluster.local
      - name: API_HOST
        value: data-proxy.local
      - name: WEBDIS_URL
        value: http://istio-ingressgateway.istio-ingress.svc.cluster.local/webdis
      - name: NAMESPACE
        value: data-proxy
      - name: PRODUCER_CRONJOB
        value: data-proxy-producer
      - name: POSTGREST_URL
        value: http://data-proxy-postgrest.data-proxy.svc.cluster.local:3000
      - name: PG_IMAGE
        value: localhost/data-proxy-postgres:local
      - name: CACHE_TTL_SECONDS
        value: "5"
