apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: data-proxy-e2e
  namespace: data-proxy
spec:
  parallelism: 1
  paused: "false"
  script:
    localFile: /scripts/e2e.js
  runner:
    image: registry.localhost:5001/k6:local
    serviceAccountName: manifests-k6-e2e
    automountServiceAccountToken: "true"
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 4Gi
    env:
      - name: BASE_URL
        value: http://istio-ingressgateway.istio-ingress.svc.cluster.local
      - name: API_HOST
        value: data-proxy.local
      - name: NAMESPACE
        value: data-proxy
      - name: PIPELINE
        value: data-proxy-sync
      - name: E2E_SCRIPT_CONFIGMAP
        value: data-proxy-e2e
      - name: POSTGREST_URL
        value: http://data-proxy-postgrest.data-proxy.svc.cluster.local:3000
      - name: OIDC_TOKEN_URL
        value: http://keycloak.keycloak.svc.cluster.local:8080/realms/dev/protocol/openid-connect/token
      - name: OIDC_USER_CLIENT_ID
        value: api
      - name: OIDC_NO_POLICY_CLIENT_ID
        value: api_no_policy
      - name: PG_IMAGE
        value: registry.localhost:5001/data-proxy-postgres:17.0.0-local
      - name: CACHE_TTL_SECONDS
        value: "5"
      - name: POLICY_REPLICATION_TIMEOUT_SECONDS
        value: "120"
      - name: POLICY_REPLICATION_POLL_INTERVAL_SECONDS
        value: "2"
      - name: TOPOLOGY_TIMEOUT_SECONDS
        value: "900"
      - name: MAX_DURATION
        value: 40m
      - name: E2E_SCENARIOS
        value: ""
      - name: K8S_SA_TOKEN_PATH
        value: /var/run/secrets/kubernetes.io/serviceaccount/token
      - name: PARTITIONED_SOURCE
        value: rj-ia-desenvolvimento.dev.partitioned_table
      - name: SNAPSHOT_SOURCE
        value: rj-ia-desenvolvimento.dev.snapshot_table
