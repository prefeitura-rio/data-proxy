apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: data-proxy-perf
  namespace: data-proxy
spec:
  parallelism: 1
  paused: "false"
  script:
    localFile: /scripts/load.js
  runner:
    image: registry.localhost:5001/k6:local
    serviceAccountName: manifests-k6-perf
    automountServiceAccountToken: "true"
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 4Gi
    env:
      - name: BASE_URL
        value: http://istio-ingressgateway.istio-ingress.svc.cluster.local
      - name: API_HOST
        value: data-proxy.local
      - name: OIDC_TOKEN_URL
        value: http://keycloak.keycloak.svc.cluster.local:8080/realms/dev/protocol/openid-connect/token
      - name: OIDC_USER_CLIENT_ID
        value: api
      - name: OIDC_NO_POLICY_CLIENT_ID
        value: api_no_policy
      - name: OIDC_POLICY_WRITER_CLIENT_ID
        value: policy
      - name: OIDC_CLIENT_SECRET
        value: test-secret
      - name: K6_PROFILE
        value: load
      - name: K6_PEAK_RATE
        value: "25"
      - name: K6_BOTTLENECK_SHARE
        value: "0.0"
      - name: K6_FALLBACK_SHARE
        value: "0.01"
      - name: K6_THRESHOLD_MODE
        value: strict
      - name: K6_MAX_VUS_MULTIPLIER
        value: "3"
