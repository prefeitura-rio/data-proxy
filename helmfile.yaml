helmDefaults:
  wait: true
  timeout: 900
  syncArgs:
    - --force-conflicts

repositories:
  - name: cnpg
    url: https://cloudnative-pg.io/charts/
  - name: keda
    url: https://kedacore.github.io/charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: istio
    url: https://istio-release.storage.googleapis.com/charts
  - name: bedag
    url: https://bedag.github.io/helm-charts/
  - name: cloudpirates
    url: https://cloudpirates-io.github.io/helm-charts/

releases:
  - name: cnpg
    namespace: cnpg-system
    createNamespace: true
    chart: cnpg/cloudnative-pg
    version: 0.24.0
    wait: true
    timeout: 900

  - name: valkey
    namespace: data-proxy
    createNamespace: true
    chart: oci://registry-1.docker.io/cloudpirates/valkey
    version: 0.17.0
    wait: true
    timeout: 900
    values:
        - scripts/values/valkey.yaml

  - name: keda
    namespace: keda
    createNamespace: true
    chart: keda/keda
    version: 2.18.3
    wait: true
    timeout: 900

  - name: k6-operator
    namespace: k6-operator-system
    createNamespace: true
    chart: grafana/k6-operator
    version: 4.6.0
    wait: true
    timeout: 900

  - name: istio-base
    namespace: istio-system
    createNamespace: true
    chart: istio/base
    version: 1.27.1
    wait: true
    timeout: 900

  - name: istiod
    namespace: istio-system
    chart: istio/istiod
    version: 1.27.1
    wait: true
    timeout: 900
    needs:
        - istio-system/istio-base

  - name: istio-ingressgateway
    namespace: istio-ingress
    createNamespace: true
    chart: istio/gateway
    version: 1.27.1
    wait: true
    timeout: 900
    needs:
      - istio-system/istio-base
      - istio-system/istiod
    values:
      - service:
          type: NodePort

  - name: data-proxy-gateway
    namespace: istio-system
    chart: bedag/raw
    wait: true
    timeout: 900
    needs:
      - istio-ingress/istio-ingressgateway
    values:
      - scripts/values/gateway.yaml

  - name: keycloak
    namespace: keycloak
    createNamespace: true
    chart: cloudpirates/keycloak
    version: 0.21.41
    wait: true
    timeout: 900
    values:
      - scripts/values/keycloak.yaml
