sync:
  image: localhost/data-proxy:local
  imagePullPolicy: IfNotPresent
  dumper:
    visibilityTimeoutMs: 60000
    batchMegaBytes: 60000
migration:
  image: localhost/data-proxy-nushell:local
serviceAccount:
  create: true
  name: data-proxy
postgrest:
  proxyUri: http://localhost:3111
  jwksUri: http://oidc.data-proxy.svc.cluster.local:8080/jwks.json
  jwksFetch:
    image: localhost/data-proxy-nushell:local
  ro:
    replicas: 1
    resources: {}
    keda:
      minReplicaCount: 1
      maxReplicaCount: 3
      pollingInterval: 30
      cooldownPeriod: 300
      triggers: []
  rw:
    replicas: 1
    resources: {}
    hpa:
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
pooler:
    instances: 1
    poolSize: 20
    maxClientConns: 100
    autoscaling:
      minReplicaCount: 1
      maxReplicaCount: 3
s3:
  bucket: test-bucket
  useSsl: "false"
  accessKey: seaweedfs
  secretKey: seaweedfs
seaweedfs:
  allInOne:
    enabled: true
    data:
      type: persistentVolumeClaim
      size: 2Gi
    s3:
      enabled: true
      createBuckets:
        - name: test-bucket
  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false
  s3:
    enabled: false
    enableAuth: true
    credentials:
      admin:
        accessKey: seaweedfs
        secretKey: seaweedfs
redis:
  existingSecret: data-proxy-redis
  writerAddress: data-proxy-valkey-0.data-proxy-valkey-headless.data-proxy.svc.cluster.local:6379
  webdisHost: data-proxy-valkey-0.data-proxy-valkey-headless.data-proxy.svc.cluster.local
  webdisPort: 6379
  webdisReadHost: data-proxy-valkey.data-proxy.svc.cluster.local
  webdisReadPort: 6379
gcp:
  existingSecret: gcp-key
swaggerUi:
  enabled: true
worker:
  keda:
    lagCount: "7"
syncConfig:
  schemas:
    pic:
      claim: preferred_username
      tables:
        - name: rj-ia-desenvolvimento.dev.endpoint_participante_listagem
          strategy: full
          rls:
            - column: id_unidade
              unit_type: unidade
        - name: rj-ia-desenvolvimento.dev.endpoint_participantes
          strategy: full
          rls:
            - column: id_cras
              unit_type: cras
            - column: id_escola
              unit_type: escola
        - name: rj-ia-desenvolvimento.dev.protocolo_estado_diario
          strategy: partitioned
          "n": 5
          partitioning:
            column: protocolo_data_referencia_particicao
            interval: daily
            retention: 365 days
          cache_ttl: 600
          rls:
            - column: id_unidade
              unit_type: unidade
fallback:
  cacheTtl: 5
  nginxImage: localhost/data-proxy-nginx-proxy:local
cnpg:
  db:
    name: data-proxy
    user: data-proxy
  password: test-pg-pass
  authenticatorPassword: test-auth-pass
  init:
    image: localhost/data-proxy-nushell:local
  mode: shared
  instances: 2
  image: localhost/data-proxy-postgres:17.0.0-local
  storage:
    size: 2Gi
  autoscaling:
    minReplicaCount: 2
    maxReplicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: "4"
      memory: 4Gi
partman:
  schedule: '*/30 * * * *'
ingress:
  sidecarInject: true
  enabled: true
  gateway: istio-system/data-proxy-gateway
  host: data-proxy.local
  timeout: 60s
  retries:
    attempts: 2
    perTryTimeout: 30s
    retryOn: "503"
  auth:
    enabled: true
    issuer: http://oidc.data-proxy.svc.cluster.local:8080
    jwksUri: http://oidc.data-proxy.svc.cluster.local:8080/jwks.json
    audience: dev
