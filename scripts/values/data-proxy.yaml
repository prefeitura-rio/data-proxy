image:
  repository: localhost/data-proxy
  tag: local
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: data-proxy
pgduckdb:
  image: localhost/data-proxy-postgres:local
  init:
    image: localhost/data-proxy-nushell:local
  storage:
    size: 2Gi
  db:
    name: dataproxy
    user: dataproxy
  existingSecret: ""
  password: test-pg-pass
  authenticatorPassword: test-auth-pass
postgrest:
  proxyUri: http://localhost:3111
  jwksUri: http://oidc.data-proxy.svc.cluster.local:8080/jwks.json
  jwksFetch:
    image: localhost/data-proxy-nushell:local
s3:
  bucket: test-bucket
  useSsl: "false"
  accessKey: seaweedfs
  secretKey: seaweedfs-local
seaweedfs:
  allInOne:
    enabled: true
    data:
      type: persistentVolumeClaim
      size: 2Gi
    s3:
      enabled: true
      createBuckets:
        - name: test-bucket
  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false
  s3:
    enabled: false
    enableAuth: true
    credentials:
      admin:
        accessKey: seaweedfs
        secretKey: seaweedfs-local
valkey:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: valkey-local
gcp:
  existingSecret: gcp-key
swaggerUi:
  enabled: true
worker:
  keda:
    lagCount: "7"
syncConfig:
  schemas:
    pic:
      claim: preferred_username
      tables:
        - name: rj-ia-desenvolvimento.dev.endpoint_participante_listagem
          strategy: full
          rls:
            - column: id_unidade
              unit_type: unidade
        - name: rj-ia-desenvolvimento.dev.endpoint_participantes
          strategy: full
          rls:
            - column: id_cras
              unit_type: cras
            - column: id_escola
              unit_type: escola
        - name: rj-ia-desenvolvimento.dev.protocolo_estado_diario
          strategy: partitioned
          "n": 5
          cache_ttl: 600
          rls:
            - column: id_unidade
              unit_type: unidade
fallback:
  enabled: true
  cacheTtl: 5
  nginxImage: localhost/data-proxy-nginx-proxy:local
ha:
  enabled: false
  # schemas:
  #   pic:
  #     members: 3
  #     storage:
  #       size: 2Gi
  #     postgrest:
  #       readReplicas: 2
  #       writeReplicas: 1
  #     haproxy:
  #       replicas: 2
  # patroni:
  #   replicationPassword: patroni-local
ingress:
  sidecarInject: true
  enabled: true
  gateway: istio-system/data-proxy-gateway
  host: data-proxy.local
  timeout: 60s
  retries:
    attempts: 2
    perTryTimeout: 30s
    retryOn: "503"
  auth:
    enabled: true
    issuer: http://oidc.data-proxy.svc.cluster.local:8080
    jwksUri: http://oidc.data-proxy.svc.cluster.local:8080/jwks.json
    audience: dev
