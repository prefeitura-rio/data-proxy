sync:
  image: localhost/data-proxy-sync:local
  imagePullPolicy: IfNotPresent
  dumper:
    visibilityTimeoutMs: 60000
    batchMegaBytes: 60000
  recovery:
    enabled: true
    intervalSeconds: 30
    graceSeconds: 120
  config:
    schemas:
      test:
        claim: preferred_username
        tables:
          - name: rj-ia-desenvolvimento.dev.full_table
            strategy: full
            rls:
              - column: unit_id
                unit_type: unit
          - name: rj-ia-desenvolvimento.dev.multi_rls_table
            strategy: full
            rls:
              - column: region_id
                unit_type: region
              - column: group_id
                unit_type: group
          - name: rj-ia-desenvolvimento.dev.partitioned_table
            strategy: partitioned
            n: 5
            partitioning:
              column: date
              interval: daily
              retention: 365 days
            cache_ttl: 600
            rls:
              - column: unit_id
                unit_type: unit
jobs:
  image: localhost/data-proxy-jobs:local
serviceAccount:
  create: true
  name: data-proxy
postgrest:
  proxyUri: http://localhost:3111
  jwksUri: http://keycloak.keycloak.svc.cluster.local:8080/realms/dev/protocol/openid-connect/certs
  jwksFetch:
    image: localhost/data-proxy-jobs:local
  ro:
    replicas: 1
    resources: {}
    keda:
      minReplicaCount: 1
      maxReplicaCount: 3
      pollingInterval: 30
      cooldownPeriod: 300
      triggers: []
  rw:
    replicas: 1
    resources: {}
    hpa:
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
s3:
  bucket: test-bucket
  useSsl: "false"
  accessKey: seaweedfs
  secretKey: seaweedfs
seaweedfs:
  allInOne:
    enabled: true
    data:
      type: persistentVolumeClaim
      size: 2Gi
    s3:
      enabled: true
      createBuckets:
        - name: test-bucket
  master:
    enabled: false
  volume:
    enabled: false
  filer:
    enabled: false
  s3:
    enabled: false
    enableAuth: true
    credentials:
      admin:
        accessKey: seaweedfs
        secretKey: seaweedfs
redis:
  existingSecret: data-proxy-redis
  writerAddress: data-proxy-valkey-0.data-proxy-valkey-headless.data-proxy.svc.cluster.local:6379
  webdisHost: data-proxy-valkey-0.data-proxy-valkey-headless.data-proxy.svc.cluster.local
  webdisPort: 6379
  webdisReadHost: data-proxy-valkey.data-proxy.svc.cluster.local
  webdisReadPort: 6379
gcp:
  existingSecret: gcp-key
swaggerUi:
  enabled: true
worker:
  keda:
    lagCount: "7"
ducklake:
  litestream:
    storage:
      storageClass: standard
fallback:
  cacheTtl: 5
  proxyImage: localhost/data-proxy-proxy:local
cnpg:
  pooler:
    instances: 1
    poolSize: 20
    maxClientConns: 100
    autoscaling:
      minReplicaCount: 1
      maxReplicaCount: 3
  db:
    name: data-proxy
    user: admin
  password: test-pg-pass
  authenticatorPassword: test-auth-pass
  init:
    image: localhost/data-proxy-jobs:local
  mode: shared
  instances: 1
  image: localhost/data-proxy-postgres:17.0.0-local
  storage:
    size: 2Gi
  autoscaling:
    minReplicaCount: 1
    maxReplicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
ingress:
  sidecarInject: true
  enabled: true
  gateway: istio-system/data-proxy-gateway
  host: data-proxy.local
  timeout: 60s
  retries:
    attempts: 2
    perTryTimeout: 30s
    retryOn: "503"
  auth:
    enabled: true
    issuer: http://keycloak.keycloak.svc.cluster.local:8080/realms/dev
    jwksUri: http://keycloak.keycloak.svc.cluster.local:8080/realms/dev/protocol/openid-connect/certs
    audience: dev
