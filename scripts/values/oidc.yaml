resources:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: oidc
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: oidc
      template:
        metadata:
          labels:
            app: oidc
        spec:
          containers:
            - name: oidc
              image: localhost/oidc:local
              imagePullPolicy: IfNotPresent
              ports:
                - name: http
                  containerPort: 8080
  - apiVersion: v1
    kind: Service
    metadata:
      name: oidc
    spec:
      selector:
        app: oidc
      ports:
        - name: http
          port: 8080
          targetPort: http
