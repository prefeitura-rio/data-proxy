resources:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: mock-oauth2-config
    data:
      JSON_CONFIG: |
        {"interactiveLogin":true,"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"grant_type","match":".*","claims":{"sub":"user-1","aud":["dev"],"role":"user","preferred_username":"user-1","schemas":["pic","pic"]}}]}]}
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mock-oauth2-server
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: mock-oauth2-server
      template:
        metadata:
          labels:
            app: mock-oauth2-server
        spec:
          containers:
            - name: mock-oauth2-server
              image: ghcr.io/navikt/mock-oauth2-server:latest
              ports:
                - name: http
                  containerPort: 8080
              env:
                - name: JSON_CONFIG
                  valueFrom:
                    configMapKeyRef:
                      name: mock-oauth2-config
                      key: JSON_CONFIG
  - apiVersion: v1
    kind: Service
    metadata:
      name: mock-oauth2-server
    spec:
      selector:
        app: mock-oauth2-server
      ports:
        - name: http
          port: 8080
          targetPort: http
