suite: Sync trigger CronJob
templates:
  - templates/trigger.yaml
tests:
  - it: renders a suspended sync trigger CronJob when enabled
    set:
      trigger.enabled: true
    asserts:
      - isKind:
          of: ConfigMap
        documentSelector:
          path: metadata.name
          value: manifests-sync-trigger-script
      - isKind:
          of: CronJob
        documentSelector:
          path: metadata.name
          value: manifests-sync-trigger
      - equal:
          path: spec.suspend
          value: true
        documentSelector:
          path: metadata.name
          value: manifests-sync-trigger
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [kubectl, -n, data-proxy, exec, deployment/data-proxy-sync, -c, sync, --, python, /scripts/trigger.py]
        documentSelector:
          path: metadata.name
          value: manifests-sync-trigger
