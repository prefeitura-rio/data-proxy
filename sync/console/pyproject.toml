[project]
name = "console"
version = "0.1.0"
description = "Operator console: a FastAPI service that shows the sync runs and the freshness of the data"
requires-python = ">=3.14"
dependencies = [
  "dbos",
  "engine",
  "fastapi>=0.142.2",
  "granian[uvloop]>=2.8.4",
  "psycopg[binary]",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "whenever",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
strict = true
addopts = ["--import-mode=importlib"]
env_files = ["../.env.test"]
pythonpath = ["tests"]
markers = ["postgres: tests that need the PostgreSQL test service"]

[tool.ruff]
extend = "../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.extend-per-file-ignores]
"src/console/dependencies.py" = [
  "TC001",
] # FastAPI reads the annotations of a dependency at runtime
"src/console/routes/*.py" = [
  "TC001", # FastAPI reads the annotations of a route at runtime
  "TC003", # FastAPI reads the annotations of a route at runtime
]

[tool.basedpyright]
extends = "../pyproject.toml"
extraPaths = ["src", "tests", "../engine/src"]

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportAny = false         # the tests read decoded JSON bodies
reportExplicitAny = false # the tests annotate decoded JSON bodies as Any

[tool.vulture]
exclude = [
  "src/console/models.py",
] # response models: FastAPI reads their fields
ignore_decorators = ["@router.*"]
ignore_names = ["model_config", "do_POST"] # do_POST: http.server calls the handler method by name
