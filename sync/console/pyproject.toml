[project]
name = "console"
version = "0.1.0"
description = "Operator console: a FastAPI service that shows the sync runs and the freshness of the data"
requires-python = ">=3.14"
dependencies = [
  "dbos>=3.0.0",
  "fastapi>=0.142.2",
  "pydantic-settings>=2.14.2",
  "granian[uvloop]>=2.8.4",
  "whenever>=0.10.5",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
strict = true
addopts = ["--import-mode=importlib"]
env_files = ["../.env.test"]

[tool.ruff]
extend = "../pyproject.toml"
src = ["src"]

[tool.ruff.lint.extend-per-file-ignores]
"src/console/dependencies.py" = ["TC001"] # FastAPI reads the annotations of a dependency at runtime
"src/console/routes/*.py" = [
  "TC001", # FastAPI reads the annotations of a route at runtime
  "TC003", # FastAPI reads the annotations of a route at runtime
]

[tool.basedpyright]
extends = "../pyproject.toml"
extraPaths = ["src"]

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportAny = false         # the tests read decoded JSON bodies
reportExplicitAny = false # the tests annotate decoded JSON bodies as Any

[tool.vulture]
exclude = ["src/console/models.py"] # response models: FastAPI reads their fields
ignore_decorators = ["@router.*"]
ignore_names = ["model_config"]

