[project]
name = "console"
version = "0.1.0"
description = "Operator console: a FastAPI service that shows the sync runs and the freshness of the data"
requires-python = ">=3.14"
dependencies = [
  "dbos>=3.0.0",
  "fastapi>=0.142.2",
  "pydantic-settings>=2.14.2",
  "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
