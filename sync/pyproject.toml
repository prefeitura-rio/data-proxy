[dependency-groups]
dev = [
  "console",
  "engine",
  "complexipy>=7.0.1",
  "google-auth-stubs>=0.3.0",
  "hypothesis>=6.165.10",
  "minio>=7.2.20",
  "pytest-asyncio>=0.24.0",
  "pytest-bdd==8.1.0",
  "pytest-env>=1.1.5",
  "pytest-gremlins>=1.9.0",
  "pytest>=8.0.0",
  "pyrefly>=0.1.0",
  "ruff>=0.9.3",
  "types-aiobotocore[s3]>=3.9.0",
  "vulture>=2.16",
  "httpx2>=2.13.0",
]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "dbos>=3.0.0",
  "psycopg>=3.3.4",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "sqlalchemy>=2.0.54",
  "uvloop>=0.23.0",
  "whenever>=0.10.5",
]

[tool.uv.workspace]
members = ["*"]

[tool.uv.sources]
console = { workspace = true }
engine = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "COM812", # trailing comma — conflicts with the formatter
  "CPY",    # copyright header — not used in this repository
  "D203",   # blank line before class docstring — conflicts with D211
  "D213",   # summary on second line — conflicts with D212
  "E501",   # line too long — handled by formatter
  "ISC001", # implicit string concat on one line — conflicts with the formatter
  "TRY003", # long messages in raise — too strict for scripts
  "DOC201", # docstring Returns section — docstrings are one-line summaries
  "DOC402", # docstring Yields section — docstrings are one-line summaries
  "DOC501", # docstring Raises section — docstrings are one-line summaries
  "EM101",  # raw string in exception — same policy as TRY003
  "EM102",  # f-string in exception — same policy as TRY003
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
  "S101",     # assert — the way a test states its expectation
  "ASYNC109", # test doubles keep the signature of the real function
  "D100",     # test modules have no module docstring by project rule
  "INP001",   # tests run with importlib import mode, not as a package
  "PLR2004",  # magic numbers are the expected values in assertions
  "PLR6301",  # test class methods group cases and do not use self
  "TC002",    # test annotations are cheap, runtime imports keep fixtures simple
  "TC003",    # test annotations are cheap, runtime imports keep fixtures simple
]

[tool.basedpyright]
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
reportUnusedCallResult = false # calls such as execute and set are made for their effect

[tool.pyrefly]
project-includes = ["*/src", "*/tests"]
search-path = ["engine/src", "engine", "console/src", "console/tests"]
python-version = "3.14"
python-interpreter-path = ".venv/bin/python"
preset = "all"

[tool.pyrefly.errors]
implicit-bool = false      # truthiness checks are the code style
unused-call-result = false # calls such as execute and set are made for their effect

[[tool.pyrefly.sub-config]]
matches = "console/tests/**"

[tool.pyrefly.sub-config.errors]
explicit-any = false # the console tests read decoded JSON bodies

[tool.complexipy]
max-complexity-allowed = 10
