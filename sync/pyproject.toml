[project]
name = "sync"
version = "1.0.0"
description = "Sync service: copies source tables into DuckLake with DBOS workflows and serves them through PostgreSQL views"

requires-python = ">=3.14"
dependencies = [
  "duckdb==1.5.4",
  "dbos[otel]>=3.0.0",
  "httpx2>=2.13.0",
  "google-cloud-bigquery>=3.42.3",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.14.2",
  "pydantic>=2.13.4",
  "redis>=5.0",
  "asyncer>=0.0.18",
  "whenever>=0.10.5",
  "aiobotocore>=3.9.0",
  "jinja2>=3.1",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "uvloop>=0.23.0",
  "lightkube>=1.0.1",
  "croniter>=6.2.4",
]

[dependency-groups]
dev = [
  "google-auth-stubs>=0.3.0",
  "hypothesis>=6.165.10",
  "minio>=7.2.20",
  "pytest-asyncio>=0.24.0",
  "pytest-bdd==8.1.0",
  "pytest-cov>=6.0.0",
  "pytest>=8.0.0",
  "pyrefly>=0.1.0",
  "ruff>=0.9.3",
  "types-aiobotocore[s3,iam]>=3.9.0",
  "vulture>=2.16",
  "types-croniter>=6.2.4.20261006",
  "pytest-xdist>=3.6",
  "sqlfluff>=4.5.0",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
# GHSA-6q48-6c7w-9gw2 is critical. Its fix, certifi 2026.10.19, is younger than the cooldown above.
exclude-newer-package = { certifi = "2026-10-24T12:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
strict = true
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
bdd_features_base_dir = "tests/integration/features"
markers = [
  "postgres: scenarios that require the PostgreSQL test service",
  "s3: scenarios that require S3-compatible object storage",
]
filterwarnings = [
  "ignore::pytest.PytestRemovedIn10Warning:pytest_bdd.compat",
  "ignore::pytest.PytestRemovedIn10Warning:_pytest.fixtures",
  "ignore::DeprecationWarning:gherkin.gherkin_line",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "."]

[tool.ruff.lint]
preview = true
select = ["F", "E4", "E7", "E9", "I", "B", "ASYNC", "S", "BLE", "DTZ", "T10", "PLE", "PLW", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",     # assert — the way a test states its expectation
  "ASYNC109", # test doubles keep the signature of the real function
  "RUF029",   # async test doubles keep the awaitable signature
  "PLW1514",  # test files are ASCII
  "S106",     # the storage credentials are test constants
  "S404",     # the psql fixture runs the psql command-line client
  "S603",     # the fixtures run the psql client and the container engine
  "S607",     # the fixtures find psql on PATH
  "S608",     # the fixtures build SQL from constants
]
"src/sync/dbos/steps.py" = ["RUF029"] # DBOS steps are async by contract
"src/sync/dbos/workflows.py" = [
  "BLE001", # workflows catch every failure to record it and continue the run
]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.14"
python-interpreter-path = ".venv/bin/python"
preset = "all"

[tool.pyrefly.errors]
unused-call-result = false # calls such as execute and set are made for their effect

[tool.vulture]
ignore_decorators = [
  "@DBOS.workflow*", # DBOS starts a workflow by name from the queue, so no code calls it
  "@pytest.fixture",
  "@given",
  "@when",
  "@then",
  "@field_validator",
  "@model_validator",
]
ignore_names = [
  "pytest_*",
  "pytestmark",
  "propagate",
  "cache_ttl",
  "side_effect",
  "return_value",
  "__aenter__",
  "__aexit__",
  "SchemaField",
  "model_config",
  "expect",
  "patch_type",
  "do_POST",
  "log_message",
  "annotations", # a field of ObjectMeta, which the code assigns
  "ownerReferences", # a field of ObjectMeta, which the code assigns
]
