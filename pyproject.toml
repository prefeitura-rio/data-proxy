[project]
name = "poc-pg-duckdb-postgrest"
version = "0.1.0"
description = "PoC: pg_duckdb + PostgREST + RLS as a read-serving layer for BigQuery/dbt marts (proposta-pedro architecture, Option A)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-cloud-bigquery>=3.38.0",
    "google-cloud-storage>=2.19.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.2.1",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
