[project]
name = "data-proxy"
version = "1.0.0"
description = "pg_duckdb + PostgREST + RLS as a read-serving layer for BigQuery/dbt marts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "duckdb>=1.5",
  "polars>=1.0",
  "faststream[redis]>=0.7.0",
  "google-cloud-bigquery>=3.42.3",
  "loguru>=0.7.3",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.14.2",
  "pydantic>=2.13.4",
  "redis>=5.0",
  "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "google-auth-stubs>=0.3.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.3",
  "sqlfluff>=3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "FLY",  # flynt
  "I",    # isort
  "ISC",  # flake8-implicit-str-concat
  "N",    # pep8-naming
  "PERF", # perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "T10",  # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "E501",    # line too long — handled by formatter
  "B008",    # function call in default argument
  "FLY002",  # implicit f-string concat — intentional in some patterns
  "PERF203", # try-except in loop — acceptable in sync scripts
  "RET504",  # unnecessary assignment before return — aids readability
  "S101",    # assert — intentional security guard in sync.py
  "S311",    # random — intentional, seed script uses synthetic data not crypto
  "S608",    # SQL via f-string — intentional, documented inline
  "TRY003",  # long messages in raise — too strict for scripts
]

[tool.basedpyright]
venvPath = ".devenv/state"
venv = "venv"
extraPaths = ["src", "tests"]
reportUnusedCallResult = "none"
reportUnusedParameter = "none"

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "placeholder"
sql_file_exts = ".sql"
exclude_rules = "AM04"

[tool.sqlfluff.templater.placeholder]
param_style = "dollar"

[tool.coverage.run]
source = ["dp"]
omit = [
  "*/__init__.py",
  "src/dp/constants.py",
  "src/dp/duckdb.py",
  "src/dp/errors.py",
  "src/dp/models.py",
  "src/dp/settings.py",
  "src/dp/templates.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.",
  "pragma: no cover",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
