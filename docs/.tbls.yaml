application:
  dsn: ${TBLS_APP_DSN}
  er:
    format: mermaid
    hideDef: true
  exclude:
    - public.*
    - duckdb.*
  viewpoints:
    - name: application
      desc: Application database tables
      tables:
        - console.projects
        - console.schemas
        - console.tables
        - console.rls
        - console.config_history
        - data_proxy.*
        - rbac.*
        - access.*
  relations:
    - table: data_proxy.scope
      columns:
        - schema_name
      parentTable: console.schemas
      parentColumns:
        - name
      def: same name
    - table: console.config_history
      columns:
        - schema_name
      parentTable: console.schemas
      parentColumns:
        - name
      def: same name
catalog:
  dsn: ${TBLS_CATALOG_DSN}
  er:
    format: mermaid
  viewpoints:
    - name: catalog
      desc: Catalog database application tables
      tables:
        - signer.keys
