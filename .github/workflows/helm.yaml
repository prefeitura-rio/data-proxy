name: Helm chart
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/helm.yaml
      - helm/Chart.yaml
      - helm/Chart.lock
      - helm/values.yaml
      - helm/ci/**
      - helm/db/**
      - helm/files/**
      - helm/templates/**
      - helm/tests/**
  workflow_dispatch:
concurrency:
  group: helm-release
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
env:
  REGISTRY: ghcr.io
  REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}/charts
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v4.2.4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Read current version
        id: version
        run: |
          CURRENT=$(yq eval '.version' helm/Chart.yaml)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEXT="$MAJOR.$((MINOR + 1)).0"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT"         >> "$GITHUB_OUTPUT"
          echo "tag=helm-v$CURRENT"   >> "$GITHUB_OUTPUT"
      - name: Skip if no helm changes since last release
        id: guard
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E "^helm-v" | head -1 || echo "")
          [ -z "$LAST_TAG" ] && exit 0
          git diff --name-only "$LAST_TAG" HEAD -- helm/ | grep -q . && exit 0
          echo "No helm changes since $LAST_TAG — nothing to release."
          echo "skip=true" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ${{ env.REGISTRY }} \
                -u ${{ github.actor }} \
                --password-stdin
      - name: Install helm-unittest plugin
        if: steps.guard.outputs.skip != 'true'
        run: helm plugin install https://github.com/helm-unittest/helm-unittest/releases/download/v1.1.2/unittest-1.1.2.tgz --verify=false
      - name: Lint
        if: steps.guard.outputs.skip != 'true'
        run: |
          helm lint helm/ -f helm/ci/test-values.yaml
          helm lint helm/ -f helm/ci/test-values-ha.yaml
      - name: Unit tests
        if: steps.guard.outputs.skip != 'true'
        run: helm unittest helm/
      - name: Render and validate chart
        if: steps.guard.outputs.skip != 'true'
        run: bash scripts/test-charts.sh
      - name: Package
        if: steps.guard.outputs.skip != 'true'
        run: helm package helm/ --destination ./packaged/
      - name: Push to GHCR
        if: steps.guard.outputs.skip != 'true'
        run: helm push ./packaged/*.tgz oci://${{ env.REGISTRY_PREFIX }}
      - name: Bump minor version in Chart.yaml
        if: steps.guard.outputs.skip != 'true'
        run: yq e '.version = strenv(NEXT)' -i helm/Chart.yaml
        env:
          NEXT: ${{ steps.version.outputs.next }}
      - name: Commit version bump and tag
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/Chart.yaml
          git commit -m "chore: bump helm chart to ${{ steps.version.outputs.next }} [skip ci]"
          git tag ${{ steps.version.outputs.tag }}
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin ${{ steps.version.outputs.tag }}
      - name: Create GitHub release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.version.outputs.current }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname \
            | grep -E "^helm-v" | sed -n '2p' || true)
          gh release create "$TAG" \
            --title "Helm chart $TAG" \
            ${PREV_TAG:+--notes-start-tag "$PREV_TAG"} \
            --generate-notes \
            --notes "## data-proxy $TAG

          ### Install

          \`\`\`bash
          helm install my-release \
            oci://${{ env.REGISTRY_PREFIX }}/data-proxy \
            --version $CURRENT
          \`\`\`

          ### Pull

          \`\`\`bash
          helm pull \
            oci://${{ env.REGISTRY_PREFIX }}/data-proxy \
            --version $CURRENT
          \`\`\`"
      - name: Upload .tgz to GitHub release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" ./packaged/*.tgz
