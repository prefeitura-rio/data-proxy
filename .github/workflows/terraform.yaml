name: Terraform provider
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: The provider version to release, such as 0.2.0. Leave it empty to follow the commits.
        type: string
        required: false
concurrency:
  group: terraform-release
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  release:
    name: Release the provider
    if: vars.TERRAFORM_REGISTRY_HOST != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: devenv --profile terraform shell -- bash -e {0}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TERRAFORM_REGISTRY_HOST: ${{ vars.TERRAFORM_REGISTRY_HOST }}
      TERRAFORM_REGISTRY_NAMESPACE: ${{ vars.TERRAFORM_REGISTRY_NAMESPACE }}
      TERRAFORM_REGISTRY_BUCKET: ${{ vars.TERRAFORM_REGISTRY_BUCKET }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
      - uses: ./.github/actions/cache-go
      - name: Decide whether a release is due
        id: next
        run: nu scripts/ci.nu terraform next
        env:
          VERSION: ${{ inputs.version }}
      - name: Authenticate to Google Cloud
        if: steps.next.outputs.release == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Build, sign and publish the release
        if: steps.next.outputs.release == 'true'
        run: nu scripts/ci.nu terraform release "$PROVIDER_VERSION"
        env:
          PROVIDER_VERSION: ${{ steps.next.outputs.version }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Publish the registry
        if: steps.next.outputs.release == 'true'
        run: nu scripts/ci.nu terraform registry
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
