name: Proxy
on:
  push:
    branches:
      - main
    paths: &proxy_paths
      - nginx/**
      - Dockerfile.proxy
      - devenv.nix
      - devenv.lock
      - devenv.yaml
  pull_request:
    paths: *proxy_paths
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  NIXPKGS: github:cachix/devenv-nixpkgs/ee3d58d53cfcddfc0ae6fc7f04f4fe2a0c7cf0ed
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Link the njs type definitions
        run: |
          ln -sfn "$(nix build --print-out-paths --no-link "$NIXPKGS#nginxModules.njs")/ts" nginx/types
      - name: Typecheck, test and build the proxy
        run: |
          nix shell "$NIXPKGS#typescript" "$NIXPKGS#nodejs_24" --command bash -euo pipefail -c '
            tsc -p nginx
            node --experimental-config-file=nginx/node.config.json --test nginx/fallback.test.ts
            tsc -p nginx --noEmit false --outDir nginx/build
          '
      - uses: hadolint/hadolint-action@v3.2.0
        with:
          dockerfile: Dockerfile.proxy
      - name: Build the proxy image
        run: docker build -t data-proxy-nginx-proxy:verify -f Dockerfile.proxy .
      - name: Check that nginx loads the compiled script
        run: |
          docker run --rm \
            --add-host kube-dns.kube-system.svc.cluster.local:127.0.0.1 \
            data-proxy-nginx-proxy:verify nginx -t
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fallback-script
          path: nginx/build/fallback.js
  publish:
    if: github.ref == 'refs/heads/main'
    needs:
      - verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fallback-script
          path: nginx/build
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-nginx-proxy
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Dockerfile.proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
