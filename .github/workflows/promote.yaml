name: Promote
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: The chart version that production runs, such as 2.13.0. Use an older version for a rollback.
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  next:
    name: Find the version to promote
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: devenv --profile chart shell -- bash -e {0}
    outputs:
      version: ${{ steps.next.outputs.version }}
      pending: ${{ steps.next.outputs.pending }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
      - name: Compare the newest chart with the chart of production
        id: next
        run: ci chart next
        env:
          VERSION: ${{ inputs.version }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REGISTRY_USER: ${{ github.actor }}
  promote:
    name: Promote to production
    needs: next
    if: needs.next.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        shell: devenv --profile chart shell -- bash -e {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
      - name: Move the tag prod to the chart
        run: ci chart promote "$VERSION" $LATEST_ONLY
        env:
          VERSION: ${{ needs.next.outputs.version }}
          LATEST_ONLY: ${{ github.event_name == 'workflow_run' && '--if-latest' || '' }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REGISTRY_USER: ${{ github.actor }}
