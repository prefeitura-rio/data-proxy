name: Promote
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: The chart version that production runs, such as 2.13.0. Use an older version for a rollback.
        type: string
        required: true
permissions:
  actions: write
  contents: read
  packages: write
jobs:
  next:
    name: Find the version to promote
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.next.outputs.version }}
      current: ${{ steps.next.outputs.current }}
      pending: ${{ steps.next.outputs.pending }}
    steps:
      - name: Cancel the other Promote runs that wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --workflow promote.yaml --status waiting --json databaseId \
            --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | .databaseId" |
            xargs --no-run-if-empty -n1 gh run cancel
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: next
        uses: ./.github/actions/chart-promote
        with:
          command: next
          version: ${{ inputs.version }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          registry-user: ${{ github.actor }}
  promote:
    name: Promote to production (${{ needs.next.outputs.current }} to ${{ needs.next.outputs.version }})
    needs: next
    if: needs.next.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: promote-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/chart-promote
        with:
          command: promote
          version: ${{ needs.next.outputs.version }}
          latest-only: ${{ github.event_name == 'workflow_run' }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          registry-user: ${{ github.actor }}
