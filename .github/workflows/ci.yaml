name: CI
on:
  push:
    branches:
      - main
    paths: &ci_paths
      - .github/workflows/**
      - .github/actions/**
      - src/**
      - tests/**
      - nginx/**
      - helm/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - Dockerfile.pipeline
      - Dockerfile.postgres
      - Dockerfile.nushell
      - Dockerfile.proxy
      - devenv.nix
      - devenv.lock
      - devenv.yaml
  pull_request:
    paths: *ci_paths
  workflow_dispatch:
    inputs:
      force_full:
        description: Run all stages
        type: boolean
        default: false
concurrency:
  group: data-proxy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      build_helm: ${{ steps.filter.outputs.build_helm }}
      build_images: ${{ steps.filter.outputs.build_images }}
      build_matrix: ${{ steps.filter.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-devenv
      - id: filter
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.force_full || false }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_OUTPUT_FILE: ${{ github.output }}
        run: devenv shell -- ci changes
  quality:
    defaults:
      run:
        shell: devenv --profile quality shell -- bash -e {0}
    name: Lint and test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-devenv
      - name: Restore quality virtual environment
        id: quality-venv-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: quality-venv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'devenv.nix', 'devenv.lock', 'devenv.yaml') }}
      - name: Restore quality task state
        id: quality-tasks-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .devenv/profiles/quality/state/tasks.db*
            .devenv/profiles/quality/state/files.json
          key: quality-tasks-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'devenv.nix', 'devenv.lock', 'devenv.yaml') }}-${{ github.sha }}
          restore-keys: |
            quality-tasks-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'devenv.nix', 'devenv.lock', 'devenv.yaml') }}-
      - run: devenv --profile quality tasks run dp:lint dp:test
      - name: Save quality virtual environment
        if: steps.quality-venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: ${{ steps.quality-venv-cache.outputs.cache-primary-key }}
      - name: Save quality task state
        if: steps.quality-tasks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .devenv/profiles/quality/state/tasks.db*
            .devenv/profiles/quality/state/files.json
          key: ${{ steps.quality-tasks-cache.outputs.cache-primary-key }}
  build-images:
    name: Build ${{ matrix.name }} image
    needs:
      - changes
      - quality
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    if: always() && github.ref == 'refs/heads/main' && needs.quality.result == 'success' && needs.changes.outputs.build_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=${{ matrix.tag_prefix }},format=short
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  helm:
    defaults:
      run:
        shell: devenv --profile helm shell -- bash -e {0}
    name: Release Helm chart
    timeout-minutes: 15
    needs:
      - changes
      - quality
      - build-images
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.changes.outputs.build_helm == 'true' || needs.changes.outputs.build_images == 'true') && needs.quality.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-devenv
      - name: Update from main
        run: devenv shell -- ci git update
      - name: Resolve latest image SHAs from registry
        id: shas
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devenv shell -- ci images resolve
      - name: Pin image SHAs in values.yaml
        run: devenv shell -- ci images pin
        env:
          PIPELINE_SHA: ${{ steps.shas.outputs.pipeline }}
          PG_SHA: ${{ steps.shas.outputs.postgres }}
          NU_SHA: ${{ steps.shas.outputs.nushell }}
          PROXY_SHA: ${{ steps.shas.outputs.proxy }}
      - name: Read current version
        id: version
        run: devenv shell -- ci version
      - name: Skip if no chart or image changes since release
        id: guard
        run: devenv shell -- ci guard
      - name: Login to registry
        if: steps.guard.outputs.skip != 'true'
        run: devenv shell -- ci chart login
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REGISTRY_USER: ${{ github.actor }}
      - name: Bump chart version
        if: steps.guard.outputs.skip != 'true'
        run: devenv shell -- ci chart bump
        env:
          NEXT: ${{ steps.version.outputs.next }}
      - name: Package chart
        if: steps.guard.outputs.skip != 'true'
        run: devenv shell -- ci chart package
      - name: Commit and tag chart release
        if: steps.guard.outputs.skip != 'true'
        run: devenv shell -- ci chart commit
        env:
          NEXT: ${{ steps.version.outputs.next }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
      - name: Publish chart and release
        if: steps.guard.outputs.skip != 'true'
        run: devenv shell -- ci chart publish
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
