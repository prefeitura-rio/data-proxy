name: CI
on:
  push:
    branches:
      - main
    paths: &ci_paths
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - Dockerfile.postgres
      - Dockerfile.nushell
      - Dockerfile.proxy
      - nginx/**
  pull_request:
    paths: *ci_paths
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  PROXY_TOOLS: .devenv/state/proxy-tools
  NJS_TYPES_VERSION: 1.0.0
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --frozen
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run ruff check
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run basedpyright src/ tests/
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --frozen
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run pytest tests/ -q
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install the compiler and the type definitions
        run: |
          npm install --no-save --prefix "$PROXY_TOOLS" "typescript@latest" "njs-types@$NJS_TYPES_VERSION"
          ln -sfn "$PWD/$PROXY_TOOLS/node_modules/njs-types" nginx/types
      - name: Typecheck, test and build the proxy
        run: |
          tsc="$PROXY_TOOLS/node_modules/.bin/tsc"
          "$tsc" -p nginx
          node --experimental-config-file=nginx/node.config.json --test nginx/fallback.test.ts
          "$tsc" -p nginx --noEmit false --outDir nginx/build
      - uses: hadolint/hadolint-action@v3.2.0
        with:
          dockerfile: Dockerfile.proxy
      - name: Build the proxy image
        run: docker build -t data-proxy-nginx-proxy:verify -f Dockerfile.proxy .
      - name: Check that nginx loads the compiled script
        run: |
          docker run --rm \
            --add-host kube-dns.kube-system.svc.cluster.local:127.0.0.1 \
            data-proxy-nginx-proxy:verify nginx -t
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fallback-script
          path: nginx/build/fallback.js
  build-dp:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.built }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Skip if Dockerfile and deps unchanged
        id: guard
        run: |
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- Dockerfile pyproject.toml uv.lock src/)" ]; then
            echo "No changes to Dockerfile or build context — skipping build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: hadolint/hadolint-action@v3.2.0
        if: steps.guard.outputs.built == 'true'
        with:
          dockerfile: Dockerfile
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.guard.outputs.built == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        if: steps.guard.outputs.built == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.guard.outputs.built == 'true'
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-pg:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.built }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Skip if Dockerfile.postgres unchanged
        id: guard
        run: |
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- Dockerfile.postgres)" ]; then
            echo "No changes to Dockerfile.postgres — skipping build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: hadolint/hadolint-action@v3.2.0
        if: steps.guard.outputs.built == 'true'
        with:
          dockerfile: Dockerfile.postgres
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.guard.outputs.built == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        if: steps.guard.outputs.built == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-postgres
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.guard.outputs.built == 'true'
        with:
          file: Dockerfile.postgres
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-nushell:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.built }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Skip if Dockerfile.nushell unchanged
        id: guard
        run: |
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- Dockerfile.nushell)" ]; then
            echo "No changes to Dockerfile.nushell — skipping build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: hadolint/hadolint-action@v3.2.0
        if: steps.guard.outputs.built == 'true'
        with:
          dockerfile: Dockerfile.nushell
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.guard.outputs.built == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        if: steps.guard.outputs.built == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-nushell
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.guard.outputs.built == 'true'
        with:
          file: Dockerfile.nushell
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-proxy:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
      - proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Skip if the proxy sources unchanged
        id: guard
        run: |
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- nginx/ Dockerfile.proxy)" ]; then
            echo "No changes to the proxy — skipping build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.guard.outputs.built == 'true'
        with:
          name: fallback-script
          path: nginx/build
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.guard.outputs.built == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        if: steps.guard.outputs.built == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-nginx-proxy
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.guard.outputs.built == 'true'
        with:
          file: Dockerfile.proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
