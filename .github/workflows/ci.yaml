name: CI
on:
  push:
    branches:
      - main
    paths: &ci_paths
      - .github/workflows/**
      - .github/actions/**
      - src/**
      - tests/**
      - nginx/**
      - helm/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - Dockerfile.postgres
      - Dockerfile.nushell
      - Dockerfile.proxy
      - devenv.nix
      - devenv.lock
      - devenv.yaml
  pull_request:
    paths: *ci_paths
  workflow_dispatch:
    inputs:
      force_full:
        description: Run all stages
        type: boolean
        default: false
concurrency:
  group: data-proxy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      build_helm: ${{ steps.filter.outputs.build_helm }}
      build_images: ${{ steps.filter.outputs.build_images }}
      build_matrix: ${{ steps.filter.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.force_full || false }}
        run: |
          matrix='{"include":['
          first=true
          build_images=false
          add_image() {
            if [ "$first" = false ]; then matrix+=','; fi
            first=false
            matrix+="{\"name\":\"$1\",\"dockerfile\":\"$2\",\"image\":\"ghcr.io/$GITHUB_REPOSITORY$3\"}"
            build_images=true
          }
          if [ "$FORCE_FULL" = "true" ]; then
            build_helm=true
            add_image "Sync pipeline" "Dockerfile" ""
            add_image "PostgreSQL" "Dockerfile.postgres" "-postgres"
            add_image "Nushell" "Dockerfile.nushell" "-nushell"
            add_image "Nginx proxy" "Dockerfile.proxy" "-nginx-proxy"
          else
            BASE="$BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
            CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            changed() { echo "$CHANGED" | grep -Eq "$1"; }
            build_helm=false
            if changed '^helm/'; then build_helm=true; fi
            if changed '^(Dockerfile$|src/|pyproject\.toml$|uv\.lock$)'; then add_image "Sync pipeline" "Dockerfile" ""; fi
            if changed '^(nginx/|Dockerfile\.proxy$)'; then add_image "Nginx proxy" "Dockerfile.proxy" "-nginx-proxy"; fi
            if changed '^Dockerfile\.nushell$'; then add_image "Nushell" "Dockerfile.nushell" "-nushell"; fi
            if changed '^Dockerfile\.postgres$'; then add_image "PostgreSQL" "Dockerfile.postgres" "-postgres"; fi
          fi
          matrix+=']}'
          {
            echo "build_helm=$build_helm"
            echo "build_images=$build_images"
            echo "build_matrix<<EOF"
            echo "$matrix"
            echo EOF
          } >> "$GITHUB_OUTPUT"
  quality:
    defaults:
      run:
        shell: devenv --profile quality shell -- bash -e {0}
    name: Lint and test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-devenv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .devenv
          key: quality-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'devenv.nix', 'devenv.lock', 'devenv.yaml') }}
      - run: devenv tasks run dp:lint dp:test
  build-images:
    name: Build ${{ matrix.name }} image
    needs:
      - changes
      - quality
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    if: always() && github.ref == 'refs/heads/main' && needs.quality.result == 'success' && needs.changes.outputs.build_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  helm:
    defaults:
      run:
        shell: devenv --profile helm shell -- bash -e {0}
    name: Release Helm chart
    timeout-minutes: 15
    needs:
      - changes
      - quality
      - build-images
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.changes.outputs.build_helm == 'true' || needs.changes.outputs.build_images == 'true') && needs.quality.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-devenv
      - name: Update from main
        run: git pull --rebase origin main
      - name: Resolve latest image SHAs from GHCR
        id: shas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resolve_sha() {
            local name="$1"
            local sha
            sha=$(gh api "orgs/prefeitura-rio/packages/container/${name}/versions" --jq '.[0].metadata.container.tags | map(select(. != "latest")) | .[0]' 2>/dev/null || true)
            if [ -z "$sha" ] || echo "$sha" | grep -q '{'; then echo "latest"; else echo "$sha"; fi
          }
          {
            echo "app=$(resolve_sha data-proxy)"
            echo "postgres=$(resolve_sha data-proxy-postgres)"
            echo "nushell=$(resolve_sha data-proxy-nushell)"
            echo "nginx=$(resolve_sha data-proxy-nginx-proxy)"
          } >> "$GITHUB_OUTPUT"
      - name: Pin image SHAs in values.yaml
        run: |
          yq e ".sync.image = \"ghcr.io/prefeitura-rio/data-proxy:\" + strenv(APP_SHA)" -i helm/values.yaml
          yq e ".cnpg.image = \"ghcr.io/prefeitura-rio/data-proxy-postgres:\" + strenv(PG_SHA)" -i helm/values.yaml
          yq e ".migration.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".cnpg.init.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".postgrest.jwksFetch.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".backup.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".cleanup.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".fallback.nginxImage = \"ghcr.io/prefeitura-rio/data-proxy-nginx-proxy:\" + strenv(NGINX_SHA)" -i helm/values.yaml
        env:
          APP_SHA: ${{ steps.shas.outputs.app }}
          PG_SHA: ${{ steps.shas.outputs.postgres }}
          NU_SHA: ${{ steps.shas.outputs.nushell }}
          NGINX_SHA: ${{ steps.shas.outputs.nginx }}
      - name: Read current version
        id: version
        run: |
          CHART_VERSION=$(yq eval '.version' helm/Chart.yaml)
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^helm-v' | head -1 || true)
          LAST_VERSION=${LAST_TAG#helm-v}
          BASE_VERSION="$CHART_VERSION"
          if [ -n "$LAST_VERSION" ] && [ "$(printf '%s\n' "$BASE_VERSION" "$LAST_VERSION" | sort -V | tail -1)" = "$LAST_VERSION" ]; then
            BASE_VERSION="$LAST_VERSION"
          fi
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          NEXT="$MAJOR.$((MINOR + 1)).0"
          {
            echo "current=$CHART_VERSION"
            echo "next=$NEXT"
            echo "tag=helm-v$NEXT"
          } >> "$GITHUB_OUTPUT"
      - name: Skip if no chart or image changes since release
        id: guard
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^helm-v' | head -1 || true)
          if [ -n "$LAST_TAG" ] && ! git diff --name-only "$LAST_TAG" HEAD -- helm/ | grep -v '^helm/tests/' | grep -q . && ! git diff --name-only -- helm/values.yaml | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to GHCR
        if: steps.guard.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Bump chart version
        if: steps.guard.outputs.skip != 'true'
        run: yq e '.version = strenv(NEXT)' -i helm/Chart.yaml
        env:
          NEXT: ${{ steps.version.outputs.next }}
      - name: Package chart
        if: steps.guard.outputs.skip != 'true'
        run: helm package helm/ --destination ./packaged/
      - name: Commit and tag chart release
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/Chart.yaml helm/values.yaml
          git commit -m "chore: release helm chart ${{ steps.version.outputs.next }} [skip ci]"
          git tag helm-v${{ steps.version.outputs.next }}
          git push origin HEAD:main
          git push origin helm-v${{ steps.version.outputs.next }}
      - name: Push chart
        if: steps.guard.outputs.skip != 'true'
        run: helm push ./packaged/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Create GitHub release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^helm-v' | sed -n '2p' || true)
          gh release create "$TAG" --title "Helm chart $TAG" ${PREV_TAG:+--notes-start-tag "$PREV_TAG"} --generate-notes
          gh release upload "$TAG" ./packaged/*.tgz
