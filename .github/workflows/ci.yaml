name: CI
on:
  push:
    branches:
      - main
    paths: &ci_paths
      - .github/workflows/**
      - .github/actions/**
      - sync/**
      - console/**
      - k3d/**
      - nix/**
      - proxy/**
      - helm/**
      - k6/**
      - scripts/**
      - Containerfile.sync
      - Containerfile.jobs
      - Containerfile.postgres
      - Containerfile.proxy
      - Containerfile.console
      - cog.toml
      - .sqlfluff
      - .sqlfluffignore
      - .hadolint.yaml
      - .nu-lint.toml
      - devenv.nix
      - devenv.lock
      - devenv.yaml
  pull_request:
    paths: *ci_paths
  workflow_dispatch:
    inputs:
      force_full:
        description: Run all stages
        type: boolean
        default: false
concurrency:
  group: data-proxy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      build_helm: ${{ steps.filter.outputs.build_helm }}
      build_images: ${{ steps.filter.outputs.build_images }}
      build_matrix: ${{ steps.filter.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-devenv
      - id: filter
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.force_full || false }}
          CI_REPOSITORY: ${{ github.repository }}
        run: devenv --profile checks shell -- ci changes
  checks:
    defaults:
      run:
        shell: devenv --profile checks shell -- bash -e {0}
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-devenv
      - name: Restore checks virtual environment
        id: checks-venv-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sync/.venv
          key: checks-venv-${{ runner.os }}-${{ hashFiles('sync/uv.lock', 'sync/pyproject.toml', 'devenv.nix', 'devenv.lock', 'devenv.yaml') }}
      - name: Restore the task state
        if: ${{ !inputs.force_full }}
        uses: ./.github/actions/task-state-restore
        with:
          group: checks
      - run: devenv --profile checks tasks run lint:all test:all
      - name: Save checks virtual environment
        if: steps.checks-venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: sync/.venv
          key: ${{ steps.checks-venv-cache.outputs.cache-primary-key }}
      - name: Save the task state
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/task-state-save
        with:
          group: checks
  test-sync:
    name: Sync integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-devenv
      - run: podman --version
      - name: Restore the task state
        if: ${{ !inputs.force_full }}
        uses: ./.github/actions/task-state-restore
        with:
          group: sync
      - run: devenv --profile checks tasks run test:int:sync
      - name: Save the task state
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/task-state-save
        with:
          group: sync
  test-console:
    name: Console tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-devenv
      - run: podman --version
      - name: Restore the task state
        if: ${{ !inputs.force_full }}
        uses: ./.github/actions/task-state-restore
        with:
          group: console
      - run: devenv --profile checks tasks run test:int:console
      - name: Save the task state
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/task-state-save
        with:
          group: console
  test-proxy:
    name: Proxy integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-devenv
      - name: Restore the task state
        if: ${{ !inputs.force_full }}
        uses: ./.github/actions/task-state-restore
        with:
          group: proxy
      - run: devenv --profile checks tasks run test:int:proxy
      - name: Save the task state
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/task-state-save
        with:
          group: proxy
  build-images:
    name: Build ${{ matrix.name }} image
    needs:
      - changes
      - checks
      - test-sync
      - test-proxy
      - test-console
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}
    if: always() && github.ref == 'refs/heads/main' && needs.checks.result == 'success' && needs.test-sync.result == 'success' && needs.test-proxy.result == 'success' && needs.test-console.result == 'success' && needs.changes.outputs.build_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=${{ matrix.tag_prefix }},format=short
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          file: ${{ matrix.containerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # Sigstore answers with a transient HTTP error now and then, and a failed signing skips the release.
        run: |
          for attempt in 1 2 3; do
            cosign sign --yes "${IMAGE}@${DIGEST}" && exit 0
            echo "Signing failed on attempt ${attempt}."
            sleep $((attempt * 20))
          done
          exit 1
  helm:
    defaults:
      run:
        shell: devenv --profile chart shell -- bash -e {0}
    name: Release Helm chart
    timeout-minutes: 15
    needs:
      - changes
      - checks
      - test-sync
      - test-proxy
      - test-console
      - build-images
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.changes.outputs.build_helm == 'true' || needs.changes.outputs.build_images == 'true') && needs.checks.result == 'success' && needs.test-sync.result == 'success' && needs.test-proxy.result == 'success' && needs.test-console.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-devenv
      - name: Update from main
        run: devenv --profile checks shell -- ci git update
      - name: Resolve latest image SHAs from registry
        id: shas
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devenv --profile checks shell -- ci images resolve
      - name: Read next version
        id: version
        run: devenv --profile checks shell -- ci version
      - name: Skip if no release-level commit or chart changes exist
        id: guard
        run: devenv --profile checks shell -- ci guard
        env:
          RELEASE: ${{ steps.version.outputs.release }}
      - name: Login to registry
        if: steps.guard.outputs.skip != 'true'
        run: devenv --profile checks shell -- ci chart login
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REGISTRY_USER: ${{ github.actor }}
      - name: Pin the images, bump the version, write the changelog and tag
        if: steps.guard.outputs.skip != 'true'
        run: devenv --profile checks shell -- ci release bump
        env:
          PIPELINE_SHA: ${{ steps.shas.outputs.sync }}
          PG_SHA: ${{ steps.shas.outputs.postgres }}
          NU_SHA: ${{ steps.shas.outputs.jobs }}
          PROXY_SHA: ${{ steps.shas.outputs.proxy }}
          CONSOLE_SHA: ${{ steps.shas.outputs.console }}
      - name: Package chart
        if: steps.guard.outputs.skip != 'true'
        run: devenv --profile checks shell -- ci chart package
      - name: Publish chart
        if: steps.guard.outputs.skip != 'true'
        run: devenv --profile checks shell -- ci chart publish
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the release commit and tag
        if: steps.guard.outputs.skip != 'true'
        run: devenv --profile checks shell -- ci release push "${{ steps.version.outputs.tag }}"
      - name: Write the release notes
        if: steps.guard.outputs.skip != 'true'
        run: devenv --profile checks shell -- ci release notes "${{ steps.version.outputs.tag }}"
      - name: Create the GitHub release
        if: steps.guard.outputs.skip != 'true'
        run: gh release create "${{ steps.version.outputs.tag }}" --title "Helm chart ${{ steps.version.outputs.tag }}" --notes-file packaged/notes.md packaged/*.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
