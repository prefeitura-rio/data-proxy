name: CI
on:
  push:
    branches:
      - main
    paths: &ci_paths
      - .github/workflows/**
      - src/**
      - tests/**
      - nginx/**
      - helm/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - Dockerfile.postgres
      - Dockerfile.nushell
      - Dockerfile.proxy
  pull_request:
    paths: *ci_paths
  workflow_dispatch:
    inputs:
      force_python:
        description: Run Python lint, tests, and application image build
        type: boolean
        default: false
      force_nginx:
        description: Run Nginx lint, tests, and proxy image build
        type: boolean
        default: false
      force_nushell:
        description: Run Nushell lint and image build
        type: boolean
        default: false
      force_postgres:
        description: Run PostgreSQL image build
        type: boolean
        default: false
      force_helm:
        description: Run Helm lint, tests, and chart release
        type: boolean
        default: false
      force_full:
        description: Run all lint, test, image build, and Helm stages
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
env:
  CRD_SCHEMA: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
  NJS_TYPES_VERSION: 1.0.0
jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      python: ${{ steps.filter.outputs.python }}
      nginx: ${{ steps.filter.outputs.nginx }}
      nushell: ${{ steps.filter.outputs.nushell }}
      postgres: ${{ steps.filter.outputs.postgres }}
      helm: ${{ steps.filter.outputs.helm }}
      build_python: ${{ steps.filter.outputs.build_python }}
      build_nginx: ${{ steps.filter.outputs.build_nginx }}
      build_nushell: ${{ steps.filter.outputs.build_nushell }}
      build_postgres: ${{ steps.filter.outputs.build_postgres }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.force_full || false }}
          FORCE_PYTHON: ${{ inputs.force_python || false }}
          FORCE_NGINX: ${{ inputs.force_nginx || false }}
          FORCE_NUSHELL: ${{ inputs.force_nushell || false }}
          FORCE_POSTGRES: ${{ inputs.force_postgres || false }}
          FORCE_HELM: ${{ inputs.force_helm || false }}
        run: |
          if [ "$FORCE_FULL" = "true" ]; then
            for output in ci python nginx nushell postgres helm build_python build_nginx build_nushell build_postgres; do
              echo "$output=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          changed() { echo "$CHANGED" | grep -Eq "$1" && echo true || echo false; }
          force_or_changed() {
            if [ "$1" = "true" ]; then
              echo true
            else
              changed "$2"
            fi
          }
          {
            echo "ci=$(changed '^\.github/workflows/')"
            echo "python=$(force_or_changed "$FORCE_PYTHON" '^(src/|tests/|pyproject\.toml$|uv\.lock$|Dockerfile$)')"
            echo "nginx=$(force_or_changed "$FORCE_NGINX" '^(nginx/|Dockerfile\.proxy$)')"
            echo "nushell=$(force_or_changed "$FORCE_NUSHELL" '^(scripts/|helm/files/.*\.nu$|Dockerfile\.nushell$)')"
            echo "postgres=$(force_or_changed "$FORCE_POSTGRES" '^Dockerfile\.postgres$')"
            echo "helm=$(force_or_changed "$FORCE_HELM" '^helm/')"
            echo "build_python=$(force_or_changed "$FORCE_PYTHON" '^(Dockerfile$|src/|pyproject\.toml$|uv\.lock$)')"
            echo "build_nginx=$(force_or_changed "$FORCE_NGINX" '^(nginx/|Dockerfile\.proxy$)')"
            echo "build_nushell=$(force_or_changed "$FORCE_NUSHELL" '^Dockerfile\.nushell$')"
            echo "build_postgres=$(force_or_changed "$FORCE_POSTGRES" '^Dockerfile\.postgres$')"
          } >> "$GITHUB_OUTPUT"
  lint-ci:
    defaults:
      run:
        shell: nix develop ./.github#quality --impure -c bash -e {0}
    name: Lint GitHub Actions workflows
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: actionlint .github/workflows/*.yaml
  lint-python:
    defaults:
      run:
        shell: nix develop ./.github#quality --impure -c bash -e {0}
    name: Lint Python codebase
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --all-groups --frozen
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run ruff check src/ tests/
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run basedpyright src/ tests/
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run complexipy src/ tests/
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
  test-python:
    defaults:
      run:
        shell: nix develop ./.github#quality --impure -c bash -e {0}
    name: Test Python codebase
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: uv sync --all-groups --frozen
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run pytest tests/ -q
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
  lint-sql:
    defaults:
      run:
        shell: nix develop ./.github#quality --impure -c bash -e {0}
    name: Lint SQL templates
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          sqlfluff lint --dialect postgres --config helm/files/sql/helm/.sqlfluff helm/files/sql/helm
          sqlfluff lint --dialect postgres src/dp/sql/postgres helm/files/sql/jinja
          sqlfluff lint --dialect duckdb src/dp/sql/duckdb
          sqlfluff lint --dialect bigquery src/dp/sql/bigquery
  lint-nushell:
    defaults:
      run:
        shell: nix develop ./.github#quality --impure -c bash -e {0}
    name: Lint Nushell scripts
    needs: changes
    if: needs.changes.outputs.nushell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nu-lint helm/files/*.nu
  lint-proxy:
    defaults:
      run:
        shell: nix develop ./.github#quality --impure -c bash -e {0}
    name: Lint nginx proxy script
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: npm install --no-save "njs-types@$NJS_TYPES_VERSION" @types/node
      - run: tsc -p nginx
  test-proxy:
    defaults:
      run:
        shell: nix develop ./.github#quality --impure -c bash -e {0}
    name: Test nginx proxy script
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: node --experimental-config-file=nginx/node.config.json --test nginx/fallback.test.ts
  quality:
    name: Lint and test
    needs:
      - changes
      - lint-python
      - test-python
      - lint-nushell
      - lint-sql
      - lint-proxy
      - test-proxy
      - lint-helm
      - test-helm
    if: always() && (needs.changes.outputs.python == 'true' || needs.changes.outputs.nushell == 'true' || needs.changes.outputs.nginx == 'true' || needs.changes.outputs.helm == 'true' || needs.changes.outputs.build_python == 'true' || needs.changes.outputs.build_postgres == 'true' || needs.changes.outputs.build_nushell == 'true') && (needs.lint-python.result == 'success' || needs.lint-python.result == 'skipped') && (needs.test-python.result == 'success' || needs.test-python.result == 'skipped') && (needs.lint-nushell.result == 'success' || needs.lint-nushell.result == 'skipped') && (needs.lint-sql.result == 'success' || needs.lint-sql.result == 'skipped') && (needs.lint-proxy.result == 'success' || needs.lint-proxy.result == 'skipped') && (needs.test-proxy.result == 'success' || needs.test-proxy.result == 'skipped') && (needs.lint-helm.result == 'success' || needs.lint-helm.result == 'skipped') && (needs.test-helm.result == 'success' || needs.test-helm.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: echo "All affected quality jobs passed"
  build-dp:
    defaults:
      run:
        shell: nix develop ./.github#build --impure -c bash -e {0}
    name: Build application image
    needs:
      - changes
      - quality
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.build_python == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: hadolint Dockerfile
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-pg:
    defaults:
      run:
        shell: nix develop ./.github#build --impure -c bash -e {0}
    name: Build PostgreSQL image
    needs:
      - changes
      - quality
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.build_postgres == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: hadolint Dockerfile.postgres
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-postgres
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile.postgres
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-nushell:
    defaults:
      run:
        shell: nix develop ./.github#build --impure -c bash -e {0}
    name: Build Nushell image
    needs:
      - changes
      - quality
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.build_nushell == 'true' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: hadolint Dockerfile.nushell
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-nushell
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile.nushell
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-proxy:
    defaults:
      run:
        shell: nix develop ./.github#build --impure -c bash -e {0}
    name: Build nginx proxy image
    needs:
      - changes
      - quality
    if: always() && github.ref == 'refs/heads/main' && (needs.changes.outputs.nginx == 'true') && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: hadolint Dockerfile.proxy
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-nginx-proxy
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build:
    name: Build
    needs:
      - changes
      - build-dp
      - build-pg
      - build-nushell
      - build-proxy
    if: always() && (needs.changes.outputs.build_python == 'true' || needs.changes.outputs.build_nginx == 'true' || needs.changes.outputs.build_nushell == 'true' || needs.changes.outputs.build_postgres == 'true') && (needs.build-dp.result == 'success' || needs.build-dp.result == 'skipped') && (needs.build-pg.result == 'success' || needs.build-pg.result == 'skipped') && (needs.build-nushell.result == 'success' || needs.build-nushell.result == 'skipped') && (needs.build-proxy.result == 'success' || needs.build-proxy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: echo "All selected build jobs passed"
  lint-helm:
    defaults:
      run:
        shell: nix develop ./.github#quality --impure -c bash -e {0}
    name: Lint Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.build_python == 'true' || needs.changes.outputs.build_postgres == 'true' || needs.changes.outputs.build_nushell == 'true' || needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          helm lint helm/ -f helm/ci/test-values.yaml
          helm lint helm/ -f helm/ci/test-values-ha.yaml
  test-helm:
    defaults:
      run:
        shell: nix develop ./.github#quality --impure -c bash -e {0}
    name: Test Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.build_python == 'true' || needs.changes.outputs.build_postgres == 'true' || needs.changes.outputs.build_nushell == 'true' || needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          helm unittest helm/
          helm template data-proxy helm/ -f helm/ci/test-values.yaml | kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location "$CRD_SCHEMA"
          helm template data-proxy helm/ -f helm/ci/test-values-ha.yaml | kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location "$CRD_SCHEMA"
  helm:
    defaults:
      run:
        shell: nix develop ./.github#release --impure -c bash -e {0}
    name: Release Helm chart
    needs:
      - changes
      - quality
      - build
    if: always() && !cancelled() && (needs.changes.outputs.helm == 'true' || needs.changes.outputs.build_python == 'true' || needs.changes.outputs.build_postgres == 'true' || needs.changes.outputs.build_nushell == 'true' || needs.changes.outputs.nginx == 'true') && needs.quality.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3.22.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update from main
        if: github.ref == 'refs/heads/main'
        run: git pull --rebase origin main
      - name: Resolve latest image SHAs from GHCR
        if: github.ref == 'refs/heads/main'
        id: shas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resolve_sha() {
            local name="$1"
            local sha
            sha=$(gh api "orgs/prefeitura-rio/packages/container/${name}/versions" --jq '.[0].metadata.container.tags | map(select(. != "latest")) | .[0]' 2>/dev/null || true)
            if [ -z "$sha" ] || echo "$sha" | grep -q '{'; then echo "latest"; else echo "$sha"; fi
          }
          {
            echo "app=$(resolve_sha data-proxy)"
            echo "postgres=$(resolve_sha data-proxy-postgres)"
            echo "nushell=$(resolve_sha data-proxy-nushell)"
            echo "nginx=$(resolve_sha data-proxy-nginx-proxy)"
          } >> "$GITHUB_OUTPUT"
      - name: Pin image SHAs in values.yaml
        if: github.ref == 'refs/heads/main'
        run: |
          yq e ".sync.image = \"ghcr.io/prefeitura-rio/data-proxy:\" + strenv(APP_SHA)" -i helm/values.yaml
          yq e ".cnpg.image = \"ghcr.io/prefeitura-rio/data-proxy-postgres:\" + strenv(PG_SHA)" -i helm/values.yaml
          yq e ".migration.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".cnpg.init.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".postgrest.jwksFetch.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".backup.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".cleanup.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".fallback.nginxImage = \"ghcr.io/prefeitura-rio/data-proxy-nginx-proxy:\" + strenv(NGINX_SHA)" -i helm/values.yaml
        env:
          APP_SHA: ${{ steps.shas.outputs.app }}
          PG_SHA: ${{ steps.shas.outputs.postgres }}
          NU_SHA: ${{ steps.shas.outputs.nushell }}
          NGINX_SHA: ${{ steps.shas.outputs.nginx }}
      - name: Read current version
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          CHART_VERSION=$(yq eval '.version' helm/Chart.yaml)
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^helm-v' | head -1 || true)
          LAST_VERSION=${LAST_TAG#helm-v}
          BASE_VERSION="$CHART_VERSION"
          if [ -n "$LAST_VERSION" ] && [ "$(printf '%s\n' "$BASE_VERSION" "$LAST_VERSION" | sort -V | tail -1)" = "$LAST_VERSION" ]; then
            BASE_VERSION="$LAST_VERSION"
          fi
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          NEXT="$MAJOR.$((MINOR + 1)).0"
          {
            echo "current=$CHART_VERSION"
            echo "next=$NEXT"
            echo "tag=helm-v$NEXT"
          } >> "$GITHUB_OUTPUT"
      - name: Skip if no chart or image changes since release
        if: github.ref == 'refs/heads/main'
        id: guard
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^helm-v' | head -1 || true)
          if [ -n "$LAST_TAG" ] && ! git diff --name-only "$LAST_TAG" HEAD -- helm/ | grep -v '^helm/tests/' | grep -q . && ! git diff --name-only -- helm/values.yaml | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Bump chart version
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        run: yq e '.version = strenv(NEXT)' -i helm/Chart.yaml
        env:
          NEXT: ${{ steps.version.outputs.next }}
      - name: Package chart
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        run: helm package helm/ --destination ./packaged/
      - name: Commit and tag chart release
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/Chart.yaml helm/values.yaml
          git commit -m "chore: release helm chart ${{ steps.version.outputs.next }} [skip ci]"
          git tag helm-v${{ steps.version.outputs.next }}
          git push origin HEAD:main
          git push origin helm-v${{ steps.version.outputs.next }}
      - name: Push chart
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        run: helm push ./packaged/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^helm-v' | sed -n '2p' || true)
          gh release create "$TAG" --title "Helm chart $TAG" ${PREV_TAG:+--notes-start-tag "$PREV_TAG"} --generate-notes
          gh release upload "$TAG" ./packaged/*.tgz
