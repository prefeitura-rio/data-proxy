name: CI
on:
  push:
    branches:
      - main
    paths: &ci_paths
      - .github/workflows/**
      - .github/actions/**
      - sync/**
      - console/**
      - k3d/**
      - nix/**
      - proxy/**
      - helm/**
      - k6/**
      - migrations/**
      - scripts/**
      - docs/**
      - "*.md"
      - book.toml
      - repomix.config.json
      - lychee.toml
      - .vale.ini
      - .vale/**
      - provider/**
      - Containerfile.*
      - cog.toml
      - .sqlfluff
      - .sqlfluffignore
      - .hadolint.yaml
      - .nu-lint.toml
      - devenv.nix
      - devenv.lock
      - devenv.yaml
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths: *ci_paths
  delete: {}
  workflow_dispatch:
    inputs:
      force_full:
        description: Run all stages, and build every image and release the chart
        type: boolean
        default: false
      force_checks:
        description: Run every check and test, with no saved task state. The images and the release follow the changed files.
        type: boolean
        default: false
      docs_tag:
        description: Publish the docs of this chart release tag again, such as helm-v2.21.0. Leave it empty to follow the commits.
        type: string
        required: false
concurrency:
  group: ${{ github.event_name == 'delete' && format('cleanup-{0}', github.run_id) || (github.event.action == 'closed' && format('cleanup-pr-{0}', github.event.pull_request.number)) || format('data-proxy-{0}', github.ref) }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  changes:
    name: Detect changed components
    if: github.event_name != 'delete' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      build_helm: ${{ steps.filter.outputs.build_helm }}
      build_images: ${{ steps.filter.outputs.build_images }}
      build_matrix: ${{ steps.filter.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - id: filter
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.force_full || false }}
          CI_REPOSITORY: ${{ github.repository }}
        run: devenv --profile chart shell -- ci detect changes
  checks:
    name: Checks (${{ matrix.profile }})
    if: github.event_name != 'delete' && github.event.action != 'closed'
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: chart
            command: test
          - profile: docs
            command: tasks run docs:lint
          - profile: tools
            command: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Restore the task state
        id: task-state
        uses: ./.github/actions/task-state-restore
        with:
          force: ${{ inputs.force_full || inputs.force_checks }}
          profile: ${{ matrix.profile }}
      - run: devenv --profile ${{ matrix.profile }} ${{ matrix.command }}
      - name: Save the task state
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/task-state-save
        with:
          profile: ${{ matrix.profile }}
          key: ${{ steps.task-state.outputs.key }}
          state-dir: ${{ steps.task-state.outputs.state-dir }}
  test-sync:
    name: Sync integration tests
    if: github.event_name != 'delete' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: prewarm
        uses: ./.github/actions/prewarm-images
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - uses: ./.github/actions/cache-packages
      - name: Evaluate the environment while images warm
        run: devenv --profile sync shell -- podman --version
      - uses: ./.github/actions/wait-images
        with:
          postgres-image: ${{ steps.prewarm.outputs.postgres-image }}
          keycloak-image: ${{ steps.prewarm.outputs.keycloak-image }}
      - run: devenv --profile sync test
  test-console:
    name: Console integration tests
    if: github.event_name != 'delete' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: prewarm
        uses: ./.github/actions/prewarm-images
        with:
          keycloak: true
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - uses: ./.github/actions/cache-packages
      - name: Evaluate the environment while images warm
        run: devenv --profile console shell -- podman --version
      - uses: ./.github/actions/wait-images
        with:
          postgres-image: ${{ steps.prewarm.outputs.postgres-image }}
          keycloak-image: ${{ steps.prewarm.outputs.keycloak-image }}
      - run: devenv --profile console test
      - name: Save the container images
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/save-images
        with:
          keycloak-cache-hit: ${{ steps.prewarm.outputs.keycloak-cache-hit }}
          keycloak-image: ${{ steps.prewarm.outputs.keycloak-image }}
          keycloak-cache-key: ${{ steps.prewarm.outputs.keycloak-cache-key }}
  test-proxy:
    name: Proxy integration tests
    if: github.event_name != 'delete' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - run: devenv --profile proxy test
  test-terraform:
    name: Terraform provider tests
    if: github.event_name != 'delete' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: prewarm
        uses: ./.github/actions/prewarm-images
        with:
          keycloak: true
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - uses: ./.github/actions/cache-packages
      - uses: ./.github/actions/cache-go
      - name: Evaluate the environment while images warm
        run: devenv --profile provider shell -- podman --version
      - uses: ./.github/actions/wait-images
        with:
          postgres-image: ${{ steps.prewarm.outputs.postgres-image }}
          keycloak-image: ${{ steps.prewarm.outputs.keycloak-image }}
      - run: devenv --profile provider test
  build-images:
    name: Build ${{ matrix.name }} image
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix || '{"include":[{"name":"none","containerfile":"none"}]}') }}
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.build_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{ matrix.containerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
  push-images:
    name: Push ${{ matrix.name }} image
    needs:
      - changes
      - build-images
      - checks
      - test-sync
      - test-proxy
      - test-console
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix || '{"include":[{"name":"none","containerfile":"none"}]}') }}
    if: always() && github.ref == 'refs/heads/main' && needs.checks.result == 'success' && needs.test-sync.result == 'success' && needs.test-proxy.result == 'success' && needs.test-console.result == 'success' && needs.build-images.result == 'success' && needs.changes.outputs.build_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=${{ matrix.tag_prefix }},format=short
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          file: ${{ matrix.containerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # Sigstore answers with a transient HTTP error now and then, and a failed signing skips the release.
        run: |
          for attempt in 1 2 3; do
            cosign sign --yes "${IMAGE}@${DIGEST}" && exit 0
            echo "Signing failed on attempt ${attempt}."
            sleep $((attempt * 20))
          done
          exit 1
  helm:
    defaults:
      run:
        shell: devenv --profile chart shell -- bash -e {0}
    name: Release Helm chart
    environment: release
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.plan.outputs.skip != 'true' && steps.plan.outputs.tag || '' }}
    needs:
      - changes
      - checks
      - test-sync
      - test-proxy
      - test-console
      - build-images
      - push-images
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.changes.outputs.build_helm == 'true' || needs.changes.outputs.build_images == 'true') && needs.checks.result == 'success' && needs.test-sync.result == 'success' && needs.test-proxy.result == 'success' && needs.test-console.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') && (needs.push-images.result == 'success' || needs.push-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: Update from main
        run: git pull --rebase origin main
      - name: Resolve the image SHAs, read the next version and decide whether to release
        id: plan
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ci plan chart
      - name: Pin the images, bump the version, write the changelog and tag
        if: steps.plan.outputs.skip != 'true'
        run: ci release chart
        env:
          SYNC_SHA: ${{ steps.plan.outputs.sync }}
          PG_SHA: ${{ steps.plan.outputs.postgres }}
          NU_SHA: ${{ steps.plan.outputs.jobs }}
          PROXY_SHA: ${{ steps.plan.outputs.proxy }}
          CONSOLE_SHA: ${{ steps.plan.outputs.console }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REGISTRY_USER: ${{ github.actor }}
      - name: Package chart
        if: steps.plan.outputs.skip != 'true'
        run: ci package chart
      - name: Push the release commit and tag
        if: steps.plan.outputs.skip != 'true'
        run: git push --atomic origin HEAD:main "${{ steps.plan.outputs.tag }}"
      - name: Publish the chart and write the release notes
        if: steps.plan.outputs.skip != 'true'
        run: ci publish chart "${{ steps.plan.outputs.tag }}"
        env:
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REGISTRY_USER: ${{ github.actor }}
      - name: Create the GitHub release
        if: steps.plan.outputs.skip != 'true'
        run: gh release create "${{ steps.plan.outputs.tag }}" --title "Helm chart ${{ steps.plan.outputs.tag }}" --notes-file packaged/notes.md packaged/*.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docs:
    name: Publish the docs
    needs: helm
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && ((needs.helm.result == 'success' && needs.helm.outputs.tag != '') || (github.event_name == 'workflow_dispatch' && inputs.docs_tag != ''))
    concurrency:
      group: docs-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate the release tag
        id: version
        env:
          DOCS_TAG: ${{ inputs.docs_tag || needs.helm.outputs.tag }}
        run: |
          [[ "$DOCS_TAG" =~ ^helm-v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          echo "version=${DOCS_TAG#helm-}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.docs_tag || needs.helm.outputs.tag }}
      - uses: ./.github/actions/cache-nix
      - uses: ./.github/actions/setup-devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build and check the bundle
        run: devenv --profile docs tasks run docs:lint
      - name: Publish the version to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .book/html
          destination_dir: ${{ steps.version.outputs.version }}
          keep_files: false
      - name: Replace latest with this publication
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .book/html
          destination_dir: latest
          keep_files: false
      - name: Read the complete site from gh-pages
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: gh-pages
          path: packaged/pages
          persist-credentials: false
      - name: Upload the complete Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: packaged/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  cache-branch:
    name: Delete the caches of a deleted branch
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
      - uses: ./.github/actions/delete-caches
        with:
          ref: refs/heads/${{ github.event.ref }}
          token: ${{ github.token }}
  cache-pr:
    name: Delete the caches of a closed pull request
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions
      - uses: ./.github/actions/delete-caches
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          token: ${{ github.token }}
