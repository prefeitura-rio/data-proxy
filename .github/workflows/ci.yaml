name: CI

on:
  push:
    branches: [main]
    paths: &ci_paths
      - .github/workflows/**
      - src/**
      - tests/**
      - nginx/**
      - helm/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - Dockerfile.postgres
      - Dockerfile.nushell
      - Dockerfile.proxy
  pull_request:
    paths: *ci_paths
  workflow_dispatch:
    inputs:
      force_proxy:
        description: Build and push the proxy image even when its sources are unchanged
        type: boolean
        default: false
      force_full:
        description: Run all lint, test, image build, and Helm stages
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  CRD_SCHEMA: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
  TYPESCRIPT_VERSION: 7.0.2
  NJS_TYPES_VERSION: 1.0.0

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      python: ${{ steps.filter.outputs.python }}
      nushell: ${{ steps.filter.outputs.nushell }}
      proxy: ${{ steps.filter.outputs.proxy }}
      helm: ${{ steps.filter.outputs.helm }}
      dp_image: ${{ steps.filter.outputs.dp_image }}
      pg_image: ${{ steps.filter.outputs.pg_image }}
      nushell_image: ${{ steps.filter.outputs.nushell_image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ inputs.force_full || false }}
        run: |
          if [ "$FORCE_FULL" = "true" ]; then
            for output in ci python nushell proxy helm dp_image pg_image nushell_image; do
              echo "$output=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
          CHANGED=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          changed() { echo "$CHANGED" | grep -Eq "$1" && echo true || echo false; }
          {
            echo "ci=$(changed '^\.github/workflows/')"
            echo "python=$(changed '^(src/|tests/|pyproject\.toml$|uv\.lock$|Docker$)')"
            echo "nushell=$(changed '^(scripts/|helm/files/.*\.nu$)')"
            echo "proxy=$(changed '^(nginx/|Dockerfile\.proxy$)')"
            echo "helm=$(changed '^helm/')"
            echo "dp_image=$(changed '^(Docker$|src/|pyproject\.toml$|uv\.lock$)')"
            echo "pg_image=$(changed '^Dockerfile\.postgres$')"
            echo "nushell_image=$(changed '^Dockerfile\.nushell$')"
          } >> "$GITHUB_OUTPUT"

  lint-ci:
    name: Lint GitHub Actions workflows
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#actionlint -- .github/workflows/*.yaml

  lint-python:
    name: Lint Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --frozen
        env: { UV_PROJECT_ENVIRONMENT: .devenv/state/venv }
      - run: uv run ruff check src/ tests/
        env: { UV_PROJECT_ENVIRONMENT: .devenv/state/venv }
      - run: uv run basedpyright src/ tests/
        env: { UV_PROJECT_ENVIRONMENT: .devenv/state/venv }
      - run: uv run complexipy src/ tests/
        env: { UV_PROJECT_ENVIRONMENT: .devenv/state/venv }
      - run: uv run vulture src/ tests/
        env: { UV_PROJECT_ENVIRONMENT: .devenv/state/venv }

  test-python:
    name: Test Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --frozen
        env: { UV_PROJECT_ENVIRONMENT: .devenv/state/venv }
      - run: uv run pytest tests/ -q
        env: { UV_PROJECT_ENVIRONMENT: .devenv/state/venv }

  lint-nushell:
    name: Lint Nushell scripts
    needs: changes
    if: needs.changes.outputs.nushell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the shell linter
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://codeberg.org/wvhulle/nu-lint/releases/download/v1.2.1/nu-lint-x86_64-unknown-linux-musl.tar.gz | tar xz
      - run: ./nu-lint helm/files/*.nu scripts/cluster.nu scripts/oidc.nu

  lint-proxy:
    name: Lint nginx proxy
    needs: changes
    if: needs.changes.outputs.proxy == 'true' || inputs.force_proxy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - run: npm install --no-save "typescript@$TYPESCRIPT_VERSION" "njs-types@$NJS_TYPES_VERSION" @types/node
      - run: ./node_modules/.bin/tsc -p nginx

  test-proxy:
    name: Test nginx proxy
    needs: changes
    if: needs.changes.outputs.proxy == 'true' || inputs.force_proxy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - run: node --experimental-config-file=nginx/node.config.json --test nginx/fallback.test.ts

  validation:
    name: Validate affected components
    needs: [lint-python, test-python, lint-nushell, lint-proxy, test-proxy, lint-helm, test-helm]
    if: >-
      always() &&
      (needs.lint-python.result == 'success' || needs.lint-python.result == 'skipped') &&
      (needs.test-python.result == 'success' || needs.test-python.result == 'skipped') &&
      (needs.lint-nushell.result == 'success' || needs.lint-nushell.result == 'skipped') &&
      (needs.lint-proxy.result == 'success' || needs.lint-proxy.result == 'skipped') &&
      (needs.test-proxy.result == 'success' || needs.test-proxy.result == 'skipped') &&
      (needs.lint-helm.result == 'success' || needs.lint-helm.result == 'skipped') &&
      (needs.test-helm.result == 'success' || needs.test-helm.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: echo "All affected validation jobs passed"

  build-dp:
    name: Build application image
    needs: [changes, validation]
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.dp_image == 'true' && needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hadolint/hadolint-action@v3.2.0
        with: { dockerfile: Dockerfile }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-pg:
    name: Build PostgreSQL image
    needs: [changes, validation]
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.pg_image == 'true' && needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hadolint/hadolint-action@v3.2.0
        with: { dockerfile: Dockerfile.postgres }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-postgres
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Dockerfile.postgres
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-nushell:
    name: Build Nushell image
    needs: [changes, validation]
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.nushell_image == 'true' && needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hadolint/hadolint-action@v3.2.0
        with: { dockerfile: Dockerfile.nushell }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-nushell
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Dockerfile.nushell
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-proxy:
    name: Build nginx proxy image
    needs: [changes, validation]
    if: always() && github.ref == 'refs/heads/main' && (needs.changes.outputs.proxy == 'true' || inputs.force_proxy == true) && needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hadolint/hadolint-action@v3.2.0
        with: { dockerfile: Dockerfile.proxy }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-nginx-proxy
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  lint-helm:
    name: Lint Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.dp_image == 'true' || needs.changes.outputs.pg_image == 'true' || needs.changes.outputs.nushell_image == 'true' || needs.changes.outputs.proxy == 'true' || inputs.force_full == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v4.2.4
      - run: |
          helm lint helm/ -f helm/ci/test-values.yaml
          helm lint helm/ -f helm/ci/test-values-ha.yaml

  test-helm:
    name: Test Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.dp_image == 'true' || needs.changes.outputs.pg_image == 'true' || needs.changes.outputs.nushell_image == 'true' || needs.changes.outputs.proxy == 'true' || inputs.force_full == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v4.2.4
      - name: Install the chart test plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest/releases/download/v1.1.2/unittest-1.1.2.tgz --verify=false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: Install the schema validator
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: |
          helm unittest helm/
          helm template data-proxy helm/ -f helm/ci/test-values.yaml | kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location "$CRD_SCHEMA"
          helm template data-proxy helm/ -f helm/ci/test-values-ha.yaml | kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location "$CRD_SCHEMA"

  helm:
    name: Release Helm chart
    needs: [changes, validation, build-dp, build-pg, build-nushell, build-proxy]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.helm == 'true' || needs.changes.outputs.dp_image == 'true' || needs.changes.outputs.pg_image == 'true' || needs.changes.outputs.nushell_image == 'true' || needs.changes.outputs.proxy == 'true' || inputs.force_proxy == true || inputs.force_full == true) &&
      needs.validation.result == 'success' &&
      (needs.build-dp.result == 'success' || needs.build-dp.result == 'skipped') &&
      (needs.build-pg.result == 'success' || needs.build-pg.result == 'skipped') &&
      (needs.build-nushell.result == 'success' || needs.build-nushell.result == 'skipped') &&
      (needs.build-proxy.result == 'success' || needs.build-proxy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v4.2.4
      - name: Resolve latest image SHAs from GHCR
        if: github.ref == 'refs/heads/main'
        id: shas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resolve_sha() {
            local name="$1"
            local sha
            sha=$(gh api "orgs/prefeitura-rio/packages/container/${name}/versions" --jq '.[0].metadata.container.tags | map(select(. != "latest")) | .[0]' 2>/dev/null || true)
            if [ -z "$sha" ] || echo "$sha" | grep -q '{'; then echo "latest"; else echo "$sha"; fi
          }
          {
            echo "app=$(resolve_sha data-proxy)"
            echo "postgres=$(resolve_sha data-proxy-postgres)"
            echo "nushell=$(resolve_sha data-proxy-nushell)"
            echo "proxy=$(resolve_sha data-proxy-nginx-proxy)"
          } >> "$GITHUB_OUTPUT"
      - name: Pin image SHAs in values.yaml
        if: github.ref == 'refs/heads/main'
        run: |
          yq e ".image.tag = strenv(APP_SHA)" -i helm/values.yaml
          yq e ".pgduckdb.image = \"ghcr.io/prefeitura-rio/data-proxy-postgres:\" + strenv(PG_SHA)" -i helm/values.yaml
          yq e ".nushell.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".pgduckdb.init.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".postgrest.jwksFetch.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".backup.image = \"ghcr.io/prefeitura-rio/data-proxy-nushell:\" + strenv(NU_SHA)" -i helm/values.yaml
          yq e ".fallback.nginxImage = \"ghcr.io/prefeitura-rio/data-proxy-nginx-proxy:\" + strenv(PROXY_SHA)" -i helm/values.yaml
        env:
          APP_SHA: ${{ steps.shas.outputs.app }}
          PG_SHA: ${{ steps.shas.outputs.postgres }}
          NU_SHA: ${{ steps.shas.outputs.nushell }}
          PROXY_SHA: ${{ steps.shas.outputs.proxy }}
      - name: Read current version
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          CURRENT=$(yq eval '.version' helm/Chart.yaml)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          {
            echo "current=$CURRENT"
            echo "next=$MAJOR.$((MINOR + 1)).0"
            echo "tag=helm-v$CURRENT"
          } >> "$GITHUB_OUTPUT"
      - name: Skip if no chart or image changes since release
        if: github.ref == 'refs/heads/main'
        id: guard
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^helm-v' | head -1 || true)
          if [ -n "$LAST_TAG" ] && ! git diff --name-only "$LAST_TAG" HEAD -- helm/ | grep -v '^helm/tests/' | grep -q . && ! git diff --name-only -- helm/values.yaml | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package and push chart
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        run: |
          helm package helm/ --destination ./packaged/
          helm push ./packaged/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Bump chart version, commit, and tag
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        run: |
          yq e '.version = strenv(NEXT)' -i helm/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/Chart.yaml helm/values.yaml
          git commit -m "chore: bump helm chart to ${{ steps.version.outputs.next }} [skip ci]"
          git tag ${{ steps.version.outputs.tag }}
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin ${{ steps.version.outputs.tag }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
      - name: Create GitHub release
        if: github.ref == 'refs/heads/main' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^helm-v' | sed -n '2p' || true)
          gh release create "$TAG" --title "Helm chart $TAG" ${PREV_TAG:+--notes-start-tag "$PREV_TAG"} --generate-notes
          gh release upload "$TAG" ./packaged/*.tgz
