name: CI
on:
  push:
    branches:
      - main
    paths: &ci_paths
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - Dockerfile.postgres
      - Dockerfile.nushell
      - Dockerfile.proxy
      - nginx/**
      - helm/**
      - scripts/**
  pull_request:
    paths: *ci_paths
  workflow_dispatch:
    inputs:
      force_proxy:
        description: Build and push the proxy image even when its sources are unchanged
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
env:
  PROXY_TOOLS: .devenv/state/proxy-tools
  NJS_TYPES_VERSION: 1.0.0
  CRD_SCHEMA: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --frozen
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run ruff check
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run basedpyright src/ tests/
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - name: Install the shell linter
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://codeberg.org/wvhulle/nu-lint/releases/download/v1.2.1/nu-lint-x86_64-unknown-linux-musl.tar.gz | tar xz
      - name: Lint the chart scripts
        run: ./nu-lint helm/files/*.nu
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v4.2.4
      - run: helm lint helm/ -f helm/ci/test-values.yaml
      - run: helm lint helm/ -f helm/ci/test-values-ha.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install the proxy compiler and type definitions
        run: |
          npm install --no-save --prefix "$PROXY_TOOLS" "typescript@latest" "njs-types@$NJS_TYPES_VERSION"
          ln -sfn "$PWD/$PROXY_TOOLS/node_modules/njs-types" nginx/types
      - name: Build the proxy
        run: "$PROXY_TOOLS/node_modules/.bin/tsc -p nginx --noEmit false --outDir nginx/build"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --frozen
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - run: uv run pytest tests/ -q
        env:
          UV_PROJECT_ENVIRONMENT: .devenv/state/venv
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Test the proxy
        run: node --experimental-config-file=nginx/node.config.json --test nginx/fallback.test.ts
      - uses: hustcer/setup-nu@main
        with:
          version: 0.107.0
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v4.2.4
      - name: Install the chart test plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest/releases/download/v1.1.2/unittest-1.1.2.tgz --verify=false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: Install the schema validator
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Test the chart
        run: helm unittest helm/
      - name: Validate the rendered chart
        run: |
          helm template data-proxy helm/ -f helm/ci/test-values.yaml | kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location "$CRD_SCHEMA"
          helm template data-proxy helm/ -f helm/ci/test-values-ha.yaml | kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location "$CRD_SCHEMA"
  build-dp:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.built }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Skip if Dockerfile and deps unchanged
        id: guard
        run: |
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- Dockerfile pyproject.toml uv.lock src/)" ]; then
            echo "No changes to Dockerfile or build context — skipping build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: hadolint/hadolint-action@v3.2.0
        if: steps.guard.outputs.built == 'true'
        with:
          dockerfile: Dockerfile
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.guard.outputs.built == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        if: steps.guard.outputs.built == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.guard.outputs.built == 'true'
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-pg:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.built }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Skip if Dockerfile.postgres unchanged
        id: guard
        run: |
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- Dockerfile.postgres)" ]; then
            echo "No changes to Dockerfile.postgres — skipping build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: hadolint/hadolint-action@v3.2.0
        if: steps.guard.outputs.built == 'true'
        with:
          dockerfile: Dockerfile.postgres
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.guard.outputs.built == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        if: steps.guard.outputs.built == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-postgres
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.guard.outputs.built == 'true'
        with:
          file: Dockerfile.postgres
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-nushell:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.guard.outputs.built }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Skip if Dockerfile.nushell unchanged
        id: guard
        run: |
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- Dockerfile.nushell)" ]; then
            echo "No changes to Dockerfile.nushell — skipping build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: hadolint/hadolint-action@v3.2.0
        if: steps.guard.outputs.built == 'true'
        with:
          dockerfile: Dockerfile.nushell
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.guard.outputs.built == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        if: steps.guard.outputs.built == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-nushell
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.guard.outputs.built == 'true'
        with:
          file: Dockerfile.nushell
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  build-proxy:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Skip if the proxy sources unchanged
        id: guard
        run: |
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- nginx/ Dockerfile.proxy)" ] && [ "${{ inputs.force_proxy }}" != "true" ]; then
            echo "No changes to the proxy — skipping build."
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: hadolint/hadolint-action@v3.2.0
        if: steps.guard.outputs.built == 'true'
        with:
          dockerfile: Dockerfile.proxy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.built == 'true'
        with:
          node-version: 24.19.0
      - name: Build the proxy script
        if: steps.guard.outputs.built == 'true'
        run: |
          npm install --no-save --prefix "$PROXY_TOOLS" "typescript@latest" "njs-types@$NJS_TYPES_VERSION"
          ln -sfn "$PWD/$PROXY_TOOLS/node_modules/njs-types" nginx/types
          "$PROXY_TOOLS/node_modules/.bin/tsc" -p nginx --noEmit false --outDir nginx/build
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.guard.outputs.built == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        if: steps.guard.outputs.built == 'true'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-nginx-proxy
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.guard.outputs.built == 'true'
        with:
          context: .
          file: Dockerfile.proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
