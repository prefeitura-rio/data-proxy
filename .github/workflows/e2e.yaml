name: E2E
on:
  workflow_dispatch:
    inputs:
      modes:
        description: Deployment modes to test
        type: choice
        options:
          - single and HA
          - single
          - HA
        default: single and HA
# The suite changes a shared BigQuery table, so two runs must never overlap.
concurrency:
  group: e2e-bigquery
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  e2e:
    name: E2E on k3d
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/setup-devenv
      - name: Prepare Podman for k3d
        run: |
          podman --version
          backend="$(podman info --format '{{.Host.NetworkBackend}}')"
          test "$backend" = netavark || { echo "Podman needs the netavark network backend for DNS, found: $backend"; exit 1; }
          podman system service --time=0 unix:///tmp/podman.sock &
          echo "DOCKER_HOST=unix:///tmp/podman.sock" >> "$GITHUB_ENV"
      - name: Write the BigQuery credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_SA_KEY" || { echo "The secret GCP_SA_KEY is not set"; exit 1; }
          mkdir -p "$HOME/.config/gcloud"
          printf '%s' "$GCP_SA_KEY" > "$HOME/.config/gcloud/application_default_credentials.json"
          chmod 600 "$HOME/.config/gcloud/application_default_credentials.json"
      - name: Start the cluster
        run: devenv --profile default shell -- cluster up
      - name: E2E in single mode
        if: inputs.modes != 'HA'
        run: devenv --profile default shell -- cluster k6 e2e
      - name: E2E in HA mode
        if: inputs.modes != 'single'
        run: devenv --profile default shell -- cluster k6 e2e --ha
      - name: Collect the cluster state
        if: failure()
        run: |
          mkdir -p e2e-logs
          export KUBECONFIG="$PWD/k3d/.kubeconfig"
          kubectl get pods -A -o wide > e2e-logs/pods.txt || true
          kubectl -n data-proxy get events --sort-by=.lastTimestamp > e2e-logs/events.txt || true
          for pod in $(kubectl -n data-proxy get pods -o name); do
            kubectl -n data-proxy logs "$pod" --all-containers --tail=500 > "e2e-logs/$(basename "$pod").log" 2>&1 || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs
      - name: Remove the cluster and its catalogs
        if: always()
        run: devenv --profile default shell -- cluster down
