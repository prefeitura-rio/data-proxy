name: Save the container images
description: Save the verified Keycloak image under the compatibility key from prewarming.
inputs:
  keycloak-cache-hit:
    description: Whether prewarming restored the Keycloak archive.
    required: true
  keycloak-image:
    description: The verified image tag from prewarming.
    required: true
  keycloak-cache-key:
    description: The architecture and recipe key from prewarming.
    required: true
runs:
  using: composite
  steps:
    - if: ${{ inputs.keycloak-cache-hit != 'true' }}
      shell: bash
      env:
        KEYCLOAK_IMAGE: ${{ inputs.keycloak-image }}
      run: |
        set -euo pipefail
        podman image exists "$KEYCLOAK_IMAGE"
        mkdir -p ~/.cache/data-proxy
        podman save --format oci-archive --output ~/.cache/data-proxy/keycloak-image.tar "$KEYCLOAK_IMAGE"
    - if: ${{ inputs.keycloak-cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/data-proxy/keycloak-image.tar
        key: ${{ inputs.keycloak-cache-key }}
