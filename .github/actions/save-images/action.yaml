name: Save the container images
description: Save the test Keycloak image in the cache, when the cache did not have it, so the next run restores it.
inputs:
  keycloak-cache-hit:
    description: The output keycloak-cache-hit of the prewarm action.
    required: true
runs:
  using: composite
  steps:
    - if: ${{ inputs.keycloak-cache-hit != 'true' }}
      shell: bash
      run: |
        tag=$(sha256sum Containerfile.kc | cut -c1-12)
        mkdir -p ~/.cache/data-proxy
        podman save --format oci-archive --output ~/.cache/data-proxy/keycloak-image.tar "localhost/data-proxy-test-kc:$tag"
    - if: ${{ inputs.keycloak-cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/data-proxy/keycloak-image.tar
        key: keycloak-image-${{ runner.os }}-${{ hashFiles('Containerfile.kc') }}
