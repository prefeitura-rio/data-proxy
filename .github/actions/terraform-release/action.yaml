name: Release the Terraform provider
description: Decide whether a provider release is due, and build, sign and publish it with the registry files. The caller checks out the repository with its full history first, and runs this on main.
inputs:
  version:
    description: The provider version to release, such as 0.2.0. Leave it empty to follow the commits.
    default: ""
  registry-host:
    description: The host that serves the registry.
    required: true
  registry-namespace:
    description: The namespace in the address and in the registry paths.
    required: true
  registry-bucket:
    description: The bucket that stores the registry files.
    required: true
  gcp-workload-identity-provider:
    description: The workload identity provider that lets the job write the bucket.
    required: true
  gcp-service-account:
    description: The service account that writes the bucket.
    required: true
  gpg-private-key:
    description: The private key that signs the checksums.
    required: true
  gpg-passphrase:
    description: The passphrase of the private key.
    required: true
  github-token:
    description: The token that creates the GitHub Release.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/cache-nix
    - uses: ./.github/actions/setup-devenv
    - uses: ./.github/actions/cache-go
    - name: Decide whether a release is due
      id: next
      shell: devenv --profile terraform shell -- bash -e {0}
      run: nu scripts/ci.nu terraform next
      env:
        VERSION: ${{ inputs.version }}
    - name: Authenticate to Google Cloud
      if: steps.next.outputs.release == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
        service_account: ${{ inputs.gcp-service-account }}
    - name: Build, sign and publish the release
      if: steps.next.outputs.release == 'true'
      shell: devenv --profile terraform shell -- bash -e {0}
      run: nu scripts/ci.nu terraform release "$PROVIDER_VERSION"
      env:
        PROVIDER_VERSION: ${{ steps.next.outputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
        TERRAFORM_REGISTRY_HOST: ${{ inputs.registry-host }}
        TERRAFORM_REGISTRY_NAMESPACE: ${{ inputs.registry-namespace }}
        TERRAFORM_REGISTRY_BUCKET: ${{ inputs.registry-bucket }}
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
        GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
    - name: Publish the registry
      if: steps.next.outputs.release == 'true'
      shell: devenv --profile terraform shell -- bash -e {0}
      run: nu scripts/ci.nu terraform registry
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TERRAFORM_REGISTRY_HOST: ${{ inputs.registry-host }}
        TERRAFORM_REGISTRY_NAMESPACE: ${{ inputs.registry-namespace }}
        TERRAFORM_REGISTRY_BUCKET: ${{ inputs.registry-bucket }}
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
        GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
