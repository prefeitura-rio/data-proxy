name: Setup devenv
description: Install Nix, configure the devenv cache, and install devenv
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
    - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
      with:
        name: devenv
    - name: Install devenv
      shell: bash
      run: nix profile add nixpkgs#devenv
