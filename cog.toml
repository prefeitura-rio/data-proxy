tag_prefix = "helm-v"
skip_ci = "[skip ci]"
ignore_merge_commits = true

# The hooks run after cog checks that the checkout is clean, and before the release commit. The commit then has their changes.
pre_bump_hooks = [
  "nu scripts/ci.nu images pin",
  "nu scripts/ci.nu chart bump {{version}}",
]

[changelog]
path = "CHANGELOG.md"
template = "scripts/changelog.tera"

# Only a feature, a fix and a breaking change reach the changelog.
[commit_types]
chore = { omit_from_changelog = true }
docs = { omit_from_changelog = true }
refactor = { omit_from_changelog = true }
revert = { omit_from_changelog = true }
test = { omit_from_changelog = true }
feat = { changelog_title = "Features" }
fix = { changelog_title = "Fixes" }
