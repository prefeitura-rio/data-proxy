# Suggestions remain available to editors without defining code structure.
[groups]
adopt-nu-syntax = "hint"
pipe-instead-of-loop = "hint"
parse-structured-data = "hint"
replace-external-tools = "hint"
stream-in-process = "hint"
reduce-complexity = "hint"
format-whitespace = "hint"
follow-naming-conventions = "hint"
document-interfaces = "hint"
annotate-types = "hint"
remove-dead-code = "hint"

[rules]
# Native nu --ide-check validates syntax with the installed interpreter.
nu_parse_error = "off"
# These findings describe lost failures or destructive operations, not style.
check_complete_exit_code = "error"
fragile_last_exit_code = "error"
dangerous_file_operations = "error"
