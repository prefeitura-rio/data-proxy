[book]
title = "Data Proxy"
src = "docs"

[build]
build-dir = ".book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"
renderers = ["html"]

[output.markdown]

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/prefeitura-rio/data-proxy"
edit-url-template = "https://github.com/prefeitura-rio/data-proxy/edit/main/{path}"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 0
