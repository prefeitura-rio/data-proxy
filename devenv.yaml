inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  import-tree:
    url: github:vic/import-tree
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

nixpkgs:
  permitted_unfree_packages:
    - terraform

imports:
  - ./proxy
  - ./sync
  - ./console
  - ./helm
