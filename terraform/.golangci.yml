version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - godoclint
    - noctx
    - revive
  exclusions:
    rules:
      - linters:
          - godoclint
        text: 'godoc \("Test'
  settings:
    godoclint:
      default: none
      enable:
        - pkg-doc
        - single-pkg-doc
        - start-with-name
        - require-doc
        - deprecated
      options:
        require-doc:
          ignore-exported: false
          ignore-unexported: false
        start-with-name:
          include-unexported: true
    revive:
      rules:
        - name: exported
        - name: package-comments
