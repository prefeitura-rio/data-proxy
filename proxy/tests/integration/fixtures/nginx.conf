worker_processes 1;
error_log /dev/stderr info;
pid __RUN_DIR__/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_buffer_size 1k;
    lua_package_path "__ROOT__/proxy/src/?.lua;__LUALIB__/?.lua;__LUALIB__/?/init.lua;;";
    lua_package_cpath "__LUALIB__/?.so;;";
    lua_shared_dict counters 1m;
    lua_shared_dict proxy_inflight 1m;
    lua_shared_dict proxy_locks 1m;
    lua_shared_dict proxy_settings 4m;
    lua_shared_dict console_mock 1m;
    lua_code_cache on;
    gzip on;
    gzip_types application/json;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_vary on;
    resolver 127.0.0.1 ipv6=off;

    init_by_lua_block {
        require("proxy.main").init("__SYNC_JSON__", function(name)
            return ({
                PROXY_CACHE_TTL = "60",
                PROXY_MAX_BODY = "262144",
                PROXY_REDIS_HOST = "127.0.0.1",
                PROXY_REDIS_PORT = "__REDIS_PORT__",
                PROXY_REDIS_DATABASE = "0",
                PROXY_POSTGREST = "http://127.0.0.1:__POSTGREST_PORT__",
                PROXY_MAX_INFLIGHT = "__MAX_INFLIGHT__",
                PROXY_CONFIG_URL = "__CONFIG_URL__",
                PROXY_CONFIG_REFRESH_SECONDS = "3600",
            })[name]
        end)
    }

    init_worker_by_lua_block {
        require("proxy.main").start()
    }

    # The admin server of the proxy under test.
    server {
        listen 127.0.0.1:__ADMIN_PORT__;

        location = /reload {
            content_by_lua_block { require("proxy.main").reload() }
        }
    }

    # The proxy under test.
    server {
        listen 127.0.0.1:__PROXY_PORT__;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location / {
            content_by_lua_block { require("proxy.main").handle() }
        }
    }

    server {
        listen 127.0.0.1:__POSTGREST_PORT__;

        location = /rpc/config {
            content_by_lua_block {
                if ngx.var.http_accept_profile ~= "console" then
                    ngx.status = 406
                    return ngx.print('{"message":"Unknown schema profile"}')
                end
                local mock = ngx.shared.console_mock
                local body = mock:get("body")
                if body == nil then
                    local file = assert(io.open("__SYNC_JSON__", "r"))
                    body = file:read("*a")
                    file:close()
                end
                ngx.status = mock:get("status") or 200
                ngx.header["Content-Type"] = "application/json"
                ngx.header["ETag"] = mock:get("etag") or '"1"'
                ngx.print(body)
            }
        }

        location = /console/set {
            content_by_lua_block {
                ngx.req.read_body()
                local args = ngx.req.get_uri_args()
                local mock = ngx.shared.console_mock
                mock:set("body", ngx.req.get_body_data())
                mock:set("etag", args.etag)
                mock:set("status", tonumber(args.status or "200"))
                ngx.print("ok")
            }
        }

        location = /always-down {
            content_by_lua_block {
                local n = ngx.shared.counters:incr("always-down:" .. ngx.req.get_method(), 1, 0)
                ngx.status = 503
                ngx.header["Content-Type"] = "application/json"
                ngx.print('{"upstream":"postgrest","n":' .. n .. '}')
            }
        }

        location = /flaky {
            content_by_lua_block {
                local n = ngx.shared.counters:incr("flaky", 1, 0)
                ngx.header["Content-Type"] = "application/json"
                if n == 1 then
                    ngx.status = 503
                    return ngx.print('{"upstream":"postgrest","n":1}')
                end
                ngx.print('{"upstream":"postgrest","n":' .. n .. '}')
            }
        }

        location = /closed { return 444; }

        location = /gone {
            content_by_lua_block {
                local n = ngx.shared.counters:incr("gone", 1, 0)
                ngx.status = 404
                ngx.header["Content-Type"] = "application/json"
                ngx.print('{"upstream":"postgrest","path":"gone","n":' .. n .. '}')
            }
        }

        location = /nested {
            content_by_lua_block {
                local client = require("resty.http").new()
                local inner = client:request_uri("http://127.0.0.1:__PROXY_PORT__/people?case=nested-inner")
                ngx.header["Content-Type"] = "application/json"
                ngx.print(require("cjson.safe").encode({
                    upstream = "nested",
                    inner_status = inner and inner.status or 0,
                    inner_retry_after = inner and inner.headers["Retry-After"] or "",
                }))
            }
        }

        location = /slow {
            content_by_lua_block {
                local n = ngx.shared.counters:incr("slow", 1, 0)
                ngx.sleep(1)
                ngx.header["Content-Type"] = "application/json"
                ngx.header["X-Source"] = "ducklake"
                ngx.print('{"upstream":"postgrest","slow":' .. n .. '}')
            }
        }

        location = /fan {
            content_by_lua_block {
                local http = require("resty.http")

                local function generation()
                    local red = require("resty.redis"):new()
                    red:connect("127.0.0.1", __REDIS_PORT__)
                    local value = red:get("policy:generation")
                    red:close()
                    return tostring(value)
                end

                local function fan(case)
                    local url = "http://127.0.0.1:__PROXY_PORT__/slow?case=" .. case
                    local threads = {}
                    local statuses = {}
                    for i = 1, 12 do
                        threads[i] = ngx.thread.spawn(function()
                            local response = http.new():request_uri(url)
                            statuses[i] = response and response.status or 0
                        end)
                    end
                    for i = 1, 12 do ngx.thread.wait(threads[i]) end
                    local ok = 0
                    for i = 1, 12 do if statuses[i] == 200 then ok = ok + 1 end end
                    local after = http.new():request_uri(url)
                    return ok, after and after.headers["X-Cache"] or "none"
                end

                local result
                for attempt = 1, 5 do
                    ngx.shared.counters:set("slow", 0)
                    local before = generation()
                    local ok, after = fan("fan" .. attempt)
                    result = { ok = ok, upstream_calls = ngx.shared.counters:get("slow"), after = after }
                    if generation() == before then break end
                end
                ngx.header["Content-Type"] = "application/json"
                ngx.print(require("cjson.safe").encode(result))
            }
        }

        location = /empty {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.print("[]")
            }
        }

        location = /text {
            content_by_lua_block {
                ngx.header["Content-Type"] = "text/plain"
                ngx.print("hello")
            }
        }

        location = /big {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.print('"' .. string.rep("a", 300000) .. '"')
            }
        }

        # The aggregate functions of three tables. The first answers with the filter it received.
        # The second answers null, and the third does not exist.
        location = /rpc/agg_ok_aggregate {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.header["X-Source"] = "ducklake"
                ngx.header["X-DuckLake-Snapshot"] = "7"
                local n = ngx.shared.counters:incr("aggregate:" .. (ngx.var.args or ""), 1, 0)
                ngx.print('[{"via":"rpc","n":' .. n .. ',"args":"' .. (ngx.var.args or "") .. '","filter":' .. (ngx.req.get_headers()["x-ducklake-filter"] or "null") .. '}]')
            }
        }

        location = /rpc/agg_null_aggregate {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.print("null")
            }
        }

        location /echo {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.print(ngx.req.get_headers()["x-ducklake-filter"] or "none")
            }
        }

        location / {
            content_by_lua_block {
                ngx.header["Content-Type"] = "application/json"
                ngx.header["X-Source"] = "ducklake"
                local method = ngx.req.get_method()
                if method == "GET" or method == "HEAD" then
                    local n = ngx.shared.counters:incr("read:" .. ngx.var.uri .. "?" .. (ngx.var.args or ""), 1, 0)
                    ngx.header["X-DuckLake-Snapshot"] = "7"
                    ngx.print('{"upstream":"postgrest","n":' .. n .. ',"auth":"' .. (ngx.req.get_headers()["authorization"] or "") .. '"}')
                    return
                end
                local n = ngx.shared.counters:incr("write:" .. ngx.var.uri, 1, 0)
                ngx.req.read_body()
                local body = ngx.req.get_body_data() or ""
                local path = ngx.req.get_body_file()
                if path then
                    local file = io.open(path, "rb")
                    body = file:read("*a")
                    file:close()
                end
                ngx.print(require("cjson.safe").encode({ upstream = "postgrest", n = n, body_bytes = #body, body = body }))
            }
        }
    }
}
