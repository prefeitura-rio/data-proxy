StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = data-proxy
Packages = Microsoft, alex

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, alex, DataProxy
# Vale.Terms has hundreds of built-in casings (helm→Helm, yaml→YAML, etc.)
# that conflict with this project's conventions. DataProxy.Terms handles
# only product-name casings.
Vale.Terms = NO
# GIN (Postgres index type) and kid (JWT key ID) are technical terms.
TokenIgnores = (?i)\b(GIN|kid)\b
# failure and invalid are technical terms in this project, not statements about people.
alex.ProfanityUnlikely = NO
alex.Ablist = NO

[*.py]
BasedOnStyles = Vale, Microsoft, alex
Vale.Terms = NO
Vale.Spelling = NO
# Code comments and log strings keep the full forms of the messages they describe.
Microsoft.Contractions = NO
Microsoft.Spacing = NO
Microsoft.Quotes = NO
# failed, reject, execute, invalid, and disabled are technical terms in code.
alex.ProfanityUnlikely = NO
alex.Ablist = NO
# GIN (Postgres index type) and kid (JWT key ID) are technical terms.
TokenIgnores = (?i)\b(GIN|kid)\b

[*.nu]
BasedOnStyles = Vale, Microsoft, alex
Vale.Terms = NO
Vale.Spelling = NO
# Error and log strings keep the full forms of the messages they describe.
Microsoft.Contractions = NO
# agent and spec name Kubernetes and k6 objects.
Microsoft.Terms = NO
Microsoft.Spacing = NO
Microsoft.Quotes = NO
Microsoft.Ellipses = NO
Microsoft.Hyphens = NO
alex.Race = NO
# alex fires on log strings and field names (e.g. $result.failed), not prose.
alex.ProfanityUnlikely = NO
alex.Ablist = NO
TokenIgnores = (?i)\b(GIN|kid)\b
