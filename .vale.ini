StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = data-proxy
Packages = Microsoft, alex

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, alex, DataProxy
# Vale.Terms has hundreds of built-in casings (helm→Helm, yaml→YAML, etc.)
# that conflict with this project's conventions. DataProxy.Terms handles
# only product-name casings.
Vale.Terms = NO
# GIN (Postgres index type) and kid (JWT key ID) are technical terms.
TokenIgnores = (?i)\b(GIN|kid)\b

[*.py]
BasedOnStyles = Vale, Microsoft, alex
Vale.Terms = NO
Vale.Spelling = NO
Microsoft.Spacing = NO
Microsoft.Quotes = NO
# GIN (Postgres index type) and kid (JWT key ID) are technical terms.
TokenIgnores = (?i)\b(GIN|kid)\b

[*.nu]
BasedOnStyles = Vale, Microsoft, alex
Vale.Terms = NO
Vale.Spelling = NO
Microsoft.Spacing = NO
Microsoft.Quotes = NO
Microsoft.Ellipses = NO
Microsoft.Hyphens = NO
alex.Race = NO
# alex fires on log strings and field names (e.g. $result.failed), not prose.
alex.ProfanityUnlikely = NO
alex.Ablist = NO
TokenIgnores = (?i)\b(GIN|kid)\b
